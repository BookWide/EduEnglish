<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BookWide ERP V0.2｜RunEC 商品克隆</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">BookWide ERP <span>V0.2</span></div>
  <div class="status">RunEC 商品模組克隆｜唯讀測試</div>
</header>
<nav class="modules">
  <button class="active">系統</button><button>銷售</button><button>採購</button><button>存貨</button><button>應收</button><button>應付</button><button>銀行</button><button>財務</button><button>成本</button><button>發票</button><button>出口</button><button>進口</button><button>事項</button><button>簽出</button>
</nav>
<main class="layout">
  <aside class="sidebar">
    <div class="tree-title">🔧 Items－商品總覽</div>
    <div id="categoryTree" class="tree"></div>
    <div class="sidebar-links"><a>新增原物料</a><a>新增在製品</a><a>新增產品</a><a>新增服務</a><a>輸出</a></div>
    <div class="searchbar"><input id="searchInput" value="" placeholder="品號／名稱"/><button id="searchBtn">搜尋</button></div>
  </aside>
  <section class="workspace">
    <div class="breadcrumb">🔧 商品 /Things/Items/Items/<span id="crumbCategory"></span>/<b id="crumbId"></b></div>
    <nav class="tabs">
      <button class="tab active" data-tab="basic">基本資料</button>
      <button class="tab" data-tab="other">其他資料</button>
      <button class="tab" data-tab="partner">交易對象</button>
      <button class="tab" data-tab="safe">安全存量</button>
      <button class="tab" data-tab="stock">庫存數量</button>
      <button class="tab" data-tab="attachment">附件</button>
      <button class="tab" data-tab="state">狀態</button>
      <button class="tab evolution" data-tab="labels">標籤池</button>
      <button class="tab evolution" data-tab="preview">標籤預覽</button>
    </nav>

    <section id="basic" class="panel active">
      <div class="basic-grid">
        <label>編號<span class="required">*</span><input id="id" readonly /></label>
        <label>名稱<span class="required">*</span><input id="name" readonly /></label>
        <label class="memo">說明<span class="required">*</span><textarea id="memo" readonly></textarea></label>
        <label class="internal">說明(僅供內部參考)<span class="required">*</span><textarea id="internalMemo" readonly></textarea></label>
        <div class="photo-label">照片</div>
        <div class="photo-area"><img id="productPhoto" alt="商品照片" /></div>
        <label class="reference">參考<input id="reference" readonly /></label>
      </div>
    </section>

    <section id="other" class="panel">
      <div class="other-grid">
        <label>基本單位<input id="unit" readonly /></label>
        <label class="checks"><input id="stockable" type="checkbox" disabled /> 可庫存　<input id="taxable" type="checkbox" disabled /> 應稅</label>
        <label class="wide">替代料<input id="substitute" readonly /></label>
        <label>啟用日<input id="startDate" readonly /></label>
        <label>停用日<input id="endDate" readonly /></label>
        <label>商品歸類<input id="itemClass" readonly /></label>
        <label class="checks"><input id="pinned" type="checkbox" disabled /> 置頂（顯示在最上層）</label>
      </div>
    </section>

    <section id="partner" class="panel"><table><thead><tr><th>交易對象</th><th>商品編號(交易對象)</th><th>商品名稱(交易對象)</th><th>說明</th><th>交易對象等級</th></tr></thead><tbody id="partnerRows"></tbody></table></section>
    <section id="safe" class="panel"><table><thead><tr><th>倉庫</th><th>最低安全存量</th><th>最高存量</th></tr></thead><tbody id="safeRows"></tbody></table></section>
    <section id="stock" class="panel"><table><thead><tr><th>倉庫</th><th>數量</th></tr></thead><tbody id="stockRows"></tbody></table></section>
    <section id="attachment" class="panel"><table><thead><tr><th>內容</th><th>說明</th></tr></thead><tbody id="attachmentRows"></tbody></table><button disabled>上傳附件</button></section>
    <section id="state" class="panel"><div class="state-box"><label>狀態<input id="status" readonly /></label><label>最後更新<input id="updatedAt" readonly /></label></div></section>

    <section id="labels" class="panel">
      <div class="label-toolbar"><input id="labelSearch" placeholder="搜尋現有 EZP 標籤模板"/><span id="labelCount"></span></div>
      <div id="labelPool" class="label-pool"></div>
    </section>

    <section id="preview" class="panel">
      <div class="preview-controls"><label>批號<input id="batchNo" value="TEST-001" /></label><label>列印份數<input id="printQty" type="number" value="1" min="1" /></label><button id="printBtn">列印預覽</button></div>
      <div class="preview-note">V0.2 先用瀏覽器預覽與列印；既有 EZP 模板仍可下載後用 QLabel IV 開啟。</div>
      <div id="labelPreview" class="label-preview"><div class="label-brand">PMKTOOLS</div><div id="pProductNo" class="label-no"></div><div id="pName" class="label-name"></div><div id="pMemo" class="label-spec"></div><div class="codes"><div class="barcode"></div><div class="qr"></div></div><div id="pBatch" class="label-batch"></div></div>
    </section>
    <footer class="actions"><button>✓ 存檔</button><button>↻ 重新載入</button><button>🔧 新增商品</button><button>▣ 複製</button><button>✎ 移動</button><button>✂ 刪除</button><button>🔒 權限</button><button>▤ BOM表總覽</button></footer>
  </section>
</main>
<script src="data/products.js"></script>
<script src="data/labels.js"></script>
<script src="app.js"></script>
</body>
</html>
