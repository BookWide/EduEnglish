<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BookWide ERP V0.1｜RunEC 商品克隆</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">BookWide ERP <span>V0.1</span></div>
    <div class="status">RunEC 商品模組｜唯讀測試</div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <h2>商品搜尋</h2>
      <input id="searchInput" type="search" placeholder="輸入品號／名稱／說明" autocomplete="off" />
      <div id="resultCount" class="muted"></div>
      <div id="productList" class="product-list"></div>
    </aside>

    <section class="content">
      <nav class="tabs" aria-label="商品頁籤">
        <button class="tab active" data-tab="basic">基本資料</button>
        <button class="tab" data-tab="photo">商品照片</button>
        <button class="tab" data-tab="label">標籤池</button>
        <button class="tab" data-tab="preview">標籤預覽</button>
      </nav>

      <section id="basic" class="panel active">
        <div class="form-grid">
          <label>編號<input id="id" readonly /></label>
          <label>名稱<input id="name" readonly /></label>
          <label class="wide">說明<textarea id="memo" rows="3" readonly></textarea></label>
          <label class="wide">內部說明<textarea id="internalMemo" rows="3" readonly></textarea></label>
          <label>交易對象<input id="partner" readonly /></label>
          <label>基本單位<input id="unit" readonly /></label>
          <label>安全存量<input id="safeStock" readonly /></label>
          <label>庫存數量<input id="stockQty" readonly /></label>
          <label>狀態<input id="status" readonly /></label>
          <label>附件<input id="attachment" readonly /></label>
        </div>
        <div class="notice">本版只讀，不會寫入 RunEC PostgreSQL。</div>
      </section>

      <section id="photo" class="panel">
        <div class="photo-wrap">
          <img id="productPhoto" alt="商品照片" />
          <div>
            <h3 id="photoTitle"></h3>
            <p class="muted">V0.1 先以 JSON 測試；下一階段改接 RunEC 商品照片來源。</p>
          </div>
        </div>
      </section>

      <section id="label" class="panel">
        <div class="toolbar">
          <input id="labelSearch" type="search" placeholder="搜尋標籤模板" />
          <button id="addPoolBtn" type="button">加入標籤池</button>
        </div>
        <div id="labelPool" class="label-pool"></div>
      </section>

      <section id="preview" class="panel">
        <div class="preview-controls">
          <label>批號<input id="batchNo" value="TEST-001" /></label>
          <label>數量<input id="printQty" type="number" value="1" min="1" max="999" /></label>
          <button id="printBtn" type="button">列印標籤</button>
        </div>
        <div id="labelPreview" class="label-preview">
          <div class="label-brand">PMKTOOLS</div>
          <div id="pProductNo" class="label-no"></div>
          <div id="pName" class="label-name"></div>
          <div id="pMemo" class="label-spec"></div>
          <div class="codes">
            <div id="barcode" class="barcode"></div>
            <div id="qr" class="qr"></div>
          </div>
          <div id="pBatch" class="label-batch"></div>
        </div>
      </section>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
