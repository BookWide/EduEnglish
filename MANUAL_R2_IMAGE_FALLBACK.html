<h1>LINE 禮物手動補圖備援</h1>
<div class="note">
自動匯入照片若暫時不穩，可以先手動，不影響商品購買與結帳。<br><br>
建議流程：<br>
1. 從 LINE 商品頁另存商品圖片。<br>
2. 圖片檔名用 LINE 商品 ID，例如 <code>322098992.jpg</code>。<br>
3. 上傳到 BookWide R2：<code>assets/gifts/322098992.jpg</code>。<br>
4. 到 <code>line-gifts-admin.html</code> 編輯該商品，把「商品圖片網址」填成 R2 公開網址。<br>
5. 儲存後前台即可顯示圖片。<br><br>
這是備援流程；商品資料、點數折抵、0 點刷卡購買都可照常運作。
</div>
