<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品詳情｜BookWide</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#0f172a;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
.top{background:#0f1d33;color:#fff;padding:18px 0}.topin{max-width:1180px;margin:auto;padding:0 18px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:24px;font-weight:950;color:#7c3aed;text-decoration:none}.back{color:#fff;text-decoration:none;font-weight:800}
.wrap{max-width:1180px;margin:30px auto;padding:0 18px}.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:34px;background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:28px;box-shadow:0 12px 34px rgba(15,23,42,.06)}
.mainpic{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#f8fafc;border-radius:18px;overflow:hidden}.mainpic img{width:100%;height:100%;object-fit:contain}
.thumbs{display:flex;gap:10px;overflow:auto;margin-top:10px}.thumb{width:72px;height:72px;border:2px solid transparent;border-radius:12px;object-fit:cover;cursor:pointer;background:#fff}.thumb.on{border-color:#2563eb}
.meta{color:#64748b;font-size:14px}.name{font-size:34px;font-weight:950;line-height:1.25;margin:8px 0}.summary{font-size:17px;color:#475569;line-height:1.7}.price{font-size:32px;font-weight:950;margin:18px 0}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:6px 10px;border-radius:999px;background:#f1f5f9;color:#475569;font-size:13px;font-weight:800}
.opt{margin-top:18px}.opt label{display:block;font-weight:900;margin-bottom:8px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer}.choice.on{background:#0f172a;color:#fff;border-color:#0f172a}
.buy{display:block;text-align:center;margin-top:24px;background:#06c755;color:#fff;text-decoration:none;border-radius:14px;padding:15px;font-weight:950;font-size:18px}.buy.disabled{opacity:.45;pointer-events:none}
.section{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:24px;margin-top:20px}.section h2{margin:0 0 14px;font-size:22px}.section p,.section li{line-height:1.85;color:#334155}.section ul{margin:0;padding-left:22px}.desc{white-space:pre-line}
.empty{padding:60px;text-align:center;color:#64748b}
.flower-page{--flower-ink:#43252b;--flower-muted:#8b6d72;--flower-line:#eadfdd;--flower-bg:#faf8f6}
.flower-page .hero{background:var(--flower-bg);border:0;border-radius:0;box-shadow:none;padding:34px;gap:52px}
.flower-page .mainpic{background:#f2efec;border-radius:0;aspect-ratio:4/5}
.flower-page .mainpic img{object-fit:cover}
.flower-page .thumb{border-radius:0}
.flower-page .meta{letter-spacing:.08em;color:#9b7d72}
.flower-page .name{font-family:Georgia,"Noto Serif TC",serif;color:var(--flower-ink);font-weight:700}
.flower-page .summary{color:#765b60}
.flower-page .price{font-family:Georgia,"Noto Serif TC",serif;color:#8b7467;font-weight:700}
.flower-page .choice{border-color:#b9aaa5;border-radius:6px}
.flower-page .choice.on{background:#4b4140;border-color:#4b4140}
.flower-page .buy{background:#43252b;border-radius:4px;max-width:360px;letter-spacing:.22em}
.flower-story{margin:70px auto 0;max-width:980px;color:var(--flower-ink);font-family:Georgia,"Noto Serif TC",serif}
.flower-kicker{text-align:center;letter-spacing:.45em;color:#b39486;font-size:13px;margin-bottom:30px}
.flower-quote{text-align:center;font-size:31px;line-height:1.8;font-weight:700;margin:0 auto 28px;max-width:680px}
.flower-rule{width:34px;border-top:2px solid #9b4b53;margin:0 auto 32px}
.flower-lead{text-align:center;line-height:2;color:#7d5b55;max-width:720px;margin:0 auto 42px;font-size:17px}
.flower-photo{display:block;width:min(800px,100%);max-height:900px;object-fit:cover;margin:0 auto 42px}
.flower-copy{max-width:800px;margin:0 auto 48px;border-left:2px solid #9b4b53;padding:8px 0 8px 30px;white-space:pre-line;line-height:2.05;font-size:17px;color:#67474a}
.flower-copy-title{font-size:24px;margin-bottom:12px;color:#43252b}
.flower-cta{text-align:center;margin:54px auto 10px}
.flower-cta a{display:inline-block;background:#43252b;color:#fff;text-decoration:none;padding:18px 58px;letter-spacing:.28em;border-radius:3px;font-weight:800}
.flower-note{margin-top:14px;color:#9b7d72;font-size:13px}
.flower-page>.section{max-width:980px;margin:34px auto 0;background:#fff;border-color:var(--flower-line);border-radius:4px}

@media(max-width:820px){.hero{grid-template-columns:1fr;padding:18px}.name{font-size:28px}.wrap{margin-top:18px}}
</style>
</head>
<body>
<div class="top"><div class="topin"><a class="brand" href="/line-gifts.html">← BookWide</a><a class="back" href="/line-gifts.html">返回商品庫</a></div></div>
<main class="wrap" id="app"><div class="empty">讀取商品中…</div></main>
<script>
const API='https://bookwide-hiking-api.pmktools.workers.dev',pid=String(new URL(location.href).searchParams.get('product')||'').trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW');
let product=null,selections={},currentVariation=null;
function imgs(p){return [...new Set([p.image_url,...(p.gallery_urls||[]),...(p.variations||[]).map(v=>v.image_url)].map(x=>String(x||'').trim()).filter(Boolean))]}
function attrs(p){return p.attributes?.length?p.attributes:(p.option_groups||[]).map((g,i)=>({id:'attr-'+(i+1),name:g.name,values:g.values||[]}))}
function vars(p){return (p.variations||[]).filter(v=>v&&v.is_active!==false)}
function flower(p){return /送禮花卉|花卉|花束|花禮/.test(String(p?.category||''))}
function findVar(){if(String(product?.product_type||'simple')!=='variable')return null;return vars(product).find(v=>Object.entries(v.attributes||{}).every(([k,x])=>String(selections[k]||'')===String(x||'')))||null}
function priceValue(){if(currentVariation)return Number(currentVariation.sale_price||currentVariation.price||product.price||0);const a=vars(product).map(v=>Number(v.sale_price||v.price||0)).filter(x=>x>0);if(product.product_type==='variable'&&a.length){const lo=Math.min(...a),hi=Math.max(...a);return lo===hi?lo:[lo,hi]}return Number(product.price||0)}
function story(p,im){const raw=String(p.detail_description||'').trim(),ls=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean),lead=ls.slice(0,2).join(' '),q=(ls.find(x=>x.length>=8&&x.length<=28)||p.name||'把心意，送到她手上。').replace(/[。！!]+$/,'');return `<section class="flower-story"><div class="flower-kicker">BOOKWIDE FLOWER GIFT</div><div class="flower-quote">${esc(q)}<br>讓這份心意，被好好記住。</div><div class="flower-rule"></div><div class="flower-lead">${esc(lead||'一束花，不只是禮物，也是替你說出口的心意。')}</div>${im[1]?`<img class="flower-photo" src="${esc(im[1])}">`:''}<div class="flower-copy"><div class="flower-copy-title">${esc(p.name)}｜商品介紹</div>${esc(raw)}</div>${im[2]?`<img class="flower-photo" src="${esc(im[2])}">`:''}<div class="flower-cta"><a href="#buyArea">為 她 預 訂</a></div></section>`}
function render(){if(!product){app.innerHTML='<div class="empty">找不到商品。</div>';return}const im=imgs(product),aa=attrs(product),isf=flower(product);document.body.classList.toggle('flower-page',isf);const pv=priceValue(),pt=Array.isArray(pv)?`${money(pv[0])} – ${money(pv[1])}`:money(pv);app.innerHTML=`<section class="hero"><div><div class="mainpic">${im[0]?`<img id="mainImage" src="${esc(im[0])}">`:'🎁'}</div>${im.length>1?`<div class="thumbs">${im.map((u,i)=>`<img class="thumb ${i===0?'on':''}" src="${esc(u)}" data-img="${esc(u)}">`).join('')}</div>`:''}</div><div><div class="meta">${esc(product.brand||'BookWide')} · ${esc(product.category||'精選福利')}</div><div class="name">${esc(product.name)}</div><div class="summary">完整商品介紹請見下方。</div><div class="price" id="priceText">${pt}</div><div id="buyArea"></div>${aa.map((a,i)=>`<div class="opt"><label>${esc(a.name)} *</label><div class="choices">${(a.values||[]).map(v=>`<button type="button" class="choice" data-group="${i}" data-value="${esc(v)}">${esc(v)}</button>`).join('')}</div></div>`).join('')}<div id="stockState" class="meta" style="margin-top:14px"></div><a id="buyBtn" class="buy" href="#">${product.product_type==='variable'?'選好規格後購買':(Number(product.price||0)<200?'前往兌換':'立即購買')}</a></div></section>${isf?story(product,im):(product.detail_description?`<section class="section"><h2>商品介紹</h2><div class="desc">${esc(product.detail_description)}</div></section>`:'')}`;document.querySelectorAll('.thumb').forEach(x=>x.onclick=()=>{mainImage.src=x.dataset.img;document.querySelectorAll('.thumb').forEach(y=>y.classList.remove('on'));x.classList.add('on')});document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const a=aa[Number(b.dataset.group)];selections[a.name]=b.dataset.value;document.querySelectorAll(`.choice[data-group="${b.dataset.group}"]`).forEach(x=>x.classList.remove('on'));b.classList.add('on');update()});buyBtn.onclick=e=>{e.preventDefault();if(product.product_type==='variable'&&!currentVariation)return alert('請先選擇完整商品規格');if(currentVariation?.stock_tracking_enabled&&Number(currentVariation.stock_qty||0)<=0)return alert('此規格目前缺貨');const q=new URLSearchParams({product:product.id});if(Object.keys(selections).length)q.set('opts',JSON.stringify(selections));if(currentVariation?.id)q.set('variant',currentVariation.id);location.href='/line-gift-checkout.html?'+q};update()}
function update(){currentVariation=findVar();const pv=priceValue();priceText.textContent=Array.isArray(pv)?`${money(pv[0])} – ${money(pv[1])}`:money(pv);const fallbackImg=String(product.image_url||(Array.isArray(product.gallery_urls)?product.gallery_urls[0]:'')||'');
if(mainImage)mainImage.src=String(currentVariation?.image_url||fallbackImg);if(product.product_type!=='variable'){stockState.textContent=product.stock_tracking_enabled?`庫存 ${Number(product.stock_qty||0)}`:'';buyBtn.classList.remove('disabled');return}const complete=attrs(product).every(a=>selections[a.name]);if(!complete){stockState.textContent='請選擇完整規格';buyBtn.classList.add('disabled');return}if(!currentVariation){stockState.textContent='此規格組合目前不可購買';buyBtn.classList.add('disabled');return}if(currentVariation.stock_tracking_enabled&&Number(currentVariation.stock_qty||0)<=0){stockState.textContent='此規格目前缺貨';buyBtn.classList.add('disabled');return}stockState.textContent=currentVariation.stock_tracking_enabled?`此規格庫存 ${Number(currentVariation.stock_qty||0)}`:'';buyBtn.classList.remove('disabled')}
async function boot(){try{const r=await fetch(API+'/api/bw-products',{cache:'no-store'}),j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.message||j.error||'讀取失敗');product=(j.products||[]).find(p=>String(p.id)===pid||String(p.external_id||'')===pid)||null;if(product?.is_active===false)product=null;render()}catch(e){app.innerHTML=`<div class="empty">商品資料讀取失敗：${esc(e.message||e)}</div>`}}boot();
</script>
</body></html>
