<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>商品詳情｜BookWide</title>
<style>
:root{--ink:#241b22;--muted:#776970;--line:#eadfe1;--paper:#fffdfc;--rose:#a45157;--soft:#f8f3f2;--green:#267a57}
*{box-sizing:border-box}body{margin:0;background:#f7f6f6;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}a{text-decoration:none;color:inherit}
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #eee}.topin{max-width:1280px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:14px}.brand{font-size:20px;font-weight:950;color:#122642}.topspacer{flex:1}.toplink{font-weight:800;color:#53657b}.cartLink{border:1px solid #ddd;border-radius:999px;padding:8px 13px}.langSwitch{display:flex;align-items:center;gap:4px;border:1px solid #ddd;border-radius:999px;padding:3px;background:#fff}.langSwitch button{border:0;background:transparent;border-radius:999px;padding:6px 9px;cursor:pointer;font-weight:800;color:#53657b}.langSwitch button.active{background:#122642;color:#fff}@media(max-width:560px){.langSwitch button{padding:6px 7px;font-size:12px}.topin{padding:10px}.brand{font-size:17px}}
.wrap{max-width:1280px;margin:auto;padding:22px 18px 60px}.product{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 28px rgba(52,35,40,.06)}
.hero{display:grid;grid-template-columns:30% 70%;min-height:520px}.mediaSide{padding:18px;background:#faf8f7;border-right:1px solid var(--line)}.stage{height:410px;border-radius:14px;overflow:hidden;background:#111;display:grid;place-items:center}.stage img,.stage video{width:100%;height:100%;object-fit:contain}.stage iframe{width:100%;height:100%;border:0}.stage.is-image{background:#f1efee}.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto}.thumb{width:58px;height:58px;min-width:58px;border:2px solid transparent;border-radius:8px;overflow:hidden;padding:0;background:#eee;cursor:pointer}.thumb.active{border-color:var(--rose)}.thumb img{width:100%;height:100%;object-fit:cover}.thumb span{display:grid;place-items:center;width:100%;height:100%;background:#151515;color:#fff;font-size:20px}
.info{padding:34px 40px 30px;display:flex;flex-direction:column}.eyebrow{color:#b37377;font-weight:800;font-size:14px;margin-bottom:8px}.title{font-family:Georgia,"Noto Serif TC",serif;font-size:34px;line-height:1.2;margin:0 0 8px}.summary{color:var(--muted);margin:0 0 12px;line-height:1.7}.price{font:800 38px Georgia,serif;color:#9b765d;margin:10px 0 16px}.optGroup{margin:13px 0}.optLabel{font-weight:900;margin-bottom:7px}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.opt{border:1px solid #cbb6b7;background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}.opt.active{background:#3d3335;color:#fff}.stock{color:var(--green);font-weight:850;margin:10px 0}.skuLine{font-size:14px;color:#526070;margin:2px 0 8px}.skuLine b{color:#1f2937}
.qtyrow{display:flex;align-items:center;gap:12px;margin-top:12px}.qtybox{display:flex;border:1px solid #d4c6c8;border-radius:10px;overflow:hidden}.qtybox button{width:42px;height:42px;border:0;background:#fff;font-size:22px;cursor:pointer}.qtybox input{width:54px;text-align:center;border:0;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.btn{border:0;border-radius:11px;padding:14px 16px;font-size:17px;font-weight:950;cursor:pointer}.buy{background:var(--rose);color:#fff}.cart{background:#fff;color:var(--rose);border:1px solid var(--rose)}.btn:disabled{opacity:.45;cursor:not-allowed}
.addons{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}.addons h3{margin:0 0 12px;font-size:18px}.addonGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.addon{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;border:1px solid #eadfe1;border-radius:12px;padding:9px;background:#fff}.addon img{width:76px;height:72px;object-fit:cover;border-radius:8px;background:#eee}.addonName{font-weight:850;font-size:14px;line-height:1.35}.addonPrice{font-size:13px;color:#8b6b5a;margin-top:3px}.addon input{width:20px;height:20px}
.detail{border-top:1px solid var(--line);padding:28px 34px 38px;display:grid;grid-template-columns:1fr 280px;gap:30px}.detail h2{margin:0 0 14px}.desc{white-space:pre-wrap;line-height:1.9;color:#44393c}.meta{background:var(--soft);padding:18px;border-radius:12px;height:max-content}.metaRow{padding:9px 0;border-bottom:1px solid #e6d9db}.metaRow:last-child{border-bottom:0}.meta b{display:block;font-size:12px;color:var(--muted)}
.err,.loading{max-width:900px;margin:40px auto;padding:30px;text-align:center}.err{display:none;background:#fff0f1;color:#9d2934;border-radius:12px}
.toast{position:fixed;right:18px;bottom:18px;background:#222;color:#fff;border-radius:10px;padding:12px 16px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:99}.toast.on{opacity:1;transform:none}
@media(max-width:900px){.hero{grid-template-columns:1fr}.mediaSide{border-right:0;border-bottom:1px solid var(--line)}.stage{height:min(58vh,500px)}.info{padding:24px 18px}.detail{grid-template-columns:1fr}.addonGrid{grid-template-columns:1fr}.wrap{padding:10px 8px 36px}.options{grid-template-columns:repeat(2,minmax(0,1fr))}.opt{font-size:14px;padding:10px}.title{font-size:29px}}
@media(max-width:480px){.stage{height:48vh;min-height:330px}.title{font-size:25px;line-height:1.15}.price{font-size:31px}.actions{grid-template-columns:1fr}.toplink.hideMobile{display:none}.options{grid-template-columns:1fr}.opt{font-size:14px}}
</style></head><body>
<header class="top"><div class="topin"><a class="brand" href="/line-gifts.html">BookWide・福利品</a><div class="topspacer"></div><a class="toplink hideMobile" href="/line-gifts.html">← 商品庫</a><div class="langSwitch" id="langSwitch"><button type="button" data-lang="zh-TW" class="active">中</button><button type="button" data-lang="en">EN</button></div><a class="toplink cartLink" href="/line-gift-cart.html">🛒 購物車 <span id="cartCount">0</span></a></div></header>
<main class="wrap"><div id="loading" class="loading">讀取商品中…</div><div id="err" class="err"></div>
<article id="product" class="product" hidden><section class="hero">
<div class="mediaSide"><div id="stage" class="stage"></div><div id="thumbs" class="thumbs"></div></div>
<div class="info"><div id="eyebrow" class="eyebrow"></div><h1 id="name" class="title"></h1><p id="summary" class="summary"></p><div id="price" class="price"></div><div id="options"></div><div id="stock" class="stock"></div><div id="skuLine" class="skuLine"><b>SKU／料號：</b><span id="skuValue">—</span></div>
<div class="qtyrow"><b>數量</b><div class="qtybox"><button id="minus" type="button">−</button><input id="qty" value="1" inputmode="numeric"><button id="plus" type="button">＋</button></div></div>
<div class="actions"><button id="buy" class="btn buy" disabled>立即購買</button><button id="addCart" class="btn cart" disabled>加入購物車</button></div>
<section id="addons" class="addons" hidden><h3>一起加購</h3><div id="addonGrid" class="addonGrid"></div></section>
</div></section>
<section class="detail"><div><h2>商品介紹</h2><div id="description" class="desc"></div></div><aside class="meta"><div class="metaRow"><b>商品分類</b><span id="category"></span></div><div class="metaRow"><b>品牌／供應</b><span id="brand"></span></div><div class="metaRow"><b>履約方式</b><span id="fulfillment"></span></div></aside></section></article></main>
<div id="toast" class="toast"></div>
<script>
const API='https://bookwide-hiking-api.pmktools.workers.dev',CART_KEY='bw_gift_cart_v1',$=id=>document.getElementById(id),fmt=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const productId=String(new URL(location.href).searchParams.get('product')||'').trim();let P=null,ALL=[],selected={},selectedVariation=null;

const BW_LANG_KEY='bw_gift_lang_v1';
let BW_LANG=localStorage.getItem(BW_LANG_KEY)||'zh-TW',BW_TRANSLATION=null;
const BW_UI={
'zh-TW':{library:'← 商品庫',cart:'🛒 購物車',qty:'數量',buy:'立即購買',add:'加入購物車',intro:'商品介紹',cat:'商品分類',brand:'品牌／供應',fulfill:'履約方式',sku:'SKU／料號：'},
'en':{library:'← Products',cart:'🛒 Cart',qty:'Qty',buy:'Buy now',add:'Add to cart',intro:'Product description',cat:'Category',brand:'Brand / Supplier',fulfill:'Fulfillment',sku:'SKU: '}
};
function bwStaticLangV6(lang){
  BW_LANG=lang;localStorage.setItem(BW_LANG_KEY,lang);document.documentElement.lang=lang;
  document.querySelectorAll('#langSwitch [data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
  const u=BW_UI[lang]||BW_UI['zh-TW'];
  const lib=document.querySelector('.toplink.hideMobile');if(lib)lib.textContent=u.library;
  const cartEl=document.querySelector('.cartLink');if(cartEl&&cartEl.firstChild)cartEl.firstChild.nodeValue=u.cart+' ';
  const qb=document.querySelector('.qtyrow>b');if(qb)qb.textContent=u.qty;
  if($('buy'))$('buy').textContent=u.buy;if($('addCart'))$('addCart').textContent=u.add;
  const dh=document.querySelector('.detail h2');if(dh)dh.textContent=u.intro;
  const mb=document.querySelectorAll('.metaRow b');if(mb[0])mb[0].textContent=u.cat;if(mb[1])mb[1].textContent=u.brand;if(mb[2])mb[2].textContent=u.fulfill;const sb=$('skuLine')?.querySelector('b');if(sb)sb.textContent=u.sku;
}
function bwTranslationPayloadV6(){
  const gs=groups();
  return {
    name:P?.name||'',summary:P?.detail_summary||'',description:P?.detail_description||'',
    category:P?.category||'',brand:P?.brand||P?.supplier||'',
    group_names:gs.map(g=>g.name),
    options:gs.flatMap(g=>g.values||[])
  };
}
async function bwApplyLanguageV6(lang){
  bwStaticLangV6(lang);
  if(!P)return;
  if(lang==='zh-TW'){
    BW_TRANSLATION=null;
    $('name').textContent=P.name||'';
    $('summary').textContent=P.detail_summary||'';
    $('description').textContent=P.detail_description||'此商品目前尚未填寫詳細介紹。';
    $('category').textContent=P.category||'—';
    $('brand').textContent=P.brand||P.supplier||'BookWide';
    renderOptions();
    return;
  }
  const cacheKey='bw_gift_trans_'+String(P.id||P.external_id||'')+'_'+lang;
  let t=null;try{t=JSON.parse(sessionStorage.getItem(cacheKey)||'null')}catch(_){}
  if(!t){
    try{
      const r=await fetch(API+'/api/bw-product-page-translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target_lang:lang,product:bwTranslationPayloadV6()}),cache:'no-store'});
      const j=await r.json();
      if(!r.ok||j.ok===false)throw new Error(j.message||j.error||('HTTP '+r.status));
      t=j.translated||{};sessionStorage.setItem(cacheKey,JSON.stringify(t));
    }catch(e){console.warn('language translate failed',e);return}
  }
  BW_TRANSLATION=t;
  $('name').textContent=t.name||P.name||'';
  $('summary').textContent=t.summary||P.detail_summary||'';
  $('description').textContent=t.description||P.detail_description||'';
  $('category').textContent=t.category||P.category||'—';
  $('brand').textContent=t.brand||P.brand||P.supplier||'BookWide';
  renderOptions();
}

function bwTwShortSpecV1(raw){
  let s=String(raw||'').trim();
  const reps=[['亚克力','壓克力'],['首饰','首飾'],['礼盒','禮盒'],['礼物','禮物'],['颜色','顏色'],['高级','高級'],['绅士','紳士'],['守护','守護'],['无防尘罩','無防塵罩'],['防尘罩','防塵罩'],['许你','許你'],['诺言','諾言'],['不会','不會'],['凋谢','凋謝'],['美丽','美麗'],['热销','熱銷']];
  for(const [x,y] of reps)s=s.split(x).join(y);
  s=s.replace(/近期\s*熱銷/g,'').replace(/^\s*熊憨憨[·・:\s-]*/,'').trim()
    .replace(/[【\[]\s*壓克力首飾盒款\s*[】\]]/g,'｜壓克力盒')
    .replace(/[【\[]\s*無防塵罩款\s*[】\]]/g,'｜無防塵罩')
    .replace(/[【\[]\s*防塵罩款\s*[】\]]/g,'｜防塵罩')
    .replace(/[【\[]\s*([^】\]]+?)款\s*[】\]]/g,'｜$1')
    .replace(/[【\[]\s*([^】\]]+?)\s*[】\]]/g,'｜$1')
    .replace(/\s*[|｜]\s*/g,'｜').replace(/\s{2,}/g,' ').trim();
  return s.length>26?s.slice(0,25)+'…':s;
}
function bwOptionLabelV1(groupName,raw){
  const gs=groups();
  if(gs.length===1){
    const hit=(P.variations||[]).find(v=>v&&v.is_active!==false&&String(v.attributes?.[groupName]||'')===String(raw));
    if(String(hit?.display_name||'').trim())return String(hit.display_name).trim();
  }
  return bwTwShortSpecV1(raw);
}

function youtubeId(url){const m=String(url||'').match(/(?:youtube\.com\/(?:shorts\/|watch\?v=|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/i);return m?m[1]:''}
function cart(){try{return JSON.parse(localStorage.getItem(CART_KEY)||'[]')||[]}catch(_){return[]}}
function saveCart(a){localStorage.setItem(CART_KEY,JSON.stringify(a));paintCartCount()}
function paintCartCount(){$('cartCount').textContent=cart().reduce((s,x)=>s+Number(x.quantity||1),0)}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1500)}
function mediaItems(p){
  const a=[];
  if(p.video_url)a.push({type:youtubeId(p.video_url)?'youtube':'video',url:p.video_url});
  const images=[];
  const pushImage=u=>{u=String(u||'').trim();if(u&&!images.includes(u))images.push(u)};
  pushImage(p.image_url);
  (p.gallery_urls||[]).forEach(pushImage);
  images.slice(0,4).forEach(url=>a.push({type:'image',url}));
  return a
}
function showMedia(it,i){const st=$('stage');st.className='stage'+(it.type==='image'?' is-image':'');if(it.type==='youtube')st.innerHTML=`<iframe src="https://www.youtube.com/embed/${youtubeId(it.url)}?rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;else if(it.type==='video')st.innerHTML=`<video src="${esc(it.url)}" ${P.image_url?`poster="${esc(P.image_url)}"`:''} controls playsinline></video>`;else st.innerHTML=`<img src="${esc(it.url)}" alt="">`;document.querySelectorAll('.thumb').forEach((b,n)=>b.classList.toggle('active',n===i))}
function renderMedia(){const a=mediaItems(P);$('thumbs').innerHTML=a.map((x,i)=>`<button class="thumb ${i===0?'active':''}" data-i="${i}">${x.type==='image'?`<img src="${esc(x.url)}">`:'<span>▶</span>'}</button>`).join('');document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.i);if(a[i])showMedia(a[i],i)});if(a[0])showMedia(a[0],0)}
function showVariationImageSafe(v){
  const url=String(v?.image_url||'').trim();
  if(!url)return;

  // 先找左側既有媒體縮圖；找到就沿用原本 showMedia，完全不重建縮圖。
  const a=mediaItems(P);
  const idx=a.findIndex(x=>x.type==='image'&&String(x.url||'')===url);
  if(idx>=0){
    showMedia(a[idx],idx);
    return;
  }

  // 規格圖若不是主圖／圖庫的一員，只暫時換主顯示區。
  // 不改 thumbs、不改 onclick、不改 mediaItems，左側縮圖仍可照原本方式點回去。
  const st=$('stage');
  if(!st)return;
  const img=new Image();
  img.alt='';
  img.onload=()=>{
    st.className='stage is-image';
    st.innerHTML='';
    st.appendChild(img);
    document.querySelectorAll('.thumb').forEach(b=>b.classList.remove('active'));
  };
  img.onerror=()=>{}; // 載入失敗就維持目前正常畫面，不把左區變黑。
  img.src=url;
}
function groups(){return (P.option_groups?.length?P.option_groups:(P.attributes||[]).map(a=>({name:a.name,required:true,values:a.values||[]})))}
function findVar(){const gs=groups();if(!gs.length)return null;if(gs.some(g=>g.required!==false&&!selected[g.name]))return null;return (P.variations||[]).find(v=>v.is_active!==false&&gs.every(g=>String(v.attributes?.[g.name]||'')===String(selected[g.name]||'')))||null}
function refresh(){selectedVariation=findVar();const gs=groups();let can=true,price=Number(P.price||0),stock='可訂購',priceText='';if(gs.length&&!selectedVariation){can=false;stock='請先選擇完整規格';const vp=(P.variations||[]).filter(v=>v&&v.is_active!==false).map(v=>Number(v.sale_price||v.price||0)).filter(n=>n>0);priceText=vp.length?`${fmt(Math.min(...vp))} 起`:'請選擇規格'}else if(selectedVariation){price=Number(selectedVariation.sale_price||selectedVariation.price||0);if(selectedVariation.stock_tracking_enabled!==false){const q=Number(selectedVariation.stock_qty||0);stock=q>0?`現貨 ${q}`:'此規格缺貨';can=q>0}}else if(P.stock_tracking_enabled===true){const q=Number(P.stock_qty||0);stock=q>0?`現貨 ${q}`:'目前缺貨';can=q>0}$('price').textContent=priceText||fmt(price);$('stock').textContent=stock;$('skuValue').textContent=selectedVariation?.sku||P.sku||(gs.length?'請先選擇規格':'—');$('buy').disabled=!can;$('addCart').disabled=!can;if(selectedVariation?.image_url)showVariationImageSafe(selectedVariation)}
function renderOptions(){
  const gs=groups(),box=$('options'),t=BW_TRANSLATION||{},tg=Array.isArray(t.group_names)?t.group_names:[],to=Array.isArray(t.options)?t.options:[];
  let gi=0,oi=0;
  box.innerHTML=gs.map(g=>{
    const gLabel=tg[gi++]||g.name;
    return `<div class="optGroup"><div class="optLabel">${esc(gLabel)}${g.required!==false?' *':''}</div><div class="options">${(g.values||[]).map(v=>{
      const translated=to[oi++]||'';
      const label=translated||bwOptionLabelV1(g.name,v);
      return `<button type="button" class="opt" title="${esc(v)}" data-n="${esc(g.name)}" data-v="${esc(v)}">${esc(label)}</button>`
    }).join('')}</div></div>`
  }).join('');
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{selected[b.dataset.n]=b.dataset.v;box.querySelectorAll('.opt').forEach(x=>{if(x.dataset.n===b.dataset.n)x.classList.toggle('active',x===b)});refresh()});
  refresh()
}
function qty(){return Math.max(1,Math.min(99,Math.floor(Number($('qty').value)||1)))}
function lineFor(p,quantity=1,variation=null,opts={}){return {product_id:p.id,name:p.name,image_url:variation?.image_url||p.image_url||'',quantity,variation_id:variation?.id||'',sku:String(variation?.sku||p.sku||''),source_sku_id:String(variation?.source_sku_id||p.source_sku_id||''),variation_display_name:String(variation?.display_name||''),selected_options:opts,unit_price:Number(variation?.sale_price||variation?.price||p.price||0)}}
function addonSelected(){
  return [...document.querySelectorAll('[data-addon-check]')].filter(c=>c.checked).map(c=>{
    const p=ALL.find(x=>String(x.id)===String(c.dataset.addonCheck));if(!p)return null;
    const qtyEl=document.querySelector(`[data-addon-qty="${CSS.escape(String(p.id))}"]`);
    return {product:p,quantity:Math.max(1,Math.min(99,Number(qtyEl?.value||1)))};
  }).filter(Boolean)
}
function currentGroup(){
  return {group_id:'g_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7),parent:lineFor(P,qty(),selectedVariation,selected),children:addonSelected().map(x=>lineFor(x.product,x.quantity,null,{}))}
}
function addCurrentToCart(go=false){
  const a=cart(),g=currentGroup();a.push(g);saveCart(a);toast(`已加入購物車：1 主商品＋${g.children.length} 子項`);if(go)location.href='/line-gift-cart.html'
}
function directBuy(){
  const g=currentGroup();sessionStorage.setItem('bw_gift_direct_group',JSON.stringify([g]));location.href='/line-gift-checkout.html?mode=cart&direct=1'
}
function renderAddons(){
  const defs=(P.add_on_items&&P.add_on_items.length)?P.add_on_items:(P.add_on_product_ids||[]).map((id,i)=>({product_id:id,default_qty:1,required:false,sort_order:i}));
  const rows=defs.map(d=>({def:d,p:ALL.find(x=>String(x.id)===String(d.product_id))})).filter(x=>x.p&&x.p.is_active!==false);
  if(!rows.length)return;
  $('addons').hidden=false;
  $('addonGrid').innerHTML=rows.map(({def,p})=>`<label class="addon"><img src="${esc(p.image_url||'')}"><span><span class="addonName">${esc(p.name)}</span><span class="addonPrice">${fmt(p.price)} ${def.required?'<b style="color:#a45157">・必選</b>':''}</span><span style="display:block;margin-top:6px;font-size:12px">數量 <input data-addon-qty="${esc(p.id)}" type="number" min="1" max="99" value="${Math.max(1,Number(def.default_qty||1))}" style="width:54px"></span></span><input type="checkbox" data-addon-check="${esc(p.id)}" ${def.required?'checked disabled':''}></label>`).join('')
}
async function boot(){try{const r=await fetch(API+'/api/bw-products',{cache:'no-store'}),j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.error||'讀取失敗');ALL=j.products||[];P=ALL.find(p=>String(p.id)===productId||String(p.external_id)===productId);if(!P)throw new Error('找不到商品');if(P.is_addon_product===true)throw new Error('此商品為加購子項，僅能依附主商品選購，不能單獨購買。');$('eyebrow').textContent='BookWide・'+(P.category||'福利品');$('name').textContent=P.name;$('summary').textContent=P.detail_summary||'';$('description').textContent=P.detail_description||'此商品目前尚未填寫詳細介紹。';$('category').textContent=P.category||'—';$('brand').textContent=P.brand||P.supplier||'BookWide';$('fulfillment').textContent=({ship:'實體出貨',voucher:'電子券／發券',pickup:'自取',service:'服務／其他'})[P.fulfillment_type]||P.fulfillment_type||'—';renderMedia();renderOptions();renderAddons();$('loading').hidden=true;$('product').hidden=false;await bwApplyLanguageV6(BW_LANG)}catch(e){$('loading').hidden=true;$('err').style.display='block';$('err').textContent='商品載入失敗：'+String(e.message||e)}}
document.querySelectorAll('#langSwitch [data-lang]').forEach(b=>b.onclick=()=>bwApplyLanguageV6(b.dataset.lang));
$('minus').onclick=()=>{$('qty').value=Math.max(1,qty()-1)};$('plus').onclick=()=>{$('qty').value=Math.min(99,qty()+1)};$('qty').onchange=()=>{$('qty').value=qty()};$('buy').onclick=directBuy;$('addCart').onclick=()=>addCurrentToCart(false);paintCartCount();boot();
</script></body></html>
