<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>商品詳情｜BookWide</title>
<style>
:root{--ink:#241b22;--muted:#806c73;--line:#eadfe1;--paper:#fffdfc;--rose:#b96f73;--rose2:#8f4f54;--soft:#f8f2f1;--green:#2f7d5b}
*{box-sizing:border-box}body{margin:0;background:#f6f5f6;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}a{text-decoration:none;color:inherit}
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);border-bottom:1px solid #eee;backdrop-filter:blur(10px)}
.topin{max-width:1320px;margin:auto;padding:13px 24px;display:flex;align-items:center;gap:14px}.brand{font-size:20px;font-weight:950;color:#132743}.back{margin-left:auto;color:#53657b;font-weight:800}
.wrap{max-width:1320px;margin:0 auto;padding:34px 26px 64px}.product{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 36px rgba(52,35,40,.07)}
.hero{display:grid;grid-template-columns:minmax(430px,1.08fr) minmax(390px,.92fr);min-height:650px}.mediaSide{padding:30px;background:#faf8f7;border-right:1px solid var(--line)}
.stage{height:570px;border-radius:16px;overflow:hidden;background:#111;display:grid;place-items:center;position:relative}.stage img,.stage video{width:100%;height:100%;object-fit:contain;background:#111}.stage iframe{width:100%;height:100%;border:0;background:#111}.stage.is-image{background:#f4f1ef}.stage.is-image img{object-fit:contain;background:#f4f1ef}
.thumbs{display:flex;gap:10px;margin-top:13px;overflow-x:auto;padding:2px 1px 5px}.thumb{width:72px;height:72px;min-width:72px;border:2px solid transparent;border-radius:10px;overflow:hidden;background:#eee;cursor:pointer;padding:0}.thumb.active{border-color:var(--rose2)}.thumb img{width:100%;height:100%;object-fit:cover}.thumb span{display:grid;place-items:center;width:100%;height:100%;font-size:25px;background:#161616;color:#fff}
.info{padding:48px 50px 38px}.eyebrow{font-size:15px;color:var(--rose);letter-spacing:.06em;font-weight:800;margin-bottom:9px}h1{font-family:Georgia,"Noto Serif TC",serif;font-size:38px;line-height:1.22;margin:0 0 14px;font-weight:800}.summary{color:var(--muted);line-height:1.7;margin:0 0 22px;font-size:16px}.price{font-family:Georgia,serif;font-size:42px;font-weight:800;color:#9d795e;margin:8px 0 24px}
.optGroup{margin:18px 0}.optLabel{font-weight:900;margin-bottom:9px}.options{display:flex;gap:10px;flex-wrap:wrap}.opt{border:1px solid #cbb6b7;background:#fff;border-radius:9px;padding:11px 17px;cursor:pointer;font-size:15px}.opt.active{background:#3d3335;color:#fff;border-color:#3d3335}.stock{font-size:14px;color:var(--green);margin:15px 0 5px;font-weight:800}
.cta{width:100%;border:0;border-radius:12px;padding:16px 18px;font-size:18px;font-weight:950;background:var(--rose2);color:#fff;cursor:pointer;margin-top:17px}.cta:disabled{background:#b9aaad;cursor:not-allowed}
.detail{padding:34px 42px 48px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 320px;gap:36px}.detail h2{margin:0 0 18px;font-size:23px}.desc{font-size:16px;line-height:1.9;white-space:pre-wrap;color:#44393c}.meta{background:var(--soft);border-radius:14px;padding:20px;height:max-content}.metaRow{padding:10px 0;border-bottom:1px solid #e7dadb}.metaRow:last-child{border-bottom:0}.meta b{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.err{display:none;margin:30px auto;max-width:900px;padding:20px;border-radius:12px;background:#fff0f1;color:#a12b37;font-weight:800}.loading{padding:120px 20px;text-align:center;color:var(--muted)}
@media(max-width:900px){.wrap{padding:16px 10px 40px}.hero{grid-template-columns:1fr;min-height:0}.mediaSide{padding:12px;border-right:0;border-bottom:1px solid var(--line)}.stage{height:min(72vh,560px)}.info{padding:26px 20px 30px}h1{font-size:30px}.price{font-size:34px}.detail{grid-template-columns:1fr;padding:26px 20px}.topin{padding:11px 14px}}
@media(max-width:480px){.stage{height:55vh;min-height:390px}.thumb{width:58px;height:58px;min-width:58px}.info{padding:22px 16px 26px}h1{font-size:26px}.summary{font-size:14px}.price{font-size:31px}.opt{padding:10px 13px}.detail{padding:23px 16px}.brand{font-size:18px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><a class="brand" href="/line-gifts.html">BookWide・福利品</a><a class="back" href="/line-gifts.html">← 返回商品庫</a></div></header>
<main class="wrap">
<div id="loading" class="loading">讀取商品中…</div><div id="err" class="err"></div>
<article id="product" class="product" hidden>
<section class="hero">
<div class="mediaSide"><div id="stage" class="stage"></div><div id="thumbs" class="thumbs"></div></div>
<div class="info"><div id="eyebrow" class="eyebrow"></div><h1 id="name"></h1><p id="summary" class="summary"></p><div id="price" class="price"></div><div id="options"></div><div id="stock" class="stock"></div><button id="buy" class="cta" disabled>選好規格後購買</button></div>
</section>
<section class="detail"><div><h2>商品介紹</h2><div id="description" class="desc"></div></div><aside class="meta"><div class="metaRow"><b>商品分類</b><span id="category"></span></div><div class="metaRow"><b>品牌／供應</b><span id="brand"></span></div><div class="metaRow"><b>履約方式</b><span id="fulfillment"></span></div></aside></section>
</article>
</main>
<script>
const API='https://bookwide-hiking-api.pmktools.workers.dev';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW');
const productId=String(new URL(location.href).searchParams.get('product')||'').trim();
let P=null,selected={},selectedVariation=null;

function youtubeId(url){const s=String(url||'').trim();const m=s.match(/(?:youtube\.com\/(?:shorts\/|watch\?v=|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/i);return m?m[1]:''}
function mediaItems(p){
 const a=[];
 if(p.video_url)a.push({type:youtubeId(p.video_url)?'youtube':'video',url:p.video_url,label:'影片'});
 if(p.image_url)a.push({type:'image',url:p.image_url,label:'主圖'});
 (p.gallery_urls||[]).forEach((u,i)=>{if(u&&!a.some(x=>x.url===u)){a.push({type:'image',url:u,label:'圖'+(i+1)})}});
 return a;
}
function showMedia(item,idx){
 const st=$('stage');st.className='stage'+(item.type==='image'?' is-image':'');
 if(item.type==='youtube'){const id=youtubeId(item.url);st.innerHTML=`<iframe src="https://www.youtube.com/embed/${esc(id)}?rel=0&playsinline=1" title="商品影片" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`}
 else if(item.type==='video'){st.innerHTML=`<video src="${esc(item.url)}" ${P?.image_url?`poster="${esc(P.image_url)}"`:''} controls playsinline preload="metadata"></video>`}
 else{st.innerHTML=`<img src="${esc(item.url)}" alt="${esc(P?.name||'商品圖片')}">`}
 document.querySelectorAll('.thumb').forEach((b,i)=>b.classList.toggle('active',i===idx));
}
function renderMedia(){
 const items=mediaItems(P),thumbs=$('thumbs');
 if(!items.length){$('stage').innerHTML='<div style="color:#bbb">尚無商品媒體</div>';thumbs.innerHTML='';return}
 thumbs.innerHTML=items.map((x,i)=>`<button class="thumb ${i===0?'active':''}" data-i="${i}" title="${esc(x.label)}">${x.type==='image'?`<img src="${esc(x.url)}" alt="">`:'<span>▶</span>'}</button>`).join('');
 thumbs.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>showMedia(items,Number(b.dataset.i)));
 showMedia(items[0],0);
}
function optionGroups(p){if(Array.isArray(p.option_groups)&&p.option_groups.length)return p.option_groups;return (p.attributes||[]).map(a=>({name:a.name,required:true,values:a.values||[]}))}
function activeVariations(){return (P.variations||[]).filter(v=>v&&v.is_active!==false)}
function variationPrice(v){return Number(v?.sale_price||v?.price||0)}
function findVariation(){
 const groups=optionGroups(P);if(!groups.length)return null;
 if(groups.some(g=>g.required!==false&&!selected[g.name]))return null;
 return activeVariations().find(v=>groups.every(g=>!selected[g.name]||String(v.attributes?.[g.name]||'')===String(selected[g.name])))||null;
}
function refreshChoice(){
 selectedVariation=findVariation();
 if(selectedVariation){
   const pr=variationPrice(selectedVariation);if(pr>0)$('price').textContent=fmt(pr);
   const tracking=selectedVariation.stock_tracking_enabled!==false,qty=Number(selectedVariation.stock_qty||0);
   $('stock').textContent=tracking?(qty>0?`現貨 ${qty}`:'此規格目前缺貨'):'可訂購';
   $('buy').disabled=tracking&&qty<=0;$('buy').textContent=(tracking&&qty<=0)?'此規格目前缺貨':'立即購買';
 }else{
   const groups=optionGroups(P);
   if(groups.length){$('stock').textContent='';$('buy').disabled=true;$('buy').textContent='選好規格後購買'}
   else{const tracking=P.stock_tracking_enabled===true,qty=Number(P.stock_qty||0);$('stock').textContent=tracking?(qty>0?`現貨 ${qty}`:'目前缺貨'):'可訂購';$('buy').disabled=tracking&&qty<=0;$('buy').textContent=(tracking&&qty<=0)?'目前缺貨':'立即購買'}
 }
}
function renderOptions(){
 const groups=optionGroups(P),box=$('options');
 box.innerHTML=groups.map(g=>`<div class="optGroup"><div class="optLabel">${esc(g.name)}${g.required!==false?' *':''}</div><div class="options">${(g.values||[]).map(v=>`<button type="button" class="opt" data-name="${esc(g.name)}" data-value="${esc(v)}">${esc(v)}</button>`).join('')}</div></div>`).join('');
 box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{selected[b.dataset.name]=b.dataset.value;box.querySelectorAll('.opt').forEach(x=>{if(x.dataset.name===b.dataset.name)x.classList.toggle('active',x===b)});refreshChoice()});
 refreshChoice();
}
function checkout(){
 const groups=optionGroups(P);if(groups.some(g=>g.required!==false&&!selected[g.name]))return;
 const q=new URLSearchParams({product:P.id});if(selectedVariation?.id)q.set('variant',selectedVariation.id);if(Object.keys(selected).length)q.set('opts',JSON.stringify(selected));location.href='/line-gift-checkout.html?'+q.toString();
}
async function boot(){
 try{
   if(!productId)throw new Error('缺少商品 ID');
   const r=await fetch(API+'/api/bw-products',{cache:'no-store'}),j=await r.json();
   if(!r.ok||j.ok===false)throw new Error(j.message||j.error||('HTTP '+r.status));
   P=(j.products||[]).find(p=>String(p.id)===productId||String(p.external_id)===productId);
   if(!P||P.is_active===false)throw new Error('找不到商品，或商品目前未上架');
   $('eyebrow').textContent='BookWide・'+(P.category||'福利品');$('name').textContent=P.name||'商品';$('summary').textContent=P.detail_summary||'';$('price').textContent=fmt(P.price);
   $('description').textContent=P.detail_description||'此商品目前尚未填寫詳細介紹。';$('category').textContent=P.category||'—';$('brand').textContent=P.brand||P.supplier||'BookWide';
   $('fulfillment').textContent=({ship:'實體出貨',voucher:'電子券／發券',pickup:'自取',service:'服務／其他'})[P.fulfillment_type]||P.fulfillment_type||'—';
   renderMedia();renderOptions();$('buy').onclick=checkout;$('loading').hidden=true;$('product').hidden=false;
 }catch(e){$('loading').hidden=true;$('err').style.display='block';$('err').textContent='商品載入失敗：'+String(e.message||e)}
}
boot();
</script>
</body>
</html>
