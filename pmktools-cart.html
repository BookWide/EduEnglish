<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMKTOOLS 購物車</title><style>body{margin:0;background:#f6f7f9;color:#111827;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:980px;margin:28px auto;padding:0 16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top a{color:#0f3b67;text-decoration:none;font-weight:800}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px}.g{display:grid;grid-template-columns:88px 1fr auto;gap:16px;padding:16px 0;border-bottom:1px solid #eee}.g img{width:88px;height:88px;object-fit:cover;border-radius:10px;background:#eee}.name{font-weight:900;font-size:18px}.sub{font-size:13px;color:#6b7280;margin-top:5px}.price{font-weight:900}.remove{border:0;background:none;color:#b91c1c;cursor:pointer}.total{text-align:right;font-size:24px;font-weight:950;margin:20px 0}.actions{display:flex;gap:12px;justify-content:flex-end}.btn{border:1px solid #cbd5e1;border-radius:12px;padding:12px 18px;background:#fff;font-weight:900;cursor:pointer}.primary{background:#0f3b67;color:#fff;border-color:#0f3b67}.empty{text-align:center;padding:70px 20px;color:#6b7280}@media(max-width:600px){.g{grid-template-columns:70px 1fr}.g img{width:70px;height:70px}.g>.price{grid-column:2}.actions{flex-direction:column}.btn{width:100%}}</style></head><body><main class="wrap"><div class="top"><a href="/pmktools.html">← 返回商品庫</a><b>PMKTOOLS 購物車</b></div><section class="card"><div id="list"></div><div id="total" class="total"></div><div class="actions"><button class="btn" id="clear">清空購物車</button><button class="btn primary" id="checkout">前往結帳</button></div></section></main><script>const KEY='pmktools_cart_v1',$=x=>document.getElementById(x),fmt=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW');function read(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')||[]}catch(_){return[]}}function save(a){localStorage.setItem(KEY,JSON.stringify(a));render()}function lines(g){return [g.parent,...(g.children||[])]}function render(){const a=read();if(!a.length){$('list').innerHTML='<div class="empty">購物車目前沒有商品</div>';$('total').textContent='';$('checkout').disabled=true;return}$('checkout').disabled=false;let sum=0;$('list').innerHTML=a.map((g,i)=>{const p=g.parent||{},ls=lines(g);const st=ls.reduce((n,x)=>n+Number(x.unit_price||0)*Number(x.quantity||1),0);sum+=st;return `<div class="g"><img src="${p.image_url||''}"><div><div class="name">${p.name||p.product_id||'商品'}</div><div class="sub">數量 ${p.quantity||1}${(g.children||[]).length?` ・ 加購 ${(g.children||[]).length} 項`:''}</div>${(g.children||[]).map(x=>`<div class="sub">＋ ${x.name||x.product_id} × ${x.quantity||1}</div>`).join('')}<button class="remove" onclick="rm(${i})">移除</button></div><div class="price">${fmt(st)}</div></div>`}).join('');$('total').textContent='合計 '+fmt(sum)}window.rm=i=>{const a=read();a.splice(i,1);save(a)};$('clear').onclick=()=>{if(confirm('清空購物車？'))save([])};$('checkout').onclick=()=>location.href='/pmktools-checkout.html?mode=cart';render();</script></body></html>
