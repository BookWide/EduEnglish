<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>聯鑽購物車｜PMKTOOLS</title>
<style>
:root{--ink:#182235;--muted:#718096;--line:#e6e9ee;--bg:#f7f8fa;--navy:#123f6b;--orange:#ff5a1f;--soft:#fff7f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
a{text-decoration:none;color:inherit}.wrap{max-width:1240px;margin:0 auto;padding:22px 18px 110px}
.top{display:flex;align-items:center;gap:18px;margin-bottom:16px}.back{font-weight:850;color:var(--navy)}.title{font-size:26px;font-weight:950;margin-left:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.head{display:grid;grid-template-columns:minmax(420px,1fr) 190px 180px 130px 90px;gap:12px;padding:13px 18px;background:#fbfcfd;border-bottom:1px solid var(--line);font-size:13px;color:#64748b;font-weight:800}
.item{display:grid;grid-template-columns:minmax(420px,1fr) 190px 180px 130px 90px;gap:12px;align-items:center;padding:18px;border-bottom:1px solid #edf0f3}.item:last-child{border-bottom:0}
.prod{display:grid;grid-template-columns:106px minmax(0,1fr);gap:16px;align-items:center}.prod img{width:106px;height:92px;object-fit:contain;border-radius:10px;background:#f4f4f4}
.name{font-size:18px;font-weight:900;line-height:1.35;margin-bottom:6px}.sku{font-size:13px;color:#53657b;line-height:1.45}.sku b{color:#26364a}.spec{font-size:13px;color:#7b8797;margin-top:3px}
.price{font-weight:850;font-size:17px}.lineTotal{font-size:18px;font-weight:950;color:#0f172a}
.qty{display:inline-flex;border:1px solid #d8dde5;border-radius:8px;overflow:hidden;background:#fff}.qty button{width:38px;height:36px;border:0;background:#fff;font-size:20px;cursor:pointer}.qty button:hover{background:#f3f4f6}.qty input{width:50px;border:0;border-left:1px solid #e2e6eb;border-right:1px solid #e2e6eb;text-align:center;font-weight:850;font-size:15px;outline:0}
.remove{border:0;background:transparent;color:#e33b36;font-weight:800;cursor:pointer;padding:8px}
.empty{padding:60px 20px;text-align:center;color:#64748b}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid #e3e7ec;z-index:30}
.bottomIn{max-width:1240px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:18px}.companyMini{font-size:12px;color:#7b8797;line-height:1.45}.spacer{flex:1}.totalLabel{font-size:14px;color:#64748b}.total{font-size:28px;font-weight:950;color:#0f172a;min-width:170px;text-align:right}.clear{border:1px solid #d6dce5;background:#fff;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}.checkout{border:0;background:var(--navy);color:#fff;border-radius:10px;padding:13px 22px;font-size:16px;font-weight:950;cursor:pointer}.checkout:disabled{opacity:.45}
.footer{max-width:1240px;margin:16px auto 0;padding:18px;text-align:center;color:#768396;font-size:13px;line-height:1.7}
.badge{display:inline-block;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--orange);font-size:11px;font-weight:900;margin-left:6px}
@media(max-width:850px){
  .wrap{padding:10px 8px 125px}.title{font-size:21px}.head{display:none}.card{border-radius:12px}
  .item{grid-template-columns:1fr auto;padding:12px;gap:10px}.prod{grid-column:1/-1;grid-template-columns:88px minmax(0,1fr);gap:10px}.prod img{width:88px;height:78px}.name{font-size:16px}
  .price:before{content:"單價 ";font-size:12px;color:#7b8797;font-weight:600}.lineTotal{display:none}.remove{justify-self:end}.qty{justify-self:start}
  .bottomIn{padding:9px 10px;gap:9px;flex-wrap:wrap}.companyMini{display:none}.totalLabel{margin-left:auto}.total{font-size:23px;min-width:auto}.clear{padding:10px 12px}.checkout{padding:11px 15px}
}
</style></head><body>
<div class="wrap">
  <div class="top"><a class="back" href="/pmktools.html">← 返回商品庫</a><div class="title">聯鑽購物車</div></div>
  <div class="card">
    <div class="head"><div>商品資訊</div><div>SKU／規格</div><div>數量</div><div>小計</div><div>操作</div></div>
    <div id="list"></div>
  </div>
  <div class="footer">
    聯鑽企業有限公司｜統一編號：53270306｜Taichung City, Taiwan<br>
    BookWide Enterprise Co., Ltd. ｜ Tel: +886 4 24623591
  </div>
</div>
<div class="bottom"><div class="bottomIn">
  <div class="companyMini">聯鑽企業有限公司<br>統一編號 53270306</div>
  <div class="spacer"></div>
  <div class="totalLabel">合計</div><div id="total" class="total">NT$ 0</div>
  <button id="clear" class="clear">清空購物車</button>
  <button id="checkout" class="checkout">前往結帳</button>
</div></div>
<script>
const CART_KEY='pmktools_cart_v1',$=id=>document.getElementById(id),fmt=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function cart(){try{const x=JSON.parse(localStorage.getItem(CART_KEY)||'[]');return Array.isArray(x)?x:[]}catch(_){return[]}}
function save(a){localStorage.setItem(CART_KEY,JSON.stringify(a));render()}
function flatten(a){
  const out=[];
  a.forEach((g,gi)=>{
    if(g?.parent)out.push({gi,kind:'parent',ci:-1,line:g.parent});
    (Array.isArray(g?.children)?g.children:[]).forEach((line,ci)=>out.push({gi,kind:'child',ci,line}));
  });
  return out
}
function lineSku(l){
  const sku=String(l?.sku||'').trim(),src=String(l?.source_sku_id||'').trim();
  return sku||src||String(l?.variation_id||'').trim()||'—'
}
function specText(l){
  if(l?.variation_name)return String(l.variation_name);
  const o=l?.selected_options&&typeof l.selected_options==='object'?Object.entries(l.selected_options).map(([k,v])=>`${k}: ${v}`).join(' / '):'';
  return o||''
}
function setQty(gi,kind,ci,value){
  const a=cart(),g=a[gi];if(!g)return;
  const l=kind==='parent'?g.parent:g.children?.[ci];if(!l)return;
  l.quantity=Math.max(1,Math.min(99,Math.floor(Number(value)||1)));
  save(a)
}
function removeLine(gi,kind,ci){
  const a=cart(),g=a[gi];if(!g)return;
  if(kind==='parent')a.splice(gi,1);else{g.children.splice(ci,1);if(!g.parent&&g.children.length===0)a.splice(gi,1)}
  save(a)
}
function render(){
  const a=cart(),rows=flatten(a),box=$('list');
  if(!rows.length){box.innerHTML='<div class="empty">購物車目前沒有商品</div>';$('total').textContent=fmt(0);$('checkout').disabled=true;return}
  box.innerHTML=rows.map(({gi,kind,ci,line:l})=>{
    const q=Math.max(1,Number(l.quantity||1)),price=Number(l.unit_price||0),subtotal=q*price;
    return `<div class="item">
      <div class="prod"><img src="${esc(l.image_url||'')}" alt=""><div><div class="name">${esc(l.name||'商品')}${kind==='child'?'<span class="badge">加購</span>':''}</div><div class="price">${fmt(price)}</div></div></div>
      <div><div class="sku"><b>SKU：</b>${esc(lineSku(l))}</div>${specText(l)?`<div class="spec">${esc(specText(l))}</div>`:''}</div>
      <div><div class="qty"><button data-act="minus" data-gi="${gi}" data-kind="${kind}" data-ci="${ci}">−</button><input data-qty data-gi="${gi}" data-kind="${kind}" data-ci="${ci}" value="${q}" inputmode="numeric"><button data-act="plus" data-gi="${gi}" data-kind="${kind}" data-ci="${ci}">＋</button></div></div>
      <div class="lineTotal">${fmt(subtotal)}</div>
      <div><button class="remove" data-act="remove" data-gi="${gi}" data-kind="${kind}" data-ci="${ci}">刪除</button></div>
    </div>`
  }).join('');
  const total=rows.reduce((s,r)=>s+Number(r.line.unit_price||0)*Math.max(1,Number(r.line.quantity||1)),0);
  $('total').textContent=fmt(total);$('checkout').disabled=false
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const gi=Number(b.dataset.gi),ci=Number(b.dataset.ci),kind=b.dataset.kind,act=b.dataset.act;
  if(act==='remove')return removeLine(gi,kind,ci);
  const a=cart(),g=a[gi],l=kind==='parent'?g?.parent:g?.children?.[ci];if(!l)return;
  const q=Math.max(1,Number(l.quantity||1));
  if(act==='minus')setQty(gi,kind,ci,q-1);
  if(act==='plus')setQty(gi,kind,ci,q+1);
});
document.addEventListener('change',e=>{if(!e.target.matches('[data-qty]'))return;setQty(Number(e.target.dataset.gi),e.target.dataset.kind,Number(e.target.dataset.ci),e.target.value)});
$('clear').onclick=()=>{if(confirm('確定清空購物車？'))save([])};
$('checkout').onclick=()=>location.href='/pmktools-checkout.html?mode=cart';
render();
</script></body></html>
