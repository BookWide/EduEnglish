<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的 PMKTOOLS</title><style>body{margin:0;background:#f4f6f8;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#172033}.top{background:#731218;color:#fff;padding:15px 20px}.top a{color:#fff;text-decoration:none;font-weight:800;margin-right:18px}.wrap{max-width:1050px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #dde3ea;border-radius:14px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.k{color:#64748b;font-size:12px}.v{font-weight:850;margin-top:3px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}th{background:#f8fafc}.btn{border:0;background:#111827;color:#fff;border-radius:7px;padding:8px 11px;cursor:pointer}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="top"><a href="/pmktools.html">← 商品首頁</a><a href="#" id="logout">登出</a></div><main class="wrap"><section class="card"><h2>我的帳戶</h2><div id="profile" class="grid"></div></section><section class="card"><h2>訂購紀錄</h2><div class="table"><table><thead><tr><th>日期</th><th>訂單編號</th><th>狀態</th><th>付款條件</th><th>總額</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="6">讀取中…</td></tr></tbody></table></div></section></main><script>const API='https://pmktools-api.pmktools.workers.dev',KEY='pmk_session_v1',fmt=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW');function token(){return localStorage.getItem(KEY)||''}function h(){return{Authorization:'Bearer '+token()}}async function boot(){if(!token())return location.href='/pmktools-login.html';let r=await fetch(API+'/api/pmk-auth/me',{headers:h(),cache:'no-store'}),j=await r.json().catch(()=>({}));if(!r.ok)return location.href='/pmktools-login.html';const u=j.user;document.getElementById('profile').innerHTML=[['客戶',u.customer_name||'—'],['客戶代碼',u.customer_code||'—'],['價格群組',u.price_group_code||'標準'],['付款條件',u.payment_terms||'—']].map(x=>`<div><div class="k">${x[0]}</div><div class="v">${x[1]}</div></div>`).join('');r=await fetch(API+'/api/pmk-account/orders',{headers:h(),cache:'no-store'});j=await r.json().catch(()=>({}));const rows=j.rows||[];document.getElementById('rows').innerHTML=rows.length?rows.map(o=>`<tr><td>${String(o.created_at||'').slice(0,10)}</td><td>${o.order_no}</td><td>${o.status}</td><td>${o.payment_terms||'—'}</td><td>${fmt(o.total_amount)}</td><td><button class="btn" onclick="detail('${o.id}')">明細</button></td></tr>`).join(''):'<tr><td colspan="6">目前沒有訂購紀錄。</td></tr>'}async function detail(id){const r=await fetch(API+'/api/pmk-order?id='+encodeURIComponent(id),{headers:h(),cache:'no-store'}),j=await r.json();if(!r.ok)return alert(j.error||'讀取失敗');alert(j.order.order_no+'\n'+(j.items||[]).map(x=>`${x.product_name} ${x.variation_name||''} × ${x.quantity} = ${fmt(x.line_total)}`).join('\n')+'\n總額 '+fmt(j.order.total_amount))}document.getElementById('logout').onclick=async e=>{e.preventDefault();await fetch(API+'/api/pmk-auth/logout',{method:'POST',headers:h()}).catch(()=>{});localStorage.removeItem(KEY);location.href='/pmktools.html'};boot()</script></body></html>
