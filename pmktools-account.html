<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的 PMKTOOLS</title>
<style>
body{margin:0;background:#f4f6f8;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#172033}
.top{background:#731218;color:#fff;padding:15px 20px}.top a{color:#fff;text-decoration:none;font-weight:800;margin-right:18px}
.wrap{max-width:1100px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #dde3ea;border-radius:14px;padding:20px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.k{color:#64748b;font-size:12px}.v{font-weight:850;margin-top:3px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}
.field input{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px;padding:11px 12px;font-size:15px}
.field input[readonly]{background:#f1f5f9;color:#64748b}.wide{grid-column:1/-1}
.actions{display:flex;align-items:center;gap:12px;margin-top:16px}.btn{border:0;background:#731218;color:#fff;border-radius:8px;padding:10px 18px;font-weight:800;cursor:pointer}
.msg{font-size:14px}.ok{color:#087f5b}.err{color:#b42318}.notice{padding:12px 14px;border-radius:9px;background:#fff7ed;border:1px solid #fed7aa;margin-bottom:15px}
.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}th{background:#f8fafc}
@media(max-width:700px){.grid,.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style>
</head>
<body>
<div class="top"><a href="/pmktools.html">← 商品首頁</a><a href="#" id="logout">登出</a></div>
<main class="wrap">
<section class="card">
<h2>我的帳戶</h2>
<div id="status"></div>
<div id="profile" class="grid"></div>
</section>

<section class="card">
<h2>公司／收件資料</h2>
<p style="color:#64748b">公司名稱、聯絡人、電話與地址可自行維護。統一編號、客戶等級、價格群組、付款條件及 ERP 客戶代號由 PMKTOOLS 管理。</p>
<form id="profileForm">
<div class="formgrid">
<div class="field"><label>Email 登入帳號</label><input id="email" readonly></div>
<div class="field"><label>統一編號</label><input id="taxId" readonly></div>
<div class="field wide"><label>公司名稱 *</label><input id="companyName" required></div>
<div class="field"><label>聯絡人 *</label><input id="contact" required></div>
<div class="field"><label>聯絡電話 *</label><input id="phone" required></div>
<div class="field wide"><label>發票／帳單地址 *</label><input id="billingAddress" required></div>
<div class="field wide"><label>送貨地址</label><input id="shippingAddress"></div>
</div>
<div class="actions"><button class="btn" id="saveBtn" type="submit">儲存我的資料</button><span id="saveMsg" class="msg"></span></div>
</form>
</section>

<section class="card"><h2>訂購紀錄</h2><div class="table"><table><thead><tr><th>日期</th><th>訂單編號</th><th>狀態</th><th>付款條件</th><th>總額</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="6">讀取中…</td></tr></tbody></table></div></section>
</main>
<script>
const API='https://pmktools-api.pmktools.workers.dev',KEY='pmk_session_v1',fmt=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW');
const $=id=>document.getElementById(id);function token(){return localStorage.getItem(KEY)||''}function h(json=false){const x={Authorization:'Bearer '+token()};if(json)x['Content-Type']='application/json';return x}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function boot(){
 if(!token())return location.href='/pmktools-login.html';
 let r=await fetch(API+'/api/pmk-auth/me',{headers:h(),cache:'no-store'}),j=await r.json().catch(()=>({}));
 if(!r.ok)return location.href='/pmktools-login.html';
 r=await fetch(API+'/api/pmk-account/profile',{headers:h(),cache:'no-store'});j=await r.json().catch(()=>({}));
 if(!r.ok){$('status').innerHTML='<div class="notice">公司資料讀取失敗。</div>';return}
 const c=j.customer,p=j.pending,u=j.user||{};
 $('email').value=u.email||'';
 if(p&&!c){
   $('status').innerHTML=`<div class="notice"><b>等待 Admin 核准綁定</b><br>統一編號 ${esc(p.tax_id||p.customer_tax_id||'')} 已有公司資料：${esc(p.customer_name||'')}。核准前不會覆寫既有公司。</div>`;
   $('profile').innerHTML=[['客戶','待核准'],['客戶代碼','—'],['價格群組','標準'],['付款條件','信用卡']].map(x=>`<div><div class="k">${x[0]}</div><div class="v">${x[1]}</div></div>`).join('');
   $('profileForm').querySelectorAll('input:not(#email)').forEach(x=>x.disabled=true);$('saveBtn').disabled=true;
 }else if(c){
   $('profile').innerHTML=[['客戶',c.name||'—'],['ERP 客戶代號',c.erp_code||'尚未設定'],['客戶等級',c.customer_level||'一般客戶'],['價格群組',c.price_group_code||'標準'],['付款條件',c.payment_terms||'信用卡']].map(x=>`<div><div class="k">${x[0]}</div><div class="v">${esc(x[1])}</div></div>`).join('');
   $('taxId').value=c.tax_id||'';$('companyName').value=c.name||'';$('contact').value=c.contact||'';$('phone').value=c.phone||'';
   $('billingAddress').value=c.billing_address||c.address||'';$('shippingAddress').value=c.shipping_address||'';
 }else{
   $('status').innerHTML='<div class="notice">目前沒有公司資料，請重新由註冊流程建立公司資料。</div>';$('saveBtn').disabled=true;
 }
 await loadOrders();
}
async function loadOrders(){
 const r=await fetch(API+'/api/pmk-account/orders',{headers:h(),cache:'no-store'}),j=await r.json().catch(()=>({}));const rows=j.rows||[];
 $('rows').innerHTML=rows.length?rows.map(o=>`<tr><td>${esc(String(o.created_at||'').slice(0,10))}</td><td>${esc(o.order_no)}</td><td>${esc(o.status)}</td><td>${esc(o.payment_terms||'—')}</td><td>${fmt(o.total_amount)}</td><td><button class="btn" onclick="detail('${esc(o.id)}')">明細</button></td></tr>`).join(''):'<tr><td colspan="6">目前沒有訂購紀錄。</td></tr>';
}
$('profileForm').onsubmit=async e=>{
 e.preventDefault();$('saveMsg').textContent='儲存中…';$('saveMsg').className='msg';
 const body={company_name:$('companyName').value.trim(),contact:$('contact').value.trim(),phone:$('phone').value.trim(),billing_address:$('billingAddress').value.trim(),shipping_address:$('shippingAddress').value.trim()};
 try{const r=await fetch(API+'/api/pmk-account/profile',{method:'POST',headers:h(true),body:JSON.stringify(body)}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||j.error||'儲存失敗');$('saveMsg').textContent='已儲存';$('saveMsg').className='msg ok';await boot()}catch(e){$('saveMsg').textContent=e.message;$('saveMsg').className='msg err'}
};
async function detail(id){const r=await fetch(API+'/api/pmk-order?id='+encodeURIComponent(id),{headers:h(),cache:'no-store'}),j=await r.json();if(!r.ok)return alert(j.error||'讀取失敗');alert(j.order.order_no+'\n'+(j.items||[]).map(x=>`${x.product_name} ${x.variation_name||''} × ${x.quantity} = ${fmt(x.line_total)}`).join('\n')+'\n總額 '+fmt(j.order.total_amount))}
$('logout').onclick=async e=>{e.preventDefault();await fetch(API+'/api/pmk-auth/logout',{method:'POST',headers:h()}).catch(()=>{});localStorage.removeItem(KEY);location.href='/pmktools.html'};
boot();
</script></body></html>
