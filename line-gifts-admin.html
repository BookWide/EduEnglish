<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LINE 禮物商品後台｜BookWide</title>
<style>
:root{--nav:#0f1b31;--blue:#2563eb;--green:#06c755;--red:#dc2626;--ink:#14213d;--muted:#64748b;--line:#e5e7eb;--bg:#f5f7fb;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif}a{text-decoration:none;color:inherit}.top{background:var(--nav);color:#fff}.topin{max-width:1280px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:10px}.brand{font-weight:950;font-size:22px;margin-right:auto}.btn,.linkbtn{border:0;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}.linkbtn{border:1px solid rgba(255,255,255,.25)}.btn{background:var(--blue);color:#fff}.btn.green{background:var(--green)}.btn.gray{background:#fff;color:#334155;border:1px solid var(--line)}.btn.red{background:#fff;color:var(--red);border:1px solid #fecaca}.wrap{max-width:1280px;margin:auto;padding:22px 16px 50px}.head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:14px}.head h1{margin:0;font-size:28px}.head p{margin:5px 0 0;color:var(--muted)}.status{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:14px;color:#475569}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.w2{grid-column:span 2}.field.w4{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:800}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 11px;font-size:14px;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tools{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px}.tools input{max-width:420px;width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:960px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;vertical-align:middle}th{background:#f8fafc;color:#334155;position:sticky;top:0}.thumb{width:58px;height:58px;border-radius:10px;object-fit:cover;background:#eef2f7}.name{font-weight:900;max-width:300px}.muted{color:var(--muted)}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900}.badge.on{background:#dcfce7;color:#166534}.badge.off{background:#f1f5f9;color:#64748b}.rowbtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-weight:800;cursor:pointer}.rowbtn.danger{color:var(--red);border-color:#fecaca}.gate{max-width:660px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;text-align:center}.gate h2{margin-top:0}@media(max-width:860px){.formgrid{grid-template-columns:1fr 1fr}.field.w2{grid-column:span 2}}@media(max-width:520px){.formgrid{grid-template-columns:1fr}.field.w2,.field.w4{grid-column:1}.head{display:block}.tools{display:block}.tools input{margin-bottom:8px}.topin{padding:10px}.brand{font-size:17px}.linkbtn{padding:8px 9px;font-size:12px}}

<body>
<header class="top"><div class="topin"><a class="brand" href="/line-gifts.html">← LINE 禮物商品庫</a><a class="linkbtn" href="/admin.html">返回 Admin</a></div></header>
<div class="wrap">
<div id="gate" class="gate"><h2>檢查管理員權限中…</h2><div class="muted">只有 profiles.is_admin = true 的管理員可進入。</div></div>
<div id="app" style="display:none">
  <div class="head"><div><h1>LINE 禮物商品後台 <small style="font-size:14px;color:#64748b">V41.2</small></h1><p>直接維護前台商品，不需再改 JSON。新增／替換／上下架後，前台重新整理即生效。</p></div><button class="btn green" id="newBtn">＋ 新增商品</button></div>
  <div id="status" class="status">準備中…</div>
  <section class="panel">
    <div class="formgrid">
      <div class="field"><label>LINE 商品 ID</label><input id="external_id" placeholder="例如 322504000"></div>
      <div class="field"><label>品牌</label><input id="brand" placeholder="品牌名稱"></div>
      <div class="field w2"><label>商品名稱</label><input id="name" placeholder="商品名稱"></div>
      <div class="field"><label>價格 NT$</label><input id="price" type="number" min="0" step="1" placeholder="0"></div>
      <div class="field"><label>分類</label><input id="category" placeholder="美妝保養 / 甜點烘焙"></div>
      <div class="field w4"><label>節日標籤（可複選；日曆可用 festival 參數直接篩選）</label>
        <div id="festivalChecks" style="display:flex;gap:8px;flex-wrap:wrap;padding:8px 0">
          <label><input type="checkbox" value="father_day"> 父親節</label>
          <label><input type="checkbox" value="qixi"> 七夕情人節</label>
          <label><input type="checkbox" value="teachers_day"> 教師節</label>
          <label><input type="checkbox" value="mid_autumn"> 中秋節</label>
          <label><input type="checkbox" value="christmas"> 聖誕節</label>
          <label><input type="checkbox" value="mother_day"> 母親節</label>
          <label><input type="checkbox" value="dragon_boat"> 端午節</label>
          <label><input type="checkbox" value="new_year"> 新年</label>
        </div>
      </div>
      <div class="field"><label>排序</label><input id="sort_order" type="number" value="100" step="1"></div>
      <div class="field"><label>狀態</label><select id="is_active"><option value="true">上架</option><option value="false">下架</option></select></div>
      <div class="field w4"><label>LINE 禮物商品網址</label><input id="line_url" placeholder="https://giftshop-tw.line.me/products/..."></div>
      <div class="field w4"><label>商品圖片網址（BookWide R2）</label><input id="image_url" placeholder="上傳完成後自動回填 R2 圖片網址"></div><div class="field w4"><label>手動補商品照片（從電腦選照片）</label><input id="local_image" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div>
    </div>
    <div class="actions"><button class="btn" id="saveBtn">儲存商品</button><button class="btn green" id="uploadImageBtn">上傳照片到 R2</button><button class="btn gray" id="importBtn">LINE 自動匯入（備用）</button><button class="btn gray" id="clearBtn">清空表單</button><button class="btn gray" id="deriveBtn">只帶入商品 ID</button></div>
    <div class="status" style="margin:12px 0 0;background:#f8fafc"><b>手動補圖：</b>選商品 → 從電腦選照片 → 按「上傳照片到 R2」。照片直接存 <b>assets/gifts/商品ID.副檔名</b>，不再抓 LINE 網頁。</div>
  </section>
  <section class="panel">
    <div class="tools"><input id="q" placeholder="搜尋品牌、商品、分類"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn gray" id="fillMissingBtn">批次補齊缺圖到 R2</button><div class="muted"><span id="count">0</span> 筆</div></div></div>
    <div class="tablewrap"><table><thead><tr><th>圖</th><th>商品</th><th>價格</th><th>分類／節日</th><th>排序</th><th>狀態</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
  <section class="panel">
    <div class="tools"><div><b>禮物訂單／送禮管理</b><div class="muted">付款完成或全點數兌換後會進入「待送禮」。</div></div><button class="btn gray" id="reloadOrders">重新整理訂單</button></div>
    <div class="tablewrap"><table><thead><tr><th>時間</th><th>會員</th><th>商品</th><th>原價</th><th>點數</th><th>刷卡</th><th>狀態</th><th>操作</th></tr></thead><tbody id="orderRows"><tr><td colspan="8" class="muted">讀取中…</td></tr></tbody></table></div>
  </section>
</div>
</div>
<script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://jeajrwpmrgczimmrflxo.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplYWpyd3BtcmdjemltbXJmbHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3MTg5MzksImV4cCI6MjA3NjI5NDkzOX0.3iFXdHH0JEuk177_R4TGFJmOxYK9V8XctON6rDe7-Do';
const SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let editingId=null, products=[];
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setStatus(t){$('status').textContent=t}
function selectedFestivals(){return [...document.querySelectorAll('#festivalChecks input:checked')].map(x=>x.value)}
function setFestivals(vals){const set=new Set(Array.isArray(vals)?vals:[]);document.querySelectorAll('#festivalChecks input').forEach(x=>x.checked=set.has(x.value))}
function formData(){return {external_id:$('external_id').value.trim()||null,brand:$('brand').value.trim(),name:$('name').value.trim(),price:Math.max(0,Number($('price').value||0)),category:$('category').value.trim()||'其他',festival_keys:selectedFestivals(),sort_order:Number($('sort_order').value||100),is_active:$('is_active').value==='true',line_url:$('line_url').value.trim(),image_url:$('image_url').value.trim()}}
function clearForm(){editingId=null;['external_id','brand','name','price','category','line_url','image_url'].forEach(id=>$(id).value='');setFestivals([]);$('sort_order').value='100';$('is_active').value='true';$('saveBtn').textContent='儲存商品'}
function fill(p){editingId=p.id;$('external_id').value=p.external_id||'';$('brand').value=p.brand||'';$('name').value=p.name||'';$('price').value=p.price||0;$('category').value=p.category||'';setFestivals(p.festival_keys||[]);$('sort_order').value=p.sort_order??100;$('is_active').value=String(p.is_active!==false);$('line_url').value=p.line_url||'';$('image_url').value=p.image_url||'';$('saveBtn').textContent='更新商品';scrollTo({top:0,behavior:'smooth'})}
const FESTIVAL_LABEL={father_day:'父親節',qixi:'七夕',teachers_day:'教師節',mid_autumn:'中秋',christmas:'聖誕',mother_day:'母親節',dragon_boat:'端午',new_year:'新年'};
function festivalNames(v){return (Array.isArray(v)?v:[]).map(x=>FESTIVAL_LABEL[x]||x).join('、')}
function render(){const q=$('q').value.trim().toLowerCase();const arr=products.filter(p=>!q||(`${p.brand} ${p.name} ${p.category} ${p.external_id||''}`).toLowerCase().includes(q));$('count').textContent=arr.length;$('rows').innerHTML=arr.length?arr.map(p=>`<tr><td>${p.image_url?`<img class="thumb" src="${esc(p.image_url)}" onerror="this.style.visibility='hidden'">`:'—'}</td><td><div class="name">${esc(p.name)}</div><div class="muted">${esc(p.brand||'')} · ${esc(p.external_id||'')}</div></td><td>NT$ ${Number(p.price||0).toLocaleString('zh-TW')}</td><td>${esc(p.category||'')}<div class="muted">${festivalNames(p.festival_keys)}</div></td><td>${Number(p.sort_order||0)}</td><td><span class="badge ${p.is_active?'on':'off'}">${p.is_active?'上架':'下架'}</span></td><td>${p.line_url?`<a class="rowbtn" href="${esc(p.line_url)}" target="_blank" rel="noopener noreferrer">LINE商品 ↗</a> `:''}<button class="rowbtn" data-edit="${p.id}">編輯</button> <button class="rowbtn" data-toggle="${p.id}">${p.is_active?'下架':'上架'}</button> <button class="rowbtn danger" data-del="${p.id}">刪除</button></td></tr>`).join(''):'<tr><td colspan="7" class="muted">目前沒有商品。</td></tr>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>fill(products.find(p=>String(p.id)===b.dataset.edit)));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggle(b.dataset.toggle));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del(b.dataset.del))}
async function load(){setStatus('讀取商品中…');const {data,error}=await SB.from('line_gift_products').select('*').order('sort_order',{ascending:true}).order('id',{ascending:true});if(error){setStatus('❌ 讀取失敗：'+error.message);return}products=data||[];render();setStatus(`✅ 已讀取 ${products.length} 筆商品`) }
async function save(){const p=formData();if(!p.name||!p.line_url){alert('商品名稱與 LINE 商品網址必填');return}setStatus('儲存中…');let r;if(editingId) r=await SB.from('line_gift_products').update(p).eq('id',editingId);else r=await SB.from('line_gift_products').insert(p);if(r.error){setStatus('❌ 儲存失敗：'+r.error.message);return}clearForm();await load();setStatus('✅ 商品已儲存，前台重新整理即生效')}
async function toggle(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;const {error}=await SB.from('line_gift_products').update({is_active:!p.is_active}).eq('id',p.id);if(error)return setStatus('❌ 更新失敗：'+error.message);await load()}
async function del(id){const p=products.find(x=>String(x.id)===String(id));if(!p||!confirm(`確定刪除「${p.name}」？\n\n若只是暫時不用，建議按下架即可。`))return;const {error}=await SB.from('line_gift_products').delete().eq('id',p.id);if(error)return setStatus('❌ 刪除失敗：'+error.message);await load()}
function derive(){const u=$('line_url').value.trim();const m=u.match(/\/products\/(\d+)/);if(m)$('external_id').value=m[1];else alert('網址中找不到 /products/商品ID')}

async function uploadLocalImageToR2(){
 const file=$('local_image')?.files?.[0]; if(!file)return alert('請先從電腦選擇商品照片');
 let externalId=$('external_id').value.trim(); if(!externalId){derive();externalId=$('external_id').value.trim()}
 if(!externalId)return alert('缺少 LINE 商品 ID');
 if(file.size>10*1024*1024)return alert('照片不可超過 10MB');
 $('uploadImageBtn').disabled=true;setStatus('⏳ 正在把照片上傳到 R2…');
 try{
  const {data:{session}}=await SB.auth.getSession();if(!session?.access_token)throw new Error('登入狀態失效');
  const fd=new FormData();fd.append('access_token',session.access_token);fd.append('upload_image','true');fd.append('external_id',externalId);fd.append('image_file',file,file.name);
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),30000);
  let r;
  try{
    r=await fetch(SUPABASE_URL+'/functions/v1/import-line-gift-product',{method:'POST',body:fd,signal:ctl.signal,cache:'no-store'});
  }catch(e){
    if(e?.name==='AbortError')throw new Error('UPLOAD_TIMEOUT｜30 秒未收到 R2 上傳服務回應');
    throw e;
  }finally{
    clearTimeout(timer);
  }
  const text=await r.text();let j={};try{j=JSON.parse(text)}catch(_){throw new Error(text||('HTTP '+r.status))}
  if(!r.ok||j.ok===false){
    throw new Error([j.error,j.message,j.stage?('stage='+j.stage):'',('HTTP '+r.status)].filter(Boolean).join('｜'));
  }
  $('image_url').value=j.image_url||'';
  if(editingId){const u=await SB.from('line_gift_products').update({image_url:j.image_url}).eq('id',editingId);if(u.error)throw u.error;await load();setStatus('✅ 照片已上傳 R2 並更新商品：'+j.r2_key)}
  else setStatus('✅ 照片已上傳 R2：'+j.r2_key+'；請按儲存商品');
 }catch(e){setStatus('❌ 手動照片上傳失敗：'+String(e?.message||e))}
 finally{$('uploadImageBtn').disabled=false}
}
async function callImporter(payload){
  const {data:{session},error:sessionError}=await SB.auth.getSession();
  if(sessionError)throw new Error('登入狀態讀取失敗：'+sessionError.message);
  if(!session?.access_token)throw new Error('登入狀態失效，請重新登入');

  // Edge Function V38.7 使用 req.formData()，所以這裡必須送 form-urlencoded，
  // 並把 access_token 放進表單；不可再送 JSON。
  const body=new URLSearchParams();
  body.set('access_token',session.access_token);
  body.set('line_url',String(payload?.line_url||'').trim());
  body.set('refresh_fields',payload?.refresh_fields===false?'false':'true');
  if(payload?.product_id!==undefined&&payload?.product_id!==null&&String(payload.product_id).trim()){
    body.set('product_id',String(payload.product_id));
  }

  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),20000);
  let r;
  try{
    r=await fetch(SUPABASE_URL+'/functions/v1/import-line-gift-product',{
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
      body:body.toString(),
      signal:ctl.signal,
      cache:'no-store',
      credentials:'omit',
      redirect:'follow'
    });
  }catch(e){
    if(e?.name==='AbortError')throw new Error('POST_TIMEOUT｜20 秒未收到補圖服務回應');
    throw new Error('POST_NETWORK_ERROR｜'+String(e?.message||e));
  }finally{
    clearTimeout(timer);
  }

  const text=await r.text().catch(()=> '');
  let j={};
  try{j=text?JSON.parse(text):{}}catch(_){j={error:text||('HTTP '+r.status)}}
  if(!r.ok||j.ok===false){
    throw new Error([j.error,j.message,j.stage?('stage='+j.stage):'',('HTTP '+r.status)].filter(Boolean).join('｜'));
  }
  return j;
}
async function importLineProduct(){
  const line=$('line_url').value.trim(); if(!line)return alert('先貼 LINE 禮物商品網址');
  $('importBtn').disabled=true; setStatus('⏳ 正在讀 LINE 商品並把圖片存到 R2…');
  try{
    const j=await callImporter({line_url:line});
    $('external_id').value=j.external_id||''; if(j.brand)$('brand').value=j.brand; $('name').value=j.name||''; if(j.price>0)$('price').value=j.price; $('image_url').value=j.image_url||''; $('line_url').value=j.line_url||line;
    setStatus('✅ 已匯入：'+(j.name||j.external_id)+'；圖片已存 R2：'+j.r2_key);
  }catch(e){setStatus('❌ LINE 匯入失敗：'+String(e.message||e));}
  finally{$('importBtn').disabled=false}
}
async function fillMissingImages(){
  const arr=products.filter(p=>p.line_url && !String(p.image_url||'').trim());
  if(!arr.length)return alert('目前沒有缺圖商品');
  if(!confirm(`要把 ${arr.length} 件缺圖商品從 LINE 抓圖並存到 R2？`))return;
  $('fillMissingBtn').disabled=true; let ok=0,fail=0; const errors=[];
  try{
    for(let i=0;i<arr.length;i++){
      const p=arr[i]; setStatus(`⏳ 補圖 ${i+1}/${arr.length}：${p.name}\n成功 ${ok}｜失敗 ${fail}`);
      try{
        await callImporter({line_url:p.line_url,product_id:p.id,refresh_fields:false});
        ok++;
      }catch(e){
        fail++;
        const msg=String(e?.message||e);
        errors.push(`${p.external_id||p.id}｜${p.name}｜${msg}`);
        console.warn('補圖失敗',p.name,e);
      }
    }
    await load();
    setStatus(`✅ 批次補圖完成：成功 ${ok}、失敗 ${fail}`+(errors.length?`\n\n失敗原因：\n${errors.join('\n')}`:''));
  }finally{
    $('fillMissingBtn').disabled=false;
  }
}

async function loadOrders(){const box=$('orderRows');if(!box)return;box.innerHTML='<tr><td colspan="8" class="muted">讀取訂單中…</td></tr>';const {data,error}=await SB.from('line_gift_orders').select('id,user_id,product_name,product_price,points_used,cash_amount,status,created_at,paid_at,sent_at,note').order('created_at',{ascending:false}).limit(100);if(error){box.innerHTML=`<tr><td colspan="8" class="muted">讀取失敗：${esc(error.message)}</td></tr>`;return}const names={pending_payment:'待刷卡',pending_fulfillment:'待送禮',sent:'已送出',cancelled:'已取消'};box.innerHTML=(data||[]).length?(data||[]).map(o=>`<tr><td>${new Date(o.created_at).toLocaleString('zh-TW',{hour12:false})}</td><td class="muted">${esc(String(o.user_id).slice(0,8))}…</td><td><b>${esc(o.product_name)}</b></td><td>NT$ ${Number(o.product_price||0).toLocaleString('zh-TW')}</td><td>${Number(o.points_used||0).toLocaleString('zh-TW')} 點</td><td>NT$ ${Number(o.cash_amount||0).toLocaleString('zh-TW')}</td><td><span class="badge ${o.status==='sent'?'on':o.status==='cancelled'?'off':''}">${names[o.status]||esc(o.status)}</span></td><td>${o.status==='pending_fulfillment'?`<button class="rowbtn" data-sent="${o.id}">已送出</button> <button class="rowbtn danger" data-cancel="${o.id}">取消</button>`:o.status==='pending_payment'?`<button class="rowbtn danger" data-cancel="${o.id}">取消</button>`:'—'}</td></tr>`).join(''):'<tr><td colspan="8" class="muted">目前沒有禮物訂單。</td></tr>';document.querySelectorAll('[data-sent]').forEach(b=>b.onclick=()=>setOrderStatus(b.dataset.sent,'sent'));document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>setOrderStatus(b.dataset.cancel,'cancelled'))}
async function setOrderStatus(id,status){if(status==='cancelled'&&!confirm('確定取消這筆禮物訂單？取消後推薦點會釋放回可用點數。'))return;const {error}=await SB.rpc('admin_set_line_gift_order_status',{p_order_id:id,p_status:status,p_note:null});if(error){alert(error.message);return}await loadOrders()}
async function boot(){const {data:{session}}=await SB.auth.getSession();if(!session){$('gate').innerHTML='<h2>請先登入</h2><p class="muted">登入 BookWide 後再進入商品後台。</p><p><a class="btn" href="/index.html#login">前往登入</a></p>';return}const {data,error}=await SB.from('profiles').select('is_admin').eq('id',session.user.id).maybeSingle();if(error||data?.is_admin!==true){$('gate').innerHTML='<h2>沒有管理權限</h2><p class="muted">此頁只開放 BookWide Admin。</p>';return}$('gate').style.display='none';$('app').style.display='block';await load();await loadOrders()}
$('saveBtn').onclick=save;$('uploadImageBtn').onclick=uploadLocalImageToR2;$('importBtn').onclick=importLineProduct;$('fillMissingBtn').onclick=fillMissingImages;$('clearBtn').onclick=clearForm;$('newBtn').onclick=clearForm;$('deriveBtn').onclick=derive;$('q').oninput=render;$('reloadOrders').onclick=loadOrders;boot();
</script>
