<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMKTOOLS 客戶登入</title><style>body{margin:0;background:#f4f6f8;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#172033}.box{max-width:420px;margin:10vh auto;background:#fff;border:1px solid #dde3ea;border-radius:16px;padding:28px;box-shadow:0 16px 40px #0001}h1{margin:0 0 8px}.muted{color:#64748b;margin-bottom:22px}label{display:block;font-weight:800;font-size:13px;margin:12px 0 5px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:9px;background:#7d151b;color:#fff;font-size:16px;font-weight:900;cursor:pointer}.err{color:#b91c1c;margin-top:12px;min-height:22px}.back{display:block;text-align:center;margin-top:16px;color:#475569}</style></head><body><div class="box"><h1>PMKTOOLS 客戶登入</h1><div class="muted">登入後顯示您的專屬價格與訂購紀錄。</div><label>帳號 / Email</label><input id="account" autocomplete="username"><label>密碼</label><input id="password" type="password" autocomplete="current-password"><button id="go">登入</button><div id="err" class="err"></div><a class="back" href="/pmktools.html">← 返回商品首頁</a></div><script>const API='https://pmktools-api.pmktools.workers.dev',KEY='pmk_session_v1';async function login(){const e=document.getElementById('err');e.textContent='登入中…';const r=await fetch(API+'/api/pmk-auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account:document.getElementById('account').value,password:document.getElementById('password').value})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok){e.textContent=j.message||j.error||'登入失敗';return}localStorage.setItem(KEY,j.token);const next=new URL(location.href).searchParams.get('next');location.href=next||'/pmktools-account.html'}document.getElementById('go').onclick=login;document.getElementById('password').onkeydown=e=>{if(e.key==='Enter')login()}</script></body></html>
