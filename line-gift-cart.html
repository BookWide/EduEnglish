<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>購物車｜BookWide</title>
<script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f8;color:#172033;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.top{background:#fff;border-bottom:1px solid #e5e7eb}.topin{max-width:1120px;margin:auto;padding:14px 18px;display:flex;align-items:center}.brand{font-size:22px;font-weight:950}.back{margin-left:auto;color:#526175;text-decoration:none;font-weight:800}.wrap{max-width:1120px;margin:22px auto;padding:0 14px}.card{background:#fff;border:1px solid #e3e6ea;border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(15,23,42,.05)}h1{margin:0 0 18px}
.group{border:1px solid #e4e7eb;border-radius:15px;margin:0 0 16px;overflow:hidden}.parent{display:grid;grid-template-columns:86px 1fr 120px 130px auto;gap:14px;align-items:center;padding:14px;background:#fff}.parent img{width:86px;height:86px;object-fit:cover;border-radius:10px;background:#eee}.name{font-weight:950}.opts{color:#64748b;font-size:13px;margin-top:4px}.qty{display:flex;border:1px solid #ddd;border-radius:8px;overflow:hidden}.qty button{width:32px;border:0;background:#fff;font-size:18px}.qty input{width:42px;border:0;text-align:center}.price{text-align:right;font-weight:950}.remove{border:0;background:transparent;color:#c0392b;cursor:pointer}
.children{background:#fafbfc;border-top:1px solid #edf0f2;padding:4px 16px 10px 110px}.child{display:grid;grid-template-columns:54px 1fr 90px 110px auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed #dfe3e7}.child:last-child{border-bottom:0}.child img{width:54px;height:54px;object-fit:cover;border-radius:8px;background:#eee}.child .name{font-size:14px}.tag{display:inline-block;font-size:11px;background:#eee7e8;color:#8e4d52;border-radius:999px;padding:3px 7px;margin-right:6px}
.shippingBox{margin-top:18px;margin-left:auto;max-width:520px;border:1px solid #e6e9ee;border-radius:14px;background:#fff;padding:14px 16px}.shippingTitle{font-weight:950;margin-bottom:8px}.shippingOption{display:flex;gap:8px;align-items:center;padding:7px 0}.addressBox{margin-top:10px;padding-top:10px;border-top:1px solid #eee;display:grid;gap:8px}.addressBox input{width:100%;border:1px solid #d7dce2;border-radius:8px;padding:9px 10px}.addressHint{font-size:12px;color:#64748b;line-height:1.45}.discountBox{margin-top:18px;margin-left:auto;max-width:520px;border:1px solid #e6e9ee;border-radius:14px;background:#f8fafc;padding:14px 16px}.discountRow{display:flex;justify-content:space-between;gap:16px;padding:7px 0}.discountRow strong{font-weight:950}.discountRow.points strong{color:#b45309}.discountRow.cash strong{color:#0f766e;font-size:19px}.discountNote{margin-top:8px;font-size:12px;color:#64748b;line-height:1.5}.summary{display:flex;justify-content:flex-end;gap:18px;align-items:center;padding-top:20px;border-top:1px solid #eee}.total{font-size:25px;font-weight:950}.checkout{border:0;border-radius:10px;padding:13px 19px;background:#9f5056;color:#fff;font-weight:950;cursor:pointer}.empty{text-align:center;padding:60px 20px;color:#64748b}
@media(max-width:760px){.parent{grid-template-columns:70px 1fr auto}.parent img{width:70px;height:70px}.parent .qty,.parent .price{grid-column:2}.children{padding-left:18px}.child{grid-template-columns:48px 1fr auto}.child .qty,.child .price{grid-column:2}.summary{display:block;text-align:right}.checkout{margin-top:12px}}
</style></head><body><header class="top"><div class="topin"><div class="brand">BookWide 購物車</div><a class="back" href="/line-gifts.html">← 繼續選購</a></div></header><main class="wrap"><div class="card"><h1>購物車</h1><div id="list"></div><div id="sum"></div></div></main>
<script>
const KEY='bw_gift_cart_v1',$=id=>document.getElementById(id),fmt=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW');
const SUPABASE_URL='https://jeajrwpmrgczimmrflxo.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplYWpyd3BtcmdjemltbXJmbHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3MTg5MzksImV4cCI6MjA3NjI5NDkzOX0.3iFXdHH0JEuk177_R4TGFJmOxYK9V8XctON6rDe7-Do';
const API='https://bookwide-hiking-api.pmktools.workers.dev';
const SB=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let pointPreviewSeq=0,shippingMethod='',profileData=null;
function cart(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]')||[];return a.map((x,i)=>x.parent?x:{group_id:'legacy_'+i,parent:x,children:[]})}catch(_){return[]}}
function save(a){localStorage.setItem(KEY,JSON.stringify(a));render()}
function opts(x){const o=x.selected_options||{};return Object.keys(o).map(k=>`${k}：${o[k]}`).join('／')}
function lineTotal(x){return Number(x.unit_price||0)*Number(x.quantity||1)}
function groupTotal(g){return lineTotal(g.parent)+(g.children||[]).reduce((s,x)=>s+lineTotal(x),0)}
function qtyCtl(kind,gi,ci,x){const a=cart();if(kind==='p')a[gi].parent.quantity=Math.min(99,Number(a[gi].parent.quantity||1)+1);if(kind==='m')a[gi].parent.quantity=Math.max(1,Number(a[gi].parent.quantity||1)-1);if(kind==='cp')a[gi].children[ci].quantity=Math.min(99,Number(a[gi].children[ci].quantity||1)+1);if(kind==='cm')a[gi].children[ci].quantity=Math.max(1,Number(a[gi].children[ci].quantity||1)-1);save(a)}
function render(){
 const a=cart(),list=$('list');if(!a.length){list.innerHTML='<div class="empty">購物車目前是空的。</div>';$('sum').innerHTML='';return}
 list.innerHTML=a.map((g,gi)=>`<section class="group"><div class="parent"><img src="${g.parent.image_url||''}"><div><div class="name">${g.parent.name||'商品'}</div><div class="opts">${opts(g.parent)}</div>${g.children?.length?`<div style="margin-top:7px;color:#8e4d52;font-size:12px">含 ${g.children.length} 項加購子商品</div>`:''}</div><div class="qty"><button data-act="m" data-g="${gi}">−</button><input value="${Number(g.parent.quantity||1)}" readonly><button data-act="p" data-g="${gi}">＋</button></div><div class="price">${fmt(lineTotal(g.parent))}</div><button class="remove" data-rg="${gi}">刪除整組</button></div>
 ${(g.children||[]).length?`<div class="children">${g.children.map((c,ci)=>`<div class="child"><img src="${c.image_url||''}"><div><div class="name"><span class="tag">加購</span>${c.name||'子商品'}</div><div class="opts">${opts(c)}</div></div><div class="qty"><button data-act="cm" data-g="${gi}" data-c="${ci}">−</button><input value="${Number(c.quantity||1)}" readonly><button data-act="cp" data-g="${gi}" data-c="${ci}">＋</button></div><div class="price">${fmt(lineTotal(c))}</div><button class="remove" data-rc="${ci}" data-g="${gi}">刪除</button></div>`).join('')}</div>`:''}</section>`).join('');
 document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>qtyCtl(b.dataset.act,Number(b.dataset.g),Number(b.dataset.c||0)));
 document.querySelectorAll('[data-rg]').forEach(b=>b.onclick=()=>{const x=cart();x.splice(Number(b.dataset.rg),1);save(x)});
 document.querySelectorAll('[data-rc]').forEach(b=>b.onclick=()=>{const x=cart();x[Number(b.dataset.g)].children.splice(Number(b.dataset.rc),1);save(x)});
 const total=a.reduce((s,g)=>s+groupTotal(g),0),lines=a.reduce((s,g)=>s+1+(g.children||[]).length,0);
 $('sum').innerHTML=`<div id="shippingPreview" class="shippingBox"><div class="shippingTitle">運送方式</div><div class="muted">讀取中…</div></div><div id="discountPreview" class="discountBox"><div class="discountRow"><span>可用推薦點</span><strong>讀取中…</strong></div></div><div class="summary"><div><div class="total">商品小計 ${fmt(total)}</div><div style="color:#64748b;font-size:13px;margin-top:4px">${a.length} 組／${lines} 項商品</div></div><button class="checkout" id="checkoutAll">全部一起結帳</button></div>`;
 $('checkoutAll').onclick=()=>{saveShippingStateV563({});location.href='/line-gift-checkout.html?mode=cart'};
 loadPointPreview(a,total);
}
async function loadPointPreview(groups,total){
 const seq=++pointPreviewSeq,box=$('discountPreview'),shipBox=$('shippingPreview'),btn=$('checkoutAll');if(!box)return;
 try{
   const {data:{session}}=await SB.auth.getSession();
   if(seq!==pointPreviewSeq)return;
   if(!session?.access_token){
     shipBox.innerHTML='<div class="shippingTitle">運送方式</div><div class="addressHint">登入後顯示運送方式與會員地址。</div>';
     box.innerHTML=`<div class="discountRow"><span>可用推薦點</span><strong>登入後顯示</strong></div>`;
     return;
   }
   if(!profileData){
     const {data:p}=await SB.from('profiles').select('display_name,phone,address').eq('id',session.user.id).maybeSingle();
     profileData=p||{};
   }
   const preview=async()=>{
     const r=await fetch(API+'/api/bw-cart-checkout-preview',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({groups,shipping_method:shippingMethod}),cache:'no-store'});
     const j=await r.json().catch(()=>({}));
     if(!r.ok||j.ok===false)throw new Error(j.message||j.error||('HTTP '+r.status));
     return j;
   };
   let j=await preview();
   if(seq!==pointPreviewSeq)return;
   if(!shippingMethod&&j.selected_shipping_method?.code)shippingMethod=j.selected_shipping_method.code;
   renderShippingV563(j.available_shipping_methods||[],j.selected_shipping_method||{},groups,total,session,seq);
   const available=Number(j.available_points||0),used=Number(j.points_used||0),net=Number(j.net_after_points||total),fee=Number(j.fee_5||0),cash=Number(j.cash_amount||0),can=j.can_checkout!==false;
   if(!can && String(j.reason||'')==='REFERRAL_POINTS_NOT_ENOUGH'){
     box.innerHTML=`<div class="discountRow points"><span>可用推薦點</span><strong>${available.toLocaleString('zh-TW')} 點</strong></div><div class="discountRow"><span>本次可折抵</span><strong>0 點</strong></div><div class="discountNote">推薦點需滿 ${Number(j.required_points||200)} 點才可使用好禮；目前尚差 ${Math.max(0,Number(j.required_points||200)-available).toLocaleString('zh-TW')} 點。</div>`;
     if(btn){btn.disabled=true;btn.textContent='未滿 200 點';}
     return;
   }
   box.innerHTML=`<div class="discountRow points"><span>可用推薦點</span><strong>${available.toLocaleString('zh-TW')} 點</strong></div><div class="discountRow points"><span>本次推薦點折抵</span><strong>- ${used.toLocaleString('zh-TW')} 點</strong></div><div class="discountRow"><span>商品小計</span><strong>${fmt(Number(j.subtotal||total))}</strong></div><div class="discountRow"><span>運費</span><strong>${fmt(Number(j.shipping_fee||0))}</strong></div><div class="discountRow"><span>折抵後金額</span><strong>${fmt(net)}</strong></div><div class="discountRow"><span>5%</span><strong>${fmt(fee)}</strong></div><div class="discountRow cash"><span>預估信用卡付款</span><strong>${fmt(cash)}</strong></div><div class="discountNote">1 推薦點 = NT$1；運費一併納入本張訂單計算。正式扣點與付款金額以結帳頁最後確認為準。</div>`;
   if(btn){btn.disabled=false;btn.textContent='全部一起結帳';}
 }catch(e){
   if(seq!==pointPreviewSeq)return;
   if(shipBox)shipBox.innerHTML='<div class="shippingTitle">運送方式</div><div class="addressHint">暫時無法讀取運送設定。</div>';
   box.innerHTML=`<div class="discountRow"><span>可用推薦點</span><strong>暫時無法讀取</strong></div><div class="discountNote">${String(e.message||e)}</div>`;
 }
}
function renderShippingV563(methods,selected,groups,total,session,seq){
 const box=$('shippingPreview');if(!box)return;
 if(!methods.length){box.innerHTML='<div class="shippingTitle">運送方式</div><div class="addressHint">此購物車不需要實體運送。</div>';saveShippingStateV563(selected);return}
 const sel=shippingMethod||selected?.code||methods[0]?.code||'';
 shippingMethod=sel;
 const chosen=methods.find(x=>x.code===sel)||methods[0];
 const needAddr=chosen?.requires_address!==false;
 const addr=String(profileData?.address||'').trim(),name=String(profileData?.display_name||'').trim(),phone=String(profileData?.phone||'').trim();
 box.innerHTML=`<div class="shippingTitle">運送方式</div>${methods.map(m=>`<label class="shippingOption"><input type="radio" name="bwShipping" value="${m.code}" ${m.code===sel?'checked':''}> ${m.label} <b style="margin-left:auto">${Number(m.fee||0)>0?fmt(m.fee):'免費'}</b></label>`).join('')}
 ${needAddr?`<div class="addressBox"><b>收件資料</b><input id="shipName" placeholder="收件人" value="${name.replace(/"/g,'&quot;')}"><input id="shipPhone" placeholder="聯絡電話" value="${phone.replace(/"/g,'&quot;')}"><input id="shipAddress" placeholder="收件地址" value="${addr.replace(/"/g,'&quot;')}"><div class="addressHint">${addr?'已自動帶入會員 Profile 地址；可在這裡修改。':'Profile 尚未填地址，請在此填寫；結帳時會回存到會員 Profile，下次自動帶入。'}</div></div>`:''}`;
 box.querySelectorAll('input[name="bwShipping"]').forEach(r=>r.onchange=()=>{shippingMethod=r.value;saveShippingStateV563({code:shippingMethod});loadPointPreview(groups,total)});
 ['shipName','shipPhone','shipAddress'].forEach(id=>box.querySelector('#'+id)?.addEventListener('change',()=>saveShippingStateV563(chosen)));
 saveShippingStateV563(chosen);
}
function saveShippingStateV563(chosen={}){
 const state={method:shippingMethod||chosen.code||'',name:$('shipName')?.value||profileData?.display_name||'',phone:$('shipPhone')?.value||profileData?.phone||'',address:$('shipAddress')?.value||profileData?.address||'',requires_address:chosen.requires_address!==false};
 localStorage.setItem('bw_gift_shipping_v1',JSON.stringify(state));
}

render();
</script></body></html>
