<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>購物車｜BookWide</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f8;color:#172033;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.top{background:#fff;border-bottom:1px solid #e5e7eb}.topin{max-width:1120px;margin:auto;padding:14px 18px;display:flex;align-items:center}.brand{font-size:22px;font-weight:950}.back{margin-left:auto;color:#526175;text-decoration:none;font-weight:800}.wrap{max-width:1120px;margin:22px auto;padding:0 14px}.card{background:#fff;border:1px solid #e3e6ea;border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(15,23,42,.05)}h1{margin:0 0 18px}.item{display:grid;grid-template-columns:92px 1fr 130px 130px auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #eee}.item img{width:92px;height:92px;object-fit:cover;border-radius:10px;background:#eee}.name{font-weight:900}.opts{color:#64748b;font-size:13px;margin-top:5px}.qty{display:flex;border:1px solid #ddd;border-radius:8px;overflow:hidden}.qty button{width:34px;border:0;background:#fff;font-size:18px}.qty input{width:46px;border:0;text-align:center}.price{text-align:right;font-weight:900}.remove{border:0;background:transparent;color:#c0392b;cursor:pointer}.summary{display:flex;justify-content:flex-end;gap:20px;align-items:center;padding-top:20px}.total{font-size:24px;font-weight:950}.note{margin-top:10px;color:#64748b;font-size:13px;text-align:right}.empty{text-align:center;padding:60px 20px;color:#64748b}.checkout{border:0;border-radius:10px;padding:13px 18px;background:#9f5056;color:#fff;font-weight:950;cursor:pointer}.checkout:disabled{opacity:.45}.rowactions{display:flex;gap:8px}.secondary{border:1px solid #bbb;background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:800}
@media(max-width:760px){.item{grid-template-columns:72px 1fr auto}.item img{width:72px;height:72px}.qty,.price{grid-column:2}.rowactions{grid-column:2}.summary{display:block;text-align:right}.total{margin:10px 0}}
</style></head><body><header class="top"><div class="topin"><div class="brand">BookWide 購物車</div><a class="back" href="/line-gifts.html">← 繼續選購</a></div></header><main class="wrap"><div class="card"><h1>購物車</h1><div id="list"></div><div id="sum"></div></div></main>
<script>
const KEY='bw_gift_cart_v1',$=id=>document.getElementById(id),fmt=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW');
function cart(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')||[]}catch(_){return[]}}function save(a){localStorage.setItem(KEY,JSON.stringify(a));render()}
function opts(x){const o=x.selected_options||{};return Object.keys(o).map(k=>`${k}：${o[k]}`).join('／')}
function render(){const a=cart(),list=$('list');if(!a.length){list.innerHTML='<div class="empty">購物車目前是空的。</div>';$('sum').innerHTML='';return}list.innerHTML=a.map((x,i)=>`<div class="item"><img src="${x.image_url||''}"><div><div class="name">${x.name||'商品'}</div><div class="opts">${opts(x)}</div></div><div class="qty"><button data-m="${i}">−</button><input value="${Number(x.quantity||1)}" readonly><button data-p="${i}">＋</button></div><div class="price">${fmt(Number(x.unit_price||0)*Number(x.quantity||1))}</div><div class="rowactions"><button class="secondary" data-c="${i}">結帳</button><button class="remove" data-r="${i}">刪除</button></div></div>`).join('');document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=+b.dataset.m;a[i].quantity=Math.max(1,Number(a[i].quantity||1)-1);save(a)});document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const i=+b.dataset.p;a[i].quantity=Math.min(99,Number(a[i].quantity||1)+1);save(a)});document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{a.splice(+b.dataset.r,1);save(a)});document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>checkout(a[+b.dataset.c]));const total=a.reduce((s,x)=>s+Number(x.unit_price||0)*Number(x.quantity||1),0);$('sum').innerHTML=`<div class="summary"><div class="total">商品小計 ${fmt(total)}</div><button class="checkout" id="firstCheckout">從第一項開始結帳</button></div><div class="note">目前 BookWide Checkout Core 逐項建立訂單；購物車會保留其餘商品，不會遺失。</div>`;$('firstCheckout').onclick=()=>checkout(a[0])}
function checkout(x){const q=new URLSearchParams({product:x.product_id,quantity:String(x.quantity||1)});if(x.variation_id)q.set('variant',x.variation_id);if(x.selected_options&&Object.keys(x.selected_options).length)q.set('opts',JSON.stringify(x.selected_options));location.href='/line-gift-checkout.html?'+q.toString()}
render();
</script></body></html>
