<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BookWide LINE 禮物商品庫</title>
<meta name="description" content="BookWide 精選 LINE 禮物商品庫。點選商品後前往 LINE 禮物官方商品頁。">
<style>
:root{--nav:#0f1b31;--ink:#14213d;--muted:#667085;--green:#06c755;--line:#e7ebf2;--bg:#f5f8fc;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{text-decoration:none;color:inherit}.top{background:var(--nav);color:#fff;position:sticky;top:0;z-index:20}.topin{max-width:1240px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:12px}.brand{font-size:25px;font-weight:900;color:#7c2bc6;margin-right:auto}.navbtn{border:1px solid rgba(255,255,255,.25);padding:10px 16px;border-radius:13px;font-weight:800}.navbtn.green{background:var(--green);border-color:var(--green)}
.wrap{max-width:1240px;margin:0 auto;padding:30px 20px 60px}.hero{background:linear-gradient(135deg,#ffffff,#f1fff6);border:1px solid #d9eee2;border-radius:24px;padding:28px;display:flex;gap:20px;align-items:center}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;color:var(--muted);line-height:1.7}.hero .go{margin-left:auto;white-space:nowrap;background:var(--green);color:#fff;font-weight:900;padding:13px 18px;border-radius:14px}
.tools{margin:22px 0 16px;display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:12px}.search{width:100%;border:1px solid var(--line);background:white;padding:13px 15px;border-radius:14px;font-size:16px}.sort{border:1px solid var(--line);background:white;padding:0 14px;border-radius:14px;font-size:15px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chip{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 13px;font-weight:800;cursor:pointer}.chip.active{background:#132743;color:white;border-color:#132743}.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-height:100%;transition:.18s transform,.18s box-shadow}.card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(20,33,61,.1)}.pic{aspect-ratio:1/1;background:linear-gradient(145deg,#f0f2f6,#fff);display:flex;align-items:center;justify-content:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.ph{width:76%;height:76%;border-radius:22px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:950;font-size:26px;padding:20px}.body{padding:15px;display:flex;flex-direction:column;gap:8px;flex:1}.brandname{font-size:13px;color:var(--muted);font-weight:800}.name{font-size:16px;font-weight:850;line-height:1.45;min-height:46px}.bottom{margin-top:auto;display:flex;align-items:center;gap:10px}.price{font-size:20px;font-weight:950}.open{margin-left:auto;background:var(--green);color:white;padding:9px 12px;border-radius:11px;font-size:13px;font-weight:900}.empty{grid-column:1/-1;background:#fff;border:1px dashed #ccd4e0;border-radius:18px;padding:48px;text-align:center;color:var(--muted)}.note{margin-top:24px;padding:16px 18px;border-radius:16px;background:white;border:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.7}
@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.topin{padding:10px}.brand{font-size:18px}.navbtn{padding:8px 10px;font-size:13px}.wrap{padding:18px 12px 40px}.hero{display:block;padding:20px}.hero h1{font-size:24px}.hero .go{display:inline-block;margin-top:14px}.tools{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.body{padding:12px}.name{font-size:14px}.price{font-size:17px}.open{padding:8px 9px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.navbtn.hide-sm{display:none}}
</style>
</head>
<body>
<header class="top"><div class="topin"><a class="brand" href="/">← BookWide</a><a class="navbtn hide-sm" href="/activity.html">活動</a><a class="navbtn green" href="https://giftshop-tw.line.me/home" target="_blank" rel="noopener noreferrer">LINE 禮物官網 ↗</a></div></header>
<main class="wrap">
<section class="hero"><div><h1>🎁 LINE 禮物商品庫</h1><p>BookWide 整理可選好禮；點選任何商品，直接前往 LINE 禮物官方商品頁完成送禮。</p></div><a class="go" href="https://giftshop-tw.line.me/home" target="_blank" rel="noopener noreferrer">查看更多 LINE 禮物</a></section>
<div class="tools"><input id="q" class="search" placeholder="搜尋品牌或商品，例如 DIOR、蛋糕"><select id="sort" class="sort"><option value="featured">精選排序</option><option value="low">價格：低 → 高</option><option value="high">價格：高 → 低</option><option value="name">名稱排序</option></select></div>
<div class="chips" id="chips"></div><div class="meta"><span id="count">讀取商品中…</span><span>BookWide → LINE 禮物官方頁</span></div><section class="grid" id="grid"></section>
<div class="note">商品名稱、價格與可購買狀態以 LINE 禮物官方商品頁當下顯示為準。此頁只做 BookWide 商品索引與導流，不在 BookWide 內完成 LINE 禮物付款。</div>
</main>
<script>
const FALLBACK={products:[{"id": "322504000", "brand": "DIOR LINE官方旗艦館", "name": "MISS DIOR 花漾迪奧護手霜 [快速出貨]", "price": 2050, "category": "美妝保養", "url": "https://giftshop-tw.line.me/products/322504000", "image": "https://lcp-prod-obs.line-scdn.net/0hAnWye19SHkFqAAuH77JhFjldEjBZcRpJA3gDfE5FPzoedzFxXy0DJTBIK3IgbQtPPS0wQQ5GPyksMThxVzoEQk5JPgQabwtLPTo5QTNLEBcVdiJLDG4tVw/w320", "active": true}, {"id": "322548569", "brand": "DIOR LINE官方旗艦館", "name": "Miss Dior 花漾迪奧親吻淡香水 20ML [快速出貨]", "price": 2200, "category": "香水香氛", "url": "https://giftshop-tw.line.me/products/322548569", "image": "", "active": true}, {"id": "322549136", "brand": "DIOR LINE官方旗艦館", "name": "迪奧巨星持色唇露｜收禮者自選色號 [快速出貨]", "price": 1650, "category": "美妝保養", "url": "https://giftshop-tw.line.me/products/322549136", "image": "", "active": true}, {"id": "322549104", "brand": "DIOR LINE官方旗艦館", "name": "迪奧巨星持色唇膏－極霧｜收禮者自選色號 [快速出貨]", "price": 1650, "category": "美妝保養", "url": "https://giftshop-tw.line.me/products/322549104", "image": "", "active": true}, {"id": "322549138", "brand": "DIOR LINE官方旗艦館", "name": "獨家｜織愛絲語巨星持色唇膏禮盒 [快速出貨]", "price": 3300, "category": "美妝保養", "url": "https://giftshop-tw.line.me/products/322549138", "image": "", "active": true}, {"id": "322530212", "brand": "DIOR LINE官方旗艦館", "name": "迪奧超完美晶透光氣墊粉餅 蝴蝶結｜自選色號 [快速出貨]", "price": 3050, "category": "美妝保養", "url": "https://giftshop-tw.line.me/products/322530212", "image": "", "active": true}, {"id": "322031433", "brand": "Häagen-Dazs 哈根達斯", "name": "五吋愛戀香草冰淇淋蛋糕｜宅配到家", "price": 1180, "category": "甜點烘焙", "url": "https://giftshop-tw.line.me/products/322031433", "image": "", "active": true}, {"id": "322075178", "brand": "Häagen-Dazs 哈根達斯", "name": "五吋愛戀香草冰淇淋蛋糕＋單球券x2 / 玻璃杯", "price": 1180, "category": "甜點烘焙", "url": "https://giftshop-tw.line.me/products/322075178", "image": "", "active": false}]};
let all=[];let cat='全部';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function placeholder(p){const t=(p.brand||'LINE 禮物').replace(/LINE官方旗艦館/g,'').trim();return `<div class="ph">${esc(t)}</div>`}
function render(){const q=document.querySelector('#q').value.trim().toLowerCase();const sort=document.querySelector('#sort').value;let arr=all.filter(p=>p.active!==false).filter(p=>(cat==='全部'||p.category===cat)&&(!q||(`${p.brand} ${p.name}`).toLowerCase().includes(q)));if(sort==='low')arr.sort((a,b)=>a.price-b.price);if(sort==='high')arr.sort((a,b)=>b.price-a.price);if(sort==='name')arr.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));document.querySelector('#count').textContent=`目前顯示 ${arr.length} 項好禮`;document.querySelector('#grid').innerHTML=arr.length?arr.map(p=>`<a class="card" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer"><div class="pic">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" onerror="this.parentNode.innerHTML=placeholderById('${esc(p.id)}')">`:placeholder(p)}</div><div class="body"><div class="brandname">${esc(p.brand)}</div><div class="name">${esc(p.name)}</div><div class="bottom"><div class="price">NT$ ${Number(p.price||0).toLocaleString('zh-TW')}</div><span class="open">選這份 ↗</span></div></div></a>`).join(''):`<div class="empty">找不到符合條件的商品。</div>`}
window.placeholderById=id=>placeholder(all.find(x=>String(x.id)===String(id))||{});
function buildChips(){const cats=['全部',...new Set(all.filter(p=>p.active!==false).map(p=>p.category).filter(Boolean))];document.querySelector('#chips').innerHTML=cats.map(x=>`<button class="chip ${x===cat?'active':''}" data-cat="${esc(x)}">${esc(x)}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;buildChips();render()})}
async function init(){try{const r=await fetch('/data/line-gifts.json',{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();all=Array.isArray(d.products)?d.products:[]}catch(e){all=FALLBACK.products}buildChips();render()}
document.querySelector('#q').addEventListener('input',render);document.querySelector('#sort').addEventListener('change',render);init();
</script>
</body></html>
