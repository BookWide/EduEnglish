let pageLang=localStorage.getItem('bw_line_gifts_lang')==='en'?'en':'zh';
function t(){return PAGE_I18N[pageLang]}
function labelCategory(name){return t().categories[name]||name}
function applyPageLanguage(){
  const d=t();
  document.documentElement.lang=pageLang==='en'?'en':'zh-Hant';
  const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val};
  set('activityBtn',d.activity); set('adminGiftBtn',d.admin);
  set('heroTitle',d.heroTitle); set('heroLead',d.heroLead); set('inviteFriendsBtn',d.invite);
  const q=document.getElementById('q'); if(q) q.placeholder=d.search;
  set('sortFeatured',d.sortFeatured); set('sortLow',d.sortLow); set('sortHigh',d.sortHigh); set('sortName',d.sortName);
  set('categoryTitle',d.categoryTitle); set('paymentModeLabel',d.paymentMode); set('pageNote',d.note);
  document.getElementById('langZh')?.classList.toggle('active',pageLang==='zh');
  document.getElementById('langEn')?.classList.toggle('active',pageLang==='en');
  try{
    const qs=new URLSearchParams(location.search);
    if(qs.get('from')==='referral'){

      if(b)b.textContent=d.backReferral;

}

let all=[];let cat='全部';let managedCategories=[];
const FESTIVALS={father_day:{label:'父親節',url:'https://giftshop-tw.line.me/collections/group/SweetForDad'},qixi:{label:'七夕情人節',url:'https://giftshop-tw.line.me/collections/2456770'},teachers_day:{label:'教師節',url:'https://giftshop-tw.line.me/collections/group/teachersdaylife'},mid_autumn:{label:'中秋節',url:'https://giftshop-tw.line.me/collections/group/mid-autumn'},christmas:{label:'聖誕節',url:'https://giftshop-tw.line.me/search?searchValue=%E8%81%96%E8%AA%95%E7%A6%AE%E7%9B%92'},mother_day:{label:'母親節',url:'https://giftshop-tw.line.me/collection-groups/SweetMom'},dragon_boat:{label:'端午節',url:'https://giftshop-tw.line.me/search?searchValue=%E7%AB%AF%E5%8D%88%E7%AF%80'},new_year:{label:'新年',url:'https://giftshop-tw.line.me/search?searchValue=%E6%96%B0%E5%B9%B4%E7%A6%AE%E7%9B%92'}};
const festivalKey=new URLSearchParams(location.search).get('festival')||'';
function festivalTags(p){return (p.festivals||[]).map(k=>`<span class="festag">${esc(FESTIVALS[k]?.label||k)}</span>`).join('')}
function applyFestivalHero(){if(!festivalKey||!FESTIVALS[festivalKey])return;const f=FESTIVALS[festivalKey];document.getElementById('heroTitle').textContent='🎁 '+f.label+' 好禮也能用推薦點換！';document.getElementById('heroText').textContent='好友完成付費訂閱即可累積推薦點；滿 200 點開始兌換。現在已為你篩選「'+f.label+'」好禮。';}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function placeholder(p){const t=(p.brand||'福利品').replace(/LINE官方旗艦館/g,'').trim();return `<div class="ph">${esc(t)}</div>`}
function catalogEffectivePriceV548(p){
  if(String(p?.product_type||'simple')==='variable'&&Array.isArray(p.variations)){
    const a=p.variations.filter(v=>v&&v.is_active!==false).map(v=>Number(v.sale_price||v.price||0)).filter(x=>x>0);
    if(a.length)return Math.min(...a);
  }
  return Number(p?.price||0);
}
function catalogPriceV54(p){if(String(p?.product_type||'simple')==='variable'&&Array.isArray(p.variations)){const a=p.variations.filter(v=>v&&v.is_active!==false).map(v=>Number(v.sale_price||v.price||0)).filter(x=>x>0);if(a.length){const lo=Math.min(...a),hi=Math.max(...a);return lo===hi?`NT$ ${lo.toLocaleString('zh-TW')}`:`NT$ ${lo.toLocaleString('zh-TW')} – ${hi.toLocaleString('zh-TW')}`}}return `NT$ ${Number(p?.price||0).toLocaleString('zh-TW')}`}
function render(){const q=document.querySelector('#q').value.trim().toLowerCase();const sort=document.querySelector('#sort').value;let arr=all.filter(p=>p.active!==false).filter(p=>!festivalKey||(p.festivals||[]).includes(festivalKey)).filter(p=>(cat==='全部'||p.category===cat)&&(!q||(`${p.brand} ${p.name}`).toLowerCase().includes(q)));if(sort==='low')arr.sort((a,b)=>catalogEffectivePriceV548(a)-catalogEffectivePriceV548(b));if(sort==='high')arr.sort((a,b)=>catalogEffectivePriceV548(b)-catalogEffectivePriceV548(a));if(sort==='name')arr.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));document.querySelector('#count').textContent=t().count(arr.length);document.querySelector('#grid').innerHTML=arr.length?arr.map(p=>`<div class="card"><div class="pic">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" onerror="this.parentNode.innerHTML=placeholderById('${esc(p.id)}')">`:placeholder(p)}</div><div class="body"><div class="brandname">${esc(p.brand)}</div><div class="festags">${festivalTags(p)}</div><div class="name">${esc(p.name)}</div><div class="price">${catalogPriceV54(p)}</div><div class="actions2">${p.stock_tracking_enabled&&p.stock_qty<=0?`<span class="official">${t().out}</span>`:`<a class="open" href="/line-gift-product.html?product=${encodeURIComponent(p.id)}">${(catalogEffectivePriceV548(p)<200||p.sale_mode==='redeem_only')?t().redeem:t().order}</a>`}</div></div></div>`).join(''):`<div class="empty">找不到符合條件的商品。</div>`}
window.placeholderById=id=>placeholder(all.find(x=>String(x.id)===String(id))||{});
function buildChips(){
  const managed=managedCategories
    .filter(c=>c.active!==false)
    .slice()
    .sort((a,b)=>(Number(a.sort)||0)-(Number(b.sort)||0))
    .map(c=>String(c.name||'').trim())
    .filter(Boolean);

  const cats=['全部',...managed];
  if(cat!=='全部'&&!cats.includes(cat))cat='全部';

  const html=cats.map(x=>`<button class="chip ${x===cat?'active':''}" data-cat="${esc(x)}">${esc(x==='全部'?t().all:labelCategory(x))}</button>`).join('');
  document.querySelector('#chips').innerHTML=html;
  document.querySelector('#sideCats').innerHTML=cats.map(x=>`<button class="sidecat ${x===cat?'active':''}" data-sidecat="${esc(x)}">${esc(x==='全部'?t().all:labelCategory(x))}</button>`).join('');

  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;buildChips();render()});
  document.querySelectorAll('[data-sidecat]').forEach(b=>b.onclick=()=>{cat=b.dataset.sidecat;buildChips();render()});
}

async function loadProductsFromR2(){
  const r=await fetch(HIKING_API_BASE+'/api/bw-products',{cache:'no-store'});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.ok===false||!Array.isArray(j.products))throw new Error(j.message||j.error||('商品 API HTTP '+r.status));
  return j.products.map(p=>({
    id:String(p.id||p.external_id||''),
    brand:p.brand||'',name:p.name||'',price:Number(p.price||0),category:p.category||'精選福利',
    product_type:p.product_type||((p.variations||[]).length?'variable':'simple'),
    variations:Array.isArray(p.variations)?p.variations:[],
    festivals:Array.isArray(p.festival_keys)?p.festival_keys:[],url:p.line_url||'',

  }));
}

// V52.9：Emma 進頁嘗試有聲自動播放一次；手機若禁止有聲 autoplay，顯示一鍵有聲播放。
(function(){
  const v=document.getElementById('heroGuideVideo');
  const soundBtn=document.getElementById('emmaSoundBtn');
  if(!v) return;

  v.loop=false;
  v.autoplay=true;
  v.playsInline=true;
  v.muted=false;
  v.volume=1;

  const showSoundButton=()=>{ if(soundBtn) soundBtn.classList.add('show'); };
  const hideSoundButton=()=>{ if(soundBtn) soundBtn.classList.remove('show'); };

  const playAudibleOnce=()=>{
    try{
      v.pause();
      v.currentTime=0;
      v.muted=false;
      v.volume=1;
      const p=v.play();
      if(p && typeof p.then==='function'){
        p.then(hideSoundButton).catch(showSoundButton);
      }
    }catch(_e){
      showSoundButton();
    }
  };

  if(soundBtn){
    soundBtn.addEventListener('click',playAudibleOnce);
  }

  if(v.readyState>=2) playAudibleOnce();
  else v.addEventListener('canplay',playAudibleOnce,{once:true});

  v.addEventListener('ended',()=>{
    v.pause();
    hideSoundButton();
  });

  v.addEventListener('volumechange',()=>{
    if(!v.muted && v.volume>0) hideSoundButton();
  });
})();

</script>
