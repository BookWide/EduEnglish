<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BookWide LINE 禮物商品庫</title>
<meta name="description" content="BookWide 精選 LINE 禮物商品庫。點選商品後前往 LINE 禮物官方商品頁。">
<style>
:root{--nav:#0f1b31;--ink:#14213d;--muted:#667085;--green:#06c755;--line:#e7ebf2;--bg:#f5f8fc;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{text-decoration:none;color:inherit}.top{background:var(--nav);color:#fff;position:sticky;top:0;z-index:20}.topin{max-width:1240px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:12px}.brand{font-size:25px;font-weight:900;color:#7c2bc6;margin-right:auto}.navbtn{border:1px solid rgba(255,255,255,.25);padding:10px 16px;border-radius:13px;font-weight:800}.navbtn.green{background:var(--green);border-color:var(--green)}
.wrap{max-width:1240px;margin:0 auto;padding:30px 20px 60px}.hero{background:linear-gradient(135deg,#ffffff,#f1fff6);border:1px solid #d9eee2;border-radius:24px;padding:28px;display:flex;gap:20px;align-items:center}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;color:var(--muted);line-height:1.7}.hero .go{margin-left:auto;white-space:nowrap;background:var(--green);color:#fff;font-weight:900;padding:13px 18px;border-radius:14px}
.tools{margin:22px 0 16px;display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:12px}.search{width:100%;border:1px solid var(--line);background:white;padding:13px 15px;border-radius:14px;font-size:16px}.sort{border:1px solid var(--line);background:white;padding:0 14px;border-radius:14px;font-size:15px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chip{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 13px;font-weight:800;cursor:pointer}.chip.active{background:#132743;color:white;border-color:#132743}.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-height:100%;transition:.18s transform,.18s box-shadow}.card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(20,33,61,.1)}.pic{aspect-ratio:1/1;background:linear-gradient(145deg,#f0f2f6,#fff);display:flex;align-items:center;justify-content:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.ph{width:76%;height:76%;border-radius:22px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:950;font-size:26px;padding:20px}.body{padding:15px;display:flex;flex-direction:column;gap:8px;flex:1}.brandname{font-size:13px;color:var(--muted);font-weight:800}.festags{display:flex;gap:4px;flex-wrap:wrap}.festag{font-size:10px;font-weight:900;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:999px;padding:3px 6px}.name{font-size:16px;font-weight:850;line-height:1.45;min-height:46px}.bottom{margin-top:auto;display:flex;align-items:center;gap:10px}.price{font-size:20px;font-weight:950}.actions2{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:7px}.open{display:block;text-align:center;background:var(--green);color:white;padding:9px 8px;border-radius:11px;font-size:12px;font-weight:900}.official{display:block;text-align:center;border:1px solid var(--line);padding:9px 8px;border-radius:11px;font-size:12px;font-weight:900}.empty{grid-column:1/-1;background:#fff;border:1px dashed #ccd4e0;border-radius:18px;padding:48px;text-align:center;color:var(--muted)}.note{margin-top:24px;padding:16px 18px;border-radius:16px;background:white;border:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.7}
@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.topin{padding:10px}.brand{font-size:18px}.navbtn{padding:8px 10px;font-size:13px}.wrap{padding:18px 12px 40px}.hero{display:block;padding:20px}.hero h1{font-size:24px}.hero .go{display:inline-block;margin-top:14px}.tools{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.body{padding:12px}.name{font-size:14px}.price{font-size:17px}.open{padding:8px 9px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.navbtn.hide-sm{display:none}}
</style>
</head>
<body>
<header class="top"><div class="topin"><a class="brand" id="bwBack" href="/">← BookWide</a><a class="navbtn hide-sm" href="/activity.html">活動</a><a class="navbtn" id="adminGiftBtn" href="/line-gifts-admin.html" style="display:none">商品後台</a><a class="navbtn green" href="https://giftshop-tw.line.me/home" target="_blank" rel="noopener noreferrer">LINE 禮物官網 ↗</a></div></header>
<main class="wrap">
<section class="hero"><div><h1 id="heroTitle">🎁 LINE 禮物商品庫</h1><p id="heroText">BookWide 福利商品庫：1 推薦點 = NT$1。推薦點不足可折抵後，剩餘金額加 5% 使用信用卡支付。</p></div><a class="go" id="lineFestivalLink" href="https://giftshop-tw.line.me/home" target="_blank" rel="noopener noreferrer">查看更多 LINE 禮物</a></section>
<div class="tools"><input id="q" class="search" placeholder="搜尋品牌或商品，例如 DIOR、蛋糕"><select id="sort" class="sort"><option value="featured">精選排序</option><option value="low">價格：低 → 高</option><option value="high">價格：高 → 低</option><option value="name">名稱排序</option></select></div>
<div class="chips" id="chips"></div><div class="meta"><span id="count">讀取商品中…</span><span>推薦點折抵＋信用卡付款</span></div><section class="grid" id="grid"></section>
<div class="note">商品售價由 BookWide 後台維護；兌換規則固定為 1 推薦點 = NT$1。點「BookWide 購買」使用推薦點折抵；「LINE 商品頁」可查看官方商品資訊。</div>
</main>
<script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
<script>
// 從推薦好禮進來時，左上角可直接回 account/referral.html。
try{
  const qs=new URLSearchParams(location.search);
  if(qs.get('from')==='referral'){
    const b=document.getElementById('bwBack');
    if(b){ b.href='/account/referral.html'; b.textContent='← 返回推薦好禮'; }
  }
}catch(_e){}
const FALLBACK={products:[{"id": "322504000", "brand": "DIOR LINE官方旗艦館", "name": "MISS DIOR 花漾迪奧護手霜 [快速出貨]", "price": 2050, "category": "美妝保養", "url": "https://giftshop-tw.line.me/products/322504000", "image": "https://lcp-prod-obs.line-scdn.net/0hAnWye19SHkFqAAuH77JhFjldEjBZcRpJA3gDfE5FPzoedzFxXy0DJTBIK3IgbQtPPS0wQQ5GPyksMThxVzoEQk5JPgQabwtLPTo5QTNLEBcVdiJLDG4tVw/w320", "active": true}, {"id": "322548569", "brand": "DIOR LINE官方旗艦館", "name": "Miss Dior 花漾迪奧親吻淡香水 20ML [快速出貨]", "price": 2200, "category": "香水香氛", "url": "https://giftshop-tw.line.me/products/322548569", "image": "", "active": true}, {"id": "322549136", "brand": "DIOR LINE官方旗艦館", "name": "迪奧巨星持色唇露｜收禮者自選色號 [快速出貨]", "price": 1650, "category": "美妝保養", "url": "https://giftshop-tw.line.me/products/322549136", "image": "", "active": true}, {"id": "322549104", "brand": "DIOR LINE官方旗艦館", "name": "迪奧巨星持色唇膏－極霧｜收禮者自選色號 [快速出貨]", "price": 1650, "category": "美妝保養", "url": "https://giftshop-tw.line.me/products/322549104", "image": "", "active": true}, {"id": "322549138", "brand": "DIOR LINE官方旗艦館", "name": "獨家｜織愛絲語巨星持色唇膏禮盒 [快速出貨]", "price": 3300, "category": "美妝保養", "url": "https://giftshop-tw.line.me/products/322549138", "image": "", "active": true}, {"id": "322530212", "brand": "DIOR LINE官方旗艦館", "name": "迪奧超完美晶透光氣墊粉餅 蝴蝶結｜自選色號 [快速出貨]", "price": 3050, "category": "美妝保養", "url": "https://giftshop-tw.line.me/products/322530212", "image": "", "active": true}, {"id": "322031433", "brand": "Häagen-Dazs 哈根達斯", "name": "五吋愛戀香草冰淇淋蛋糕｜宅配到家", "price": 1180, "category": "甜點烘焙", "url": "https://giftshop-tw.line.me/products/322031433", "image": "", "active": true}, {"id": "322075178", "brand": "Häagen-Dazs 哈根達斯", "name": "五吋愛戀香草冰淇淋蛋糕＋單球券x2 / 玻璃杯", "price": 1180, "category": "甜點烘焙", "url": "https://giftshop-tw.line.me/products/322075178", "image": "", "active": false}]};
let all=[];let cat='全部';
const FESTIVALS={father_day:{label:'父親節',url:'https://giftshop-tw.line.me/collections/group/SweetForDad'},qixi:{label:'七夕情人節',url:'https://giftshop-tw.line.me/collections/2456770'},teachers_day:{label:'教師節',url:'https://giftshop-tw.line.me/collections/group/teachersdaylife'},mid_autumn:{label:'中秋節',url:'https://giftshop-tw.line.me/collections/group/mid-autumn'},christmas:{label:'聖誕節',url:'https://giftshop-tw.line.me/search?searchValue=%E8%81%96%E8%AA%95%E7%A6%AE%E7%9B%92'},mother_day:{label:'母親節',url:'https://giftshop-tw.line.me/collection-groups/SweetMom'},dragon_boat:{label:'端午節',url:'https://giftshop-tw.line.me/search?searchValue=%E7%AB%AF%E5%8D%88%E7%AF%80'},new_year:{label:'新年',url:'https://giftshop-tw.line.me/search?searchValue=%E6%96%B0%E5%B9%B4%E7%A6%AE%E7%9B%92'}};
const festivalKey=new URLSearchParams(location.search).get('festival')||'';
function festivalTags(p){return (p.festivals||[]).map(k=>`<span class="festag">${esc(FESTIVALS[k]?.label||k)}</span>`).join('')}
function applyFestivalHero(){if(!festivalKey||!FESTIVALS[festivalKey])return;const f=FESTIVALS[festivalKey];document.getElementById('heroTitle').textContent='🎁 '+f.label+' LINE 禮物';document.getElementById('heroText').textContent='已自動篩選 BookWide 後台標記為「'+f.label+'」的上架商品；商品可由 Admin 隨時更換。';const a=document.getElementById('lineFestivalLink');a.href=f.url;a.textContent='查看 LINE '+f.label+'專區 ↗';}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function placeholder(p){const t=(p.brand||'LINE 禮物').replace(/LINE官方旗艦館/g,'').trim();return `<div class="ph">${esc(t)}</div>`}
function render(){const q=document.querySelector('#q').value.trim().toLowerCase();const sort=document.querySelector('#sort').value;let arr=all.filter(p=>p.active!==false).filter(p=>!festivalKey||(p.festivals||[]).includes(festivalKey)).filter(p=>(cat==='全部'||p.category===cat)&&(!q||(`${p.brand} ${p.name}`).toLowerCase().includes(q)));if(sort==='low')arr.sort((a,b)=>a.price-b.price);if(sort==='high')arr.sort((a,b)=>b.price-a.price);if(sort==='name')arr.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));document.querySelector('#count').textContent=`目前顯示 ${arr.length} 項好禮`;document.querySelector('#grid').innerHTML=arr.length?arr.map(p=>`<div class="card"><div class="pic">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" onerror="this.parentNode.innerHTML=placeholderById('${esc(p.id)}')">`:placeholder(p)}</div><div class="body"><div class="brandname">${esc(p.brand)}</div><div class="festags">${festivalTags(p)}</div><div class="name">${esc(p.name)}</div><div class="price">NT$ ${Number(p.price||0).toLocaleString('zh-TW')}</div><div class="actions2">${p.dbid?`<a class="open" href="/line-gift-checkout.html?product=${encodeURIComponent(p.dbid)}">BookWide 購買</a>`:`<span class="official">資料庫未連線</span>`}<a class="official" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">LINE 商品頁 ↗</a></div></div></div>`).join(''):`<div class="empty">找不到符合條件的商品。</div>`}
window.placeholderById=id=>placeholder(all.find(x=>String(x.id)===String(id))||{});
function buildChips(){const cats=['全部',...new Set(all.filter(p=>p.active!==false).map(p=>p.category).filter(Boolean))];document.querySelector('#chips').innerHTML=cats.map(x=>`<button class="chip ${x===cat?'active':''}" data-cat="${esc(x)}">${esc(x)}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;buildChips();render()})}
const SUPABASE_URL='https://jeajrwpmrgczimmrflxo.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplYWpyd3BtcmdjemltbXJmbHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3MTg5MzksImV4cCI6MjA3NjI5NDkzOX0.3iFXdHH0JEuk177_R4TGFJmOxYK9V8XctON6rDe7-Do';
let SB=null;
async function loadFromSupabase(){
  try{
    SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    const {data,error}=await SB.from('line_gift_products').select('id,external_id,brand,name,price,category,festival_keys,line_url,image_url,is_active,sort_order').eq('is_active',true).order('sort_order',{ascending:true}).order('id',{ascending:true});
    if(error) throw error;
    if(Array.isArray(data) && data.length){
      return data.map(p=>({id:p.external_id||String(p.id),dbid:p.id,brand:p.brand||'',name:p.name||'',price:Number(p.price||0),category:p.category||'其他',festivals:Array.isArray(p.festival_keys)?p.festival_keys:[],url:p.line_url||'',image:p.image_url||'',active:p.is_active!==false}));
    }
  }catch(_e){}
  return null;
}
async function showAdminIfAllowed(){
  try{
    if(!SB) SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    const {data:{session}}=await SB.auth.getSession();
    if(!session) return;
    const {data,error}=await SB.from('profiles').select('is_admin').eq('id',session.user.id).maybeSingle();
    if(!error && data?.is_admin===true){ const b=document.getElementById('adminGiftBtn'); if(b)b.style.display='inline-block'; }
  }catch(_e){}
}
async function init(){
  applyFestivalHero();
  const db=await loadFromSupabase();
  if(db){ all=db; } else {
    try{const r=await fetch('/data/line-gifts.json',{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();all=Array.isArray(d.products)?d.products:[]}catch(e){all=FALLBACK.products}
  }
  buildChips();render();showAdminIfAllowed();
}
document.querySelector('#q').addEventListener('input',render);document.querySelector('#sort').addEventListener('change',render);init();
</script>
</body></html>
