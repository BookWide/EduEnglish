<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BookWide 福利品商城</title>
<meta name="description" content="BookWide 學習獎勵福利品商城。推薦點折抵，餘額以 BookWide 信用卡付款。">
<style>
:root{--nav:#0f1b31;--ink:#14213d;--muted:#667085;--green:#06c755;--line:#e7ebf2;--bg:#f5f8fc;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{text-decoration:none;color:inherit}.top{background:var(--nav);color:#fff;position:sticky;top:0;z-index:20}.topin{max-width:1240px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:12px}.brand{font-size:25px;font-weight:900;color:#7c2bc6;margin-right:auto}.navbtn{border:1px solid rgba(255,255,255,.25);padding:10px 16px;border-radius:13px;font-weight:800}.navbtn.green{background:var(--green);border-color:var(--green)}
.wrap{max-width:1240px;margin:0 auto;padding:30px 20px 60px}.hero{background:linear-gradient(135deg,#ffffff,#f1fff6);border:1px solid #d9eee2;border-radius:24px;padding:22px 24px;display:grid;grid-template-columns:190px minmax(0,1fr);gap:24px;align-items:center}.hero-video{width:190px;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#0f1b31;box-shadow:0 8px 22px rgba(20,33,61,.12);display:flex;align-items:center;justify-content:center;position:relative}.hero-video video{width:100%;height:100%;object-fit:cover;display:block}.hero-video .video-empty{color:#fff;text-align:center;font-weight:850;font-size:13px;line-height:1.5;padding:12px}.hero-copy{min-width:0}.hero h1{margin:0 0 8px;font-size:30px}.hero .lead{margin:0 0 6px;color:var(--ink);font-size:18px;font-weight:850;line-height:1.55}.hero p{margin:0;color:var(--muted);line-height:1.7}.hero .go{margin-left:auto;white-space:nowrap;background:var(--green);color:#fff;font-weight:900;padding:13px 18px;border-radius:14px}
.tools{margin:22px 0 16px;display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:12px}.search{width:100%;border:1px solid var(--line);background:white;padding:13px 15px;border-radius:14px;font-size:16px}.sort{border:1px solid var(--line);background:white;padding:0 14px;border-radius:14px;font-size:15px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chip{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 13px;font-weight:800;cursor:pointer}.chip.active{background:#132743;color:white;border-color:#132743}.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:grid;grid-template-columns:112px minmax(0,1fr);min-height:142px;transition:.16s transform,.16s box-shadow}.card:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(20,33,61,.08)}.pic{width:112px;height:100%;min-height:142px;background:linear-gradient(145deg,#f0f2f6,#fff);display:flex;align-items:center;justify-content:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.ph{width:84px;height:84px;border-radius:14px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:950;font-size:14px;padding:10px}.body{padding:11px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}.brandname{font-size:11px;color:var(--muted);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.festags{display:flex;gap:3px;flex-wrap:wrap}.festag{font-size:9px;font-weight:900;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:999px;padding:2px 5px}.name{font-size:14px;font-weight:850;line-height:1.35;min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.price{font-size:18px;font-weight:950;margin-top:auto}.actions2{margin-top:3px}.open{display:block;text-align:center;background:var(--green);color:white;padding:8px 8px;border-radius:10px;font-size:12px;font-weight:900}.official{display:none!important}.empty{grid-column:1/-1;background:#fff;border:1px dashed #ccd4e0;border-radius:18px;padding:48px;text-align:center;color:var(--muted)}.note{margin-top:24px;padding:16px 18px;border-radius:16px;background:white;border:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.7}
@media(max-width:1080px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.topin{padding:10px}.brand{font-size:18px}.navbtn{padding:8px 10px;font-size:13px}.wrap{padding:18px 12px 40px}.hero{grid-template-columns:112px minmax(0,1fr);gap:14px;padding:16px}.hero-video{width:112px;border-radius:12px}.hero h1{font-size:21px}.hero .lead{font-size:14px}.hero p{font-size:12px;line-height:1.55}.hero .go{display:inline-block;margin-top:14px}.tools{grid-template-columns:1fr}.grid{grid-template-columns:1fr;gap:9px}.card{grid-template-columns:96px minmax(0,1fr);min-height:124px}.pic{width:96px;min-height:124px}.ph{width:72px;height:72px;font-size:12px}.body{padding:10px}.name{font-size:13px;min-height:34px}.price{font-size:16px}.open{padding:8px 9px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.navbtn.hide-sm{display:none}}

.catalog-shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;align-items:start}
.catalog-side{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;position:sticky;top:76px}
.catalog-side h3{font-size:15px;margin:0 0 10px}.catalog-side .sidecats{display:grid;gap:4px}
.sidecat{border:0;background:transparent;text-align:left;padding:8px 9px;border-radius:8px;font-weight:750;color:#475569;cursor:pointer}
.sidecat:hover,.sidecat.active{background:#eef4ff;color:#1d4ed8}
.catalog-main{min-width:0}.catalog-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.catalog-head strong{font-size:14px}.catalog-head .sort{min-height:40px}
@media(max-width:820px){.catalog-shell{grid-template-columns:1fr}.catalog-side{display:none}.chips{display:flex}}
@media(min-width:821px){.chips{display:none}}
</style>
</head>
<body>
<header class="top"><div class="topin"><a class="brand" id="bwBack" href="/">← BookWide</a><a class="navbtn hide-sm" href="/activity.html">活動</a><a class="navbtn" id="adminGiftBtn" href="/checklist/line-gifts-admin.html" style="display:none">商品後台</a></div></header>
<main class="wrap">
<section class="hero">
  <div class="hero-video" id="heroVideoBox">
    <!-- Emma 導購短影片：之後只要把 src 換成實際影片網址即可 -->
    <video id="heroGuideVideo" src="https://pub-578e9e060a104f24b6865e26eb941648.r2.dev/talk/teach/emma_reffert.mp4" controls playsinline preload="metadata"></video>
  </div>
  <div class="hero-copy">
    <h1 id="heroTitle">🎁 推薦好友，真的可以拿好禮！</h1>
    <div class="lead">咖啡、DIOR、節日禮物都能選 🎉</div>
    <p id="heroText">好友完成付費訂閱，你就累積推薦點；滿 200 點開始兌換，點數越多折越多。</p>
  </div>
</section>
<div class="tools"><input id="q" class="search" placeholder="搜尋品牌或商品，例如 DIOR、蛋糕"><select id="sort" class="sort"><option value="featured">精選排序</option><option value="low">價格：低 → 高</option><option value="high">價格：高 → 低</option><option value="name">名稱排序</option></select></div>
<div class="chips" id="chips"></div>
<div class="catalog-shell">
  <aside class="catalog-side"><h3>學習福利分類</h3><div class="sidecats" id="sideCats"></div></aside>
  <div class="catalog-main"><div class="catalog-head"><strong id="count">讀取商品中…</strong><span>推薦點兌換／PAYUNi 付款</span></div><section class="grid" id="grid"></section></div>
</div>
<div class="note">V52：商品、分類、圖片全部以 BookWide R2 為唯一主檔；查看商品不會建立訂單或占用推薦點。固定主分類：學習加油站、達標好禮、職場充電、旅行學習、送禮花卉、精選福利。</div>
</main>
<script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
<script>
// 從推薦好禮進來時，左上角可直接回 account/referral.html。
try{
  const qs=new URLSearchParams(location.search);
  if(qs.get('from')==='referral'){
    const b=document.getElementById('bwBack');
    if(b){ b.href='/account/referral.html'; b.textContent='← 返回推薦好禮'; }
  }
}catch(_e){}
let all=[];let cat='全部';let managedCategories=[];
const FESTIVALS={father_day:{label:'父親節',url:'https://giftshop-tw.line.me/collections/group/SweetForDad'},qixi:{label:'七夕情人節',url:'https://giftshop-tw.line.me/collections/2456770'},teachers_day:{label:'教師節',url:'https://giftshop-tw.line.me/collections/group/teachersdaylife'},mid_autumn:{label:'中秋節',url:'https://giftshop-tw.line.me/collections/group/mid-autumn'},christmas:{label:'聖誕節',url:'https://giftshop-tw.line.me/search?searchValue=%E8%81%96%E8%AA%95%E7%A6%AE%E7%9B%92'},mother_day:{label:'母親節',url:'https://giftshop-tw.line.me/collection-groups/SweetMom'},dragon_boat:{label:'端午節',url:'https://giftshop-tw.line.me/search?searchValue=%E7%AB%AF%E5%8D%88%E7%AF%80'},new_year:{label:'新年',url:'https://giftshop-tw.line.me/search?searchValue=%E6%96%B0%E5%B9%B4%E7%A6%AE%E7%9B%92'}};
const festivalKey=new URLSearchParams(location.search).get('festival')||'';
function festivalTags(p){return (p.festivals||[]).map(k=>`<span class="festag">${esc(FESTIVALS[k]?.label||k)}</span>`).join('')}
function applyFestivalHero(){if(!festivalKey||!FESTIVALS[festivalKey])return;const f=FESTIVALS[festivalKey];document.getElementById('heroTitle').textContent='🎁 '+f.label+' 好禮也能用推薦點換！';document.getElementById('heroText').textContent='好友完成付費訂閱即可累積推薦點；滿 200 點開始兌換。現在已為你篩選「'+f.label+'」好禮。';}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function placeholder(p){const t=(p.brand||'福利品').replace(/LINE官方旗艦館/g,'').trim();return `<div class="ph">${esc(t)}</div>`}
function catalogEffectivePriceV548(p){
  if(String(p?.product_type||'simple')==='variable'&&Array.isArray(p.variations)){
    const a=p.variations.filter(v=>v&&v.is_active!==false).map(v=>Number(v.sale_price||v.price||0)).filter(x=>x>0);
    if(a.length)return Math.min(...a);
  }
  return Number(p?.price||0);
}
function catalogPriceV54(p){if(String(p?.product_type||'simple')==='variable'&&Array.isArray(p.variations)){const a=p.variations.filter(v=>v&&v.is_active!==false).map(v=>Number(v.sale_price||v.price||0)).filter(x=>x>0);if(a.length){const lo=Math.min(...a),hi=Math.max(...a);return lo===hi?`NT$ ${lo.toLocaleString('zh-TW')}`:`NT$ ${lo.toLocaleString('zh-TW')} – ${hi.toLocaleString('zh-TW')}`}}return `NT$ ${Number(p?.price||0).toLocaleString('zh-TW')}`}
function render(){const q=document.querySelector('#q').value.trim().toLowerCase();const sort=document.querySelector('#sort').value;let arr=all.filter(p=>p.active!==false).filter(p=>!festivalKey||(p.festivals||[]).includes(festivalKey)).filter(p=>(cat==='全部'||p.category===cat)&&(!q||(`${p.brand} ${p.name}`).toLowerCase().includes(q)));if(sort==='low')arr.sort((a,b)=>catalogEffectivePriceV548(a)-catalogEffectivePriceV548(b));if(sort==='high')arr.sort((a,b)=>catalogEffectivePriceV548(b)-catalogEffectivePriceV548(a));if(sort==='name')arr.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));document.querySelector('#count').textContent=`目前顯示 ${arr.length} 項好禮`;document.querySelector('#grid').innerHTML=arr.length?arr.map(p=>`<div class="card"><div class="pic">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" onerror="this.parentNode.innerHTML=placeholderById('${esc(p.id)}')">`:placeholder(p)}</div><div class="body"><div class="brandname">${esc(p.brand)}</div><div class="festags">${festivalTags(p)}</div><div class="name">${esc(p.name)}</div><div class="price">${catalogPriceV54(p)}</div><div class="actions2">${p.stock_tracking_enabled&&p.stock_qty<=0?`<span class="official">暫時缺貨</span>`:`<a class="open" href="/line-gift-product.html?product=${encodeURIComponent(p.id)}">${(catalogEffectivePriceV548(p)<200||p.sale_mode==='redeem_only')?'推薦點兌換':'立即訂購'}</a>`}</div></div></div>`).join(''):`<div class="empty">找不到符合條件的商品。</div>`}
window.placeholderById=id=>placeholder(all.find(x=>String(x.id)===String(id))||{});
function buildChips(){
  const managed=managedCategories
    .filter(c=>c.active!==false)
    .slice()
    .sort((a,b)=>(Number(a.sort)||0)-(Number(b.sort)||0))
    .map(c=>String(c.name||'').trim())
    .filter(Boolean);

  const cats=['全部',...managed];
  if(cat!=='全部'&&!cats.includes(cat))cat='全部';

  const html=cats.map(x=>`<button class="chip ${x===cat?'active':''}" data-cat="${esc(x)}">${esc(x)}</button>`).join('');
  document.querySelector('#chips').innerHTML=html;
  document.querySelector('#sideCats').innerHTML=cats.map(x=>`<button class="sidecat ${x===cat?'active':''}" data-sidecat="${esc(x)}">${esc(x)}</button>`).join('');

  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;buildChips();render()});
  document.querySelectorAll('[data-sidecat]').forEach(b=>b.onclick=()=>{cat=b.dataset.sidecat;buildChips();render()});
}

const HIKING_API_BASE='https://bookwide-hiking-api.pmktools.workers.dev';
const SUPABASE_URL='https://jeajrwpmrgczimmrflxo.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplYWpyd3BtcmdjemltbXJmbHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3MTg5MzksImV4cCI6MjA3NjI5NDkzOX0.3iFXdHH0JEuk177_R4TGFJmOxYK9V8XctON6rDe7-Do';
let SB=null;

async function loadManagedCategories(){
  const r=await fetch(HIKING_API_BASE+'/api/bw-product-categories',{cache:'no-store'});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.ok===false||!Array.isArray(j.categories)){
    throw new Error(j.message||j.error||('分類 API HTTP '+r.status));
  }
  managedCategories=j.categories;
}

async function loadProductsFromR2(){
  const r=await fetch(HIKING_API_BASE+'/api/bw-products',{cache:'no-store'});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.ok===false||!Array.isArray(j.products))throw new Error(j.message||j.error||('商品 API HTTP '+r.status));
  return j.products.map(p=>({
    id:String(p.id||p.external_id||''),
    brand:p.brand||'',name:p.name||'',price:Number(p.price||0),category:p.category||'精選福利',
    product_type:p.product_type||((p.variations||[]).length?'variable':'simple'),
    variations:Array.isArray(p.variations)?p.variations:[],
    festivals:Array.isArray(p.festival_keys)?p.festival_keys:[],url:p.line_url||'',
    image:p.image_url||(Array.isArray(p.gallery_urls)?p.gallery_urls[0]:'')||'',active:p.is_active!==false,
    sale_mode:p.sale_mode||'auto',fulfillment_type:p.fulfillment_type||'voucher',stock_qty:Number(p.stock_qty||0),stock_tracking_enabled:p.stock_tracking_enabled===true
  }));
}

async function showAdminIfAllowed(){
  try{
    if(!SB) SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    const {data:{session}}=await SB.auth.getSession();
    if(!session) return;
    const {data,error}=await SB.from('profiles').select('is_admin').eq('id',session.user.id).maybeSingle();
    if(!error && data?.is_admin===true){ const b=document.getElementById('adminGiftBtn'); if(b)b.style.display='inline-block'; }
  }catch(_e){}
}
async function init(){
  applyFestivalHero();
  try{
    await loadManagedCategories();
    all=await loadProductsFromR2();
    buildChips();
    render();
    showAdminIfAllowed();
  }catch(e){
    console.error('BW 福利品讀取失敗',e);
    const count=document.getElementById('count');
    const grid=document.getElementById('grid');
    if(count)count.textContent='讀取失敗';
    if(grid)grid.innerHTML=`<div class="empty">福利品資料讀取失敗：${esc(e?.message||String(e))}</div>`;
  }
}
document.querySelector('#q').addEventListener('input',render);document.querySelector('#sort').addEventListener('change',render);init();
</script>
</body></html>
