<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BookWide ERP V2.2 SELF TEST</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;color:#171717}
.top{height:54px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #aaa}.brand{font-size:28px;font-weight:800;font-style:italic;color:#68147d}.badge{margin-left:14px;background:#164c7c;color:#fff;border-radius:18px;padding:8px 14px;font-weight:700}.cloud{margin-left:auto;color:#398854;font-weight:700}
.mods{display:flex;gap:5px;padding:5px 8px;background:#eee;border-bottom:1px solid #999}.mods button{padding:7px 15px}.mods button.active{background:#d9e6f5}
.shell{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 96px)}aside{border-right:1px solid #999;background:#f7f7ef;position:relative}.tree{padding:10px}.tree button{display:block;width:100%;text-align:left;padding:8px;border:0;background:transparent;color:#143a75}.tree button.active{background:#e8f0ff;border:1px solid #8ba4d7}.user{position:absolute;bottom:0;left:0;right:0;border-top:1px solid #aaa;padding:10px;background:#fafaf4;line-height:1.6}
main{overflow:auto}.crumb{padding:9px 14px;background:#fffde6;border-bottom:1px solid #aaa;color:#551a8b}.work{padding:12px}.status{position:fixed;left:300px;right:0;bottom:0;background:#fffbd9;border-top:1px solid #aaa;padding:7px 12px}
.card{border:1px solid #aaa;padding:12px;background:#fff;margin-bottom:10px}.ok{color:#176c37}.bad{color:#b00020}.diag{font-family:Consolas,monospace;white-space:pre-wrap;background:#111;color:#eee;padding:10px;max-height:220px;overflow:auto}
.grid{display:grid;grid-template-columns:280px 1fr;gap:12px}.list{border-right:1px solid #aaa;padding-right:8px}.list button{display:block;width:100%;text-align:left;padding:7px;background:#fff;border:1px solid transparent}.list button:hover{background:#fff7c7}
table{width:100%;border-collapse:collapse}th,td{border:1px solid #aaa;padding:6px}th{background:#e5e5e5}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.formgrid label{display:grid;gap:3px}.formgrid input,.formgrid textarea{padding:6px}.formgrid textarea{min-height:80px}.span3{grid-column:1/-1}
</style>
</head>
<body>
<div class="top"><div class="brand">BookWide ERP</div><div class="badge">V2.2 DIRECT R2 API SELF TEST</div><div class="cloud">● Existing bookwide-hiking-api</div></div>
<nav class="mods" id="mods"></nav>
<div class="shell">
<aside><div class="tree" id="tree"></div><div class="user">您好，<b>RAYMOND</b><br>中文(繁)<br><small>V2.2 單檔自測版</small></div></aside>
<main><div class="crumb" id="crumb">首頁 / 自我檢查</div><div class="work" id="work"></div><div class="status" id="status">V2.2 JavaScript 已直接內嵌於 index.html</div></main>
</div>
<script>
"use strict";
const API="https://bookwide-hiking-api.pmktools.workers.dev";
const $=s=>document.querySelector(s), esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const modules={
 system:{title:"系統",pages:[["selftest","連線自測"],["customers","客戶總覽"]]},
 sales:{title:"銷售",pages:[["quotation","報價單"],["sales-order","銷售訂單"],["price-history","客戶歷史價格"]]},
 inventory:{title:"存貨",pages:[["items","商品總覽 / SKU"]]},
 purchase:{title:"採購",pages:[["placeholder","採購"]]},
 ar:{title:"應收",pages:[["placeholder","應收"]]},ap:{title:"應付",pages:[["placeholder","應付"]]},
 bank:{title:"銀行",pages:[["placeholder","銀行"]]},finance:{title:"財務",pages:[["placeholder","財務"]]},
 cost:{title:"成本",pages:[["placeholder","成本"]]},invoice:{title:"發票",pages:[["placeholder","發票"]]},
 exportm:{title:"出口",pages:[["placeholder","出口"]]},importm:{title:"進口",pages:[["placeholder","進口"]]},matters:{title:"事項",pages:[["placeholder","事項"]]}
};
let state={module:"system",page:"selftest"};
async function get(path){const r=await fetch(API+path,{cache:"no-store"});const text=await r.text();let j;try{j=JSON.parse(text)}catch{throw new Error("HTTP "+r.status+"｜回傳不是 JSON｜"+text.slice(0,120))}if(!r.ok)throw new Error("HTTP "+r.status+"｜"+(j.error||j.message||""));return j}
function nav(){
 $("#mods").innerHTML=Object.entries(modules).map(([k,m])=>`<button data-m="${k}" class="${k===state.module?"active":""}">${m.title}</button>`).join("");
 document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{state.module=b.dataset.m;state.page=modules[state.module].pages[0][0];render()});
 const m=modules[state.module];$("#tree").innerHTML=`<b>🔧 ${m.title}管理</b><div style="margin-top:8px">${m.pages.map(([p,n])=>`<button data-p="${p}" class="${p===state.page?"active":""}">✦ ${n}</button>`).join("")}</div>`;
 document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{state.page=b.dataset.p;render()});
}
async function render(){
 nav(); const label=modules[state.module].pages.find(x=>x[0]===state.page)?.[1]||state.page;$("#crumb").textContent=modules[state.module].title+" / "+label;
 if(state.page==="selftest")return selftest();
 if(state.page==="items")return items();
 if(state.page==="customers")return customers();
 if(state.page==="quotation"||state.page==="sales-order")return docs(state.page);
 if(state.page==="price-history")return priceHistory();
 $("#work").innerHTML=`<div class="card"><h2>${esc(label)}</h2><p>此入口保留 RunEC 模組位置；目前先驗證商品、客戶、銷售資料鏈。</p></div>`;
}
async function selftest(){
 $("#work").innerHTML=`<div class="card"><h2>V2.2 實際資料鏈自測</h2><p>這版完全不讀 line-gifts.html / line-gifts-admin.html；直接呼叫目前正式 <b>bookwide-hiking-api</b>。</p><div id="tests">測試中…</div></div><div class="diag" id="diag"></div>`;
 const tests=[
  ["R2 商品主檔","/api/bw-products"],
  ["ERP SKU 商品","/api/bw-erp-items"],
  ["ERP 客戶","/api/erp-customers"],
  ["ERP 報價單","/api/erp-sales-list?type=quotation"]
 ];
 let rows=[],log=[];
 for(const [name,path] of tests){try{const j=await get(path);const count=j.count ?? j.rows?.length ?? j.items?.length ?? j.products?.length ?? 0;rows.push(`<tr><td>${name}</td><td class="ok">PASS</td><td>${count}</td><td>${path}</td></tr>`);log.push(name+" PASS "+JSON.stringify(j).slice(0,400))}catch(e){rows.push(`<tr><td>${name}</td><td class="bad">FAIL</td><td>—</td><td>${path}<br>${esc(e.message)}</td></tr>`);log.push(name+" FAIL "+e.message)}}
 $("#tests").innerHTML=`<table><tr><th>測試</th><th>狀態</th><th>筆數</th><th>正式 API</th></tr>${rows.join("")}</table>`;
 $("#diag").textContent=log.join("\n\n");$("#status").textContent="自測完成｜API = "+API;
}
async function items(){
 $("#work").innerHTML='<div class="card">讀取 /api/bw-erp-items…</div>';
 try{const j=await get("/api/bw-erp-items"),rows=j.items||j.rows||j.products||[];$("#work").innerHTML=`<div class="grid"><div class="list"><h3>Items - 商品總覽 (${rows.length})</h3><input id="q" placeholder="SKU / 名稱" style="width:100%;padding:6px"><div id="ilist"></div></div><div id="detail" class="card">選擇商品</div></div>`;const paint=q=>{$("#ilist").innerHTML=rows.filter(x=>!q||[x.sku,x.name,x.id].some(v=>String(v||"").toLowerCase().includes(q.toLowerCase()))).map((x,i)=>`<button data-i="${rows.indexOf(x)}"><b>${esc(x.sku||x.id)}</b><br>${esc(x.name||"")}</button>`).join("");document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>show(rows[+b.dataset.i]))};const show=x=>$("#detail").innerHTML=`<h2>${esc(x.sku||x.id)}</h2><div class="formgrid"><label>SKU<input readonly value="${esc(x.sku||x.id)}"></label><label>來源 SKU<input readonly value="${esc(x.source_sku_id||"")}"></label><label>價格<input readonly value="${esc(x.price||x.sale_price||0)}"></label><label class="span3">名稱<input readonly value="${esc(x.name||"")}"></label><label class="span3">說明<textarea readonly>${esc(x.description||x.detail_description||"")}</textarea></label></div>`;$("#q").oninput=e=>paint(e.target.value);paint("");if(rows[0])show(rows[0]);$("#status").textContent="商品讀取成功 "+rows.length+" 筆"}catch(e){$("#work").innerHTML=`<div class="card bad">商品讀取失敗：${esc(e.message)}</div>`}
}
async function customers(){
 $("#work").innerHTML='<div class="card">讀取 /api/erp-customers…</div>';
 try{const j=await get("/api/erp-customers"),rows=j.rows||j.customers||[];$("#work").innerHTML=`<div class="card"><h2>客戶總覽 (${rows.length})</h2><table><tr><th>客戶編號</th><th>名稱</th><th>聯絡人</th><th>付款條件</th><th>幣別</th></tr>${rows.map(x=>`<tr><td>${esc(x.customer_id||x.id)}</td><td>${esc(x.name||x.customer_name)}</td><td>${esc(x.contact||"")}</td><td>${esc(x.payment_terms||"")}</td><td>${esc(x.currency||"TWD")}</td></tr>`).join("")}</table></div>`}catch(e){$("#work").innerHTML=`<div class="card bad">客戶讀取失敗：${esc(e.message)}</div>`}
}
async function docs(type){
 $("#work").innerHTML='<div class="card">讀取銷售單據…</div>';
 try{const j=await get("/api/erp-sales-list?type="+encodeURIComponent(type)),rows=j.rows||[];$("#work").innerHTML=`<div class="card"><h2>${type==="quotation"?"報價單":"銷售訂單"} (${rows.length})</h2><table><tr><th>單號</th><th>客戶</th><th>日期</th><th>狀態</th></tr>${rows.map(x=>`<tr><td>${esc(x.doc_no||x.id)}</td><td>${esc(x.customer_id||"")} ${esc(x.customer_name||"")}</td><td>${esc(x.date||"")}</td><td>${esc(x.status||"")}</td></tr>`).join("")}</table></div>`}catch(e){$("#work").innerHTML=`<div class="card bad">單據讀取失敗：${esc(e.message)}</div>`}
}
async function priceHistory(){
 $("#work").innerHTML='<div class="card">讀取歷史價格…</div>';
 try{const j=await get("/api/erp-customer-price"),rows=j.rows||[];$("#work").innerHTML=`<div class="card"><h2>客戶歷史價格 (${rows.length})</h2><table><tr><th>客戶</th><th>SKU</th><th>客戶 SKU</th><th>牌價</th><th>成交/報價</th><th>來源單號</th></tr>${rows.map(x=>`<tr><td>${esc(x.customer_id||"")}</td><td>${esc(x.sku||"")}</td><td>${esc(x.customer_sku||"")}</td><td>${esc(x.list_price||0)}</td><td>${esc(x.unit_price||0)}</td><td>${esc(x.source_doc_no||"")}</td></tr>`).join("")}</table></div>`}catch(e){$("#work").innerHTML=`<div class="card bad">歷史價格讀取失敗：${esc(e.message)}</div>`}
}
window.addEventListener("error",e=>{$("#status").textContent="JS ERROR｜"+e.message});
nav();render();
</script>
</body></html>
