<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BookWide ERP V3.0</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px Arial,"Microsoft JhengHei",sans-serif;color:#111;background:#f7f5e8}.top{height:62px;background:#fff;border-bottom:1px solid #aaa;display:flex;align-items:center;padding:0 16px;gap:18px}.brand{font-size:30px;font-weight:800;font-style:italic;color:#68127f}.badge{background:#124d7d;color:#fff;border-radius:18px;padding:8px 14px;font-weight:700}.cloud{margin-left:auto;color:#287d46;font-weight:700}.mods{height:48px;background:#eee;border-bottom:1px solid #aaa;padding:6px 8px;display:flex;gap:5px}.mods button,.btn{font:inherit;border:1px solid #999;background:#f8f8f8;padding:7px 14px;cursor:pointer}.mods button.active,.tree button.active{background:#dbe8ff}.layout{display:grid;grid-template-columns:310px 1fr;height:calc(100vh - 110px)}.left{border-right:1px solid #aaa;background:#f6f6ef;overflow:auto}.arrows{padding:10px;border-bottom:1px solid #aaa}.circle{border:1px solid #aaa;border-radius:50%;padding:5px 10px;background:#eee}.tree{padding:10px}.tree b{font-size:18px}.tree button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #ddd;background:transparent;padding:10px;font:inherit;cursor:pointer}.user{position:sticky;bottom:0;background:#f6f6ef;border-top:1px solid #aaa;padding:10px}.main{overflow:auto;background:#fff}.crumb{padding:12px 18px;background:#fffde2;border-bottom:1px solid #aaa;color:#6b1a88}.work{padding:14px}.card{border:1px solid #bbb;background:#fff;padding:14px;margin-bottom:12px}.toolbar{display:flex;gap:6px;justify-content:flex-end;margin-bottom:10px}.grid{display:grid;grid-template-columns:300px 1fr;gap:12px}.list{border:1px solid #bbb;background:#fff;padding:10px;max-height:70vh;overflow:auto}.list button{display:block;width:100%;text-align:left;padding:9px;border:0;border-bottom:1px solid #ddd;background:#fff;cursor:pointer}.list button:hover{background:#fff7c8}.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.formgrid label{display:flex;flex-direction:column;gap:4px}.span2{grid-column:span 2}.span4{grid-column:span 4}input,select,textarea{font:inherit;padding:7px;border:1px solid #aaa;width:100%}textarea{min-height:80px}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #bbb;padding:7px;text-align:left;vertical-align:top}th{background:#ddd}.ok{color:green;font-weight:700}.bad{color:#b00020;font-weight:700}.lines input,.lines select{min-width:90px}.money{text-align:right}.totals{margin-left:auto;width:320px}.status{position:sticky;bottom:0;background:#fffbd7;border-top:1px solid #aaa;padding:8px 14px}.diag{background:#111;color:#fff;padding:12px;white-space:pre-wrap;max-height:260px;overflow:auto}.muted{color:#666}.print-only{display:none}
@media print{.top,.mods,.left,.crumb,.toolbar,.status,.internal{display:none!important}.layout{display:block;height:auto}.main{overflow:visible}.work{padding:0}.card{border:0}.print-only{display:block}th.internal,td.internal{display:none!important}}
</style></head><body>
<div class="top"><div class="brand">BookWide ERP</div><div class="badge">V3.0 RunEC SALES CORE</div><div class="cloud">● Existing bookwide-hiking-api</div></div>
<div class="mods" id="mods"></div><div class="layout"><aside class="left"><div class="arrows"><button class="circle">◀</button> <button class="circle">▶</button> <button class="circle" onclick="render()">↻</button></div><div class="tree" id="tree"></div><div class="user">您好，<b>RAYMOND</b><br>語言　中文(繁)<br>V3.0 單檔銷售核心</div></aside>
<main class="main"><div class="crumb" id="crumb"></div><div class="work" id="work"></div><div class="status" id="status">V3.0 啟動</div></main></div>
<script>
"use strict";
const API="https://bookwide-hiking-api.pmktools.workers.dev";
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const modules={
 system:{title:"系統",pages:[["selftest","連線自測"],["customers","客戶主檔"]]},
 sales:{title:"銷售",pages:[["quotation","報價單"],["sales-order","銷售訂單"],["shipment","出貨單"],["price-history","客戶歷史價格"]]},
 inventory:{title:"存貨",pages:[["items","商品主檔 / SKU"]]},
 purchase:{title:"採購",pages:[["placeholder","採購"]]},ar:{title:"應收",pages:[["placeholder","應收"]]},ap:{title:"應付",pages:[["placeholder","應付"]]},
 bank:{title:"銀行",pages:[["placeholder","銀行"]]},finance:{title:"財務",pages:[["placeholder","財務"]]},cost:{title:"成本",pages:[["placeholder","成本"]]},
 invoice:{title:"發票",pages:[["placeholder","發票"]]},exportm:{title:"出口",pages:[["placeholder","出口"]]},importm:{title:"進口",pages:[["placeholder","進口"]]},matters:{title:"事項",pages:[["placeholder","事項"]]}
};
let state={module:"system",page:"selftest"}, cache={items:[],customers:[],docs:[]}, currentDoc=null;
async function req(path,opt={}){const r=await fetch(API+path,{cache:"no-store",credentials:"include",...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});const t=await r.text();let j;try{j=JSON.parse(t)}catch{throw new Error("HTTP "+r.status+"｜回傳不是 JSON｜"+t.slice(0,160))}if(!r.ok||j.ok===false)throw new Error(j.error||j.message||("HTTP "+r.status));return j}
const get=p=>req(p), post=(p,b)=>req(p,{method:"POST",body:JSON.stringify(b)});
function nav(){ $("#mods").innerHTML=Object.entries(modules).map(([k,m])=>`<button data-m="${k}" class="${k===state.module?"active":""}">${m.title}</button>`).join("");
 document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{state.module=b.dataset.m;state.page=modules[state.module].pages[0][0];render()});
 const m=modules[state.module];$("#tree").innerHTML=`<b>🔧 ${m.title}管理</b><div>${m.pages.map(([p,n])=>`<button data-p="${p}" class="${p===state.page?"active":""}">✦ ${n}</button>`).join("")}</div>`;
 document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{state.page=b.dataset.p;render()});}
async function render(){nav();const label=modules[state.module].pages.find(x=>x[0]===state.page)?.[1]||state.page;$("#crumb").textContent=modules[state.module].title+" / "+label;
 if(state.page==="selftest")return selftest();if(state.page==="items")return items();if(state.page==="customers")return customers();
 if(["quotation","sales-order","shipment"].includes(state.page))return sales(state.page);if(state.page==="price-history")return priceHistory();
 $("#work").innerHTML=`<div class="card"><h2>${esc(label)}</h2><p>RunEC 模組位置保留；V3.0 先完成銷售核心。</p></div>`;}
async function selftest(){ $("#work").innerHTML=`<div class="card"><h2>V3.0 正式資料鏈自測</h2><div id="tests">測試中…</div></div><div class="diag" id="diag"></div>`;
 const tests=[["R2 商品主檔","/api/bw-products"],["ERP SKU 商品","/api/bw-erp-items"],["ERP 客戶","/api/erp-customers"],["ERP 報價單","/api/erp-sales-list?type=quotation"],["ERP 訂單","/api/erp-sales-list?type=sales-order"],["ERP 出貨","/api/erp-sales-list?type=shipment"],["歷史價格","/api/erp-customer-price"]];
 let rows=[],log=[];for(const [n,p] of tests){try{const j=await get(p),c=j.count??j.rows?.length??j.items?.length??j.products?.length??0;rows.push(`<tr><td>${n}</td><td class="ok">PASS</td><td>${c}</td><td>${p}</td></tr>`);log.push(n+" PASS "+JSON.stringify(j).slice(0,500))}catch(e){rows.push(`<tr><td>${n}</td><td class="bad">FAIL</td><td>—</td><td>${p}<br>${esc(e.message)}</td></tr>`);log.push(n+" FAIL "+e.message)}}$("#tests").innerHTML=`<table><tr><th>測試</th><th>狀態</th><th>筆數</th><th>API</th></tr>${rows.join("")}</table>`;$("#diag").textContent=log.join("\n\n");$("#status").textContent="V3.0 自測完成";}
async function loadItems(){const j=await get("/api/bw-erp-items");cache.items=j.items||j.rows||j.products||[];return cache.items}
async function loadCustomers(){const j=await get("/api/erp-customers");cache.customers=j.rows||j.customers||[];return cache.customers}
async function items(){$("#work").innerHTML='<div class="card">讀取商品主檔…</div>';try{const rows=await loadItems();$("#work").innerHTML=`<div class="grid"><div class="list"><h3>商品主檔 (${rows.length})</h3><input id="iq" placeholder="SKU / 名稱"><div id="ilist"></div></div><div id="idet" class="card">選擇商品</div></div>`;const show=x=>$("#idet").innerHTML=`<h2>${esc(x.sku||x.id)}</h2><div class="formgrid"><label>ERP SKU<input readonly value="${esc(x.sku||x.id)}"></label><label>來源 SKU<input readonly value="${esc(x.source_sku_id||"")}"></label><label>牌價<input readonly value="${esc(x.price||x.sale_price||0)}"></label><label>庫存<input readonly value="${esc(x.stock_qty||x.inventory_qty||0)}"></label><label class="span4">名稱<input readonly value="${esc(x.name||"")}"></label><label class="span4">說明<textarea readonly>${esc(x.description||x.detail_description||"")}</textarea></label></div><p class="muted">ERP SKU 為主鍵；報價/訂單只引用，不在交易單據改寫 SKU。</p>`;
 const paint=q=>{$("#ilist").innerHTML=rows.filter(x=>!q||[x.sku,x.id,x.name].some(v=>String(v||"").toLowerCase().includes(q.toLowerCase()))).map(x=>`<button data-s="${esc(x.sku||x.id)}"><b>${esc(x.sku||x.id)}</b><br>${esc(x.name||"")}</button>`).join("");document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>show(rows.find(x=>String(x.sku||x.id)===b.dataset.s)))};$("#iq").oninput=e=>paint(e.target.value);paint("");if(rows[0])show(rows[0]);$("#status").textContent="商品主檔 "+rows.length+" 筆"}catch(e){$("#work").innerHTML=`<div class="card bad">${esc(e.message)}</div>`}}
function customerForm(c={}){return `<div class="toolbar"><button class="btn" onclick="newCustomer()">新增</button><button class="btn" onclick="saveCustomer()">儲存</button></div><div class="formgrid">
<label>客戶編號*<input id="c_id" value="${esc(c.customer_id||"")}"></label><label class="span2">客戶名稱*<input id="c_name" value="${esc(c.name||c.customer_name||"")}"></label><label>統一編號<input id="c_tax" value="${esc(c.tax_id||"")}"></label>
<label>聯絡人<input id="c_contact" value="${esc(c.contact||"")}"></label><label>電話<input id="c_phone" value="${esc(c.phone||"")}"></label><label>Email<input id="c_email" value="${esc(c.email||"")}"></label><label>幣別<input id="c_cur" value="${esc(c.currency||"TWD")}"></label>
<label>付款條件<input id="c_terms" value="${esc(c.payment_terms||"")}"></label><label class="span2">地址<input id="c_addr" value="${esc(c.address||"")}"></label><label>客戶統編/內碼<input id="c_ref" value="${esc(c.customer_ref||"")}"></label>
<label class="span4">備註<textarea id="c_note">${esc(c.note||"")}</textarea></label></div>`}
async function customers(){try{const rows=await loadCustomers();$("#work").innerHTML=`<div class="grid"><div class="list"><h3>客戶主檔 (${rows.length})</h3><input id="cq" placeholder="編號 / 名稱"><div id="clist"></div></div><div id="cdet" class="card">${customerForm(rows[0]||{})}</div></div>`;const paint=q=>{$("#clist").innerHTML=rows.filter(x=>!q||[x.customer_id,x.name,x.customer_name].some(v=>String(v||"").toLowerCase().includes(q.toLowerCase()))).map(x=>`<button data-c="${esc(x.customer_id)}"><b>${esc(x.customer_id)}</b> ${esc(x.name||x.customer_name||"")}</button>`).join("");document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>$("#cdet").innerHTML=customerForm(rows.find(x=>x.customer_id===b.dataset.c)||{}))};$("#cq").oninput=e=>paint(e.target.value);paint("");$("#status").textContent="客戶主檔 "+rows.length+" 筆"}catch(e){$("#work").innerHTML=`<div class="card bad">${esc(e.message)}</div>`}}
function newCustomer(){$("#cdet").innerHTML=customerForm({})}
async function saveCustomer(){const c={customer_id:$("#c_id").value.trim(),name:$("#c_name").value.trim(),tax_id:$("#c_tax").value.trim(),contact:$("#c_contact").value.trim(),phone:$("#c_phone").value.trim(),email:$("#c_email").value.trim(),currency:$("#c_cur").value.trim()||"TWD",payment_terms:$("#c_terms").value.trim(),address:$("#c_addr").value.trim(),customer_ref:$("#c_ref").value.trim(),note:$("#c_note").value.trim()};if(!c.customer_id||!c.name)return alert("客戶編號與名稱必填");try{await post("/api/erp-customer-save",{customer:c});alert("客戶已儲存");customers()}catch(e){alert("儲存失敗："+e.message)}}
function emptyDoc(type){const d=new Date().toISOString().slice(0,10);return {type,date:d,valid_until:d,status:"draft",currency:"TWD",exchange_rate:1,tax_rate:5,payment_terms:"",shipping_method:"",salesperson:"RAYMOND",lines:[]}}
async function sales(type){$("#work").innerHTML='<div class="card">讀取銷售資料…</div>';try{await Promise.all([loadItems(),loadCustomers()]);const j=await get("/api/erp-sales-list?type="+encodeURIComponent(type));cache.docs=j.rows||[];currentDoc=cache.docs[0]||emptyDoc(type);paintSales(type)}catch(e){$("#work").innerHTML=`<div class="card bad">${esc(e.message)}</div>`}}
function typeName(t){return {"quotation":"報價單","sales-order":"銷售訂單","shipment":"出貨單"}[t]||t}
function paintSales(type){const rows=cache.docs;$("#work").innerHTML=`<div class="grid"><div class="list"><h3>${typeName(type)}總覽 (${rows.length})</h3><button onclick="newDoc('${type}')">＋ 新增${typeName(type)}</button><div>${rows.map(x=>`<button data-d="${esc(x.id||x.doc_no)}"><b>${esc(x.doc_no||x.id)}</b><br>${esc(x.customer_id||"")} ${esc(x.customer_name||"")}｜${esc(x.status||"")}</button>`).join("")}</div></div><div id="doc" class="card"></div></div>`;document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{currentDoc=rows.find(x=>String(x.id||x.doc_no)===b.dataset.d);paintDoc(type)});paintDoc(type)}
function paintDoc(type){const d=currentDoc||emptyDoc(type), cs=cache.customers;$("#doc").innerHTML=`<div class="toolbar"><button class="btn" onclick="newDoc('${type}')">新增</button><button class="btn" onclick="saveDoc('${type}','draft')">暫存</button><button class="btn" onclick="saveDoc('${type}','effective')">生效</button>${type==="quotation"?`<button class="btn" onclick="convertQuote()">轉銷售訂單</button>`:""}<button class="btn" onclick="window.print()">列印</button></div>
<div class="print-only"><h1>BookWide ${typeName(type)}</h1></div><div class="formgrid">
<label>單號<input id="d_no" value="${esc(d.doc_no||"")}" placeholder="空白自動產生"></label><label>日期<input id="d_date" type="date" value="${esc(d.date||"")}"></label><label>狀態<input readonly value="${esc(d.status||"draft")}"></label><label>客戶編號<select id="d_cid" onchange="pickCustomer()"><option value="">請選擇</option>${cs.map(c=>`<option value="${esc(c.customer_id)}" ${c.customer_id===d.customer_id?"selected":""}>${esc(c.customer_id)} ${esc(c.name||c.customer_name||"")}</option>`).join("")}</select></label>
<label class="span2">客戶名稱<input id="d_cname" value="${esc(d.customer_name||"")}"></label><label>客戶詢價/PO<input id="d_po" value="${esc(d.customer_po||"")}"></label><label>有效日期<input id="d_valid" type="date" value="${esc(d.valid_until||"")}"></label>
<label>幣別<input id="d_cur" value="${esc(d.currency||"TWD")}"></label><label>匯率<input id="d_fx" type="number" step="0.0001" value="${esc(d.exchange_rate||1)}"></label><label>稅率 %<input id="d_tax" type="number" step="0.01" value="${esc(d.tax_rate??5)}" oninput="calcDoc()"></label><label>付款條件<input id="d_terms" value="${esc(d.payment_terms||"")}"></label>
<label>送貨方式<input id="d_ship" value="${esc(d.shipping_method||"")}"></label><label>業務員<input id="d_sales" value="${esc(d.salesperson||"RAYMOND")}"></label></div>
<div class="toolbar" style="justify-content:flex-start;margin-top:12px"><button class="btn" onclick="addLine()">＋ 新增明細</button>${type==="quotation"?`<button class="btn" onclick="lookupHistory()">客戶歷史價格</button>`:""}</div>
<div style="overflow:auto"><table class="lines"><thead><tr><th>ERP SKU</th><th>客戶 SKU</th><th>說明</th><th>數量</th><th>單位</th><th class="internal">牌價</th><th class="internal">折扣 %</th><th>報價/成交單價</th><th>金額</th><th>交期</th><th class="internal"></th></tr></thead><tbody id="linebody"></tbody></table></div>
<div class="formgrid" style="margin-top:10px"><label class="span2">備註<textarea id="d_note">${esc(d.note||"")}</textarea></label><div></div><div class="totals"><table><tr><td>未稅</td><td class="money" id="sub">0</td></tr><tr><td>稅額</td><td class="money" id="tax">0</td></tr><tr><th>總計</th><th class="money" id="grand">0</th></tr></table></div></div>`;renderLines(d.lines||[]);calcDoc()}
function newDoc(type){currentDoc=emptyDoc(type);paintDoc(type)}
function pickCustomer(){const c=cache.customers.find(x=>x.customer_id===$("#d_cid").value);if(c){$("#d_cname").value=c.name||c.customer_name||"";$("#d_terms").value=c.payment_terms||"";$("#d_cur").value=c.currency||"TWD"}}
function renderLines(lines){$("#linebody").innerHTML=lines.map((l,i)=>lineHtml(l,i)).join("")}
function lineHtml(l={},i){return `<tr data-row="${i}"><td><input class="sku" list="skus" value="${esc(l.sku||"")}" onchange="skuPick(this)"><datalist id="skus">${cache.items.map(x=>`<option value="${esc(x.sku||x.id)}">${esc(x.name||"")}</option>`).join("")}</datalist></td><td><input class="csku" value="${esc(l.customer_sku||"")}"></td><td><input class="name" value="${esc(l.name||"")}"></td><td><input class="qty" type="number" step="0.01" value="${esc(l.qty??1)}" oninput="calcDoc()"></td><td><input class="unit" value="${esc(l.unit||"PCS")}"></td><td class="internal"><input class="listp" type="number" step="0.01" value="${esc(l.list_price??0)}" oninput="discountChanged(this)"></td><td class="internal"><input class="disc" type="number" step="0.01" value="${esc(l.discount??0)}" oninput="discountChanged(this)"></td><td><input class="price" type="number" step="0.01" value="${esc(l.unit_price??0)}" oninput="priceChanged(this)"></td><td class="money amt">0</td><td><input class="delivery" type="date" value="${esc(l.delivery_date||"")}"></td><td class="internal"><button onclick="this.closest('tr').remove();calcDoc()">×</button></td></tr>`}
function addLine(){$("#linebody").insertAdjacentHTML("beforeend",lineHtml({},document.querySelectorAll("#linebody tr").length));calcDoc()}
function skuPick(el){const tr=el.closest("tr"),x=cache.items.find(v=>String(v.sku||v.id)===el.value);if(!x)return;tr.querySelector(".name").value=x.name||"";const p=Number(x.price||x.sale_price||0);tr.querySelector(".listp").value=p;tr.querySelector(".price").value=p;tr.querySelector(".disc").value=0;calcDoc()}
function discountChanged(el){const tr=el.closest("tr"),lp=+tr.querySelector(".listp").value||0,dc=+tr.querySelector(".disc").value||0;tr.querySelector(".price").value=(lp*(1-dc/100)).toFixed(2);calcDoc()}
function priceChanged(el){const tr=el.closest("tr"),lp=+tr.querySelector(".listp").value||0,p=+el.value||0;tr.querySelector(".disc").value=lp?((1-p/lp)*100).toFixed(2):0;calcDoc()}
function calcDoc(){let sub=0;document.querySelectorAll("#linebody tr").forEach(tr=>{const a=(+tr.querySelector(".qty").value||0)*(+tr.querySelector(".price").value||0);tr.querySelector(".amt").textContent=a.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});sub+=a});const tx=sub*((+($("#d_tax")?.value||0))/100);if($("#sub")){$("#sub").textContent=sub.toLocaleString(undefined,{minimumFractionDigits:2});$("#tax").textContent=tx.toLocaleString(undefined,{minimumFractionDigits:2});$("#grand").textContent=(sub+tx).toLocaleString(undefined,{minimumFractionDigits:2})}}
function collectDoc(type){const lines=[...document.querySelectorAll("#linebody tr")].map(tr=>({sku:tr.querySelector(".sku").value.trim(),customer_sku:tr.querySelector(".csku").value.trim(),name:tr.querySelector(".name").value.trim(),qty:+tr.querySelector(".qty").value||0,unit:tr.querySelector(".unit").value.trim()||"PCS",list_price:+tr.querySelector(".listp").value||0,discount:+tr.querySelector(".disc").value||0,unit_price:+tr.querySelector(".price").value||0,delivery_date:tr.querySelector(".delivery").value})).filter(x=>x.sku);return {...(currentDoc||{}),type,doc_no:$("#d_no").value.trim(),date:$("#d_date").value,customer_id:$("#d_cid").value,customer_name:$("#d_cname").value.trim(),customer_po:$("#d_po").value.trim(),valid_until:$("#d_valid").value,currency:$("#d_cur").value.trim()||"TWD",exchange_rate:+$("#d_fx").value||1,tax_rate:+$("#d_tax").value||0,payment_terms:$("#d_terms").value.trim(),shipping_method:$("#d_ship").value.trim(),salesperson:$("#d_sales").value.trim(),note:$("#d_note").value.trim(),lines}}
async function saveDoc(type,status){const d=collectDoc(type);if(!d.customer_id)return alert("請先選客戶");if(!d.lines.length)return alert("至少一筆商品");d.status=status;try{const j=await post("/api/erp-sales-save",{type,doc:d});currentDoc=j.doc;alert(typeName(type)+"已"+(status==="effective"?"生效":"暫存"));sales(type)}catch(e){alert("儲存失敗："+e.message)}}
async function convertQuote(){if(!currentDoc)return;const so={...currentDoc,id:"",doc_no:"",type:"sales-order",status:"draft",source_quote:currentDoc.doc_no};try{const j=await post("/api/erp-sales-save",{type:"sales-order",doc:so});alert("已轉銷售訂單："+j.doc.doc_no);state.page="sales-order";render()}catch(e){alert("轉單失敗："+e.message)}}
async function lookupHistory(){const cid=$("#d_cid").value;if(!cid)return alert("先選客戶");try{const j=await get("/api/erp-customer-price?customer_id="+encodeURIComponent(cid));const rows=j.rows||[];alert(rows.length?rows.slice(0,20).map(x=>`${x.sku}｜${x.unit_price}｜${x.source_doc_no}`).join("\n"):"此客戶尚無歷史成交/報價")}catch(e){alert(e.message)}}
async function priceHistory(){try{const j=await get("/api/erp-customer-price"),rows=j.rows||[];$("#work").innerHTML=`<div class="card"><h2>客戶歷史價格 (${rows.length})</h2><p>來源：生效報價單；不改商品牌價。</p><table><tr><th>客戶</th><th>ERP SKU</th><th>客戶 SKU</th><th>牌價</th><th>折扣%</th><th>成交/報價單價</th><th>來源單號</th><th>日期</th></tr>${rows.map(x=>`<tr><td>${esc(x.customer_id||"")} ${esc(x.customer_name||"")}</td><td>${esc(x.sku||"")}</td><td>${esc(x.customer_sku||"")}</td><td>${esc(x.list_price||0)}</td><td>${esc(x.discount||0)}</td><td>${esc(x.unit_price||0)}</td><td>${esc(x.source_doc_no||"")}</td><td>${esc(x.effective_date||"")}</td></tr>`).join("")}</table></div>`}catch(e){$("#work").innerHTML=`<div class="card bad">${esc(e.message)}</div>`}}
window.addEventListener("error",e=>{$("#status").textContent="JS ERROR｜"+e.message});nav();render();
</script></body></html>
