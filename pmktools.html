<style>
:root{--nav:#0f1b31;--ink:#14213d;--muted:#667085;--green:#06c755;--line:#e7ebf2;--bg:#f5f8fc;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{text-decoration:none;color:inherit}.top{background:var(--nav);color:#fff;position:sticky;top:0;z-index:20}.topin{max-width:1240px;margin:auto;padding:8px 14px;display:flex;align-items:center;gap:8px}.brand{font-size:18px;font-weight:900;color:#7c2bc6;margin-right:auto}.navbtn{border:1px solid rgba(255,255,255,.25);padding:7px 11px;border-radius:10px;font-weight:800;font-size:13px}.navbtn.green{background:var(--green);border-color:var(--green)}
.wrap{max-width:1240px;margin:0 auto;padding:12px 14px 40px}.hero{background:linear-gradient(135deg,#fff,#f1fff6);border:1px solid #d9eee2;border-radius:14px;padding:8px 10px;display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:8px}
.hero-video{width:118px;height:76px;border-radius:13px;overflow:hidden;background:#000}
.hero-video video{width:100%;height:100%;object-fit:cover;display:block}
.hero-copy{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"kicker actions" "title actions" "lead actions";column-gap:10px;align-items:center}
.hero-kicker{grid-area:kicker;font-size:11px;font-weight:900;color:#0f766e;margin:0 0 2px}
.hero h1{grid-area:title;margin:0 0 2px;font-size:21px;line-height:1.18}
.hero .lead{grid-area:lead;margin:0;color:#475569;font-size:11px;line-height:1.25;font-weight:700}
.hero-actions{grid-area:actions;display:flex;gap:5px;align-items:center;flex-wrap:nowrap}
.hero-cta{display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:5px 8px;border-radius:9px;border:0;text-decoration:none;font-size:11px;font-weight:900;white-space:nowrap;cursor:pointer}
.hero-cta.sound{background:#fff;color:#0f172a;border:1px solid #cbd5e1}
.hero-cta.primary{background:#2563eb;color:#fff}
@media(max-width:720px){
  .hero{grid-template-columns:100px minmax(0,1fr);gap:8px;padding:8px;border-radius:15px;margin-bottom:8px}

  .hero-actions{display:flex;gap:4px;margin-top:4px}

}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}.chip{border:1px solid var(--line);background:white;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;cursor:pointer}.chip.active{background:#132743;color:white;border-color:#132743}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:grid;grid-template-columns:112px minmax(0,1fr);min-height:142px;transition:.16s transform,.16s box-shadow}.card:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(20,33,61,.08)}.pic{width:112px;height:100%;min-height:142px;background:linear-gradient(145deg,#f0f2f6,#fff);display:flex;align-items:center;justify-content:center;overflow:hidden}.pic img,.pic video{width:100%;height:100%;object-fit:cover}.pic video{background:#000}.ph{width:84px;height:84px;border-radius:14px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:950;font-size:14px;padding:10px}.body{padding:11px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}.brandname{font-size:11px;color:var(--muted);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.festags{display:flex;gap:3px;flex-wrap:wrap}.festag{font-size:9px;font-weight:900;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:999px;padding:2px 5px}.name{font-size:14px;font-weight:850;line-height:1.35;min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.price{font-size:18px;font-weight:950;margin-top:auto}.actions2{margin-top:3px}.open{display:block;text-align:center;background:var(--green);color:white;padding:8px 8px;border-radius:10px;font-size:12px;font-weight:900}.official{display:none!important}.empty{grid-column:1/-1;background:#fff;border:1px dashed #ccd4e0;border-radius:18px;padding:48px;text-align:center;color:var(--muted)}.note{margin-top:24px;padding:16px 18px;border-radius:16px;background:white;border:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.7}
@media(max-width:1080px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.topin{padding:6px 8px}.brand{font-size:17px}.navbtn{padding:6px 8px;font-size:12px}.wrap{padding:8px 8px 32px}.hero{display:grid;grid-template-columns:92px minmax(0,1fr);gap:7px;padding:7px;border-radius:12px;margin-bottom:6px}.hero-video{width:92px;height:64px}.hero h1{font-size:12px}.grid{grid-template-columns:1fr;gap:8px}.card{grid-template-columns:96px minmax(0,1fr);min-height:124px}.pic{width:96px;min-height:124px}.ph{width:72px;height:72px;font-size:12px}.body{padding:10px}.name{font-size:13px;min-height:34px}.price{font-size:16px}.open{padding:8px 9px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.navbtn.hide-sm{display:none}}
</style>
</head>
<body>
<!-- V57.5 CLEAN TRIM: 直接刪除手機紅線區塊；無搜尋/排序/狀態列/精選福利；Emma 保留 -->
<header class="top"><div class="topin"><a class="brand" id="bwBack" href="/">← BookWide</a><a class="navbtn hide-sm" href="/activity.html">活動</a><a class="navbtn" href="/pmktools-cart.html">🛒 購物車</a><a class="navbtn" id="adminGiftBtn" href="/checklist/pmktools-product-admin.html" style="display:none">商品後台</a></div></header>
<main class="wrap">

  </div>
  <div class="hero-copy">

<script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
<script>
// 從推薦好禮進來時，左上角可直接回 account/referral.html。
try{
  const qs=new URLSearchParams(location.search);
  if(qs.get('from')==='referral'){
    const b=document.getElementById('bwBack');
    if(b){ b.href='/account/referral.html'; b.textContent='← 返回推薦好禮'; }
  }
}catch(_e){}
const FALLBACK={products:[{"id": "322504000", "brand": "DIOR LINE官方旗艦館", "name": "MISS DIOR 花漾迪奧護手霜 [快速出貨]", "price": 2050, "category": "美妝保養", "url": "https://giftshop-tw.line.me/products/322504000", "image": "https://lcp-prod-obs.line-scdn.net/0hAnWye19SHkFqAAuH77JhFjldEjBZcRpJA3gDfE5FPzoedzFxXy0DJTBIK3IgbQtPPS0wQQ5GPyksMThxVzoEQk5JPgQabwtLPTo5QTNLEBcVdiJLDG4tVw/w320", "active": true}, {"id": "322548569", "brand": "DIOR LINE官方旗艦館", "name": "Miss Dior 花漾迪奧親吻淡香水 20ML [快速出貨]", "price": 2200, "category": "香水香氛", "url": "https://giftshop-tw.line.me/products/322548569", "image": "", "active": true}, {"id": "322549136", "brand": "DIOR LINE官方旗艦館", "name": "迪奧巨星持色唇露｜收禮者自選色號 [快速出貨]", "price": 1650, "category": "美妝保養", "url": "https://giftshop-tw.line.me/products/322549136", "image": "", "active": true}, {"id": "322549104", "brand": "DIOR LINE官方旗艦館", "name": "迪奧巨星持色唇膏－極霧｜收禮者自選色號 [快速出貨]", "price": 1650, "category": "美妝保養", "url": "https://giftshop-tw.line.me/products/322549104", "image": "", "active": true}, {"id": "322549138", "brand": "DIOR LINE官方旗艦館", "name": "獨家｜織愛絲語巨星持色唇膏禮盒 [快速出貨]", "price": 3300, "category": "美妝保養", "url": "https://giftshop-tw.line.me/products/322549138", "image": "", "active": true}, {"id": "322530212", "brand": "DIOR LINE官方旗艦館", "name": "迪奧超完美晶透光氣墊粉餅 蝴蝶結｜自選色號 [快速出貨]", "price": 3050, "category": "美妝保養", "url": "https://giftshop-tw.line.me/products/322530212", "image": "", "active": true}, {"id": "322031433", "brand": "Häagen-Dazs 哈根達斯", "name": "五吋愛戀香草冰淇淋蛋糕｜宅配到家", "price": 1180, "category": "甜點烘焙", "url": "https://giftshop-tw.line.me/products/322031433", "image": "", "active": true}, {"id": "322075178", "brand": "Häagen-Dazs 哈根達斯", "name": "五吋愛戀香草冰淇淋蛋糕＋單球券x2 / 玻璃杯", "price": 1180, "category": "甜點烘焙", "url": "https://giftshop-tw.line.me/products/322075178", "image": "", "active": false}]};
let all=[];let cat='全部';let managedCategories=[];
const FESTIVALS={father_day:{label:'父親節',url:'https://giftshop-tw.line.me/collections/group/SweetForDad'},qixi:{label:'七夕情人節',url:'https://giftshop-tw.line.me/collections/2456770'},teachers_day:{label:'教師節',url:'https://giftshop-tw.line.me/collections/group/teachersdaylife'},mid_autumn:{label:'中秋節',url:'https://giftshop-tw.line.me/collections/group/mid-autumn'},christmas:{label:'聖誕節',url:'https://giftshop-tw.line.me/search?searchValue=%E8%81%96%E8%AA%95%E7%A6%AE%E7%9B%92'},mother_day:{label:'母親節',url:'https://giftshop-tw.line.me/collection-groups/SweetMom'},dragon_boat:{label:'端午節',url:'https://giftshop-tw.line.me/search?searchValue=%E7%AB%AF%E5%8D%88%E7%AF%80'},new_year:{label:'新年',url:'https://giftshop-tw.line.me/search?searchValue=%E6%96%B0%E5%B9%B4%E7%A6%AE%E7%9B%92'}};
const festivalKey=new URLSearchParams(location.search).get('festival')||'';
function festivalTags(p){return (p.festivals||[]).map(k=>`<span class="festag">${esc(FESTIVALS[k]?.label||k)}</span>`).join('')}
function applyFestivalHero(){if(!festivalKey||!FESTIVALS[festivalKey])return;const f=FESTIVALS[festivalKey];document.getElementById('heroTitle').textContent='🎁 '+f.label+' 福利品';document.getElementById('heroText').textContent='已自動篩選 BookWide 後台標記為「'+f.label+'」的上架商品；商品可由 Admin 隨時更換。';}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function youtubeIdV553(url){const m=String(url||'').trim().match(/(?:youtube\.com\/(?:shorts\/|watch\?v=|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/i);return m?m[1]:''}
function productMediaV553(p){if(!p.video)return p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" onerror="this.parentNode.innerHTML=placeholderById('${esc(p.id)}')">`:placeholder(p);const yid=youtubeIdV553(p.video);return yid?`<iframe src="https://www.youtube.com/embed/${esc(yid)}?rel=0" title="${esc(p.name)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy" style="width:100%;height:100%;border:0;background:#000"></iframe>`:`<video src="${esc(p.video)}" ${p.image?`poster="${esc(p.image)}"`:''} controls playsinline preload="metadata"></video>`}
function placeholder(p){const t=(p.brand||'福利品').replace(/LINE官方旗艦館/g,'').trim();return `<div class="ph">${esc(t)}</div>`}
function render(){
  let arr=all.filter(p=>p.active!==false&&p.is_addon_product!==true)
    .filter(p=>!festivalKey||(p.festivals||[]).includes(festivalKey))
    .filter(p=>(cat==='全部'||p.category===cat));
  document.querySelector('#grid').innerHTML=arr.length?arr.map(p=>{
    const media=productMediaV553(p);
    return `<div class="card"><div class="pic">${media}</div><div class="body"><div class="brandname">${esc(p.brand)}</div><div class="festags">${festivalTags(p)}</div><div class="name">${esc(p.name)}</div><div class="price">NT$ ${Number(p.price||0).toLocaleString('zh-TW')}</div><div class="actions2">${(p.stock_tracking_enabled&&p.stock_qty<=0)?`<span class="official" style="display:block!important">暫時缺貨</span>`:`<a class="open" href="/pmktools-product.html?product=${encodeURIComponent(p.dbid||p.id)}">${(p.price<200||p.sale_mode==='redeem_only')?'推薦點兌換':'立即訂購'}</a>`}</div></div></div>`;
  }).join(''):`<div class="empty">找不到符合條件的商品。</div>`;
}
window.placeholderById=id=>placeholder(all.find(x=>String(x.id)===String(id))||{});
function buildChips(){const hiddenCats=new Set(['精選福利']);const productCats=[...new Set(all.filter(p=>p.active!==false&&p.is_addon_product!==true).map(p=>p.category).filter(x=>x&&!hiddenCats.has(x)))];const managed=managedCategories.filter(c=>c.active!==false&&!hiddenCats.has(c.name)).sort((a,b)=>(a.sort||0)-(b.sort||0)).map(c=>c.name);const cats=['全部',...new Set(managed.length?[...managed,...productCats.filter(x=>!managed.includes(x))]:productCats)];if(cat!=='全部'&&!cats.includes(cat))cat='全部';document.querySelector('#chips').innerHTML=cats.map(x=>`<button class="chip ${x===cat?'active':''}" data-cat="${esc(x)}">${esc(x)}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;buildChips();render()})}
const HIKING_API_BASE='https://bookwide-hiking-api.pmktools.workers.dev';
const SUPABASE_URL='https://jeajrwpmrgczimmrflxo.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplYWpyd3BtcmdjemltbXJmbHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3MTg5MzksImV4cCI6MjA3NjI5NDkzOX0.3iFXdHH0JEuk177_R4TGFJmOxYK9V8XctON6rDe7-Do';
let SB=null;
async function loadManagedCategories(){try{const r=await fetch(HIKING_API_BASE+'/api/bw-product-categories',{cache:'no-store'});const j=await r.json().catch(()=>({}));if(r.ok&&j.ok!==false&&Array.isArray(j.categories))managedCategories=j.categories}catch(_e){}}
async function loadFromR2(){
  try{
    const r=await fetch(HIKING_API_BASE+'/api/bw-products',{cache:'no-store'});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||j.ok===false||!Array.isArray(j.products))throw new Error(j.message||j.error||('HTTP '+r.status));
    return j.products.filter(p=>p.is_active!==false).map(p=>({
      id:String(p.external_id||p.id),
      dbid:String(p.id),
      brand:p.brand||'',
      name:p.name||'',
      price:Number(p.price||0),
      category:p.category||'精選福利',
      festivals:Array.isArray(p.festival_keys)?p.festival_keys:[],
      url:p.line_url||'',
      image:p.image_url||'',
      video:p.video_url||'',
      gallery:Array.isArray(p.gallery_urls)?p.gallery_urls:[],
      active:p.is_active!==false,
      is_addon_product:p.is_addon_product===true,
      sale_mode:p.sale_mode||'auto',
      fulfillment_type:p.fulfillment_type||'voucher',
      stock_qty:Number(p.stock_qty||0),
      stock_tracking_enabled:p.stock_tracking_enabled===true,
      product_type:p.product_type||'simple',
      variations:Array.isArray(p.variations)?p.variations:[]
    }));
  }catch(_e){
    return null;
  }
}
async function showAdminIfAllowed(){
  try{
    if(!SB) SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    const {data:{session}}=await SB.auth.getSession();
    if(!session) return;
    const {data,error}=await SB.from('profiles').select('is_admin').eq('id',session.user.id).maybeSingle();
    if(!error && data?.is_admin===true){ const b=document.getElementById('adminGiftBtn'); if(b)b.style.display='inline-block'; }
  }catch(_e){}
}
async function init(){
  applyFestivalHero();
  await loadManagedCategories();const db=await loadFromR2();
  if(db){ all=db; } else {
    try{const r=await fetch('/data/line-gifts.json',{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();all=Array.isArray(d.products)?d.products:[]}catch(e){all=FALLBACK.products}
  }
  buildChips();render();showAdminIfAllowed();
}

(function(){
  const video=document.getElementById('heroGuideVideo');
  const btn=document.getElementById('playEmmaBtn');
  if(!video || !btn) return;
  video.loop=false;
  video.autoplay=false;
  video.muted=false;
  video.volume=1;
  video.playsInline=true;

  btn.addEventListener('click', async ()=>{
    try{
      video.muted=false;
      video.volume=1;
      if(video.ended || (video.duration && video.currentTime >= video.duration-0.2)) video.currentTime=0;
      if(video.paused) await video.play();
      else video.pause();
    }catch(_e){
      btn.textContent='點影片播放';
    }
  });
  video.addEventListener('play',()=>btn.textContent='⏸ Emma');
  video.addEventListener('pause',()=>{if(!video.ended)btn.textContent='🔊 聽 Emma';});
  video.addEventListener('ended',()=>btn.textContent='🔊 再聽');
})();

init();
</script>
