window.placeholderById=id=>placeholder(all.find(x=>String(x.id)===String(id))||{});

function productSku(p){
  const direct=String(p.sku||'').trim();
  if(direct)return direct;
  const vars=Array.isArray(p.variations)?p.variations:[];
  return String(vars.find(v=>String(v?.sku||'').trim())?.sku||'').trim();
}
function activeProducts(){
  return all.filter(p=>p.active!==false&&p.is_addon_product!==true);
}
function categoryNames(){
  const hidden=new Set(['精選福利']);
  const fromProducts=[...new Set(activeProducts().map(p=>p.category).filter(x=>x&&!hidden.has(x)))];
  const managed=managedCategories
    .filter(c=>c.active!==false&&!hidden.has(c.name))
    .sort((a,b)=>(Number(a.sort)||0)-(Number(b.sort)||0))
    .map(c=>c.name);
  return [...new Set([...managed,...fromProducts.filter(x=>!managed.includes(x))])];
}
function representative(catName){
  return activeProducts().find(p=>p.category===catName&&p.image)||activeProducts().find(p=>p.category===catName)||null;
}
function categoryCount(catName){return activeProducts().filter(p=>p.category===catName).length}

function buildCategories(){}

function buildProductDropdown(){
  const mega=document.getElementById('productMega');
  if(!mega)return;

  const cats=categoryNames();
  mega.innerHTML=
    `<button type="button" data-navcat="全部">全部產品</button>`+
    `<button type="button" data-navcat="切削刀具">切削刀具 <span>›</span></button>`+
    cats.filter(x=>x!=='切削刀具').map(x=>`<button type="button" data-navcat="${esc(x)}">${esc(x)}</button>`).join('');

  mega.querySelectorAll('[data-navcat]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    selectCategory(b.dataset.navcat,true);
    document.getElementById('productNavDrop')?.classList.remove('open');
  });

  const btn=document.getElementById('productNavBtn');
  if(btn&&!btn.dataset.bound){
    btn.dataset.bound='1';
    btn.onclick=e=>{
      e.stopPropagation();
      document.getElementById('productNavDrop')?.classList.toggle('open');
    };
  }
  if(!document.body.dataset.pmkDropBound){
    document.body.dataset.pmkDropBound='1';
    document.addEventListener('click',()=>document.getElementById('productNavDrop')?.classList.remove('open'),{passive:true});
  }
}
function buildChips(){}

function buildSubchips(){
  const box=document.getElementById('subchips');
  const side=document.getElementById('productSide');
  const area=document.getElementById('productArea');
  if(!box||!side||!area)return;

  if(cat!=='切削刀具'){
    side.style.display='none';
    area.classList.add('noSide');
    box.innerHTML='';
    return;
  }

  side.style.display='block';
  area.classList.remove('noSide');

  box.innerHTML=PMK_CUTTING_SUBCATEGORIES.map(x=>`
    <button class="subchip ${x===subcat?'active':''}" type="button" data-subchip="${esc(x)}">
      <span>›</span>${esc(x)}
    </button>`).join('');

  box.querySelectorAll('[data-subchip]').forEach(b=>b.onclick=()=>selectSubcategory(b.dataset.subchip,false));
}
function selectSubcategory(name,scroll){
  cat='切削刀具';
  subcat=name||'全部';
  document.getElementById('productHeading').textContent=subcat==='全部'?'切削刀具':subcat;
  document.getElementById('productSub').textContent=subcat==='全部'?'請從左側選擇切削刀具分項。':`顯示「${subcat}」上架商品`;
  buildSubchips();
  render();
  if(scroll)document.getElementById('products').scrollIntoView({behavior:'smooth',block:'start'});
}
function selectCategory(name,scroll){
  cat=name||'全部';
  subcat='全部';
  document.getElementById('productHeading').textContent=cat==='全部'?'產品總覽':cat;
  document.getElementById('productSub').textContent=
    cat==='全部'?'依分類快速瀏覽目前上架商品':
    (cat==='切削刀具'?'請從左側選擇切削刀具分項。':`顯示後台分類「${cat}」的上架商品`);
  buildSubchips();
  render();
  if(scroll)document.getElementById('products').scrollIntoView({behavior:'smooth',block:'start'});
}

function render(){
  let arr=activeProducts().filter(p=>(cat==='全部'||p.category===cat)&&(cat!=='切削刀具'||subcat==='全部'||String(p.subcategory||'')===subcat));
  if(query){
    const q=query.toLowerCase();
    arr=arr.filter(p=>{
      const hay=[p.name,p.brand,p.category,p.sku,productSku(p),...(Array.isArray(p.variations)?p.variations.flatMap(v=>[v?.sku,v?.variation_name]):[])].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  document.getElementById('grid').innerHTML=arr.length?arr.map(p=>{
    const sku=productSku(p);
    const soldout=p.stock_tracking_enabled&&Number(p.stock_qty||0)<=0;
    return `<article class="card">
      <div class="pic">${productMedia(p)}</div>
      <div class="body">
        <div class="category-label">${esc(p.category||'產品')}${p.subcategory?` · ${esc(p.subcategory)}`:''}</div>
        <div class="name">${esc(p.name)}</div>
        ${sku?`<div class="sku">SKU：${esc(sku)}</div>`:''}
        <div class="price">${fmt(p.price)}</div>
        <div>${soldout?`<span class="open" style="background:#9aa4b2">暫時缺貨</span>`:`<a class="open" href="/pmktools-product.html?product=${encodeURIComponent(p.dbid||p.id)}">查看規格 / 訂購</a>`}</div>
      </div>
    </article>`;
  }).join(''):`<div class="empty">找不到符合條件的商品。</div>`;
}

async function loadManagedCategories(){
  try{
    const r=await fetch(HIKING_API_BASE+'/api/bw-product-categories',{cache:'no-store'});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok!==false&&Array.isArray(j.categories))managedCategories=j.categories;
  }catch(_){}
}
async function loadProducts(){
  const r=await fetch(HIKING_API_BASE+'/api/bw-products',{cache:'no-store'});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.ok===false||!Array.isArray(j.products))throw new Error(j.message||j.error||('HTTP '+r.status));
  all=j.products.filter(p=>p.is_active!==false).map(p=>({
    id:String(p.external_id||p.id),dbid:String(p.id),brand:p.brand||'',name:p.name||'',
    sku:p.sku||'',price:Number(p.price||0),category:p.category||'未分類',subcategory:p.subcategory||'',
    image:p.image_url||'',video:p.video_url||'',gallery:Array.isArray(p.gallery_urls)?p.gallery_urls:[],
    active:p.is_active!==false,is_addon_product:p.is_addon_product===true,
    sale_mode:p.sale_mode||'auto',fulfillment_type:p.fulfillment_type||'',
    stock_qty:Number(p.stock_qty||0),stock_tracking_enabled:p.stock_tracking_enabled===true,
    product_type:p.product_type||'simple',variations:Array.isArray(p.variations)?p.variations:[]
  }));
}
async function showAdminIfAllowed(){
  try{
    if(!SB)SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    const {data:{session}}=await SB.auth.getSession();
    if(!session)return;
    const {data,error}=await SB.from('profiles').select('is_admin').eq('id',session.user.id).maybeSingle();
    if(!error&&data?.is_admin===true)document.getElementById('adminGiftBtn').style.display='inline-block';
  }catch(_){}
}
function doSearch(){
  const el=document.getElementById('topSearchInput');
  query=String(el?.value||'').trim();
  render();
  document.getElementById('products').scrollIntoView({behavior:'smooth',block:'start'});
}
document.getElementById('topSearchInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});

(async function init(){
  try{
    await Promise.all([loadManagedCategories(),loadProducts()]);
    buildProductDropdown();buildSubchips();render();showAdminIfAllowed();
  }catch(e){
    document.getElementById('grid').innerHTML=`<div class="empty">商品資料讀取失敗：${esc(e?.message||e)}</div>`;
  }
})();
</script>
