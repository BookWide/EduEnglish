<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMKTOOLS 客戶帳號／價格</title><style>body{margin:0;background:#f5f7fb;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#172033}.top{background:#0f1b31;color:#fff;padding:14px 20px}.top a{color:#fff;text-decoration:none;margin-right:18px;font-weight:850}.wrap{max-width:1200px;margin:auto;padding:20px}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}label{font-size:12px;font-weight:800;color:#64748b}input,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:7px}.w2{grid-column:span 2}.actions{margin-top:12px;display:flex;gap:8px}.btn{border:0;border-radius:8px;padding:10px 13px;background:#2563eb;color:#fff;font-weight:850;cursor:pointer}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}th{background:#f8fafc}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="top"><a href="#" id="backCrm">← 返回客戶 CRM</a><a href="/pmktools.html">前台</a></div><main class="wrap"><section class="panel"><h2>客戶帳號／專屬價格</h2><div class="grid"><div><label>客戶代碼</label><input id="code"></div><div class="w2"><label>公司／客戶名稱</label><input id="name"></div><div><label>價格群組</label><input id="group" value="STANDARD"></div><div><label>統編</label><input id="tax"></div><div><label>聯絡人</label><input id="contact"></div><div><label>電話</label><input id="phone"></div><div><label>Email</label><input id="email"></div><div class="w2"><label>地址</label><input id="address"></div><div><label>付款條件</label><input id="terms" placeholder="例：月結30天"></div><div><label>月結天數</label><input id="days" type="number" value="0"></div></div><div class="actions"><button class="btn" id="save">儲存客戶</button></div></section><section class="panel"><h3>客戶清單</h3><div class="table"><table><thead><tr><th>代碼</th><th>名稱</th><th>價格群組</th><th>付款條件</th><th>帳號數</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="panel" id="detail" hidden><h3 id="detailTitle">客戶設定</h3><div class="grid"><div><label>登入帳號</label><input id="account"></div><div><label>Email</label><input id="uemail"></div><div><label>密碼</label><input id="password" type="password"></div><div><label>角色</label><select id="role"><option value="customer">customer</option><option value="admin">admin</option></select></div><div><label>商品 ID</label><input id="product"></div><div><label>規格 ID / SKU（可空白）</label><input id="variation"></div><div><label>專屬價格</label><input id="price" type="number"></div></div><div class="actions"><button class="btn" id="saveUser">新增登入帳號</button><button class="btn" id="savePrice">新增專屬價格</button></div><div id="detailText" style="white-space:pre-wrap;margin-top:12px;color:#475569"></div></section></main><script>const API='https://pmktools-api.pmktools.workers.dev',KEY='pmk_session_v1';let current='';function token(){return localStorage.getItem(KEY)||''}function h(json=false){return json?{'Content-Type':'application/json','Authorization':'Bearer '+token()}:{'Authorization':'Bearer '+token()}}async function api(path,opt={}){opt.headers={...(opt.headers||{}),...h(!!opt.body)};const r=await fetch(API+path,opt),j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.message||j.error||'HTTP '+r.status);return j}async function load(){try{const j=await api('/api/pmk-admin/customers');document.getElementById('rows').innerHTML=(j.rows||[]).map(c=>`<tr><td>${c.customer_code}</td><td>${c.name}</td><td>${c.price_group_code||'STANDARD'}</td><td>${c.payment_terms||'—'}</td><td>${c.user_count}</td><td><button onclick="openC('${c.id}')">設定</button></td></tr>`).join('')}catch(e){if(String(e).includes('AUTH'))location.href='/pmktools-login.html';else alert(e.message)}}async function openC(id){current=id;const j=await api('/api/pmk-admin/customer?id='+encodeURIComponent(id));const c=j.customer;['code','name','group','tax','contact','phone','email','address','terms','days'].forEach(()=>{});document.getElementById('code').value=c.customer_code||'';document.getElementById('name').value=c.name||'';document.getElementById('group').value=c.price_group_code||'STANDARD';document.getElementById('tax').value=c.tax_id||'';document.getElementById('contact').value=c.contact||'';document.getElementById('phone').value=c.phone||'';document.getElementById('email').value=c.email||'';document.getElementById('address').value=c.address||'';document.getElementById('terms').value=c.payment_terms||'';document.getElementById('days').value=c.monthly_days||0;document.getElementById('detail').hidden=false;document.getElementById('detailTitle').textContent=c.customer_code+' '+c.name;document.getElementById('detailText').textContent='登入帳號：\n'+(j.users||[]).map(x=>'• '+x.account+' ('+x.role+')').join('\n')+'\n\n專屬價格：\n'+(j.prices||[]).map(x=>'• '+x.product_key+(x.variation_key?' / '+x.variation_key:'')+' = NT$ '+x.price).join('\n')}document.getElementById('save').onclick=async()=>{const b={id:current||undefined,customer_code:code.value,name:name.value,price_group_code:group.value,tax_id:tax.value,contact:contact.value,phone:phone.value,email:email.value,address:address.value,payment_terms:terms.value,monthly_days:Number(days.value||0)};const j=await api('/api/pmk-admin/customer-save',{method:'POST',body:JSON.stringify(b)});current=j.id;await load();await openC(current)};document.getElementById('saveUser').onclick=async()=>{if(!current)return alert('請先儲存客戶');await api('/api/pmk-admin/user-save',{method:'POST',body:JSON.stringify({account:account.value,email:uemail.value,password:password.value,role:role.value,customer_id:current})});password.value='';await openC(current)};document.getElementById('savePrice').onclick=async()=>{if(!current)return alert('請先儲存客戶');await api('/api/pmk-admin/price-save',{method:'POST',body:JSON.stringify({customer_id:current,product_key:product.value,variation_key:variation.value,price:Number(price.value)})});await openC(current)};document.getElementById('backCrm').onclick=e=>{e.preventDefault();history.length>1?history.back():location.href='/pmktools-product-admin.html'};const initialId=new URL(location.href).searchParams.get('id');load().then(()=>{if(initialId)openC(initialId)});</script></body></html>
