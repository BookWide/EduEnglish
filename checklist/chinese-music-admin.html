<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BookWide｜中文歌清單管理</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--border:#e5e7eb;--muted:#6b7280;--blue:#2563eb;--red:#dc2626;--green:#16a34a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#111827}.wrap{max-width:1180px;margin:24px auto;padding:0 16px 50px}.head{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}.head h1{font-size:24px;margin:0}.back{color:#2563eb;text-decoration:none;font-weight:700}.card{background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(15,23,42,.08);padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:2fr 1.4fr 1fr 110px 110px;gap:10px;align-items:end}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input{width:100%;height:40px;border:1px solid var(--border);border-radius:10px;padding:0 10px;font-size:14px}.btn{height:40px;border:0;border-radius:999px;padding:0 18px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:#2563eb;border:1px solid #2563eb}.btn.danger{background:#fff;color:var(--red);border:1px solid #fecaca}.status{font-size:13px;color:var(--muted);margin-top:10px}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.pill{background:#eff6ff;border:1px solid #bfdbfe;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:700;color:#1d4ed8}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}th{font-size:12px;color:var(--muted)}td input[type=text],td input[type=number]{width:100%;height:34px;border:1px solid var(--border);border-radius:8px;padding:0 8px}.row-actions{display:flex;gap:6px}.mini{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:6px 9px;cursor:pointer}.mini.save{color:#166534;border-color:#bbf7d0}.mini.del{color:#b91c1c;border-color:#fecaca}.hint{font-size:13px;color:#4b5563;line-height:1.6}.error{color:#b91c1c;font-weight:700}.ok{color:#166534;font-weight:700}@media(max-width:820px){.grid{grid-template-columns:1fr 1fr}.grid .wide{grid-column:1/-1}.head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div><h1>中文歌清單管理</h1><div class="hint">Admin #19｜前台：音樂 → 其他（中文） → PLAYER</div></div><a class="back" href="/admin.html">← 回 Admin</a></div>
  <div class="card">
    <div class="grid">
      <div class="field wide"><label>YouTube 網址或影片 ID</label><input id="yt" placeholder="https://www.youtube.com/watch?v=FeHcF2H1pnA"></div>
      <div class="field"><label>歌名</label><input id="title" placeholder="歌名"></div>
      <div class="field"><label>歌手</label><input id="artist" placeholder="歌手"></div>
      <div class="field"><label>排序</label><input id="sort" type="number" min="1" value="1"></div>
      <button class="btn" id="addBtn">＋ 加入</button>
    </div>
    <div id="msg" class="status">最多上架 100 首；取消上架的歌曲不計入前台課綱。</div>
  </div>
  <div class="card">
    <div class="summary"><span class="pill" id="countAll">總數 0</span><span class="pill" id="countActive">上架 0 / 100</span></div>
    <div class="tablewrap"><table><thead><tr><th style="width:70px">排序</th><th style="width:150px">YouTube ID</th><th>歌名</th><th>歌手</th><th style="width:80px">上架</th><th style="width:150px">操作</th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</div>
<script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://jeajrwpmrgczimmrflxo.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplYWpyd3BtcmdjemltbXJmbHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3MTg5MzksImV4cCI6MjA3NjI5NDkzOX0.3iFXdHH0JEuk177_R4TGFJmOxYK9V8XctON6rDe7-Do';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
const $=id=>document.getElementById(id); let current=[];
function videoId(v){v=String(v||'').trim(); if(/^[A-Za-z0-9_-]{11}$/.test(v)) return v; try{const u=new URL(v); if(u.hostname.includes('youtu.be')) return u.pathname.split('/').filter(Boolean)[0]||''; return u.searchParams.get('v')||u.pathname.split('/shorts/')[1]?.split(/[/?#]/)[0]||'';}catch(e){return ''}}
function setMsg(t,ok=false){$('msg').className='status '+(ok?'ok':'error');$('msg').textContent=t}
async function requireAdmin(){const {data:{session}}=await db.auth.getSession();if(!session?.user){location.replace('/index.html?denied=signin');return false}const {data:p,error}=await db.from('profiles').select('is_admin,is_paused').eq('id',session.user.id).maybeSingle();if(error||!p||p.is_paused||!p.is_admin){location.replace('/index.html?denied=admin');return false}return true}
async function load(){const {data,error}=await db.from('zh_music_playlist').select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:true});if(error){setMsg('讀取失敗：'+error.message+'。若尚未建表，請先執行同 ZIP 的 zh-music-setup.sql。');return}current=data||[];render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const tb=$('rows');tb.innerHTML=current.map(r=>`<tr data-id="${r.id}"><td><input type="number" min="1" value="${Number(r.sort_order)||1}" data-k="sort_order"></td><td><code>${esc(r.video_id)}</code></td><td><input type="text" value="${esc(r.title||'')}" data-k="title"></td><td><input type="text" value="${esc(r.artist||'')}" data-k="artist"></td><td><input type="checkbox" data-k="is_active" ${r.is_active?'checked':''}></td><td><div class="row-actions"><button class="mini save">儲存</button><button class="mini del">刪除</button></div></td></tr>`).join('');$('countAll').textContent='總數 '+current.length;$('countActive').textContent='上架 '+current.filter(x=>x.is_active).length+' / 100'}
$('addBtn').onclick=async()=>{if(!(await requireAdmin()))return;const id=videoId($('yt').value);if(!id){setMsg('YouTube 網址／ID 不正確');return}if(current.filter(x=>x.is_active).length>=100){setMsg('目前已上架 100 首，請先下架一首。');return}const payload={video_id:id,title:$('title').value.trim(),artist:$('artist').value.trim(),sort_order:Number($('sort').value)||1,is_active:true};const {error}=await db.from('zh_music_playlist').insert(payload);if(error){setMsg('新增失敗：'+error.message);return}$('yt').value='';$('title').value='';$('artist').value='';setMsg('已加入中文歌清單',true);await load()};
$('rows').onclick=async e=>{const tr=e.target.closest('tr');if(!tr)return;const id=tr.dataset.id;if(e.target.classList.contains('save')){if(!(await requireAdmin()))return;const obj={};tr.querySelectorAll('[data-k]').forEach(el=>obj[el.dataset.k]=el.type==='checkbox'?el.checked:(el.dataset.k==='sort_order'?Number(el.value)||1:el.value.trim()));if(obj.is_active && current.filter(x=>x.is_active&&String(x.id)!==String(id)).length>=100){setMsg('最多只能上架 100 首。');return}const {error}=await db.from('zh_music_playlist').update(obj).eq('id',id);if(error){setMsg('儲存失敗：'+error.message);return}setMsg('已儲存',true);await load()}if(e.target.classList.contains('del')){if(!confirm('確定刪除這首？'))return;if(!(await requireAdmin()))return;const {error}=await db.from('zh_music_playlist').delete().eq('id',id);if(error){setMsg('刪除失敗：'+error.message);return}setMsg('已刪除',true);await load()}};
(async()=>{if(await requireAdmin()) await load()})();
</script>
</body></html>
