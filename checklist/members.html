<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BookWide 新會員追蹤</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e5e7eb;--brand:#2563eb;--ok:#15803d;--warn:#c2410c;--bad:#b91c1c;--lg:#06c755}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:24px}
.sub{color:var(--muted);font-size:14px;margin:4px 0 16px}
a.back{color:var(--brand);text-decoration:none;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 6px 18px rgba(15,23,42,.06);cursor:pointer;border:2px solid transparent}
.stat.on{border-color:var(--brand)}
.stat .n{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
#q{flex:1;min-width:200px}
button{font:inherit;padding:8px 14px;border:0;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer;white-space:nowrap}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.line{background:var(--lg)}
button:disabled{opacity:.5;cursor:default}
.list{display:grid;gap:10px}
.m{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:start}
.av{width:52px;height:52px;border-radius:50%;background:#e2e8f0;object-fit:cover;display:grid;place-items:center;font-weight:900;color:#475569}
.name{font-weight:800;font-size:16px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:#f1f5f9;color:#334155}
.tag.line{background:#dcfce7;color:#166534}.tag.google{background:#e0e7ff;color:#3730a3}.tag.email{background:#f1f5f9}
.tag.active{background:#dcfce7;color:var(--ok);font-weight:800}.tag.expired{background:#ffedd5;color:var(--warn);font-weight:800}.tag.none{background:#fee2e2;color:var(--bad);font-weight:800}
.info{font-size:13px;color:var(--muted);line-height:1.7}
.info b{color:var(--ink);font-weight:600}
.act{display:flex;flex-direction:column;gap:6px;min-width:150px}
.notes{grid-column:2/4;display:none;gap:6px}
.m.open .notes{display:grid}
.notes textarea{min-height:70px;width:100%}
.msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:9}
.empty{padding:30px;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:16px;padding:18px;width:min(460px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog textarea{width:100%;min-height:120px}
.tpl{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tpl button{font-size:12px;padding:5px 10px}
@media(max-width:700px){.m{grid-template-columns:44px 1fr}.av{width:44px;height:44px}.act{grid-column:1/3;flex-direction:row;flex-wrap:wrap;min-width:0}.notes{grid-column:1/3}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>新會員追蹤</h1><div class="sub">誰加入了、有沒有訂閱、誰推薦的 —— 再用 LINE 跟進。</div></div>
    <a class="back" href="/checklist/admin.html">← 回後台</a>
  </div>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input id="q" placeholder="搜尋名稱 / Email / 推薦碼 / 備註">
    <select id="days"><option value="0" selected>全部會員（含舊會員）</option><option value="1">今天加入</option><option value="7">7 天內加入</option><option value="30">30 天內加入</option></select>
    <button class="ghost" id="reload">重新整理</button>
  </div>
  <div class="list" id="list"><div class="empty">載入中…</div></div>
</div>
<dialog id="dlg">
  <h3 style="margin:0 0 6px">LINE 傳訊息給 <span id="dlgName"></span></h3>
  <div class="tpl" id="tpls"></div>
  <textarea id="dlgText"></textarea>
  <div style="font-size:12px;color:#64748b;margin:6px 0">由 BookWide English 官方帳號送出，會算進每月推播額度。送出後會自動記到備註。</div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="ghost" id="dlgCancel">取消</button><button class="line" id="dlgSend">送出</button></div>
</dialog>
<div class="msg" id="toast"></div>
<script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
<script>
const API='https://bookwide-hiking-api.pmktools.workers.dev';
const SUPABASE_URL=API+'/sb';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplYWpyd3BtcmdjemltbXJmbHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3MTg5MzksImV4cCI6MjA3NjI5NDkzOX0.3iFXdHH0JEuk177_R4TGFJmOxYK9V8XctON6rDe7-Do';
const supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ALL=[],NOW=new Date().toISOString(),FILTER='all',CUR=null;
const VIA={line:['LINE','line'],google:['Google','google'],email:['Email','email']};
const SUB={active:['已訂閱','active'],expired:['已過期','expired'],none:['未訂閱','none']};
const CRM={new:'新加入',contacted:'已聯絡',trial:'試用中',subscribed:'已成交',lost:'不考慮'};
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600)}
function tw(iso){if(!iso)return '—';const d=new Date(iso);if(isNaN(d))return '—';return d.toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}
function ago(iso){if(!iso)return '';const m=(Date.now()-new Date(iso))/6e4;if(m<60)return Math.max(1,Math.round(m))+' 分鐘前';if(m<1440)return Math.round(m/60)+' 小時前';return Math.round(m/1440)+' 天前'}
async function token(){const {data:{session}}=await supa.auth.getSession();return session?.access_token||''}
async function api(path,opt={}){const t=await token();if(!t){location.href='/login.html?next='+encodeURIComponent(location.pathname);throw new Error('請先登入')}
  const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+t,...(opt.headers||{})},cache:'no-store'});
  const j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw new Error(j.msg||j.message||j.error||('HTTP '+r.status));return j}
async function load(){
  $('list').innerHTML='<div class="empty">載入中…</div>';
  try{const j=await api('/api/bw-admin/members?limit=1000');ALL=(j.members||[]).filter(m=>!m.is_admin);NOW=j.now||NOW;render()}
  catch(e){$('list').innerHTML=`<div class="empty">讀取失敗：${esc(e.message)}<br>請用管理員帳號登入 BookWide。</div>`}
}
function inDays(m){const d=Number($('days').value||0);if(!d)return true;return (Date.now()-new Date(m.joined_at))<=d*864e5}
function render(){
  const base=ALL.filter(inDays);
  const cnt={all:base.length,none:base.filter(m=>m.sub_status==='none').length,active:base.filter(m=>m.sub_status==='active').length,expired:base.filter(m=>m.sub_status==='expired').length,ref:base.filter(m=>m.referred_by).length};
  const S=[['all','加入人數'],['none','未訂閱（要跟進）'],['active','已訂閱'],['expired','已過期'],['ref','有推薦人']];
  $('stats').innerHTML=S.map(([k,l])=>`<div class="stat ${FILTER===k?'on':''}" data-f="${k}"><div class="n">${cnt[k]}</div><div class="l">${l}</div></div>`).join('');
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{FILTER=b.dataset.f;render()});
  const q=$('q').value.trim().toLowerCase();
  let arr=base.filter(m=>FILTER==='all'||(FILTER==='ref'?!!m.referred_by:m.sub_status===FILTER));
  if(q)arr=arr.filter(m=>[m.name,m.email,m.referred_by,m.referrer_name,m.crm_notes].join(' ').toLowerCase().includes(q));
  if(!arr.length){$('list').innerHTML='<div class="empty">沒有符合的會員。可以把上方改成「全部會員」看看。</div>';return}
  $('list').innerHTML=arr.map(m=>{
    const v=VIA[m.via]||[m.via,'email'],s=SUB[m.sub_status]||SUB.none;
    const avatar=m.avatar?`<img class="av" src="${esc(m.avatar)}" alt="">`:`<div class="av">${esc((m.name||m.email||'?').slice(0,1))}</div>`;
    return `<div class="m" data-id="${esc(m.id)}">
      ${avatar}
      <div>
        <div class="name">${esc(m.name||'（未命名）')}</div>
        <div class="tags"><span class="tag ${v[1]}">${esc(v[0])} 加入</span><span class="tag ${s[1]}">${s[0]}${m.sub_status==='active'?'・到 '+esc(tw(m.expires_at).split(' ')[0]):''}</span>${m.line?'':'<span class="tag">未綁 LINE</span>'}<span class="tag">${esc(CRM[m.crm_status]||m.crm_status)}</span></div>
        <div class="info">
          加入：<b>${esc(tw(m.joined_at))}</b>（${esc(ago(m.joined_at))}）　最後使用：<b>${esc(m.last_seen?ago(m.last_seen):'—')}</b><br>
          Email：<b>${esc(m.email||'未填')}</b>　推薦人：<b>${m.referred_by?esc((m.referrer_name||'')+'（'+m.referred_by+'）'):'—'}</b>${m.paid_count?`　付款：<b>${m.paid_count} 次</b>`:''}
          ${m.crm_notes?`<br>備註：${esc(m.crm_notes.split('\n').filter(Boolean).slice(-1)[0]||'').slice(0,80)}`:''}
        </div>
      </div>
      <div class="act">
        <button class="line" data-act="line" ${m.line?'':'disabled title="這位會員沒有綁定 LINE"'}>LINE 傳訊息</button>
        <select data-act="crm">${Object.entries(CRM).map(([k,l])=>`<option value="${k}" ${m.crm_status===k?'selected':''}>${l}</option>`).join('')}</select>
        <button class="ghost" data-act="note">備註</button>
      </div>
      <div class="notes"><textarea data-act="notetext">${esc(m.crm_notes)}</textarea><div style="text-align:right"><button data-act="savenote">儲存備註</button></div></div>
    </div>`}).join('');
}
$('list').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const card=b.closest('.m'),id=card.dataset.id,m=ALL.find(x=>x.id===id);if(!m)return;
  if(b.dataset.act==='note')card.classList.toggle('open');
  if(b.dataset.act==='savenote'){b.disabled=true;try{const t=card.querySelector('textarea').value;await api('/api/bw-admin/members',{method:'POST',body:JSON.stringify({user_id:id,crm_notes:t})});m.crm_notes=t;toast('備註已儲存');render()}catch(err){toast('失敗：'+err.message)}finally{b.disabled=false}}
  if(b.dataset.act==='line')openDlg(m);
});
$('list').addEventListener('change',async e=>{
  const s=e.target.closest('[data-act="crm"]');if(!s)return;const id=s.closest('.m').dataset.id,m=ALL.find(x=>x.id===id);
  try{await api('/api/bw-admin/members',{method:'POST',body:JSON.stringify({user_id:id,crm_member_status:s.value})});m.crm_status=s.value;toast('狀態已更新')}catch(err){toast('失敗：'+err.message)}
});
const TPL=[
  ['歡迎',n=>`${n}您好！歡迎加入 BookWide 😊\n可以從首頁的故事、音樂、電影開始，每天 10 分鐘就有感。\n有任何問題直接在這裡回覆我就好！`],
  ['介紹訂閱',n=>`${n}您好！這幾天用 BookWide 還順手嗎？\n訂閱後可以看完整課程、每日英文與測驗 👉 https://bookwide.net/pricing.html\n有想學的主題也歡迎告訴我～`],
  ['到期提醒',n=>`${n}您好！您的 BookWide 訂閱快到期囉，\n續訂 👉 https://bookwide.net/pricing.html\n謝謝您一直以來的支持！`]];
function openDlg(m){CUR=m;$('dlgName').textContent=m.name||m.email||'會員';const n=m.name||'';$('tpls').innerHTML=TPL.map((t,i)=>`<button class="ghost" data-tpl="${i}">${t[0]}</button>`).join('');
  $('dlgText').value=TPL[m.sub_status==='expired'?2:(m.sub_status==='none'&&(Date.now()-new Date(m.joined_at))>2*864e5?1:0)][1](n);$('dlg').showModal()}
$('tpls').addEventListener('click',e=>{const b=e.target.closest('[data-tpl]');if(b&&CUR)$('dlgText').value=TPL[+b.dataset.tpl][1](CUR.name||'')});
$('dlgCancel').onclick=()=>$('dlg').close();
$('dlgSend').onclick=async()=>{const t=$('dlgText').value.trim();if(!t||!CUR)return;const b=$('dlgSend');b.disabled=true;
  try{await api('/api/bw-admin/line-push',{method:'POST',body:JSON.stringify({user_id:CUR.id,text:t})});if(CUR.crm_status==='new'){await api('/api/bw-admin/members',{method:'POST',body:JSON.stringify({user_id:CUR.id,crm_member_status:'contacted'})}).catch(()=>{});CUR.crm_status='contacted'}$('dlg').close();toast('已用 LINE 送出');load()}
  catch(err){toast('送出失敗：'+err.message)}finally{b.disabled=false}};
$('q').oninput=render;$('days').onchange=render;$('reload').onclick=load;
load();
</script>
</body>
</html>
