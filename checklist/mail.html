<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BookWide Email 紀錄</title>
<style>
:root{--bg:#f4f6fb;--ink:#0f172a;--muted:#64748b;--line:#e5e7eb;--brand:#2563eb;--ok:#15803d;--bad:#b91c1c;--warn:#c2410c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
.wrap{max-width:1150px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:24px}.sub{color:var(--muted);font-size:14px;margin:4px 0 14px}
a.back{color:var(--brand);text-decoration:none;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font:inherit}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input,select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
#q{flex:1;min-width:200px}
button{font:inherit;padding:8px 14px;border:0;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.card{background:#fff;border-radius:14px;box-shadow:0 6px 18px rgba(15,23,42,.06);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:#f8fafc}
tr.click{cursor:pointer}tr.click:hover td{background:#f8fafc}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;font-weight:700;white-space:nowrap}
.ok{background:#dcfce7;color:var(--ok)}.bad{background:#fee2e2;color:var(--bad)}.wait{background:#ffedd5;color:var(--warn)}.k{background:#eef2ff;color:#3730a3}
.muted{color:var(--muted);font-size:12px}
.empty{padding:28px;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:16px;padding:0;width:min(760px,96vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dh{padding:14px 18px;border-bottom:1px solid var(--line)}
.dh b{font-size:16px}
.dh div{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.6}
iframe{width:100%;height:60vh;border:0;background:#fff}
.df{padding:10px 18px;text-align:right;border-top:1px solid var(--line)}
@media(max-width:700px){.hide-m{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>Email 紀錄</h1><div class="sub">網站寄出的每一封信：寄給誰、主旨、成功或失敗，點一下可以看信件內容。</div></div><a class="back" href="/admin.html">← 回後台</a></div>
  <div class="tabs"><button class="tab on" data-tab="logs">所有寄出的信</button><button class="tab" data-tab="orders">付款確認信（依訂單）</button></div>
  <div class="bar">
    <input id="q" placeholder="搜尋收件人 / 主旨 / 訂單號">
    <select id="kind"><option value="">全部類型</option><option value="payment">付款／訂閱</option><option value="verify">註冊驗證</option><option value="recovery">重設密碼</option><option value="email_change">補填 Email</option><option value="gift">福利品</option><option value="other">其他</option></select>
    <select id="st"><option value="">全部結果</option><option value="ok">成功</option><option value="bad">失敗</option></select>
    <button class="ghost" id="reload">重新整理</button>
  </div>
  <div class="card" id="box"><div class="empty">載入中…</div></div>
  <p class="muted">說明：從這一版開始，所有信件都會自動記錄（含內容）。更早以前寄出的信沒有保存內容，只能在「付款確認信」分頁看到有沒有寄出。</p>
</div>
<dialog id="dlg"><div class="dh"><b id="dSub"></b><div id="dMeta"></div></div><iframe id="dFrame" sandbox></iframe><div class="df"><button class="ghost" onclick="document.getElementById('dlg').close()">關閉</button></div></dialog>
<script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://bookwide-hiking-api.pmktools.workers.dev/sb';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplYWpyd3BtcmdjemltbXJmbHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3MTg5MzksImV4cCI6MjA3NjI5NDkzOX0.3iFXdHH0JEuk177_R4TGFJmOxYK9V8XctON6rDe7-Do';
const supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KIND={payment:'付款／訂閱',verify:'註冊驗證',recovery:'重設密碼',email_change:'補填 Email',gift:'福利品',other:'其他'};
const tw=iso=>{if(!iso)return '—';const d=new Date(String(iso).replace(' ','T')+(/Z|[+-]\d\d:?\d\d$/.test(iso)?'':'Z'));return isNaN(d)?String(iso):d.toLocaleString('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})};
let TAB='logs',LOGS=[],ORDERS=[];
async function requireAdmin(){
  const {data:{session}}=await supa.auth.getSession();
  if(!session?.user){location.href='/login.html?next='+encodeURIComponent(location.pathname);return false}
  const {data}=await supa.from('profiles').select('is_admin').eq('id',session.user.id).maybeSingle();
  if(!data?.is_admin){$('box').innerHTML='<div class="empty">只有管理員可以查看。</div>';return false}
  return true;
}
async function load(){
  $('box').innerHTML='<div class="empty">載入中…</div>';
  try{
    if(TAB==='logs'){
      const r=await supa.from('email_logs').select('id,kind,merchant_trade_no,to_email,subject,ok,status,error,created_at').order('created_at',{ascending:false}).limit(300);
      if(r.error)throw r.error;LOGS=r.data||[];
    }else{
      const r=await supa.from('orders').select('id,merchant_trade_no,email_to,period,total,paid_at,status,email_sent_at,email_last_error,created_at').not('paid_at','is',null).order('paid_at',{ascending:false}).limit(200);
      if(r.error)throw r.error;ORDERS=r.data||[];
    }
    render();
  }catch(e){$('box').innerHTML=`<div class="empty">讀取失敗：${esc(e.message||e)}</div>`}
}
function render(){
  const q=$('q').value.trim().toLowerCase(),k=$('kind').value,s=$('st').value;
  $('kind').style.display=TAB==='logs'?'':'none';
  if(TAB==='logs'){
    let a=LOGS.filter(x=>(!k||x.kind===k)&&(!s||(s==='ok'?x.ok:!x.ok))&&(!q||[x.to_email,x.subject,x.merchant_trade_no].join(' ').toLowerCase().includes(q)));
    if(!a.length){$('box').innerHTML='<div class="empty">還沒有紀錄。部署這一版之後寄出的信才會出現在這裡。</div>';return}
    $('box').innerHTML=`<table><thead><tr><th>時間</th><th>類型</th><th>收件人</th><th>主旨</th><th>結果</th></tr></thead><tbody>${a.map(x=>`<tr class="click" data-id="${x.id}"><td>${esc(tw(x.created_at))}</td><td><span class="pill k">${esc(KIND[x.kind]||x.kind)}</span></td><td>${esc(x.to_email)}</td><td>${esc(x.subject)}${x.merchant_trade_no?`<div class="muted">${esc(x.merchant_trade_no)}</div>`:''}</td><td>${x.ok?'<span class="pill ok">成功</span>':`<span class="pill bad">失敗</span><div class="muted">${esc((x.error||'').slice(0,80))}</div>`}</td></tr>`).join('')}</tbody></table>`;
  }else{
    let a=ORDERS.filter(x=>(!s||(s==='ok'?!!x.email_sent_at:!x.email_sent_at))&&(!q||[x.email_to,x.merchant_trade_no].join(' ').toLowerCase().includes(q)));
    if(!a.length){$('box').innerHTML='<div class="empty">沒有符合的訂單。</div>';return}
    $('box').innerHTML=`<table><thead><tr><th>付款時間</th><th>訂單號</th><th>收件人</th><th class="hide-m">方案／金額</th><th>確認信</th></tr></thead><tbody>${a.map(x=>{
      const st=x.email_sent_at?`<span class="pill ok">已寄出</span><div class="muted">${esc(tw(x.email_sent_at))}</div>`:(x.email_last_error?`<span class="pill bad">寄送失敗</span><div class="muted">${esc(String(x.email_last_error).slice(0,80))}</div>`:(x.email_to?'<span class="pill wait">未寄出</span>':'<span class="pill wait">沒有收件 Email</span>'));
      const log=LOGS.find(l=>l.merchant_trade_no&&l.merchant_trade_no===x.merchant_trade_no);
      return `<tr ${log?`class="click" data-id="${log.id}"`:''}><td>${esc(tw(x.paid_at))}</td><td>${esc(x.merchant_trade_no||x.id)}</td><td>${esc(x.email_to||'—')}</td><td class="hide-m">${esc(x.period||'')} ${x.total!=null?'NT$ '+esc(x.total):''}</td><td>${st}${log?'<div class="muted">點一下看內容</div>':''}</td></tr>`}).join('')}</tbody></table>`;
  }
}
$('box').addEventListener('click',async e=>{
  const tr=e.target.closest('tr[data-id]');if(!tr)return;const id=+tr.dataset.id;const x=LOGS.find(l=>l.id===id);
  $('dSub').textContent=x?.subject||'（無主旨）';$('dMeta').innerHTML=`收件人：${esc(x?.to_email)}<br>時間：${esc(tw(x?.created_at))}　結果：${x?.ok?'成功':'失敗 '+esc(x?.error||'')}`;
  $('dFrame').srcdoc='<p style="font-family:sans-serif;color:#64748b">載入中…</p>';$('dlg').showModal();
  const r=await supa.from('email_logs').select('payload').eq('id',id).maybeSingle();
  let p={};try{p=JSON.parse(r.data?.payload||'{}')}catch(_){}
  const bcc=[].concat(p.bcc||[]).join(', ');if(bcc)$('dMeta').innerHTML+=`<br>BCC：${esc(bcc)}`;
  $('dFrame').srcdoc=p.html?String(p.html):'<p style="font-family:sans-serif;color:#64748b">這封信沒有保存內容。</p>';
});
document.querySelectorAll('.tab').forEach(b=>b.onclick=async()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));TAB=b.dataset.tab;if(TAB==='orders'&&!LOGS.length){TAB='logs';await load();TAB='orders'}load()});
$('q').oninput=render;$('kind').onchange=render;$('st').onchange=render;$('reload').onclick=load;
requireAdmin().then(ok=>ok&&load());
</script>
</body>
</html>
