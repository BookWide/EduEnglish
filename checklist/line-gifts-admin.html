<header class="top"><b>← 福利品</b><span>V55.1 WooCommerce Product Admin</span><a href="/admin.html">返回 Admin</a></header><main class="wrap">

<div class="editgrid"><div class="maincol"><section class="box"><div class="boxhead">編輯產品 <span id="editState" class="status"></span></div><div style="padding:16px"><input id="name" class="titleinput" placeholder="商品名稱"><textarea id="description" class="desc" placeholder="商品說明"></textarea></div></section>
<section class="product-data"><div class="pdtop">商品資料 — <select id="product_type"><option value="simple">簡單商品</option><option value="external">外部/加盟商品</option><option value="variable">可變商品</option></select></div><div class="pdbody"><nav class="tabs"><button class="tab active" data-pane="general">🔧 一般</button><button class="tab" data-pane="inventory">▣ 庫存</button><button class="tab" data-pane="shipping">🚚 運送方式</button><button class="tab" data-pane="linked">🔗 連結商品</button><button class="tab" data-pane="attributes">▤ 屬性</button><button class="tab variable-only" data-pane="variations">▦ 變化類型</button><button class="tab" data-pane="advanced">⚙ 進階</button></nav><div>

<div class="pane" id="pane-linked"><div class="row"><label>來源商品 ID</label><input id="external_id"></div><div class="row"><label>商品來源</label><select id="source_type"><option value="manual">手動上架</option><option value="partner">外部/加盟</option><option value="line">LINE 禮物</option></select></div><div class="row"><label>供應商</label><input id="supplier"></div><div class="row"><label>來源網址</label><input id="line_url"></div></div>
<div class="pane" id="pane-attributes"><button class="btn" id="addAttr">＋ 新增屬性</button><div id="attrList" style="margin-top:12px"></div></div>
<div class="pane" id="pane-variations"><div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn" id="generateVars">產生款式</button><button class="btn" id="addVar">手動新增</button></div><div id="variationList"></div></div>
<div class="pane" id="pane-advanced"><div class="row"><label>品牌</label><input id="brand"></div><div class="row"><label>分類</label><select id="category"></select></div><div class="row"><label>排序</label><input id="sort_order" type="number" value="100"></div><div class="row"><label>狀態</label><select id="is_active"><option value="true">上架</option><option value="false">下架</option></select></div><div class="row"><label>進貨成本 NT$</label><input id="cost_price" type="number"></div></div>
</div></div></section></div>
<aside class="sidecol"><section class="sidebox"><h3>發佈</h3><div class="sidebody"><button class="btn primary" id="saveBtn">更新商品</button> <button class="btn" id="toggleBtn">下架</button> <button class="btn red" id="deleteBtn">刪除</button><div id="status" class="status" style="margin-top:10px">—</div></div></section>
<section class="sidebox"><h3>商品主圖</h3><div class="sidebody"><img id="mainPreview" class="mainimage" alt="商品主圖"><input id="mainFile" type="file" accept="image/*" style="margin-top:10px;width:100%"><button class="btn" id="uploadMain" style="margin-top:8px">上傳/更換主圖</button><button class="btn red" id="removeMain" style="margin-top:8px">移除主圖</button></div></section>
<section class="sidebox"><h3>商品圖庫</h3><div class="sidebody"><input id="galleryFile" type="file" accept="image/*" multiple><button class="btn" id="uploadGallery" style="margin-top:8px">新增商品圖庫圖片</button><div id="gallery" class="gallery"></div></div></section></aside></div></div></main>
<script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script><script>
const API='https://bookwide-hiking-api.pmtools.workers.dev';const SUPABASE_URL='https://jeajrwpmrgczimmrflxo.supabase.co';const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplYWpyd3BtcmdjemltbXJmbHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3MTg5MzksImV4cCI6MjA3NjI5NDkzOX0.3iFXdHH0JEuk177_R4TGFJmOxYK9V8XctON6rDe7-Do';const SB=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);let token='',products=[],editing=null,attributes=[],variations=[],gallery=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function st(s){$('status').textContent=s}

function v551CompatProduct(p){
  p=p||{};
  return {
    ...p,
    product_type:p.product_type||((Array.isArray(p.variations)&&p.variations.length)?'variable':'simple'),
    gallery_urls:Array.isArray(p.gallery_urls)?p.gallery_urls:[],

    variations:Array.isArray(p.variations)?p.variations:[]
  };
}

async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw Error(j.message||j.error||('HTTP '+r.status));return j}
function priceOf(p){if(p.product_type==='variable'&&p.variations?.length){const a=p.variations.map(v=>Number(v.sale_price??v.regular_price??0)).filter(x=>x>=0);return a.length?Math.min(...a):0}return Number(p.sale_price??p.regular_price??p.price??0)}
async function load(){st('讀取商品…');const j=await api('/api/bw-products');products=j.products||[];render();st('已讀取 '+products.length+' 筆')}
function render(){const q=$('q').value.trim().toLowerCase();const a=products.filter(p=>!q||(`${p.name} ${p.brand} ${p.id} ${p.external_id}`).toLowerCase().includes(q));$('count').textContent=a.length+' 個項目';$('rows').innerHTML=a.map(p=>`<tr><td>${p.image_url?`<img class="thumb" src="${esc(p.image_url)}">`:'—'}</td><td><b>${esc(p.name)}</b><div class="status">${esc(p.id)}</div></td><td>${{simple:'簡單商品',external:'外部/加盟商品',variable:'可變商品'}[p.product_type||'simple']}</td><td>${p.stock_tracking_enabled?Number(p.stock_qty||0):'—'}</td><td>NT$ ${priceOf(p).toLocaleString()}</td><td>${esc(p.category)}</td><td>${p.is_active!==false?'上架':'下架'}</td><td><button class="btn" onclick="edit('${esc(p.id)}')">編輯</button> <button class="btn" onclick="toggle('${esc(p.id)}')">${p.is_active!==false?'下架':'上架'}</button> <button class="btn red" onclick="delp('${esc(p.id)}')">刪除</button></td></tr>`).join('')||'<tr><td colspan="8">沒有商品</td></tr>'}
function blank(){editing=null;attributes=[];variations=[];gallery=[];['name','description','external_id','brand','supplier','line_url','sku','button_text'].forEach(x=>$(x).value='');['regular_price','sale_price','stock_qty','weight','cost_price'].forEach(x=>$(x).value='');$('low_stock_qty').value=3;$('sort_order').value=100;$('product_type').value='simple';$('source_type').value='manual';$('stock_tracking_enabled').value='false';$('fulfillment_type').value='physical';$('is_active').value='true';$('mainPreview').removeAttribute('src');$('editState').textContent='新增';typeUI();renderAttrs();renderVars();renderGallery()}
window.edit=id=>{const p=products.find(x=>String(x.id)===String(id));if(!p)return;editing=p.id;for(const k of ['name','description','external_id','brand','supplier','line_url','sku','button_text'])$(k).value=p[k]||'';$('regular_price').value=p.regular_price??p.price??0;$('sale_price').value=p.sale_price??'';$('stock_qty').value=p.stock_qty??0;$('low_stock_qty').value=p.low_stock_qty??3;$('weight').value=p.weight??0;$('cost_price').value=p.cost_price??0;$('sort_order').value=p.sort_order??100;$('product_type').value=p.product_type||'simple';$('source_type').value=p.source_type||'manual';$('stock_tracking_enabled').value=String(p.stock_tracking_enabled===true);$('fulfillment_type').value=p.fulfillment_type||'physical';$('is_active').value=String(p.is_active!==false);$('external_url').value=p.external_url||'';$('dim_length').value=p.dimensions?.length||'';$('dim_width').value=p.dimensions?.width||'';$('dim_height').value=p.dimensions?.height||'';attributes=structuredClone(p.attributes||[]);variations=structuredClone(p.variations||[]);gallery=[...(p.gallery_urls||[])];$('mainPreview').src=p.image_url||'';$('editState').textContent='# '+p.id;typeUI();renderAttrs();renderVars();renderGallery();scrollTo({top:document.querySelector('.editgrid').offsetTop-80,behavior:'smooth'})}
function payload(){const regular=Number($('regular_price').value||0),sale=$('sale_price').value===''?null:Number($('sale_price').value);return{id:editing||undefined,name:$('name').value.trim(),description:$('description').value,product_type:$('product_type').value,regular_price:regular,sale_price:sale,price:sale??regular,external_id:$('external_id').value.trim(),brand:$('brand').value.trim(),category:$('category').value||'精選福利',source_type:$('source_type').value,supplier:$('supplier').value.trim(),line_url:$('line_url').value.trim(),external_url:$('external_url').value.trim(),button_text:$('button_text').value.trim(),sku:$('sku').value.trim(),stock_tracking_enabled:$('stock_tracking_enabled').value==='true',stock_qty:Number($('stock_qty').value||0),low_stock_qty:Number($('low_stock_qty').value||3),fulfillment_type:$('fulfillment_type').value,weight:Number($('weight').value||0),dimensions:{length:Number($('dim_length').value||0),width:Number($('dim_width').value||0),height:Number($('dim_height').value||0)},cost_price:Number($('cost_price').value||0),sort_order:Number($('sort_order').value||100),is_active:$('is_active').value==='true',image_url:$('mainPreview').getAttribute('src')||'',gallery_urls:gallery,attributes,variations}}
async function save(){if(!$('name').value.trim())return alert('請輸入商品名稱');st('儲存中…');try{const j=await api('/api/bw-product-save',{method:'POST',body:JSON.stringify({product:payload()})});editing=j.product.id;await load();edit(editing);st('商品已更新')}catch(e){st('失敗：'+e.message)}}window.toggle=async id=>{const p=products.find(x=>String(x.id)===String(id));if(!p)return;await api('/api/bw-product-toggle',{method:'POST',body:JSON.stringify({id,is_active:p.is_active===false})});await load()};window.delp=async id=>{const p=products.find(x=>String(x.id)===String(id));if(!p||!confirm('確定刪除「'+p.name+'」？'))return;await api('/api/bw-product-delete',{method:'POST',body:JSON.stringify({id})});if(editing===id)blank();await load()}
function typeUI(){const t=$('product_type').value;document.querySelectorAll('.variable-only').forEach(x=>x.classList.toggle('hidden',t!=='variable'));document.querySelectorAll('.external-only').forEach(x=>x.classList.toggle('hidden',t!=='external'))}
function renderAttrs(){$('attrList').innerHTML=attributes.map((a,i)=>`<div class="attr"><div class="two"><input value="${esc(a.name)}" onchange="attributes[${i}].name=this.value" placeholder="屬性名稱，例如 尺寸"><input value="${esc((a.values||[]).join(' | '))}" onchange="attributes[${i}].values=this.value.split('|').map(x=>x.trim()).filter(Boolean)" placeholder="R1.0 | R1.25 | R1.5"></div><button class="btn red" onclick="attributes.splice(${i},1);renderAttrs()" style="margin-top:8px">移除</button></div>`).join('')}
window.renderAttrs=renderAttrs;function combos(arr){return arr.reduce((acc,a)=>acc.flatMap(x=>(a.values||[]).map(v=>({...x,[a.name]:v}))),[{}])}function generate(){const usable=attributes.filter(a=>a.name&&a.values?.length);if(!usable.length)return alert('先在「屬性」建立變化屬性');variations=combos(usable).map((x,i)=>({id:'var-'+Date.now().toString(36)+'-'+i,attributes:x,regular_price:Number($('regular_price').value||0),sale_price:null,stock_qty:0,is_active:true,image_url:''}));renderVars()}
function renderVars(){$('variationList').innerHTML=variations.map((v,i)=>`<div class="variation" id="v${i}"><div class="vhead" onclick="document.getElementById('v${i}').classList.toggle('open')"><b>#${i+1} ${esc(Object.entries(v.attributes||{}).map(([k,x])=>k+': '+x).join(' / ')||'手動款式')}</b><span>NT$ ${Number(v.sale_price??v.regular_price??0).toLocaleString()}</span></div><div class="vbody"><div class="two"><div><img class="vimg" src="${esc(v.image_url||$('mainPreview').getAttribute('src')||'')}" onerror="this.removeAttribute('src')"><input type="file" accept="image/*" onchange="uploadVariation(${i},this.files[0])"><div class="status">未指定圖片時自動使用商品主圖</div></div><div><label>SKU</label><input value="${esc(v.sku||'')}" onchange="variations[${i}].sku=this.value"><label>原價</label><input type="number" value="${Number(v.regular_price||0)}" onchange="variations[${i}].regular_price=Number(this.value||0)"><label>折扣價</label><input type="number" value="${v.sale_price??''}" onchange="variations[${i}].sale_price=this.value===''?null:Number(this.value)"><label>庫存</label><input type="number" value="${Number(v.stock_qty||0)}" onchange="variations[${i}].stock_qty=Number(this.value||0)"></div></div><button class="btn red" onclick="variations.splice(${i},1);renderVars()">刪除此款式</button></div></div>`).join('')}
window.renderVars=renderVars;function renderGallery(){$('gallery').innerHTML=gallery.map((u,i)=>`<div class="gitem"><img src="${esc(u)}"><button onclick="gallery.splice(${i},1);renderGallery()">×</button></div>`).join('')};window.renderGallery=renderGallery;
async function upload(file,role,slot=''){if(!file)throw Error('未選照片');let id=editing||$('external_id').value.trim();if(!id){id='bw-'+Date.now().toString(36);$('external_id').value=id}const fd=new FormData();fd.append('upload_type','gift');fd.append('product_id',id);fd.append('image_role',role);fd.append('slot',slot);fd.append('file',file);const r=await fetch(API+'/api/upload',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});const j=await r.json();if(!r.ok||j.ok===false)throw Error(j.message||j.error);return j.image_url}window.uploadVariation=async(i,f)=>{try{variations[i].image_url=await upload(f,'variation',variations[i].id||String(i+1));renderVars();st('款式圖片已上傳')}catch(e){st(e.message)}};
async function boot(){const {data:{session}}=await SB.auth.getSession();if(!session){$('gate').textContent='請先登入 BookWide';return}token=session.access_token;try{await api('/api/bw-products-health');$('gate').classList.add('hidden');$('app').classList.remove('hidden');const cj=await api('/api/bw-product-categories');$('category').innerHTML=(cj.categories||[]).filter(x=>x.active!==false).map(x=>`<option>${esc(x.name)}</option>`).join('');blank();await load()}catch(e){$('gate').textContent='商品後台讀取失敗：'+e.message}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('pane-'+b.dataset.pane).classList.add('active')});$('product_type').onchange=typeUI;$('q').oninput=render;$('newBtn').onclick=blank;$('reloadBtn').onclick=load;$('saveBtn').onclick=save;$('toggleBtn').onclick=()=>editing&&toggle(editing);$('deleteBtn').onclick=()=>editing&&delp(editing);$('addAttr').onclick=()=>{attributes.push({name:'',values:[],variation:true});renderAttrs()};$('generateVars').onclick=generate;$('addVar').onclick=()=>{variations.push({id:'var-'+Date.now().toString(36),attributes:{},regular_price:Number($('regular_price').value||0),sale_price:null,stock_qty:0,is_active:true,image_url:''});renderVars()};$('uploadMain').onclick=async()=>{try{$('mainPreview').src=await upload($('mainFile').files[0],'main');st('主圖已上傳，請按更新商品儲存')}catch(e){st(e.message)}};$('removeMain').onclick=()=>{$('mainPreview').removeAttribute('src');st('主圖已從商品資料移除；按更新商品儲存')};$('uploadGallery').onclick=async()=>{try{for(const f of $('galleryFile').files)gallery.push(await upload(f,'gallery',Date.now().toString(36)+'-'+gallery.length));renderGallery();st('圖庫已新增，請按更新商品儲存')}catch(e){st(e.message)}};boot();
</script></body></html>
