<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>推薦好禮管理｜BookWide Admin</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--green:#15803d;--orange:#c2410c;--red:#b91c1c;--radius:18px}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1180px;margin:22px auto 60px;padding:0 16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:28px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:5px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:999px;padding:8px 14px;font-weight:800;cursor:pointer;text-decoration:none;font-size:13px}.btn.secondary{background:#fff;color:var(--blue);border-color:#cbd5e1}.btn.danger{background:#fff;color:var(--red);border-color:#fecaca}.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 30px rgba(15,23,42,.06);padding:14px;margin-top:12px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.stat .k{font-size:12px;color:var(--muted);font-weight:800}.stat .v{font-size:25px;font-weight:950;margin-top:3px}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-weight:800;cursor:pointer;font-size:12px}.chip.active{background:#0f172a;color:#fff;border-color:#0f172a}
.tableWrap{margin-top:12px;border:1px solid var(--line);border-radius:14px;overflow:auto;background:#fff}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:10px 9px;border-bottom:1px solid var(--line);font-size:12.5px;text-align:left;vertical-align:middle}th{background:#f8fafc;color:#475569;font-weight:900;white-space:nowrap}tr:last-child td{border-bottom:0}
.status{display:inline-flex;border-radius:999px;padding:4px 8px;font-weight:900;font-size:11px}.pending{background:#fff7ed;color:var(--orange)}.sent{background:#ecfdf5;color:var(--green)}.cancelled{background:#f1f5f9;color:#64748b}.cat{font-weight:900}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.muted{color:var(--muted)}
.inline{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.mini{padding:6px 9px;font-size:11px}.noteInput{width:180px;border:1px solid var(--line);border-radius:10px;padding:7px 8px;font-size:12px}.empty{padding:26px;text-align:center;color:var(--muted)}
#toast{position:fixed;right:18px;top:18px;background:#0f172a;color:#fff;padding:10px 13px;border-radius:12px;opacity:0;transform:translateY(-6px);transition:.18s;pointer-events:none;z-index:20}
@media(max-width:800px){.summary{grid-template-columns:1fr 1fr}.wrap{padding:0 8px}h1{font-size:23px}.card{padding:10px}}

.productAdmin{margin-top:12px}.productForm{display:grid;grid-template-columns:1.5fr .8fr .55fr .55fr;gap:8px;align-items:end}
.productForm .wide{grid-column:span 2}.productForm label{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-bottom:4px}
.productForm input,.productForm select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 9px;font-size:12px;background:#fff}
.productFormActions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.productGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:12px}
.productCard{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;min-width:0}.productCard.off{opacity:.62}
.productThumb{width:100%;aspect-ratio:4/3;object-fit:cover;background:#f8fafc;display:block}.productBody{padding:9px}
.productName{font-weight:900;font-size:12.5px;line-height:1.35;min-height:34px}.productMeta{display:flex;justify-content:space-between;gap:6px;margin-top:6px;color:var(--muted);font-size:10.5px}.productBtns{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.productBtns .btn{padding:5px 8px;font-size:10.5px}
.productStatus{display:inline-flex;border-radius:999px;padding:2px 6px;font-size:10px;font-weight:900}.productStatus.on{background:#ecfdf5;color:#047857}.productStatus.off{background:#f1f5f9;color:#64748b}
.sectionTitle{font-weight:950;font-size:17px}.sectionSub{color:var(--muted);font-size:12px;margin-top:3px}
@media(max-width:900px){.productGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.productForm{grid-template-columns:1fr 1fr}.productForm .wide{grid-column:1/-1}}
@media(max-width:520px){.productGrid{grid-template-columns:1fr 1fr}.productForm{grid-template-columns:1fr}.productForm .wide{grid-column:auto}.productName{font-size:11.5px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>🎁 推薦好禮管理</h1><div class="sub">第一階段：Admin 以私人 LINE 手動送 LINE 禮物；送出後回此頁標記完成。</div></div>
    <div class="actions"><span class="muted" id="adminEmail">檢查權限中…</span><a class="btn secondary" href="/admin.html">返回 Admin</a><button class="btn" id="refreshBtn">重新整理</button></div>
  </div>

  <div class="card productAdmin">
    <div class="sectionTitle">🛍️ 福利商品上架</div>
    <div class="sectionSub">從 LINE 禮物挑選商品後，在這裡建立 BookWide 商品卡；可上架、下架、換圖、改點數與排序。</div>
    <div class="productForm" style="margin-top:10px">
      <div class="wide"><label>商品名稱</label><input id="pName" placeholder="例如：Starbucks 咖啡好禮"></div>
      <div><label>分類</label><select id="pCategory"><option value="coffee">☕ 咖啡甜點</option><option value="dining">🍽️ 餐飲美食</option><option value="surprise">🎁 驚喜</option></select></div>
      <div><label>推薦點</label><input id="pPoints" type="number" min="1" value="200"></div>
      <div><label>排序</label><input id="pSort" type="number" value="10"></div>
      <div class="wide"><label>LINE 禮物商品網址（Admin 備查）</label><input id="pLineUrl" placeholder="https://giftshop-tw.line.me/..."></div>
      <div class="wide"><label>商品圖片</label><input id="pImageFile" type="file" accept="image/*"></div>
      <div class="wide"><label>或直接填圖片網址</label><input id="pImageUrl" placeholder="https://..."></div>
      <div class="productFormActions wide"><button class="btn" id="saveProductBtn">新增上架</button><button class="btn secondary" id="resetProductBtn">清除 / 新增</button><span class="muted" id="productFormState">尚未編輯商品</span></div>
    </div>
    <div id="productGrid" class="productGrid"><div class="empty" style="grid-column:1/-1">讀取商品中…</div></div>
  </div>

  <div class="summary">
    <div class="stat"><div class="k">待發送</div><div class="v" id="nPending">0</div></div>
    <div class="stat"><div class="k">已發送</div><div class="v" id="nSent">0</div></div>
    <div class="stat"><div class="k">已取消</div><div class="v" id="nCancelled">0</div></div>
    <div class="stat"><div class="k">全部申請</div><div class="v" id="nAll">0</div></div>
  </div>

  <div class="card">
    <div class="filters">
      <button class="chip active" data-filter="pending">待發送</button>
      <button class="chip" data-filter="sent">已發送</button>
      <button class="chip" data-filter="cancelled">已取消</button>
      <button class="chip" data-filter="all">全部</button>
      <span class="muted" id="loadState">讀取中…</span>
    </div>
    <div class="tableWrap">
      <table>
        <thead><tr><th>會員</th><th>Email</th><th>好禮</th><th>推薦點</th><th>申請時間</th><th>狀態</th><th>送出時間</th><th>操作 / 備註</th></tr></thead>
        <tbody id="rows"><tr><td colspan="8" class="empty">讀取中…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<div id="toast">完成</div>
<script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://jeajrwpmrgczimmrflxo.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplYWpyd3BtcmdjemltbXJmbHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3MTg5MzksImV4cCI6MjA3NjI5NDkzOX0.3iFXdHH0JEuk177_R4TGFJmOxYK9V8XctON6rDe7-Do';
const SB=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
let allClaims=[]; let currentFilter='pending'; let allProducts=[]; let editingProductId=null;
const $=id=>document.getElementById(id);
function toast(m){const e=$('toast');e.textContent=m;e.style.opacity='1';e.style.transform='translateY(0)';setTimeout(()=>{e.style.opacity='0';e.style.transform='translateY(-6px)'},1200)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(v){if(!v)return '—';try{return new Date(v).toLocaleString('zh-Hant-TW',{hour12:false})}catch{return String(v)}}
function catName(v){return {coffee:'☕ 咖啡甜點',dining:'🍽️ 餐飲美食',surprise:'🎁 Surprise 驚喜'}[v]||'—'}
function statusName(v){return {pending:'待發送',sent:'已發送',cancelled:'已取消'}[v]||v||'—'}
function pCatName(v){return {coffee:'☕ 咖啡甜點',dining:'🍽️ 餐飲美食',surprise:'🎁 驚喜'}[v]||'🎁 好禮'}
function resetProductForm(){editingProductId=null;$('pName').value='';$('pCategory').value='coffee';$('pPoints').value='200';$('pSort').value='10';$('pLineUrl').value='';$('pImageUrl').value='';$('pImageFile').value='';$('saveProductBtn').textContent='新增上架';$('productFormState').textContent='尚未編輯商品'}
async function uploadProductImage(file){
  if(!file)return null;
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
  const path=`products/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error}=await SB.storage.from('referral-gifts').upload(path,file,{cacheControl:'3600',upsert:false});
  if(error)throw error;
  return SB.storage.from('referral-gifts').getPublicUrl(path).data.publicUrl;
}
async function loadProducts(){
  const {data,error}=await SB.from('referral_gift_products').select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:true});
  if(error){$('productGrid').innerHTML=`<div class="empty" style="grid-column:1/-1">商品讀取失敗：${esc(error.message)}</div>`;return}
  allProducts=data||[]; renderProducts();
}
function renderProducts(){
  const box=$('productGrid'); if(!allProducts.length){box.innerHTML='<div class="empty" style="grid-column:1/-1">目前沒有商品，請先新增。</div>';return}
  box.innerHTML=allProducts.map(p=>`<div class="productCard ${p.is_active?'':'off'}">
    <img class="productThumb" src="${esc(p.image_url||'')}" alt="${esc(p.name||'')}" onerror="this.style.visibility='hidden'">
    <div class="productBody"><div class="productName">${esc(p.name||'未命名')}</div>
      <div class="productMeta"><span>${esc(pCatName(p.category))}</span><b>${Number(p.points||0).toLocaleString('zh-Hant-TW')} 點</b></div>
      <div class="productMeta"><span>排序 ${Number(p.sort_order||0)}</span><span class="productStatus ${p.is_active?'on':'off'}">${p.is_active?'上架':'下架'}</span></div>
      <div class="productBtns"><button class="btn secondary" onclick="editProduct('${p.id}')">編輯</button><button class="btn secondary" onclick="toggleProduct('${p.id}',${p.is_active?'false':'true'})">${p.is_active?'下架':'上架'}</button><button class="btn danger" onclick="deleteProduct('${p.id}')">刪除</button>${p.line_gift_url?`<a class="btn secondary" href="${esc(p.line_gift_url)}" target="_blank">LINE</a>`:''}</div>
    </div></div>`).join('');
}
function editProduct(id){const p=allProducts.find(x=>x.id===id);if(!p)return;editingProductId=id;$('pName').value=p.name||'';$('pCategory').value=p.category||'coffee';$('pPoints').value=p.points||200;$('pSort').value=p.sort_order||0;$('pLineUrl').value=p.line_gift_url||'';$('pImageUrl').value=p.image_url||'';$('pImageFile').value='';$('saveProductBtn').textContent='儲存修改';$('productFormState').textContent=`編輯：${p.name||''}`;window.scrollTo({top:0,behavior:'smooth'})}
async function toggleProduct(id,next){const {error}=await SB.from('referral_gift_products').update({is_active:next,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);toast(next?'已上架':'已下架');await loadProducts()}
async function deleteProduct(id){if(!confirm('確定刪除這個商品？已送出的歷史申請不會消失。'))return;const {error}=await SB.from('referral_gift_products').delete().eq('id',id);if(error)return alert(error.message);toast('商品已刪除');if(editingProductId===id)resetProductForm();await loadProducts()}
async function saveProduct(){
  const name=$('pName').value.trim();const category=$('pCategory').value;const points=Math.floor(Number($('pPoints').value));const sort_order=Math.floor(Number($('pSort').value)||0);const line_gift_url=$('pLineUrl').value.trim()||null;
  if(!name)return alert('請輸入商品名稱');if(!points||points<1)return alert('推薦點必須大於 0');
  $('saveProductBtn').disabled=true;$('productFormState').textContent='儲存中…';
  try{
    let image_url=$('pImageUrl').value.trim()||null;const file=$('pImageFile').files?.[0];if(file)image_url=await uploadProductImage(file);if(!image_url)return alert('請上傳商品圖片或填圖片網址');
    const payload={name,category,points,sort_order,line_gift_url,image_url,updated_at:new Date().toISOString()};
    let error;if(editingProductId){({error}=await SB.from('referral_gift_products').update(payload).eq('id',editingProductId))}else{({error}=await SB.from('referral_gift_products').insert({...payload,is_active:true}))}
    if(error)throw error;toast(editingProductId?'商品已更新':'商品已上架');resetProductForm();await loadProducts();
  }catch(e){alert(e.message||String(e));$('productFormState').textContent='儲存失敗'}finally{$('saveProductBtn').disabled=false}
}

async function requireGlobalAdmin(){
  const {data:{session}}=await SB.auth.getSession(); if(!session?.user){location.replace('/index.html?denied=signin');return null}
  const email=String(session.user.email||'').toLowerCase();
  let {data:p}=await SB.from('profiles').select('email,is_admin,is_paused').eq('id',session.user.id).maybeSingle();
  if(!p && email){({data:p}=await SB.from('profiles').select('email,is_admin,is_paused').eq('email',email).maybeSingle())}
  if(!p || p.is_paused || !p.is_admin){location.replace('/index.html?denied=admin');return null}
  // V21 SQL 的 referral_gift_claims / RPC 目前只授權這兩個全域 Admin。
  if(!['pmktools@gmail.com','384246452@qq.com'].includes(email)){location.replace('/admin.html?denied=referral-gift');return null}
  $('adminEmail').textContent=email; return session;
}
async function getProfiles(ids){
  const out={}; if(!ids.length)return out;
  const {data,error}=await SB.from('profiles').select('id,email,display_name,full_name,name').in('id',ids);
  if(error){
    // profiles 欄位版本不同時退回最穩定的 id,email
    const r=await SB.from('profiles').select('id,email').in('id',ids); if(r.error) return out;
    (r.data||[]).forEach(p=>out[p.id]=p); return out;
  }
  (data||[]).forEach(p=>out[p.id]=p); return out;
}
async function load(){
  const session=await requireGlobalAdmin(); if(!session)return;
  await loadProducts();
  $('loadState').textContent='讀取中…';
  const {data,error}=await SB.from('referral_gift_claims').select('id,user_id,points_reserved,gift_name,gift_category,gift_product_id,gift_product_name,provider,status,edenred_reference,note,created_at,sent_at,updated_at').order('created_at',{ascending:false});
  if(error){$('rows').innerHTML=`<tr><td colspan="8" class="empty">讀取失敗：${esc(error.message)}</td></tr>`;$('loadState').textContent='讀取失敗';return}
  const ids=[...new Set((data||[]).map(x=>x.user_id).filter(Boolean))]; const prof=await getProfiles(ids);
  allClaims=(data||[]).map(c=>({...c,profile:prof[c.user_id]||{}}));
  $('nPending').textContent=allClaims.filter(x=>x.status==='pending').length;
  $('nSent').textContent=allClaims.filter(x=>x.status==='sent').length;
  $('nCancelled').textContent=allClaims.filter(x=>x.status==='cancelled').length;
  $('nAll').textContent=allClaims.length;
  $('loadState').textContent=`共 ${allClaims.length} 筆`; render();
}
function memberName(p){return p.display_name||p.full_name||p.name||p.email||'會員'}
function render(){
  const items=currentFilter==='all'?allClaims:allClaims.filter(x=>x.status===currentFilter);
  if(!items.length){$('rows').innerHTML='<tr><td colspan="8" class="empty">目前沒有資料。</td></tr>';return}
  $('rows').innerHTML=items.map(c=>{
    const p=c.profile||{}; const pending=c.status==='pending';
    return `<tr>
      <td><b>${esc(memberName(p))}</b><div class="muted mono">${esc(String(c.user_id||'').slice(0,8))}…</div></td>
      <td>${esc(p.email||'—')}</td>
      <td class="cat"><b>${esc(c.gift_product_name||c.gift_name||catName(c.gift_category))}</b><div class="muted">${esc(catName(c.gift_category))}</div></td>
      <td>${Number(c.points_reserved||0).toLocaleString('zh-Hant-TW')} 點</td>
      <td>${esc(fmtDate(c.created_at))}</td>
      <td><span class="status ${esc(c.status)}">${esc(statusName(c.status))}</span></td>
      <td>${esc(fmtDate(c.sent_at))}</td>
      <td>${pending?`<div class="inline"><input class="noteInput" id="note-${c.id}" placeholder="LINE 禮物名稱 / 備註"><button class="btn mini" onclick="markSent('${c.id}')">已發送</button><button class="btn danger mini" onclick="cancelClaim('${c.id}')">取消</button></div>`:`<div>${esc(c.edenred_reference||c.note||'—')}</div>`}</td>
    </tr>`
  }).join('');
}
async function markSent(id){
  const note=$('note-'+id)?.value?.trim()||null;
  if(!confirm('確認已用私人 LINE 把本次好禮送給會員？'))return;
  const {data,error}=await SB.rpc('admin_mark_referral_gift_sent',{p_claim_id:id,p_edenred_reference:note});
  const r=Array.isArray(data)?data[0]:data; if(error||!r?.ok){alert(error?.message||r?.message||'更新失敗');return} toast('已標記為已發送'); await load();
}
async function cancelClaim(id){
  const note=prompt('取消原因（可留空）：','')??null; if(note===null)return;
  if(!confirm('確認取消這筆申請？取消後 200 推薦點會恢復可用。'))return;
  const {data,error}=await SB.rpc('admin_cancel_referral_gift',{p_claim_id:id,p_note:note||null});
  const r=Array.isArray(data)?data[0]:data; if(error||!r?.ok){alert(error?.message||r?.message||'取消失敗');return} toast('已取消，推薦點已恢復'); await load();
}
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;render()}));
$('refreshBtn').addEventListener('click',load);
$('saveProductBtn').addEventListener('click',saveProduct);
$('resetProductBtn').addEventListener('click',resetProductForm);
load();
</script>
</body>
</html>
