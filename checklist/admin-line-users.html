<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LINE 會員管理｜BookWide Admin</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--line:#e5e7eb;--brand:#2563eb;--muted:#64748b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:#0f172a}.wrap{max-width:1180px;margin:22px auto;padding:0 16px}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.back{padding:8px 14px;border-radius:999px;border:1px solid #cbd5e1;background:#fff;text-decoration:none;color:#0f172a}.top h1{margin:0;font-size:24px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:0 8px 20px rgba(15,23,42,.05)}.stat b{font-size:20px}.tools{display:flex;gap:10px;flex-wrap:wrap;background:#fff;padding:12px;border-radius:16px;border:1px solid var(--line);margin-bottom:12px}.tools input,.tools select{min-height:40px;border:1px solid #cbd5e1;border-radius:10px;padding:0 10px}.tools input{flex:1;min-width:220px}.btn{border:0;border-radius:10px;background:var(--brand);color:#fff;padding:0 16px;font-weight:800;cursor:pointer}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:auto;box-shadow:0 10px 28px rgba(15,23,42,.06)}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:12px;color:var(--muted);background:#f8fafc;position:sticky;top:0}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#e2e8f0}.name{font-weight:850}.sub{font-size:12px;color:var(--muted);word-break:break-all}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800}.ok{background:#dcfce7;color:#166534}.off{background:#e5e7eb;color:#475569}.bind{background:#dbeafe;color:#1d4ed8}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:640px){.top h1{font-size:19px}.wrap{padding:0 8px}.tools{display:grid}.tools input{min-width:0;width:100%}}
</style></head><body><div class="wrap"><div class="top"><a class="back" href="/admin.html">← 回後台</a><h1>LINE 會員管理</h1></div><div class="stats"><div class="stat">總會員 <b id="total">0</b></div><div class="stat">有效好友 <b id="active">0</b></div><div class="stat">已綁定 <b id="bound">0</b></div></div><div class="tools"><input id="q" placeholder="搜尋 LINE 名稱／User ID／Email"><select id="status"><option value="all">全部狀態</option><option value="active">有效好友</option><option value="blocked">已封鎖</option><option value="bound">已綁定</option><option value="unbound">未綁定</option></select><button class="btn" id="reload">重新整理</button></div><div class="card"><table><thead><tr><th>頭像</th><th>LINE 會員</th><th>狀態</th><th>加入時間</th><th>最後互動</th><th>來源</th><th>BookWide 綁定</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>目前沒有 LINE 會員資料</div></div></div>
<script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script><script>
const SUPABASE_URL='https://jeajrwpmrgczimmrflxo.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplYWpyd3BtcmdjemltbXJmbHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3MTg5MzksImV4cCI6MjA3NjI5NDkzOX0.3iFXdHH0JEuk177_R4TGFJmOxYK9V8XctON6rDe7-Do';
const API_BASE=localStorage.getItem('BOOKWIDE_HIKING_API')||'https://bookwide-hiking-api.bookwide.workers.dev';
const supa=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);let all=[];
const fmt=v=>{if(!v)return '—';try{return new Intl.DateTimeFormat('zh-TW',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}catch{return v}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function token(){const {data}=await supa.auth.getSession();if(!data?.session?.access_token){location.replace('/index.html?denied=signin');throw Error('未登入')}return data.session.access_token}
async function load(){document.getElementById('rows').innerHTML='<tr><td colspan="7">讀取中…</td></tr>';const t=await token();const r=await fetch(API_BASE+'/api/line/targets',{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw Error(await r.text());const d=await r.json();all=Array.isArray(d.targets)?d.targets:[];render()}
function render(){const q=document.getElementById('q').value.trim().toLowerCase(),st=document.getElementById('status').value;const rows=all.filter(x=>{const active=x.active!==false,bound=!!x.bookwide_user_id;const text=[x.name,x.display_name,x.id,x.bookwide_email].join(' ').toLowerCase();if(q&&!text.includes(q))return false;if(st==='active'&&!active)return false;if(st==='blocked'&&active)return false;if(st==='bound'&&!bound)return false;if(st==='unbound'&&bound)return false;return true});document.getElementById('total').textContent=all.length;document.getElementById('active').textContent=all.filter(x=>x.active!==false).length;document.getElementById('bound').textContent=all.filter(x=>x.bookwide_user_id).length;document.getElementById('empty').hidden=rows.length>0;document.getElementById('rows').innerHTML=rows.map(x=>`<tr><td>${x.picture_url?`<img class="avatar" src="${esc(x.picture_url)}" alt="">`:'<div class="avatar"></div>'}</td><td><div class="name">${esc(x.display_name||x.name||'LINE 好友')}</div><div class="sub">${esc(x.id||'')}</div></td><td><span class="pill ${x.active!==false?'ok':'off'}">${x.active!==false?'有效好友':'已封鎖'}</span></td><td>${fmt(x.first_follow_at||x.created_at)}</td><td>${fmt(x.last_active_at||x.last_seen_at)}</td><td>${esc(x.source||'BookWide網站')}</td><td>${x.bookwide_user_id?`<span class="pill bind">已綁定</span><div class="sub">${esc(x.bookwide_email||x.bookwide_user_id)}</div>`:'<span class="pill off">未綁定</span>'}</td></tr>`).join('')}
document.getElementById('q').addEventListener('input',render);document.getElementById('status').addEventListener('change',render);document.getElementById('reload').addEventListener('click',()=>load().catch(e=>alert(e.message)));load().catch(e=>{document.getElementById('rows').innerHTML=`<tr><td colspan="7">讀取失敗：${esc(e.message)}</td></tr>`});
</script></body></html>
