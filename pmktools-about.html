<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>關於我們｜PMKTOOLS</title>
<style>
:root{--nav:#10233e;--red:#b71920;--line:#dde3ea;--muted:#6f7c8f}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#152238;background:#fff}
.utility{background:#151515;color:#fff}.utility-in{max-width:1420px;margin:auto;height:46px;display:flex;align-items:center;gap:18px;padding:0 22px;font-size:14px}.utility-in .spacer{flex:1}
.sitehead{background:linear-gradient(105deg,#641017,#97191f);color:#fff}.sitehead-in{max-width:1420px;margin:auto;min-height:112px;display:flex;align-items:center;gap:30px;padding:12px 22px}
.logo{width:145px;background:#fff;padding:3px}.brandtext{font-size:24px;font-weight:800;line-height:1.2}.brandtext small{display:block;font-size:14px;font-weight:600}
.nav{margin-left:auto;display:flex;align-items:stretch}.nav a{color:#fff;text-decoration:none;padding:20px 18px;font-weight:800}.nav a:hover,.nav a.active{background:rgba(255,255,255,.12)}
.layout{max-width:1420px;margin:0 auto;display:grid;grid-template-columns:290px minmax(0,1fr);gap:34px;padding:28px 22px 60px}
.side-title{background:#d90000;color:#fff;padding:14px 16px;font-size:21px;font-weight:900}.side a{display:block;padding:15px 14px;border-bottom:1px solid #e5e7eb;text-decoration:none;color:#222;font-size:17px}.side a:before{content:"› ";font-weight:900}.side a:hover{color:#c40000}
.crumb{border:1px dotted #d5dbe3;padding:14px 18px;color:#d10b16;margin-bottom:20px}.page-title{font-size:31px;color:#d10b16;margin:0 0 20px}.bodytext{font-size:18px;line-height:1.85;white-space:pre-wrap;color:#4b5563}.about-img{max-width:100%;margin-top:22px}
.news-item{display:grid;grid-template-columns:190px 1fr;gap:20px;padding:18px 0;border-bottom:1px solid #e5e7eb}.news-item img{width:190px;height:100px;object-fit:cover;background:#f3f4f6}.news-date{color:#9ca3af;font-size:13px}.news-item h3{margin:2px 0 8px;font-size:22px}.news-item p{margin:0;color:#64748b;line-height:1.6}
.video-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.video-card{border:1px solid var(--line);padding:14px}.video-card iframe,.video-card video{width:100%;aspect-ratio:16/9;border:0;background:#000}.video-card h3{margin:12px 0 6px}.video-card p{white-space:pre-wrap;color:#64748b}
.catalog-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}.catalog-card{border:1px solid var(--line);padding:12px;text-align:center}.catalog-card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#f4f4f4}.catalog-card h3{font-size:17px}.download{display:block;background:#d90000;color:#fff;text-decoration:none;padding:10px;margin-top:10px;font-weight:800}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 28px}.contact-box{border-bottom:1px solid #e5e7eb;padding:12px 0}.contact-box b{display:block;color:#64748b;font-size:13px;margin-bottom:4px}
@media(max-width:900px){.sitehead-in{display:block}.brandtext{margin-top:8px}.nav{overflow:auto}.layout{grid-template-columns:1fr}.side{display:none}.catalog-grid{grid-template-columns:repeat(2,1fr)}.video-grid{grid-template-columns:1fr}}
</style>

<style id="pmk-single-header-v242">
.utilitybar,.utility,.sitehead{display:none!important}
.pmk-single-header{position:sticky;top:0;z-index:500;background:#fff;border-bottom:1px solid #dfe5ec}
.pmk-single-in{max-width:1420px;margin:auto;min-height:82px;padding:8px 20px;display:flex;align-items:center;gap:22px}
.pmk-single-logo{width:124px;max-height:58px;object-fit:contain;background:#fff}
.pmk-single-contact{font-size:12px;line-height:1.55;color:#64748b;white-space:nowrap}
.pmk-single-nav{display:flex;align-items:stretch;justify-content:center;gap:2px;flex:1;min-width:0}
.pmk-single-nav a{display:flex;align-items:center;height:64px;padding:0 15px;text-decoration:none;color:#111827;font-weight:800;font-size:14px;white-space:nowrap;border-radius:6px}
.pmk-single-nav a:hover,.pmk-single-nav a.active{background:#f2f4f7;color:#b91c1c}
.pmk-single-actions{display:flex;align-items:center;gap:8px;white-space:nowrap}
.pmk-single-actions a{border:1px solid #cfd5dd;border-radius:6px;padding:9px 11px;text-decoration:none;color:#111827;font-size:13px;font-weight:800;background:#fff}
.pmk-single-actions a.admin{background:#111827;color:#fff;border-color:#111827}
@media(max-width:980px){
 .pmk-single-contact{display:none}.pmk-single-nav{overflow:auto;justify-content:flex-start}.pmk-single-nav a{padding:0 10px}
}
@media(max-width:720px){
 .pmk-single-in{min-height:66px;padding:6px 10px;gap:10px;flex-wrap:wrap}
 .pmk-single-logo{width:98px}.pmk-single-nav{order:3;width:100%;height:42px}.pmk-single-nav a{height:42px;font-size:12px}
 .pmk-single-actions a{font-size:12px;padding:7px 8px}
}
</style>




</head><body><div id="pmkSharedHeader"></div>

<div class="layout"><aside class="side"><div class="side-title">產品展示</div><div id="sideCats"></div></aside><main><div class="crumb">首頁　/　關於我們</div><h1 class="page-title" id="ttl">關於我們</h1><div class="bodytext" id="body"></div><img class="about-img" id="img" hidden></main></div>
<script>
const API='https://pmktools-api.pmktools.workers.dev';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function siteContent(){const r=await fetch(API+'/api/pmk-site-content',{cache:'no-store'});const j=await r.json().catch(()=>({}));return j.content||{}}
function youtubeId(url){const m=String(url||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/i);return m?m[1]:''}
async function sideProducts(){try{const r=await fetch(API+'/api/bw-product-categories',{cache:'no-store'});const j=await r.json().catch(()=>({}));const a=(j.categories||[]).filter(x=>x.active!==false);document.getElementById('sideCats').innerHTML=a.map(x=>`<a href="/pmktools-products.html?cat=${encodeURIComponent(x.name)}">${esc(x.name)}</a>`).join('')}catch(_){}}
sideProducts();
</script>
<script>(async()=>{const c=await siteContent(),a=c.about||{};document.getElementById('ttl').textContent=a.title||'關於我們';document.getElementById('body').textContent=a.body||'';if(a.image_url){const i=document.getElementById('img');i.src=a.image_url;i.hidden=false}})();</script>


<div id="pmkSharedFooter"></div><script src="/pmktools-layout.js"></script></body></html>
