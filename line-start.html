<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BookWide｜LINE 連結</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--green:#06c755;--ink:#17324d;--muted:#64748b;--line:#dbe5ee;--bg:#f4f8fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#eefbf3,#f7f9fc);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink)}
.card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px 24px;box-shadow:0 18px 50px rgba(23,50,77,.12);text-align:center}
.logo{font-size:48px}.title{font-size:25px;font-weight:950;margin:8px 0}.sub{color:var(--muted);line-height:1.7;margin:0 0 20px}.status{padding:14px;border-radius:16px;background:var(--bg);font-weight:800;line-height:1.6;white-space:pre-line}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.btn{display:block;width:100%;margin-top:16px;border:0;border-radius:999px;padding:14px 18px;background:var(--green);color:#fff;font-size:16px;font-weight:950;text-decoration:none;cursor:pointer}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.small{margin-top:16px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <div class="logo">📖</div>
  <h1 class="title">BookWide</h1>
  <p class="sub">正在確認 LINE 與 BookWide 身分，完成後會自動進入系統。</p>
  <div id="status" class="status">正在啟動 LINE…</div>
  <a id="loginBtn" class="btn" hidden href="/login.html?next=%2Fline-start.html">登入 BookWide 後自動完成</a>
  <a id="homeBtn" class="btn secondary" hidden href="/m-hiking.html">進入 BookWide</a>
  <div class="small">LIFF ID：2010846730-zwI5DmZ0</div>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
<script>
const LIFF_ID='2010846730-zwI5DmZ0';
const API='https://bookwide-hiking-api.pmktools.workers.dev';
const SUPABASE_URL='https://jeajrwpmrgczimmrflxo.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplYWpyd3BtcmdjemltbXJmbHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3MTg5MzksImV4cCI6MjA3NjI5NDkzOX0.3iFXdHH0JEuk177_R4TGFJmOxYK9V8XctON6rDe7-Do';
const supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const statusEl=document.getElementById('status'),loginBtn=document.getElementById('loginBtn'),homeBtn=document.getElementById('homeBtn');
function setStatus(text,type=''){statusEl.textContent=text;statusEl.className='status'+(type?' '+type:'')}
async function run(){
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){
      setStatus('需要先由 LINE 確認身分，正在登入…');
      liff.login({redirectUri:location.href});
      return;
    }
    const idToken=liff.getIDToken();
    if(!idToken)throw new Error('無法取得 LINE 身分，請從 LINE 訊息重新點「立即開始」。');
    setStatus('LINE 身分已確認。\n正在確認 BookWide 登入…');
    const {data:{session}}=await supa.auth.getSession();
    if(!session?.access_token){
      sessionStorage.setItem('bookwide_liff_pending','1');
      setStatus('LINE 身分已確認。\n請登入 BookWide，登入後會自動完成連結。');
      loginBtn.hidden=false;
      return;
    }
    setStatus('正在完成 LINE × BookWide 連結…');
    const res=await fetch(API+'/api/line-binding/liff-complete',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({id_token:idToken}),cache:'no-store'});
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.error||('HTTP '+res.status));
    sessionStorage.removeItem('bookwide_liff_pending');
    const name=data?.binding?.display_name?`（${data.binding.display_name}）`:'';
    setStatus('✅ LINE 已連結完成'+name+'\n即將進入 BookWide…','ok');
    homeBtn.hidden=false;
    setTimeout(()=>location.replace('/m-hiking.html'),1200);
  }catch(e){
    setStatus('連結未完成：'+(e?.message||String(e)),'err');
    homeBtn.hidden=false;
  }
}
run();
</script>
</body>
</html>
