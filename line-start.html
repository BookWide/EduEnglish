<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BookWide｜完成 LINE 綁定</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--green:#06c755;--ink:#17324d;--muted:#64748b;--line:#dbe5ee;--bg:#f4f8fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#eefbf3,#f7f9fc);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink)}
.card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px 24px;box-shadow:0 18px 50px rgba(23,50,77,.12);text-align:center}
.logo{font-size:48px}.title{font-size:25px;font-weight:950;margin:8px 0}.sub{color:var(--muted);line-height:1.7;margin:0 0 20px}
.status{padding:14px;border-radius:16px;background:var(--bg);font-weight:800;line-height:1.6;white-space:pre-line}
.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}
.btn{display:block;width:100%;margin-top:16px;border:0;border-radius:999px;padding:14px 18px;background:var(--green);color:#fff;font-size:16px;font-weight:950;text-decoration:none}
.small{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<main class="card">
  <div class="logo">🔗</div>
  <h1 class="title">BookWide LINE 綁定</h1>
  <p class="sub">正在把目前登入的 BookWide 帳號與你的 LINE 身分綁在一起。</p>
  <div id="status" class="status">正在啟動 LINE…</div>
  <a id="homeBtn" class="btn" hidden href="/index.html">回到 BookWide</a>
  <div class="small">綁定完成後，BookWide 可將活動通知、AI 日安圖及個人貼圖傳送到你的 LINE。</div>
</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script>
const LIFF_ID='2010846730-yWnTvvB2';
const API='https://bookwide-hiking-api.pmktools.workers.dev';
const SUPABASE_URL='https://jeajrwpmrgczimmrflxo.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplYWpyd3BtcmdjemltbXJmbHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3MTg5MzksImV4cCI6MjA3NjI5NDkzOX0.3iFXdHH0JEuk177_R4TGFJmOxYK9V8XctON6rDe7-Do';
const supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const statusEl=document.getElementById('status');
const homeBtn=document.getElementById('homeBtn');
function setStatus(text,type=''){statusEl.textContent=text;statusEl.className='status'+(type?' '+type:'')}
async function run(){
  try{
    const {data:{session}}=await supa.auth.getSession();
    if(!session?.access_token){
      const returnTo=encodeURIComponent('/line-start.html');
      location.replace('/login.html?next='+returnTo);
      return;
    }

    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){
      setStatus('正在由 LINE 確認身分…');
      liff.login({redirectUri:location.href});
      return;
    }

    const idToken=liff.getIDToken();
    if(!idToken)throw new Error('無法取得 LINE 身分，請重新開啟綁定頁。');

    setStatus('LINE 身分已確認。\n正在綁定 BookWide 帳號…');
    const res=await fetch(API+'/api/line-binding/liff',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+session.access_token
      },
      body:JSON.stringify({id_token:idToken}),
      cache:'no-store'
    });
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.error||('HTTP '+res.status));

    try{
      localStorage.removeItem('bw_show_line_after_signup');
      localStorage.setItem('bookwide_line_binding',JSON.stringify({
        line_user_id:data.line_user_id||'',
        display_name:data.display_name||'',
        picture_url:data.picture_url||'',
        bookwide_user_id:data.bookwide_user_id||'',
        bookwide_email:data.bookwide_email||'',
        bound_at:data.bound_at||new Date().toISOString()
      }));
    }catch(_e){}

    setStatus('✅ LINE 綁定成功\n正在回到 BookWide…','ok');
    homeBtn.hidden=false;
    setTimeout(()=>location.replace('/index.html?line_bound=1'),1200);
  }catch(e){
    console.error(e);
    setStatus('無法完成綁定：'+(e?.message||String(e)),'err');
    homeBtn.hidden=false;
  }
}
run();
</script>
</body>
</html>
