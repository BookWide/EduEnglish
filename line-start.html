<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BookWide V30.3｜LINE 綁定</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--green:#06c755;--ink:#17324d;--muted:#64748b;--line:#dbe5ee;--bg:#f4f8fb;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#eefbf3,#f7f9fc);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink)}
.card{width:min(470px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px 24px;box-shadow:0 18px 50px rgba(23,50,77,.12);text-align:center}
.logo{font-size:48px}.title{font-size:25px;font-weight:950;margin:8px 0}.sub{color:var(--muted);line-height:1.7;margin:0 0 20px}
.status{padding:14px;border-radius:16px;background:var(--bg);font-weight:800;line-height:1.6;white-space:pre-line}
.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.warn{background:#fff7ed;color:#9a3412}
.actions{display:grid;gap:10px;margin-top:16px}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:14px 18px;background:var(--green);color:#fff;font-size:16px;font-weight:950;text-decoration:none;cursor:pointer}
.btn.secondary{background:var(--blue)}.btn.light{background:#fff;color:#334155;border:1px solid #cbd5e1}
.small{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.6}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <div class="logo">🔗</div>
  <h1 class="title">BookWide V30.3</h1>
  <p class="sub">把目前登入的 BookWide 帳號與你的 LINE 身分綁定。</p>
  <div id="status" class="status">正在啟動 LINE…</div>
  <div class="actions">
    <a id="addFriendBtn" class="btn" hidden href="https://line.me/R/ti/p/@531xoidn">先加入 BookWide 官方 LINE</a>
    <button id="continueBtn" class="btn secondary" hidden type="button">我已加入，繼續綁定</button>
    <a id="homeBtn" class="btn light" hidden href="/index.html">回到 BookWide</a>
  </div>
  <div class="small">桌機可能會顯示 LINE QR Code；請用手機 LINE 掃描後，再按「我已加入，繼續綁定」。</div>
</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script>
const LIFF_ID='2010846730-yWnTvvB2';
const API='https://bookwide-hiking-api.pmktools.workers.dev';
const SUPABASE_URL='https://jeajrwpmrgczimmrflxo.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplYWpyd3BtcmdjemltbXJmbHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3MTg5MzksImV4cCI6MjA3NjI5NDkzOX0.3iFXdHH0JEuk177_R4TGFJmOxYK9V8XctON6rDe7-Do';
const supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const statusEl=document.getElementById('status');
const addFriendBtn=document.getElementById('addFriendBtn');
const continueBtn=document.getElementById('continueBtn');
const homeBtn=document.getElementById('homeBtn');

function setStatus(text,type=''){statusEl.textContent=text;statusEl.className='status'+(type?' '+type:'')}
function showFriendStep(){
  setStatus('尚未加入 BookWide 官方 LINE。\n請先加入好友，再回來繼續綁定。','warn');
  addFriendBtn.hidden=false;
  continueBtn.hidden=false;
  homeBtn.hidden=false;
}
async function bindNow(){

const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
if(!isMobile){

const qrWrap=document.createElement('div');
qrWrap.id='pcqr';
qrWrap.style.cssText='margin:18px auto;width:240px;height:240px;background:#fff;';
const st=document.querySelector('.status');
st.after(qrWrap);
if(!document.getElementById('qrlib')){
 const sc=document.createElement('script');
 sc.id='qrlib';
 sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
 sc.onload=()=>{new QRCode(qrWrap,{text:'https://liff.line.me/2010846730-yWnTvvB2',width:240,height:240});};
 document.head.appendChild(sc);
}

 setStatus('請使用手機掃描 QR Code','warn');
 document.querySelector('.sub').textContent='請使用手機 LINE 掃描 QR Code，進入 LIFF 完成 BookWide 綁定。';
 addFriendBtn.hidden=true;
 continueBtn.hidden=true;
 homeBtn.hidden=false;
 return;
}

  const {data:{session}}=await supa.auth.getSession();
  if(!session?.access_token){
    setStatus('此 LINE 已綁定其他 BookWide 帳號，或目前尚未登入 BookWide。\n請確認是否使用正確帳號。','err');
    homeBtn.hidden=false;
    return;
  }
  if(!liff.isLoggedIn()){
    liff.login({redirectUri:location.href});
    return;
  }

  // LIFF 有啟用 friendship scope 時才檢查；若無權限則直接進綁定
  try{
    const friendship=await liff.getFriendship();
    if(friendship && friendship.friendFlag===false){
      showFriendStep();
      return;
    }
  }catch(_e){}

  const idToken=liff.getIDToken();
  if(!idToken)throw new Error('無法取得 LINE 身分，請重新開啟綁定頁。');

  setStatus('LINE 身分已確認。\n正在綁定 BookWide 帳號…');
  addFriendBtn.hidden=true;
  continueBtn.hidden=true;

  const res=await fetch(API+'/api/line-binding/liff',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+session.access_token
    },
    body:JSON.stringify({id_token:idToken}),
    cache:'no-store'
  });
  const data=await res.json().catch(()=>({}));
  if(!res.ok){
    const raw=String(data?.error||data?.message||'');
    const isBindingConflict = res.status===409 || /already|bound|綁定|other|conflict/i.test(raw);
    if(isBindingConflict){
      setStatus('⚠️ 此 LINE 無法綁定目前 BookWide 帳號。\n\n請切換正確的 LINE 後再試。','err');
      addFriendBtn.hidden=true;
      continueBtn.hidden=true;
      homeBtn.hidden=false;
      return;
    }
    throw new Error(raw||('HTTP '+res.status));
  }

  try{
    localStorage.removeItem('bw_show_line_after_signup');
    localStorage.setItem('bookwide_line_binding',JSON.stringify({
      line_user_id:data.line_user_id||'',
      display_name:data.display_name||'',
      picture_url:data.picture_url||'',
      bookwide_user_id:data.bookwide_user_id||'',
      bookwide_email:data.bookwide_email||'',
      bound_at:data.bound_at||new Date().toISOString()
    }));
  }catch(_e){}

  setStatus('✅ LINE 綁定成功\n正在回到 BookWide…','ok');
  homeBtn.hidden=false;
  setTimeout(()=>location.replace('/index.html?line_bound=1'),1200);
}
async function run(){
  try{
    await liff.init({liffId:LIFF_ID});
    await bindNow();
  }catch(e){
    console.error(e);
    const msg=String(e?.message||e||'');
    if(/already|bound|綁定|other|conflict/i.test(msg)){
      setStatus('⚠️ 此 LINE 無法綁定目前 BookWide 帳號。\n\n請切換正確的 LINE 後再試。','err');
    }else{
      setStatus('無法完成 LINE 綁定：'+msg,'err');
    }
    addFriendBtn.hidden=true;
    continueBtn.hidden=true;
    homeBtn.hidden=false;
  }
}
continueBtn.addEventListener('click',()=>location.reload());
run();
</script>
</body>
</html>
