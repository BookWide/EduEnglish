<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BookWide｜LINE 會員</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--green:#06c755;--ink:#17324d;--muted:#64748b;--line:#dbe5ee;--bg:#f4f8fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#eefbf3,#f7f9fc);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink)}.card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px 24px;box-shadow:0 18px 50px rgba(23,50,77,.12);text-align:center}.logo{font-size:48px}.title{font-size:25px;font-weight:950;margin:8px 0}.sub{color:var(--muted);line-height:1.7;margin:0 0 20px}.status{padding:14px;border-radius:16px;background:var(--bg);font-weight:800;line-height:1.6;white-space:pre-line}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.btn{display:block;width:100%;margin-top:16px;border:0;border-radius:999px;padding:14px 18px;background:var(--green);color:#fff;font-size:16px;font-weight:950;text-decoration:none}.small{margin-top:16px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <div class="logo">📖</div><h1 class="title">BookWide</h1>
  <p class="sub">正在建立你的免費 LINE 會員身分，不需要註冊 BookWide 帳號。</p>
  <div id="status" class="status">正在啟動 LINE…</div>
  <a id="homeBtn" class="btn" hidden href="/m-hiking.html">立即進入 BookWide</a>
  <div class="small">LINE 是免費會員入口；需要付費、雲端同步或管理功能時，再升級 BookWide 帳號。</div>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID='2010846730-yWnTvvB2';
const API='https://bookwide-hiking-api.pmktools.workers.dev';
const statusEl=document.getElementById('status'),homeBtn=document.getElementById('homeBtn');
function setStatus(text,type=''){statusEl.textContent=text;statusEl.className='status'+(type?' '+type:'')}
async function run(){
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){setStatus('正在由 LINE 確認身分…');liff.login({redirectUri:location.href});return;}
    const idToken=liff.getIDToken();
    if(!idToken)throw new Error('無法取得 LINE 身分，請從 LINE 訊息重新點「立即開始」。');
    setStatus('LINE 身分已確認。\n正在建立免費會員…');
    const res=await fetch(API+'/api/line-members/liff-register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id_token:idToken}),cache:'no-store'});
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.error||('HTTP '+res.status));
    const name=data?.line_member?.display_name?` ${data.line_member.display_name}`:'';
    localStorage.setItem('bookwide_line_member',JSON.stringify({line_user_id:data?.line_member?.line_user_id||'',display_name:data?.line_member?.display_name||'',picture_url:data?.line_member?.picture_url||'',member_type:data?.member_type||'LINE',saved_at:new Date().toISOString()}));
    setStatus(`✅ 歡迎${name}\nLINE 免費會員已建立，立即進入 BookWide。`,'ok');
    homeBtn.hidden=false;
    setTimeout(()=>location.replace('/m-hiking.html?from=line'),1000);
  }catch(e){setStatus('無法完成：'+(e?.message||String(e)),'err');homeBtn.hidden=false;}
}
run();
</script>
</body></html>
