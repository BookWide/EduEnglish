<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PMKTOOLS ERP V3.3 工業品 + BookWide Gift</title>
  <link rel="stylesheet" href="styles.css?v=3400">
</head>
<body>
<header class="topline">
  <div class="brand">PMKTOOLS ERP <span>V3.4 CUSTOMER MASTER + LIVE SKU</span></div>
  <div class="top-actions"><span style="margin-right:12px;font-weight:800;color:#dff7e7">● PMKTOOLS 工業品 SKU + 客戶主檔 + BookWide Gift</span><button data-module="system" data-i18n="系統">系統</button><button id="signOutBtn" data-i18n="簽出">簽出</button></div>
</header>
<nav id="moduleBar" class="module-bar" aria-label="ERP 模組"></nav>
<div class="shell">
  <aside class="sidebar">
    <div class="nav-tools"><button title="上一頁">◀</button><button title="下一頁">▶</button><button title="重新整理" id="refreshBtn">↻</button><button title="全部收合" id="collapseBtn">▣</button></div>
    <div id="tree" class="tree"></div>
    <section class="userbox">
      <div><span data-i18n="您好，">您好，</span><a href="#" id="userName">RAYMOND</a></div>
      <label><span data-i18n="語言">語言</span> <select id="languageSelect"><option value="zh-TW">中文(繁)</option><option value="zh-CN">中文(简)</option><option value="en">English</option><option value="ja">日本語</option><option value="vi">Tiếng Việt</option></select></label>
      <label><span data-i18n="顯示">顯示</span> <select><option data-i18n="適中">適中</option><option data-i18n="緊湊">緊湊</option></select></label>
      <label><span data-i18n="公司">公司</span> <a href="#">聯鎧</a></label>
      <label><span data-i18n="層級">層級</span> <select><option data-i18n="聯鎧企業">聯鎧企業</option></select></label>
      <div class="domain">my-host.my-domain.com</div>
    </section>
  </aside>
  <div id="sidebarResizer" class="sidebar-resizer" title="拖曳調整左欄寬度"></div>
  <main class="main">
    <div id="breadcrumb" class="breadcrumb">首頁 / 功能導引</div>
    <section id="desktop" class="desktop"></section>
    <section id="modulePage" class="module-page hidden">
      <header class="page-head"><h1 id="pageTitle"></h1><div id="pageActions" class="page-actions"></div></header>
      <div id="tabs" class="tabs"></div>
      <div id="pageBody" class="page-body"></div>
      <footer class="statusbar"><span id="statusText">就緒</span><span>BookWide ERP Core｜<span data-i18n="自有權限系統">自有權限系統</span></span></footer>
    </section>
  </main>
</div>
<div id="dialog" class="dialog hidden" role="dialog" aria-modal="true">
  <div class="dialog-card"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><button id="dialogClose" data-i18n="確定">確定</button></div>
</div>
<script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
<script src="data/i18n.js?v=1000"></script>
<script src="data/modules.js?v=1000"></script>
<script src="app.js?v=3400"></script>
</body>
</html>
