<!doctype html><html lang="zh-Hant"><head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>福利品結帳｜BookWide</title>
<script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
<style>body{margin:0;background:#f5f7fb;color:#0f172a;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:900px;margin:24px auto;padding:0 14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:22px;box-shadow:0 12px 34px rgba(15,23,42,.07)}h1{margin:0 0 14px}.muted{color:#64748b}.bundle{margin:14px 0;border:1px solid #e7e9ed;border-radius:12px;overflow:hidden}.line{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid #eef0f2}.line.child{padding-left:34px;background:#fafbfc}.line:last-child{border-bottom:0}.tag{font-size:11px;background:#eee7e8;color:#8e4d52;border-radius:999px;padding:2px 6px;margin-right:5px}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eef2f7}.row b{font-size:18px}.total{font-size:28px!important;color:#0f766e}.pts{color:#b45309}.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:900;background:#9f5056;color:#fff;cursor:pointer;margin-top:18px}.btn:disabled{opacity:.5}.notice{margin-top:14px;padding:12px;border-radius:14px;background:#f8fafc;color:#475569;line-height:1.6}.err,.ok{display:none;margin-top:14px;padding:12px;border-radius:12px}.err{background:#fff1f2;color:#be123c}.ok{background:#ecfdf5;color:#047857;font-weight:800}.back{color:#2563eb;text-decoration:none;font-weight:800}</style></head>
<body><div class="wrap"><div class="top"><a class="back" href="/pmktools-cart.html">← 返回購物車</a><span id="loginState" class="muted">檢查登入中…</span></div><div class="card"><h1>PMKTOOLS 工業品測試結帳 <small style="font-size:12px;color:#64748b;font-weight:700">V57.0 ZERO-PAY EMAIL</small></h1><div id="items"></div>
<div id="shippingBlock" class="notice" style="margin-top:14px"><b>運送方式</b><div id="shippingMethods" style="margin-top:8px"></div><div id="shippingAddressFields" style="margin-top:10px;display:grid;gap:8px"></div></div>
<div class="row"><span>商品小計</span><b id="subtotal">—</b></div>
<div class="row"><span>運費</span><b id="shippingFee">—</b></div>
<div class="row"><span>商品總額</span><b id="price">—</b></div><div class="row"><span>可用推薦點</span><b class="pts" id="available">—</b></div><div class="row"><span>本次推薦點折抵</span><b class="pts" id="points">—</b></div><div class="row"><span>折抵後金額</span><b id="net">—</b></div><div class="row"><span>5%</span><b id="fee">—</b></div><div class="row"><span>信用卡實際收款</span><b class="total" id="cash">—</b></div><div class="notice">購物車內所有主商品與加購子項會合併成 <b>同一筆訂單、同一次付款</b>。推薦點針對整張訂單一起折抵。</div><button id="pay" class="btn" disabled>確認整車結帳</button><div id="err" class="err"></div><pre id="mailDebug" style="display:none;white-space:pre-wrap;background:#0f172a;color:#d1fae5;padding:10px;border-radius:10px;font-size:12px;margin-top:10px"></pre>
<div id="ok" class="ok"></div></div></div>
<script>
const SUPABASE_URL='https://jeajrwpmrgczimmrflxo.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplYWpyd3BtcmdjemltbXJmbHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3MTg5MzksImV4cCI6MjA3NjI5NDkzOX0.3iFXdHH0JEuk177_R4TGFJmOxYK9V8XctON6rDe7-Do',API='https://bookwide-hiking-api.pmktools.workers.dev',CART_KEY='pmktools_cart_v1';
const SB=supabase.createClient(SUPABASE_URL,KEY),$=id=>document.getElementById(id),fmt=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW');
const P=new URL(location.href).searchParams,mode=P.get('mode')||'single';let session=null,preview=null,groups=[],shippingState={};
function error(m){$('err').style.display='block';$('err').textContent=m;$('pay').disabled=true}
function getGroups(){
 if(mode==='cart'){
  if(P.get('direct')==='1'){try{return JSON.parse(sessionStorage.getItem('pmktools_direct_group')||'[]')||[]}catch(_){return[]}}
  try{return JSON.parse(localStorage.getItem(CART_KEY)||'[]')||[]}catch(_){return[]}
 }
 const opts=(()=>{try{return JSON.parse(P.get('opts')||'{}')||{}}catch(_){return{}}})();
 return [{group_id:'single',parent:{product_id:String(P.get('product')||''),quantity:Math.max(1,Number(P.get('quantity')||1)),variation_id:String(P.get('variant')||''),selected_options:opts},children:[]}];
}

function readShippingState(){
 try{return JSON.parse(localStorage.getItem('pmktools_shipping_v1')||'{}')||{}}catch(_){return{}}
}
function currentShippingPayload(){
 return {
   shipping_method:shippingState.method||'',
   shipping_name:document.getElementById('shipName')?.value||shippingState.name||'',
   shipping_phone:document.getElementById('shipPhone')?.value||shippingState.phone||'',
   shipping_postal:document.getElementById('shipPostal')?.value||shippingState.postal||'',
   shipping_address:document.getElementById('shipAddress')?.value||shippingState.address||''
 };
}
async function saveProfileAddressIfNeeded(){
 const p=currentShippingPayload(),addr=String(p.shipping_address||'').trim();
 if(!addr||!session?.user?.id)return;
 try{
   const {data:existing}=await SB.from('profiles').select('id,address,phone,display_name').eq('id',session.user.id).maybeSingle();
   const patch={address:addr,updated_at:new Date().toISOString()};
   if(p.shipping_phone)patch.phone=p.shipping_phone;
   if(p.shipping_name&&!existing?.display_name)patch.display_name=p.shipping_name;
   if(existing?.id)await SB.from('profiles').update(patch).eq('id',session.user.id);
   else await SB.from('profiles').insert({id:session.user.id,...patch});
 }catch(e){console.warn('profile address save skipped',e)}
}
function renderShippingCheckout(v){
 const methods=v.available_shipping_methods||[],selected=v.selected_shipping_method||{};
 shippingState=Object.assign({},readShippingState(),shippingState);
 if(selected.code)shippingState.method=selected.code;
 const mbox=$('shippingMethods'),abox=$('shippingAddressFields');
 if(!methods.length){$('shippingBlock').style.display='none';return}
 $('shippingBlock').style.display='block';
 mbox.innerHTML=methods.map(m=>`<label style="display:flex;gap:8px;align-items:center;padding:6px 0"><input type="radio" name="checkoutShip" value="${m.code}" ${m.code===shippingState.method?'checked':''}> ${m.label}<b style="margin-left:auto">${Number(m.fee||0)>0?fmt(m.fee):'免費'}</b></label>`).join('');
 const chosen=methods.find(x=>x.code===shippingState.method)||selected||methods[0];
 if(chosen?.requires_address!==false){
   abox.innerHTML=`<input id="shipName" placeholder="收件人" value="${String(shippingState.name||'').replace(/"/g,'&quot;')}" style="padding:10px;border:1px solid #cbd5e1;border-radius:8px"><input id="shipPhone" placeholder="聯絡電話" value="${String(shippingState.phone||'').replace(/"/g,'&quot;')}" style="padding:10px;border:1px solid #cbd5e1;border-radius:8px"><input id="shipPostal" placeholder="郵遞區號（可不填）" value="${String(shippingState.postal||'').replace(/"/g,'&quot;')}" style="padding:10px;border:1px solid #cbd5e1;border-radius:8px"><input id="shipAddress" placeholder="收件地址" value="${String(shippingState.address||'').replace(/"/g,'&quot;')}" style="padding:10px;border:1px solid #cbd5e1;border-radius:8px"><div class="muted">有 Profile 地址會自動帶入；若沒有，請在此填寫，付款前會回存 Profile。</div>`;
 }else abox.innerHTML='<div class="muted">此方式不需要收件地址。</div>';
 mbox.querySelectorAll('input[name="checkoutShip"]').forEach(r=>r.onchange=async()=>{shippingState.method=r.value;localStorage.setItem('pmktools_shipping_v1',JSON.stringify(Object.assign(readShippingState(),shippingState)));await refreshPreview()});
}
async function refreshPreview(){
 const v=await api('/api/pmk-cart-checkout-preview',{groups,...currentShippingPayload()});
 paint(v);
}
async function api(path,body){const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify(body),cache:'no-store'}),t=await r.text();let j={};try{j=JSON.parse(t)}catch(_){throw new Error(t||('HTTP '+r.status))}if(!r.ok||j.ok===false)throw new Error(j.message||j.error||('HTTP '+r.status));return j}
function renderItems(cart){
 const box=$('items');if(!cart?.groups?.length){box.innerHTML='';return}
 box.innerHTML=cart.groups.map(g=>`<div class="bundle"><div class="line"><span><b>${g.parent.name}</b> × ${g.parent.quantity}</span><b>${fmt(g.parent.line_total)}</b></div>${(g.children||[]).map(c=>`<div class="line child"><span><span class="tag">加購</span>${c.name} × ${c.quantity}</span><b>${fmt(c.line_total)}</b></div>`).join('')}</div>`).join('')
}
function paint(v){preview=v;renderItems(v.cart);renderShippingCheckout(v);$('subtotal').textContent=fmt(v.subtotal??v.cart?.total_price??0);$('shippingFee').textContent=fmt(v.shipping_fee||0);$('price').textContent=fmt(v.price);$('available').textContent=Number(v.available_points||0).toLocaleString('zh-TW')+' 點';$('points').textContent='- '+Number(v.points_used||0).toLocaleString('zh-TW')+' 點';$('net').textContent=fmt(v.net_after_points);$('fee').textContent=fmt(v.fee_5);$('cash').textContent=fmt(v.cash_amount);if(v.can_checkout===false){$('pay').textContent=v.reason==='REFERRAL_POINTS_NOT_ENOUGH'?`未滿 ${Number(v.required_points||200)} 點`:'目前無法結帳';$('pay').disabled=true;return}$('pay').textContent=Number(v.cash_amount||0)>0?`確認整車付款 ${fmt(v.cash_amount)}`:`使用 ${Number(v.points_used||0)} 點全額兌換`;$('pay').disabled=false}
async function boot(){groups=getGroups();if(!groups.length)return error('購物車是空的');const a=await SB.auth.getSession();session=a.data?.session||null;if(!session){$('loginState').textContent='尚未登入';return error('請先登入後再建立 PMKTOOLS 測試訂單。')}$('loginState').textContent=session.user.email||'已登入';shippingState=readShippingState();try{const {data:p}=await SB.from('profiles').select('display_name,phone,address').eq('id',session.user.id).maybeSingle();if(p){if(!shippingState.name)shippingState.name=p.display_name||'';if(!shippingState.phone)shippingState.phone=p.phone||'';if(!shippingState.address)shippingState.address=p.address||'';}await refreshPreview()}catch(e){error('結帳預覽失敗：'+String(e.message||e))}}
$('pay').onclick=async()=>{if(!preview)return;const msg=`確認一次結帳全部商品？\n\n商品總額 ${fmt(preview.price)}\n推薦點折抵 ${Number(preview.points_used||0)} 點\n信用卡 ${fmt(preview.cash_amount)}`;if(!confirm(msg))return;$('pay').disabled=true;$('err').style.display='none';try{await saveProfileAddressIfNeeded();const payload={groups,...currentShippingPayload()};localStorage.setItem('pmktools_shipping_v1',JSON.stringify(Object.assign(readShippingState(),currentShippingPayload(),{method:currentShippingPayload().shipping_method})));const o=await api('/api/pmk-cart-checkout-create',payload);localStorage.setItem('pmktools_pending_order',String(o.order_id||''));if(Number(o.cash_amount||0)<=0){
  const zr=await fetch(SUPABASE_URL+'/functions/v1/line-gift-zero-pay-complete',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({order_id:o.order_id})});
  const ztext=await zr.text();let zj=null;try{zj=JSON.parse(ztext)}catch(_){}
  if(!zr.ok||!zj?.ok)throw new Error('全點數訂單完成／Email 失敗：'+(zj?.message||zj?.error||ztext||zr.status));
  const md=$('mailDebug'); if(md){md.style.display='block';md.textContent='zero-pay response:\n'+JSON.stringify(zj,null,2);}
  $('ok').style.display='block';
  $('ok').textContent='V57.0｜訂單已成立；0 元訂單已呼叫 Email Function。若未收到信，畫面下方會顯示 Function 回應。';
  localStorage.removeItem(CART_KEY);
  sessionStorage.removeItem('pmktools_direct_group');
  localStorage.removeItem('pmktools_pending_order');
  $('pay').style.display='none';
  return;
}
$('ok').style.display='block';$('ok').textContent='PMKTOOLS 測試訂單 '+String(o.order_id||'')+' 已獨立建立；未送 BookWide / LINE / PAYUNi。';localStorage.removeItem(CART_KEY);sessionStorage.removeItem('pmktools_direct_group');$('pay').style.display='none';return;}catch(e){error(String(e.message||e));$('pay').disabled=false}};
boot();
</script></body></html>
