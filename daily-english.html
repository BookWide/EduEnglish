<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>BookWide 每日一句英文｜V23.1</title>
<style>
:root{--bg:#f3f7f4;--card:#fff;--ink:#173024;--muted:#66766d;--line:#dce8df;--green:#247d45;--soft:#edf8f0;--blue:#2563eb;--shadow:0 14px 38px rgba(23,48,36,.12)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#f8fbf8,#eaf4ed);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;min-height:100vh}.wrap{width:min(720px,100%);margin:auto;padding:18px 14px 34px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.brand{font-weight:950;font-size:20px}.date{font-size:12px;color:var(--muted);font-weight:800}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:20px}.badge{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--green);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:950}.lesson{margin-top:10px;color:var(--muted);font-size:13px;font-weight:850}.label{margin-top:22px;font-size:12px;color:var(--muted);font-weight:950;text-transform:uppercase;letter-spacing:.08em}.en{font-size:clamp(27px,7vw,42px);font-weight:950;line-height:1.22;margin-top:8px;letter-spacing:-.02em}.zh{font-size:17px;line-height:1.6;margin-top:10px;color:#40564a}.ja{font-size:16px;line-height:1.6;margin-top:7px;color:#4f5f75;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}.speak{margin-top:16px;border:0;border-radius:999px;background:var(--green);color:#fff;padding:12px 18px;font-weight:950;font-size:15px;cursor:pointer}.practice{margin-top:22px;padding:16px;border-radius:17px;background:#f7faf8;border:1px solid var(--line)}.practice .en2{font-size:21px;font-weight:900;line-height:1.4;margin-top:7px}.practice .zh2{font-size:14px;color:var(--muted);line-height:1.55;margin-top:7px}.practice .ja2{font-size:14px;color:#5f6e83;line-height:1.55;margin-top:5px;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}.speakRow{display:flex;gap:8px;flex-wrap:wrap}.speak.jaSpeak{background:#315a8c}.tip{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.6}.loading,.error{text-align:center;padding:48px 14px;color:var(--muted);font-weight:850}.error{color:#b42318}.footer{text-align:center;margin-top:14px;color:var(--muted);font-size:12px;line-height:1.6}@media(max-width:520px){.wrap{padding:10px 9px 24px}.card{padding:17px 14px;border-radius:18px}.brand{font-size:17px}.en{font-size:29px}.practice .en2{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">BookWide 每日一句英文</div><div class="date" id="todayDate"></div></div>
  <main class="card" id="app"><div class="loading">正在載入今天的英文…</div></main>
  <div class="footer">每個裝置都有自己的學習進度。第一次從第 1 課開始；同一天維持同一課，隔天再前進一課。</div>
</div>
<script>
const INDEX_URL='/talk/index.json';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function taipeiDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
const PROGRESS_KEYS={lesson:'bookwide_daily_english_lesson',lastDate:'bookwide_daily_english_last_date',startedAt:'bookwide_daily_english_started_at'};
function readPersonalProgress(total){
  const today=taipeiDate();
  let lesson=1,lastDate='',startedAt='';
  try{
    lesson=Math.max(1,parseInt(localStorage.getItem(PROGRESS_KEYS.lesson)||'1',10)||1);
    lastDate=String(localStorage.getItem(PROGRESS_KEYS.lastDate)||'');
    startedAt=String(localStorage.getItem(PROGRESS_KEYS.startedAt)||'');
    if(!startedAt){startedAt=today;localStorage.setItem(PROGRESS_KEYS.startedAt,startedAt);}
    if(!lastDate){
      lastDate=today;
    }else if(lastDate!==today){
      // 無論中斷幾天，重新回來時只前進一課，不會一次跳過多課。
      lesson+=1;
      lastDate=today;
    }
    if(total>0)lesson=((lesson-1)%total)+1;
    localStorage.setItem(PROGRESS_KEYS.lesson,String(lesson));
    localStorage.setItem(PROGRESS_KEYS.lastDate,lastDate);
  }catch(_e){
    lesson=1;lastDate=today;startedAt=today;
  }
  return {lesson,lastDate,startedAt};
}
function normalizeIndex(raw){
  if(Array.isArray(raw?.weeks)){
    const out=[];
    for(const w of raw.weeks){
      const wk=Number((String(w?.week||'').match(/(\d{1,3})/)||[])[1]||0)||0;
      for(const it of (Array.isArray(w?.items)?w.items:[])){
        const filename=String(it?.filename||it?.file||'').trim();
        const id=filename?filename.replace(/\.json$/i,''):String(it?.id||'').trim();
        if(!id)continue;
        out.push({id,title:String(it?.title_zh||it?.title||it?.name||it?.slug||id),week:wk,file:filename?(filename.startsWith('/')?filename:'/talk/'+filename):'/talk/'+id+'.json'});
      }
    }
    return out;
  }
  const arr=Array.isArray(raw)?raw:(Array.isArray(raw?.items)?raw.items:[]);
  return arr.map(it=>{const id=String(it?.id||it?.scene_id||it?.key||'').trim();if(!id)return null;let file=String(it?.file||it?.url||it?.filename||'').trim();if(file&&!file.startsWith('/'))file='/talk/'+file;if(!file)file='/talk/'+id+'.json';const week=Number((String(it?.week||id).match(/(?:W|w)?(\d{1,3})/)||[])[1]||0)||0;return{id,title:String(it?.title_zh||it?.title||it?.name||id),week,file};}).filter(Boolean);
}
function normalizeTurns(raw){const arr=Array.isArray(raw)?raw:(raw?.turns||raw?.dialogue||raw?.lines||raw?.items||raw?.data||[]);return (Array.isArray(arr)?arr:[]).map(t=>({en:String(t?.en??t?.english??t?.text??'').trim(),zh:String(t?.zh??t?.tw??t?.cn??t?.chinese??'').trim(),ja:String(t?.ja??t?.jp??t?.japanese??'').trim(),role:String(t?.role??t?.speaker??'').trim(),fill:String(t?.fill??t?.blank??'').trim(),answer:String(t?.answer??'').trim(),hint:String(t?.hint??'').trim()})).filter(t=>t.en);}
function speak(text,lang='en-US'){if(!('speechSynthesis'in window))return alert('此瀏覽器不支援語音朗讀');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=lang==='ja-JP'?.9:.88;speechSynthesis.speak(u);}
async function load(){
  const app=document.getElementById('app');document.getElementById('todayDate').textContent=taipeiDate();
  try{
    const r=await fetch(INDEX_URL,{cache:'no-store'});if(!r.ok)throw new Error('讀不到 Talk 課程索引');
    const scenes=normalizeIndex(await r.json());if(!scenes.length)throw new Error('目前沒有可用課程');
    const progress=readPersonalProgress(scenes.length);const idx=progress.lesson-1,scene=scenes[idx];
    const sr=await fetch(new URL(scene.file||('/talk/'+scene.id+'.json'),location.origin),{cache:'no-store'});if(!sr.ok)throw new Error('讀不到今天的 Talk 課程');
    const raw=await sr.json(),turns=normalizeTurns(raw);if(!turns.length)throw new Error('今天的課程沒有英文內容');
    const first=turns[0];const practice=turns.find((t,i)=>i>0&&(/user|student|learner/i.test(t.role)||t.fill||t.answer))||turns[1]||first;
    const title=String(raw?.title_zh||raw?.titleZh||scene.title||scene.id);
    app.innerHTML=`<span class="badge">📚 我的每日一句</span><div class="lesson">個人進度 Day ${progress.lesson}｜${esc(title)}</div><div class="label">Today's Sentence</div><div class="en">${esc(first.en)}</div><div class="zh">${esc(first.zh||'')}</div>${first.ja?`<div class="ja">${esc(first.ja)}</div>`:''}<div class="speakRow"><button class="speak" type="button" id="speakMain">🔊 聽英文</button>${first.ja?'<button class="speak jaSpeak" type="button" id="speakMainJa">🔊 聽日文</button>':''}</div><section class="practice"><div class="label" style="margin-top:0">口說回覆</div><div class="en2">${esc(practice.en)}</div><div class="zh2">${esc(practice.zh||'')}</div>${practice.ja?`<div class="ja2">${esc(practice.ja)}</div>`:''}<div class="speakRow"><button class="speak" type="button" id="speakPractice">🔊 聽回覆</button>${practice.ja?'<button class="speak jaSpeak" type="button" id="speakPracticeJa">🔊 聽日文回覆</button>':''}</div></section><div class="tip">這是你自己的學習進度。今天重開仍是同一課；台灣日期進入下一天後，才會前進一課。英文、中文與日文皆直接讀取同一份 Talk 教材。</div>`;
    document.getElementById('speakMain').onclick=()=>speak(first.en,'en-US');document.getElementById('speakPractice').onclick=()=>speak(practice.en,'en-US');
    if(first.ja)document.getElementById('speakMainJa').onclick=()=>speak(first.ja,'ja-JP');
    if(practice.ja)document.getElementById('speakPracticeJa').onclick=()=>speak(practice.ja,'ja-JP');
  }catch(e){app.innerHTML='<div class="error">今日英文載入失敗：'+esc(e.message)+'</div>';}
}
load();
</script>
</body>
</html>
