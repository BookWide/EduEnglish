<div class="pmk-shared-header">
  <div class="pmk-shared-header-in">
    <a href="/pmktools.html" class="pmk-shared-brand">
      <img src="/LOGO.png" alt="PMKTOOLS">
    </a>

    <div class="pmk-shared-contact">
      <div>service@pmktools.net</div>
      <div>04-24632423</div>
    </div>

    <nav class="pmk-shared-nav">
      <a href="/pmktools-about.html">關於我們</a>
      <a href="/pmktools-products.html">產品展示</a>
      <a href="/pmktools-news.html">最新消息</a>
      <a href="/pmktools-video.html">影片</a>
      <a href="/pmktools-catalog.html">型錄下載</a>
      <a href="/pmktools-contact.html">聯絡我們</a>
    </nav>

    <div class="pmk-shared-actions">
      <a id="pmkSharedLogin" href="/pmktools-login.html">登入</a>
      <a href="/pmktools-cart.html">購物車</a>
      <a id="pmkSharedAdmin" class="admin" href="/checklist/pmktools-product-admin.html" style="display:none">Admin</a>
    </div>
  </div>
</div>

<style>
.pmk-shared-header{background:#fff;border-bottom:1px solid #dfe5ec}
.pmk-shared-header-in{
  width:100%;min-height:108px;padding:0 62px;
  display:flex;align-items:center;gap:30px;background:#fff
}
.pmk-shared-brand{display:flex;align-items:center;flex:0 0 auto}
.pmk-shared-brand img{width:138px;height:74px;object-fit:contain;display:block}
.pmk-shared-contact{width:190px;font-size:13px;line-height:1.55;color:#536174;white-space:nowrap;flex:0 0 auto}
.pmk-shared-nav{display:flex;align-items:center;justify-content:center;gap:4px;flex:1;min-width:0;height:100%}
.pmk-shared-nav a{
  display:flex;align-items:center;justify-content:center;height:72px;padding:0 16px;
  color:#111827;text-decoration:none;font-size:14px;font-weight:800;white-space:nowrap;border-radius:6px
}
.pmk-shared-nav a:hover{background:#f3f4f6;color:#b91c1c}
.pmk-shared-actions{display:flex;align-items:center;gap:8px;white-space:nowrap;flex:0 0 auto}
.pmk-shared-actions a{
  border:1px solid #cfd5dd;background:#fff;color:#111827;border-radius:6px;
  padding:10px 12px;text-decoration:none;font-size:12px;font-weight:800
}
.pmk-shared-actions a.admin{background:#111827;color:#fff;border-color:#111827}
@media(max-width:1100px){
  .pmk-shared-header-in{padding:0 18px;gap:14px}
  .pmk-shared-contact{display:none}
  .pmk-shared-nav{overflow:auto;justify-content:flex-start}
  .pmk-shared-nav a{padding:0 11px}
}
@media(max-width:760px){
  .pmk-shared-header-in{min-height:70px;padding:6px 10px;gap:8px;flex-wrap:wrap}
  .pmk-shared-brand img{width:96px;height:54px}
  .pmk-shared-nav{order:3;width:100%;height:42px}
  .pmk-shared-nav a{height:42px;font-size:12px;padding:0 9px}
  .pmk-shared-actions a{padding:7px 8px;font-size:11px}
}
</style>

<script>
(async()=>{
  const API='https://pmktools-api.pmktools.workers.dev';
  const KEY='pmk_session_v1';
  const login=document.getElementById('pmkSharedLogin');
  const admin=document.getElementById('pmkSharedAdmin');
  const token=localStorage.getItem(KEY)||'';
  if(!token)return;
  try{
    const r=await fetch(API+'/api/pmk-auth/me',{
      headers:{Authorization:'Bearer '+token},
      cache:'no-store'
    });
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok||!j.user){
      localStorage.removeItem(KEY);
      return;
    }
    const who=String(j.user.email||j.user.account||'我的帳戶');
    if(login){
      login.textContent=who+'｜我的帳戶';
      login.href='/pmktools-account.html';
    }
    if(admin&&String(j.user.role||'').toLowerCase()==='admin'){
      admin.style.display='inline-block';
    }
  }catch(_){}
})();
</script>
