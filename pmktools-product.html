<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>聯鑽商品詳情｜PMKTOOLS</title>
<style>
:root{--ink:#241b22;--muted:#776970;--line:#eadfe1;--paper:#fffdfc;--rose:#a45157;--soft:#f8f3f2;--green:#267a57}
*{box-sizing:border-box}body{margin:0;background:#f7f6f6;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}a{text-decoration:none;color:inherit}
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #eee}.topin{max-width:1280px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:14px}.brand{font-size:20px;font-weight:950;color:#122642}.topspacer{flex:1}.toplink{font-weight:800;color:#53657b}.cartLink{border:1px solid #ddd;border-radius:999px;padding:8px 13px}.authLink{border:1px solid #d9dee5;border-radius:999px;padding:8px 13px;color:#122642;background:#fff}.authLink.logged{background:#122642;color:#fff;border-color:#122642}
.wrap{max-width:1280px;margin:auto;padding:22px 18px 60px}.product{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 28px rgba(52,35,40,.06)}
.hero{display:grid;grid-template-columns:30% 70%;min-height:520px}.mediaSide{padding:18px;background:#faf8f7;border-right:1px solid var(--line)}.stage{height:410px;border-radius:14px;overflow:hidden;background:#111;display:grid;place-items:center}.stage img,.stage video{width:100%;height:100%;object-fit:contain}.stage iframe{width:100%;height:100%;border:0}.stage.is-image{background:#f1efee}.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto}.thumb{width:58px;height:58px;min-width:58px;border:2px solid transparent;border-radius:8px;overflow:hidden;padding:0;background:#eee;cursor:pointer}.thumb.active{border-color:var(--rose)}.thumb img{width:100%;height:100%;object-fit:cover}.thumb span{display:grid;place-items:center;width:100%;height:100%;background:#151515;color:#fff;font-size:20px}
.info{padding:34px 40px 30px;display:flex;flex-direction:column}.eyebrow{color:#b37377;font-weight:800;font-size:14px;margin-bottom:8px}.title{font-family:Georgia,"Noto Serif TC",serif;font-size:34px;line-height:1.2;margin:0 0 8px}.summary{color:var(--muted);margin:0 0 12px;line-height:1.7}.price{font:800 38px Georgia,serif;color:#9b765d;margin:10px 0 16px}.optGroup{margin:13px 0}.optLabel{font-weight:900;margin-bottom:7px}.options{display:flex;gap:8px;flex-wrap:wrap}.opt{border:1px solid #cbb6b7;background:#fff;border-radius:8px;padding:9px 14px;cursor:pointer}.opt.active{background:#3d3335;color:#fff}.skuPicker{width:100%;max-width:720px;padding:12px 14px;border:1px solid #cbb6b7;border-radius:9px;background:#fff;font-size:16px}.skuHint{font-size:13px;color:var(--muted);margin-top:7px}.varGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.varBtn{display:flex;align-items:center;gap:9px;width:100%;min-height:52px;border:1px solid #e0d4d5;border-radius:10px;padding:6px 10px;background:#fff;text-align:left;cursor:pointer;font-size:15px}.varBtn:hover{border-color:#b98f92}.varBtn.active{border:2px solid #e8562d;color:#e8562d;padding:5px 9px}.varThumb{width:42px;height:42px;flex:0 0 42px;object-fit:cover;border-radius:6px;background:#eee}.selectedSku{margin-top:10px;font-size:14px;font-weight:850;color:#53657b}.stock{color:var(--green);font-weight:850;margin:10px 0}
.qtyrow{display:flex;align-items:center;gap:12px;margin-top:12px}.qtybox{display:flex;border:1px solid #d4c6c8;border-radius:10px;overflow:hidden}.qtybox button{width:42px;height:42px;border:0;background:#fff;font-size:22px;cursor:pointer}.qtybox input{width:54px;text-align:center;border:0;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.btn{border:0;border-radius:11px;padding:14px 16px;font-size:17px;font-weight:950;cursor:pointer}.buy{background:var(--rose);color:#fff}.cart{background:#fff;color:var(--rose);border:1px solid var(--rose)}.btn:disabled{opacity:.45;cursor:not-allowed}
.addons{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}.addons h3{margin:0 0 12px;font-size:18px}.addonGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.addon{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;border:1px solid #eadfe1;border-radius:12px;padding:9px;background:#fff}.addon img{width:76px;height:72px;object-fit:cover;border-radius:8px;background:#eee}.addonName{font-weight:850;font-size:14px;line-height:1.35}.addonPrice{font-size:13px;color:#8b6b5a;margin-top:3px}.addon input{width:20px;height:20px}
.detail{border-top:1px solid var(--line);padding:28px 34px 38px;display:block}.detail h2{margin:0 0 14px}.desc{white-space:pre-wrap;line-height:1.9;color:#44393c}.meta{background:var(--soft);padding:18px;border-radius:12px;height:max-content}.metaRow{padding:9px 0;border-bottom:1px solid #e6d9db}.metaRow:last-child{border-bottom:0}.meta b{display:block;font-size:12px;color:var(--muted)}
.err,.loading{max-width:900px;margin:40px auto;padding:30px;text-align:center}.err{display:none;background:#fff0f1;color:#9d2934;border-radius:12px}
.toast{position:fixed;right:18px;bottom:18px;background:#222;color:#fff;border-radius:10px;padding:12px 16px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:99}.toast.on{opacity:1;transform:none}
/* 淘寶式固定購買列：始終浮在視窗底部，不隨規格清單往下跑 */
.actions{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;width:min(760px,calc(100vw - 28px));display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0;padding:8px;background:rgba(255,255,255,.96);border:1px solid rgba(0,0,0,.06);border-radius:20px;box-shadow:0 10px 32px rgba(0,0,0,.16);backdrop-filter:blur(10px)}
.actions .btn{border-radius:0;border:0;min-height:56px;font-size:18px}.actions .cart{order:1;background:linear-gradient(90deg,#ffc400,#ff9500);color:#fff;border-radius:14px 0 0 14px}.actions .buy{order:2;background:linear-gradient(90deg,#ff7a00,#ff4b16);color:#fff;border-radius:0 14px 14px 0}.actions .btn:disabled{opacity:.55}.wrap{padding-bottom:110px}
@media(max-width:900px){.hero{grid-template-columns:1fr}.mediaSide{border-right:0;border-bottom:1px solid var(--line)}.stage{height:min(58vh,500px)}.info{padding:24px 18px}.detail{grid-template-columns:1fr}.addonGrid{grid-template-columns:1fr}.wrap{padding:10px 8px 36px}}
@media(max-width:480px){.varGrid{grid-template-columns:1fr}.stage{height:48vh;min-height:330px}.title{font-size:27px}.price{font-size:31px}.actions{grid-template-columns:1fr 1fr;width:calc(100vw - 16px);bottom:max(8px,env(safe-area-inset-bottom));padding:6px;border-radius:16px}.actions .btn{min-height:52px;font-size:16px}.toplink.hideMobile{display:none}}

html.pmk-embedded .top{display:none!important}
html.pmk-embedded body{margin:0!important;padding:0!important;background:#fff!important}
html.pmk-embedded .wrap{padding-top:18px!important}

</head><body>
<header class="top"><div class="topin"><a class="brand" href="/pmktools.html">PMKTOOLS 商品</a><div class="topspacer"></div><a class="toplink hideMobile" href="/pmktools.html?page=products">← 商品庫</a><a class="toplink authLink" id="pmkAuthLink" href="/pmktools-login.html">登入</a><a class="toplink cartLink" href="/pmktools-cart.html">🛒 購物車 <span id="cartCount">0</span></a></div></header>

<div class="info"><div id="eyebrow" class="eyebrow"></div><h1 id="name" class="title"></h1><p id="summary" class="summary"></p><div id="price" class="price"></div><div id="options"></div><div id="stock" class="stock"></div>
<div class="qtyrow"><b>數量</b><div class="qtybox"><button id="minus" type="button">−</button><input id="qty" value="1" inputmode="numeric"><button id="plus" type="button">＋</button></div></div>

</div></section>

<div id="toast" class="toast"></div>
<script>
const API='https://pmktools-api.pmktools.workers.dev',CART_KEY='pmktools_cart_v1',$=id=>document.getElementById(id),fmt=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW');
const PMK_AUTH_KEY='pmk_session_v1';
let PMK_CURRENT_USER=null;
async function paintPmkAuthLink(){const a=$('pmkAuthLink');if(!a)return null;const next=location.pathname+location.search+location.hash;const t=localStorage.getItem(PMK_AUTH_KEY)||'';if(!t){PMK_CURRENT_USER=null;a.textContent='登入';a.href='/pmktools-login.html?next='+encodeURIComponent(next);a.classList.remove('logged');return null}try{const r=await fetch(API+'/api/pmk-auth/me',{headers:{Authorization:'Bearer '+t},cache:'no-store'}),j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error('AUTH');PMK_CURRENT_USER=j.user||{};const who=String(PMK_CURRENT_USER.account||PMK_CURRENT_USER.email||'').trim();a.textContent=who?who+'｜我的帳戶':'我的帳戶';a.href='/pmktools-account.html';a.classList.add('logged');return PMK_CURRENT_USER}catch(_){localStorage.removeItem(PMK_AUTH_KEY);PMK_CURRENT_USER=null;a.textContent='登入';a.href='/pmktools-login.html?next='+encodeURIComponent(next);a.classList.remove('logged');return null}}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const productId=String(new URL(location.href).searchParams.get('product')||'').trim();let P=null,ALL=[],selected={},selectedVariation=null;
function youtubeId(url){const m=String(url||'').match(/(?:youtube\.com\/(?:shorts\/|watch\?v=|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/i);return m?m[1]:''}
function cart(){try{return JSON.parse(localStorage.getItem(CART_KEY)||'[]')||[]}catch(_){return[]}}
function saveCart(a){localStorage.setItem(CART_KEY,JSON.stringify(a));paintCartCount()}
function paintCartCount(){$('cartCount').textContent=cart().reduce((s,x)=>s+Number(x.quantity||1),0)}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1500)}
function mediaItems(p){
  const a=[];
  if(p.video_url)a.push({type:youtubeId(p.video_url)?'youtube':'video',url:p.video_url});
  const images=[];
  const pushImage=u=>{u=String(u||'').trim();if(u&&!images.includes(u))images.push(u)};
  pushImage(p.image_url);
  (p.gallery_urls||[]).forEach(pushImage);
  images.slice(0,4).forEach(url=>a.push({type:'image',url}));
  return a
}
function showMedia(it,i){const st=$('stage');st.className='stage'+(it.type==='image'?' is-image':'');if(it.type==='youtube')st.innerHTML=`<iframe src="https://www.youtube.com/embed/${youtubeId(it.url)}?rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;else if(it.type==='video')st.innerHTML=`<video src="${esc(it.url)}" ${P.image_url?`poster="${esc(P.image_url)}"`:''} controls playsinline></video>`;else st.innerHTML=`<img src="${esc(it.url)}" alt="">`;document.querySelectorAll('.thumb').forEach((b,n)=>b.classList.toggle('active',n===i))}
function renderMedia(){const a=mediaItems(P);$('thumbs').innerHTML=a.map((x,i)=>`<button class="thumb ${i===0?'active':''}" data-i="${i}">${x.type==='image'?`<img src="${esc(x.url)}">`:'<span>▶</span>'}</button>`).join('');document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.i);if(a[i])showMedia(a[i],i)});if(a[0])showMedia(a[0],0)}
function showVariationImageSafe(v){
  const url=String(v?.image_url||'').trim();
  if(!url)return;

  // 先找左側既有媒體縮圖；找到就沿用原本 showMedia，完全不重建縮圖。
  const a=mediaItems(P);
  const idx=a.findIndex(x=>x.type==='image'&&String(x.url||'')===url);
  if(idx>=0){
    showMedia(a[idx],idx);
    return;
  }

  // 規格圖若不是主圖／圖庫的一員，只暫時換主顯示區。
  // 不改 thumbs、不改 onclick、不改 mediaItems，左側縮圖仍可照原本方式點回去。
  const st=$('stage');
  if(!st)return;
  const img=new Image();
  img.alt='';
  img.onload=()=>{
    st.className='stage is-image';
    st.innerHTML='';
    st.appendChild(img);
    document.querySelectorAll('.thumb').forEach(b=>b.classList.remove('active'));
  };
  img.onerror=()=>{}; // 載入失敗就維持目前正常畫面，不把左區變黑。
  img.src=url;
}
function groups(){return (P.option_groups?.length?P.option_groups:(P.attributes||[]).map(a=>({name:a.name,required:true,values:a.values||[]})))}
function positivePrice(...vals){
  for(const v of vals){const n=Number(v);if(Number.isFinite(n)&&n>0)return n}
  return 0
}
function variationPrice(v,p=P){return positivePrice(v?.sale_price,v?.price,v?.pricing_applied_price,p?.price,p?.sale_price)}
function visiblePriceText(text){return PMK_CURRENT_USER?text:'登入後顯示價格'}
function requirePmkLogin(){if(PMK_CURRENT_USER)return true;const next=location.pathname+location.search+location.hash;location.href='/pmktools-login.html?next='+encodeURIComponent(next);return false}
function findVar(){const gs=groups();if(!gs.length)return null;if(gs.some(g=>g.required!==false&&!selected[g.name]))return null;return (P.variations||[]).find(v=>v.is_active!==false&&gs.every(g=>String(v.attributes?.[g.name]||'')===String(selected[g.name]||'')))||null}
function refresh(){selectedVariation=findVar();const gs=groups();let can=true,price=Number(P.price||0),stock='可訂購',priceText='';if(gs.length&&!selectedVariation){can=false;stock='請先選擇完整規格';const vp=(P.variations||[]).filter(v=>v&&v.is_active!==false).map(v=>variationPrice(v,P)).filter(n=>n>0);priceText=vp.length?`${fmt(Math.min(...vp))} 起`:'請選擇規格'}else if(selectedVariation){price=variationPrice(selectedVariation,P);if(selectedVariation.stock_tracking_enabled!==false){const q=Number(selectedVariation.stock_qty||0);stock=q>0?`現貨 ${q}`:'此規格缺貨';can=q>0}}else if(P.stock_tracking_enabled===true){const q=Number(P.stock_qty||0);stock=q>0?`現貨 ${q}`:'目前缺貨';can=q>0}$('price').textContent=visiblePriceText(priceText||fmt(price));$('stock').textContent=stock;$('buy').disabled=!can;$('addCart').disabled=!can;if(selectedVariation?.image_url)showVariationImageSafe(selectedVariation)}
function variationName(v,i){
  return String(v?.variation_name||Object.values(v?.attributes||{}).join(' / ')||v?.sku||`型號 ${String(i+1).padStart(2,'0')}`).trim();
}
function skuLooksWeakFrontV204(code){
  const x=String(code||'').normalize('NFKC').trim().toUpperCase();
  if(!x)return true;
  if(/^\d+(?:\.\d+)?(?:L|MM|CM)?$/.test(x))return true;
  if(/^[DRM]\d+(?:\.\d+)?(?:MM)?$/.test(x))return true;
  if(/^\d+(?:\.\d+)?[X×*]\d+(?:\.\d+)?(?:L)?$/.test(x))return true;
  return false;
}
function modelSkuFromVariation(v,i){
  // 後台「SKU 最終確認」為最高優先。人工確認後，前台不得再從品名重猜 100L / D32。
  const productSku=String(P?.sku||'').trim();
  if(P?.sku_manual_locked===true && productSku)return productSku.toUpperCase();

  const stored=String(v?.sku||'').trim();
  if(stored&&!/^BW[-_]/i.test(stored)&&!skuLooksWeakFrontV204(stored))return stored.toUpperCase();

  const name=variationName(v,i).normalize('NFKC');
  const hits=name.match(/[A-Z0-9][A-Z0-9._\/-]{2,31}/ig)||[];
  const model=hits.map(x=>String(x||'').replace(/[._\/-]+$/,'').toUpperCase())
    .find(x=>/[A-Z]/.test(x)&&/\d/.test(x)&&!skuLooksWeakFrontV204(x));
  if(model)return model.slice(0,32);

  // 前台不顯示 source_sku_id，避免暴露供應來源。
  return productSku&&!skuLooksWeakFrontV204(productSku)?productSku.toUpperCase():'';
}
function renderOptions(){
  const box=$('options'),vars=(P.variations||[]).filter(v=>v&&v.is_active!==false);
  if(P.product_type==='variable'&&vars.length){
    box.innerHTML=`<div class="optGroup"><div class="optLabel">商品規格</div><div class="varGrid">${vars.map((v,i)=>`<button type="button" class="varBtn" data-var-i="${i}">${v.image_url?`<img class="varThumb" src="${esc(v.image_url)}" alt="">`:''}<span>${esc(variationName(v,i))}</span></button>`).join('')}</div><div id="selectedSku" class="selectedSku">請先選擇規格</div></div>`;
    box.querySelectorAll('[data-var-i]').forEach(btn=>btn.onclick=()=>{
      const i=Number(btn.dataset.varI);
      selectedVariation=vars[i]||null;
      selected=selectedVariation?{...(selectedVariation.attributes||{})}:{};
      box.querySelectorAll('[data-var-i]').forEach(x=>x.classList.toggle('active',x===btn));
      refreshDirectVariation();
    });
    refreshDirectVariation();return;
  }
  const gs=groups();box.innerHTML=gs.map(g=>`<div class="optGroup"><div class="optLabel">${esc(g.name)}${g.required!==false?' *':''}</div><div class="options">${(g.values||[]).map(v=>`<button type="button" class="opt" data-n="${esc(g.name)}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div></div>`).join('');box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{selected[b.dataset.n]=b.dataset.v;box.querySelectorAll('.opt').forEach(x=>{if(x.dataset.n===b.dataset.n)x.classList.toggle('active',x===b)});refresh()});refresh()
}
function refreshDirectVariation(){
  let can=!!selectedVariation,priceText='請選擇型號',stock='請先選擇規格';
  const skuEl=$('selectedSku');
  if(selectedVariation){
    const price=variationPrice(selectedVariation,P);priceText=fmt(price);stock='可訂購';
    if(selectedVariation.stock_tracking_enabled!==false){const q=Number(selectedVariation.stock_qty||0);stock=q>0?`現貨 ${q}`:'此型號缺貨';can=q>0}
    if(skuEl)skuEl.textContent='SKU：'+(modelSkuFromVariation(selectedVariation,0)||'—');
    if(selectedVariation.image_url)showVariationImageSafe(selectedVariation)
  }else{
    const vp=(P.variations||[]).filter(v=>v&&v.is_active!==false).map(v=>variationPrice(v,P)).filter(n=>n>0);if(vp.length)priceText=`${fmt(Math.min(...vp))} 起`;
    if(skuEl)skuEl.textContent='請先選擇規格';
  }
  $('price').textContent=visiblePriceText(priceText);$('stock').textContent=stock;$('buy').disabled=!can;$('addCart').disabled=!can
}
function qty(){return Math.max(1,Math.min(99,Math.floor(Number($('qty').value)||1)))}
function lineFor(p,quantity=1,variation=null,opts={}){const publicSku=(p?.sku_manual_locked===true&&String(p?.sku||'').trim())?String(p.sku).trim():String(variation?.sku||p.sku||'').trim();return {product_id:p.id,name:p.name,image_url:variation?.image_url||p.image_url||'',quantity,variation_id:variation?.id||'',sku:publicSku,variation_name:variation?variationName(variation,0):'',selected_options:opts,unit_price:variation?variationPrice(variation,p):positivePrice(p?.price,p?.sale_price)}}
function addonSelected(){
  return [...document.querySelectorAll('[data-addon-check]')].filter(c=>c.checked).map(c=>{
    const p=ALL.find(x=>String(x.id)===String(c.dataset.addonCheck));if(!p)return null;
    const qtyEl=document.querySelector(`[data-addon-qty="${CSS.escape(String(p.id))}"]`);
    return {product:p,quantity:Math.max(1,Math.min(99,Number(qtyEl?.value||1)))};
  }).filter(Boolean)
}
function currentGroup(){
  return {group_id:'g_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7),parent:lineFor(P,qty(),selectedVariation,selected),children:addonSelected().map(x=>lineFor(x.product,x.quantity,null,{}))}
}
function addCurrentToCart(go=false){
  if(!requirePmkLogin())return;
  const a=cart(),g=currentGroup();a.push(g);saveCart(a);toast(`已加入購物車：1 主商品＋${g.children.length} 子項`);if(go)location.href='/pmktools-cart.html'
}
function directBuy(){
  if(!requirePmkLogin())return;
  const g=currentGroup();sessionStorage.setItem('pmktools_direct_group',JSON.stringify([g]));location.href='/pmktools-checkout.html?mode=cart&direct=1'
}
function renderAddons(){
  const defs=(P.add_on_items&&P.add_on_items.length)?P.add_on_items:(P.add_on_product_ids||[]).map((id,i)=>({product_id:id,default_qty:1,required:false,sort_order:i}));
  const rows=defs.map(d=>({def:d,p:ALL.find(x=>String(x.id)===String(d.product_id))})).filter(x=>x.p&&x.p.is_active!==false);
  if(!rows.length)return;
  $('addons').hidden=false;
  $('addonGrid').innerHTML=rows.map(({def,p})=>`<label class="addon"><img src="${esc(p.image_url||'')}"><span><span class="addonName">${esc(p.name)}</span><span class="addonPrice">${PMK_CURRENT_USER?fmt(p.price):'登入後顯示價格'} ${def.required?'<b style="color:#a45157">・必選</b>':''}</span><span style="display:block;margin-top:6px;font-size:12px">數量 <input data-addon-qty="${esc(p.id)}" type="number" min="1" max="99" value="${Math.max(1,Number(def.default_qty||1))}" style="width:54px"></span></span><input type="checkbox" data-addon-check="${esc(p.id)}" ${def.required?'checked disabled':''}></label>`).join('')
}
async function boot(){try{const t=localStorage.getItem(PMK_AUTH_KEY)||'';const r=await fetch(API+'/api/pmk-products',{headers:t?{Authorization:'Bearer '+t}:{},cache:'no-store'}),j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.error||'讀取失敗');ALL=j.products||[];P=ALL.find(p=>{const q=String(productId).trim().toLowerCase();const vars=Array.isArray(p.variations)?p.variations:[];const keys=[p.id,p.external_id,p.sku,...vars.map(v=>v?.sku)].map(x=>String(x||'').trim().toLowerCase()).filter(Boolean);return keys.includes(q)});if(!P)throw new Error('找不到商品');const publicSku=String(P.sku||((Array.isArray(P.variations)?P.variations:[]).find(v=>String(v?.sku||'').trim())?.sku)||'').trim();if(publicSku&&String(productId)!==publicSku){const u=new URL(location.href);u.searchParams.set('product',publicSku);history.replaceState(null,'',u.pathname+u.search+u.hash)};if(P.is_addon_product===true)throw new Error('此商品為加購子項，僅能依附主商品選購，不能單獨購買。');$('eyebrow').textContent='PMKTOOLS・'+(P.category||'商品');$('name').textContent=P.name;$('summary').textContent=P.detail_summary||'';$('description').textContent=P.detail_description||'此商品目前尚未填寫詳細介紹。';renderMedia();renderOptions();renderAddons();$('loading').hidden=true;$('product').hidden=false}catch(e){$('loading').hidden=true;$('err').style.display='block';$('err').textContent='商品載入失敗：'+String(e.message||e)}}
(async()=>{await paintPmkAuthLink();await boot()})();$('minus').onclick=()=>{$('qty').value=Math.max(1,qty()-1)};$('plus').onclick=()=>{$('qty').value=Math.min(99,qty()+1)};$('qty').onchange=()=>{$('qty').value=qty()};$('buy').onclick=directBuy;$('addCart').onclick=()=>addCurrentToCart(false);paintCartCount();
</script></body></html>
