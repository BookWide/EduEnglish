<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>福利品結帳｜BookWide</title>
<script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
<style>body{margin:0;background:#f5f7fb;color:#0f172a;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:820px;margin:28px auto;padding:0 14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:22px;box-shadow:0 12px 34px rgba(15,23,42,.07)}h1{margin:0 0 8px;font-size:28px}.muted{color:#64748b}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eef2f7}.row b{font-size:18px}.total{font-size:30px;font-weight:950;color:#0f766e}.pts{color:#b45309}.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:900;background:#06c755;color:#fff;cursor:pointer;margin-top:18px}.btn:disabled{opacity:.55}.back{color:#2563eb;text-decoration:none;font-weight:800}.notice{margin-top:14px;padding:12px;border-radius:14px;background:#f8fafc;color:#475569;line-height:1.6}.err{display:none;margin-top:14px;padding:12px;border-radius:12px;background:#fff1f2;color:#be123c;white-space:pre-wrap}.ok{display:none;margin-top:14px;padding:14px;border-radius:12px;background:#ecfdf5;color:#047857;font-weight:800}@media(max-width:600px){.wrap{margin:12px auto}.card{padding:16px}h1{font-size:23px}}</style></head><body><div class="wrap"><div class="top"><a class="back" href="/line-gifts.html?from=referral">← 返回商品庫</a><span id="loginState" class="muted">檢查登入中…</span></div><div class="card"><h1>🎁 BookWide 福利品結帳</h1><div class="muted" id="productName">讀取商品中…</div><div style="margin-top:16px">
<div class="row"><span>商品價格</span><b id="price">—</b></div><div class="row"><span>累積推薦點</span><b class="pts" id="earned">—</b></div><div class="row"><span>已保留／已使用</span><b class="pts" id="reserved">—</b></div><div class="row"><span>可用推薦點</span><b class="pts" id="available">—</b></div><div class="row"><span>本次推薦點折抵</span><b class="pts" id="points">—</b></div><div class="row"><span>折抵後金額</span><b id="net">—</b></div><div class="row"><span>5%</span><b id="fee">—</b></div><div class="row"><span>信用卡實際收款</span><b class="total" id="cash">—</b></div></div><div id="holdBox" class="notice" style="display:none"></div><div class="notice">V51.1 固定規則：<b>商品一律讀 R2；推薦點與訂單一律走 Supabase 交易資料。</b><br><b>1 推薦點 = NT$1</b>，有點先折抵，剩餘金額加 5%。咖啡、LINE 商品、花卉與合作商品全部走同一個 Checkout Core；只有最後履約分為發券或實體出貨。</div><button id="pay" class="btn" disabled>確認購買</button><div id="err" class="err"></div><div id="ok" class="ok"></div></div></div>
<script>
const SUPABASE_URL='https://jeajrwpmrgczimmrflxo.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplYWpyd3BtcmdjemltbXJmbHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3MTg5MzksImV4cCI6MjA3NjI5NDkzOX0.3iFXdHH0JEuk177_R4TGFJmOxYK9V8XctON6rDe7-Do';
const API='https://bookwide-hiking-api.pmktools.workers.dev';
const SB=supabase.createClient(SUPABASE_URL,KEY),$=id=>document.getElementById(id),fmt=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW');
const productId=String(new URL(location.href).searchParams.get('product')||'').trim();
let preview=null,session=null;
function showError(m){$('err').style.display='block';$('err').textContent=m;$('pay').disabled=true}
function paint(v){preview=v;const price=Number(v.price||0),earned=Number(v.earned_points||0),reserved=Number(v.reserved_points||0),available=Number(v.available_points||0),used=Number(v.points_used||0),net=Number(v.net_after_points||0),fee=Number(v.fee_5||0),cash=Number(v.cash_amount||0);$('productName').textContent=v.product?.name||'BookWide 福利品';$('price').textContent=fmt(price);$('earned').textContent=earned.toLocaleString('zh-TW')+' 點';$('reserved').textContent=reserved.toLocaleString('zh-TW')+' 點';$('available').textContent=available.toLocaleString('zh-TW')+' 點';$('points').textContent='- '+used.toLocaleString('zh-TW')+' 點';$('net').textContent=fmt(net);$('fee').textContent=fmt(fee);$('cash').textContent=fmt(cash);const holds=Array.isArray(v.holds)?v.holds:[];if(reserved>0){const lines=holds.length?holds.map(h=>`${h.label||'訂單'}：${Number(h.points||0)} 點（${h.status||'保留中'}）`).join('<br>'):`目前有 ${reserved.toLocaleString('zh-TW')} 點被既有申請／訂單保留。`; $('holdBox').style.display='block';$('holdBox').innerHTML=`<b>點數明細：</b>累積 ${earned.toLocaleString('zh-TW')} 點 − 已保留／已使用 ${reserved.toLocaleString('zh-TW')} 點 = 可用 ${available.toLocaleString('zh-TW')} 點。<br>${lines}`;}else{$('holdBox').style.display='none';$('holdBox').textContent='';}if(v.can_checkout===false){$('pay').textContent=v.reason==='REFERRAL_POINTS_NOT_ENOUGH'?'推薦點不足':'目前無法結帳';$('pay').disabled=true}else{$('pay').textContent=cash>0?(used>0?`使用 ${used} 點＋刷卡 ${fmt(cash)}`:`刷卡 ${fmt(cash)}`):`使用 ${used} 點全額兌換`;$('pay').disabled=false}}
async function apiPost(path,body){if(!session?.access_token)throw new Error('AUTH_REQUIRED');const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),15000);try{const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify(body),cache:'no-store',signal:ctl.signal});const text=await r.text();let j={};try{j=text?JSON.parse(text):{}}catch(_){throw new Error(text||('HTTP '+r.status))}if(!r.ok||j.ok===false)throw new Error(j.message||j.error||('HTTP '+r.status));return j}finally{clearTimeout(t)}}
async function boot(){
 $('pay').disabled=true;$('err').style.display='none';if(!productId)return showError('缺少商品 ID');
 try{const a=await SB.auth.getSession();if(a.error)throw a.error;session=a.data?.session||null}catch(e){return showError('登入檢查失敗：'+e.message)}
 if(!session){$('loginState').textContent='尚未登入';return showError('請先登入 BookWide 後再購買福利品。')}
 $('loginState').textContent=session.user.email||'已登入';
 try{const v=await apiPost('/api/bw-checkout-preview',{product_id:productId});paint(v)}catch(e){showError('結帳預覽失敗：'+String(e?.message||e))}
}
$('pay').onclick=async()=>{if(!preview||preview.can_checkout===false)return;$('pay').disabled=true;$('err').style.display='none';try{const o=await apiPost('/api/bw-checkout-create',{product_id:productId});if(Number(o.cash_amount||0)===0){$('ok').style.display='block';$('ok').textContent=`訂單完成：已使用 ${Number(o.points_used||0)} 推薦點，${o.fulfillment_type==='ship'?'已進入待出貨':'已進入待發券'}。`;$('pay').style.display='none';return}const resp=await fetch(SUPABASE_URL+'/functions/v1/create-line-gift-ecpay-order',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({order_id:o.order_id})});const text=await resp.text();if(!resp.ok)throw new Error('付款建立失敗：'+text);let j;try{j=JSON.parse(text)}catch(_){throw new Error('付款建立失敗：回傳格式錯誤')}if(j.html){document.open();document.write(j.html);document.close();return}throw new Error('付款建立失敗：缺少付款表單')}catch(e){showError(String(e?.message||e))}};
boot();
</script></body></html>
