<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>福利品結帳｜BookWide</title>
<script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
<style>body{margin:0;background:#f5f7fb;color:#0f172a;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:820px;margin:28px auto;padding:0 14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:22px;box-shadow:0 12px 34px rgba(15,23,42,.07)}h1{margin:0 0 8px;font-size:28px}.muted{color:#64748b}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eef2f7}.row b{font-size:18px}.total{font-size:30px;font-weight:950;color:#0f766e}.pts{color:#b45309}.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:900;background:#06c755;color:#fff;cursor:pointer;margin-top:18px}.btn:disabled{opacity:.55}.back{color:#2563eb;text-decoration:none;font-weight:800}.notice{margin-top:14px;padding:12px;border-radius:14px;background:#f8fafc;color:#475569;line-height:1.6}.err{display:none;margin-top:14px;padding:12px;border-radius:12px;background:#fff1f2;color:#be123c;white-space:pre-wrap}.ok{display:none;margin-top:14px;padding:14px;border-radius:12px;background:#ecfdf5;color:#047857;font-weight:800}@media(max-width:600px){.wrap{margin:12px auto}.card{padding:16px}h1{font-size:23px}}</style></head><body><div class="wrap"><div class="top"><a class="back" href="/line-gifts.html?from=referral">← 返回商品庫</a><span id="loginState" class="muted">檢查登入中…</span></div><div class="card"><h1>🎁 BookWide 福利品結帳</h1><div class="muted" id="productName">讀取商品中…</div><div style="margin-top:16px">
<div class="row"><span>商品價格</span><b id="price">—</b></div>
<div class="row"><span>可用推薦點</span><b class="pts" id="available">—</b></div>
<div class="row"><span>本次推薦點折抵</span><b class="pts" id="points">—</b></div>
<div class="row"><span>折抵後金額</span><b id="net">—</b></div>
<div class="row"><span>5%</span><b id="fee">—</b></div>
<div class="row"><span>信用卡實際收款</span><b class="total" id="cash">—</b></div>
</div><div class="notice">固定規則：<b>1 推薦點 = NT$1</b>。系統會自動使用可用推薦點，剩餘金額再加 5%。若推薦點足以全額折抵，信用卡收款為 NT$0。刷卡未完成時，點數只保留 30 分鐘，不會永久扣除。</div><button id="pay" class="btn" disabled>確認購買</button><div id="err" class="err"></div><div id="ok" class="ok"></div></div></div>
<script>
const SUPABASE_URL='https://jeajrwpmrgczimmrflxo.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplYWpyd3BtcmdjemltbXJmbHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3MTg5MzksImV4cCI6MjA3NjI5NDkzOX0.3iFXdHH0JEuk177_R4TGFJmOxYK9V8XctON6rDe7-Do';
const HIKING_API_BASE='https://bookwide-hiking-api.pmktools.workers.dev';
const SB=supabase.createClient(SUPABASE_URL,KEY),$=id=>document.getElementById(id),fmt=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW');
const productKey=String(new URL(location.href).searchParams.get('product')||'').trim();
let preview=null,product=null,legacyId=null;
function error(m){$('err').style.display='block';$('err').textContent=m;$('pay').disabled=true}
async function loadR2Product(){const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),10000);let r;try{r=await fetch(HIKING_API_BASE+'/api/bw-products',{cache:'no-store',signal:ctl.signal})}finally{clearTimeout(t)};const j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false||!Array.isArray(j.products))throw new Error(j.message||j.error||('商品 API HTTP '+r.status));return j.products.find(p=>String(p.id||p.external_id||'')===productKey)||null}
function paint(v){const price=Number(v.price||0),available=Math.max(0,Number(v.available_points||0)),pointsUsed=Math.max(0,Number(v.points_used||0)),net=Math.max(0,Number(v.net_after_points??(price-pointsUsed))),fee=Math.max(0,Number(v.fee_5??Math.round(net*.05))),cash=Math.max(0,Number(v.cash_amount??(net+fee)));preview={...v,price,available_points:available,points_used:pointsUsed,net_after_points:net,fee_5:fee,cash_amount:cash};$('productName').textContent=v.product_name||product?.name||'BookWide 福利品';$('price').textContent=fmt(price);$('available').textContent=available.toLocaleString('zh-TW')+' 點';$('points').textContent='- '+pointsUsed.toLocaleString('zh-TW')+' 點';$('net').textContent=fmt(net);$('fee').textContent=fmt(fee);$('cash').textContent=fmt(cash);$('pay').textContent=cash>0?(pointsUsed>0?`使用 ${pointsUsed} 點＋刷卡 ${fmt(cash)}`:`0 點折抵＋刷卡 ${fmt(cash)}`):`使用 ${pointsUsed} 點全額兌換`; $('pay').disabled=false}
async function boot(){
 $('pay').disabled=true;$('productName').textContent='讀取商品中…';$('loginState').textContent='檢查登入中…';
 if(!productKey)return error('缺少商品 ID');
 // V50.6：先讀 R2 商品。Supabase 登入慢或失敗，不再讓商品畫面永遠卡在「讀取商品中」。
 try{product=await loadR2Product()}catch(e){return error('R2 商品讀取失敗：'+(e?.name==='AbortError'?'連線逾時':e.message))}
 if(!product)return error('找不到商品：'+productKey);
 if(product.is_active===false)return error('此商品目前已下架。');
 legacyId=Number(product.legacy_db_id||0)||null;
 paint({product_name:product.name,price:Number(product.price||0),available_points:0,points_used:0,net_after_points:Number(product.price||0),fee_5:Math.round(Number(product.price||0)*.05),cash_amount:Math.round(Number(product.price||0)*1.05)});
 let session=null;
 try{const ar=await Promise.race([SB.auth.getSession(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('AUTH_TIMEOUT')),10000))]);if(ar.error)throw ar.error;session=ar.data?.session||null}
 catch(e){$('loginState').textContent='登入檢查逾時';$('pay').disabled=true;return error('BookWide 登入檢查逾時，請重新整理後再試。')}
 if(!session){$('loginState').textContent='尚未登入';$('pay').disabled=true;return error('請先登入 BookWide 後再購買福利品。')}
 $('loginState').textContent=session.user.email||'已登入';
 if(legacyId){const {data,error:e}=await SB.rpc('preview_line_gift_purchase',{p_product_id:legacyId});if(e)return error('商品結帳預覽失敗：'+e.message);const v=Array.isArray(data)?data[0]:data;if(!v)return error('商品目前無法結帳。');paint(v);return}
 // R2-only 合作商品已完整讀取；不建立 Supabase 商品副本。
 $('pay').disabled=false;
}
$('pay').onclick=async()=>{if(!preview||!product)return;if(!legacyId){return error('此商品已使用 R2 商品 ID「'+productKey+'」正確讀入；目前付款後端仍是舊 LINE 數字 ID RPC，V50.5 已停止錯誤送入，避免建立錯單。')}$('pay').disabled=true;$('err').style.display='none';const {data,error:e}=await SB.rpc('create_line_gift_order',{p_product_id:legacyId});if(e)return error(e.message);const o=Array.isArray(data)?data[0]:data;if(!o)return error('建立訂單失敗');if(Number(o.cash_amount)===0){$('ok').style.display='block';$('ok').textContent=`兌換成功：已使用 ${o.points_used} 點，訂單已進入待送禮。`;$('pay').style.display='none';return}const {data:{session}}=await SB.auth.getSession();const resp=await fetch(SUPABASE_URL+'/functions/v1/create-line-gift-ecpay-order',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({order_id:o.order_id})});const text=await resp.text();if(!resp.ok)return error('付款建立失敗：'+text);let j;try{j=JSON.parse(text)}catch(_){return error('付款建立失敗：回傳格式錯誤')}if(j.html){document.open();document.write(j.html);document.close();return}error('付款建立失敗：缺少付款表單')};boot();
</script></body></html>
