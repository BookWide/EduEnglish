<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>福利品結帳｜BookWide</title>
<script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
<style>body{margin:0;background:#f5f7fb;color:#0f172a;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:900px;margin:24px auto;padding:0 14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:22px;box-shadow:0 12px 34px rgba(15,23,42,.07)}h1{margin:0 0 14px}.muted{color:#64748b}.bundle{margin:14px 0;border:1px solid #e7e9ed;border-radius:12px;overflow:hidden}.line{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid #eef0f2}.line.child{padding-left:34px;background:#fafbfc}.line:last-child{border-bottom:0}.tag{font-size:11px;background:#eee7e8;color:#8e4d52;border-radius:999px;padding:2px 6px;margin-right:5px}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eef2f7}.row b{font-size:18px}.total{font-size:28px!important;color:#0f766e}.pts{color:#b45309}.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:900;background:#9f5056;color:#fff;cursor:pointer;margin-top:18px}.btn:disabled{opacity:.5}.notice{margin-top:14px;padding:12px;border-radius:14px;background:#f8fafc;color:#475569;line-height:1.6}.err,.ok{display:none;margin-top:14px;padding:12px;border-radius:12px}.err{background:#fff1f2;color:#be123c}.ok{background:#ecfdf5;color:#047857;font-weight:800}.back{color:#2563eb;text-decoration:none;font-weight:800}</style></head>
<body><div class="wrap"><div class="top"><a class="back" href="/line-gift-cart.html">← 返回購物車</a><span id="loginState" class="muted">檢查登入中…</span></div><div class="card"><h1>🎁 BookWide 福利品結帳</h1><div id="items"></div><div class="row"><span>商品總額</span><b id="price">—</b></div><div class="row"><span>可用推薦點</span><b class="pts" id="available">—</b></div><div class="row"><span>本次推薦點折抵</span><b class="pts" id="points">—</b></div><div class="row"><span>折抵後金額</span><b id="net">—</b></div><div class="row"><span>5%</span><b id="fee">—</b></div><div class="row"><span>信用卡實際收款</span><b class="total" id="cash">—</b></div><div class="notice">購物車內所有主商品與加購子項會合併成 <b>同一筆訂單、同一次付款</b>。推薦點針對整張訂單一起折抵。</div><button id="pay" class="btn" disabled>確認整車結帳</button><div id="err" class="err"></div><div id="ok" class="ok"></div></div></div>
<script>
const SUPABASE_URL='https://jeajrwpmrgczimmrflxo.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplYWpyd3BtcmdjemltbXJmbHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3MTg5MzksImV4cCI6MjA3NjI5NDkzOX0.3iFXdHH0JEuk177_R4TGFJmOxYK9V8XctON6rDe7-Do',API='https://bookwide-hiking-api.pmktools.workers.dev',CART_KEY='bw_gift_cart_v1';
const SB=supabase.createClient(SUPABASE_URL,KEY),$=id=>document.getElementById(id),fmt=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW');
const P=new URL(location.href).searchParams,mode=P.get('mode')||'single';let session=null,preview=null,groups=[];
function error(m){$('err').style.display='block';$('err').textContent=m;$('pay').disabled=true}
function getGroups(){
 if(mode==='cart'){
  if(P.get('direct')==='1'){try{return JSON.parse(sessionStorage.getItem('bw_gift_direct_group')||'[]')||[]}catch(_){return[]}}
  try{return JSON.parse(localStorage.getItem(CART_KEY)||'[]')||[]}catch(_){return[]}
 }
 const opts=(()=>{try{return JSON.parse(P.get('opts')||'{}')||{}}catch(_){return{}}})();
 return [{group_id:'single',parent:{product_id:String(P.get('product')||''),quantity:Math.max(1,Number(P.get('quantity')||1)),variation_id:String(P.get('variant')||''),selected_options:opts},children:[]}];
}
async function api(path,body){const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify(body),cache:'no-store'}),t=await r.text();let j={};try{j=JSON.parse(t)}catch(_){throw new Error(t||('HTTP '+r.status))}if(!r.ok||j.ok===false)throw new Error(j.message||j.error||('HTTP '+r.status));return j}
function renderItems(cart){
 const box=$('items');if(!cart?.groups?.length){box.innerHTML='';return}
 box.innerHTML=cart.groups.map(g=>`<div class="bundle"><div class="line"><span><b>${g.parent.name}</b> × ${g.parent.quantity}</span><b>${fmt(g.parent.line_total)}</b></div>${(g.children||[]).map(c=>`<div class="line child"><span><span class="tag">加購</span>${c.name} × ${c.quantity}</span><b>${fmt(c.line_total)}</b></div>`).join('')}</div>`).join('')
}
function paint(v){preview=v;renderItems(v.cart);$('price').textContent=fmt(v.price);$('available').textContent=Number(v.available_points||0).toLocaleString('zh-TW')+' 點';$('points').textContent='- '+Number(v.points_used||0).toLocaleString('zh-TW')+' 點';$('net').textContent=fmt(v.net_after_points);$('fee').textContent=fmt(v.fee_5);$('cash').textContent=fmt(v.cash_amount);$('pay').textContent=Number(v.cash_amount||0)>0?`確認整車付款 ${fmt(v.cash_amount)}`:`使用 ${Number(v.points_used||0)} 點全額兌換`;$('pay').disabled=false}
async function boot(){groups=getGroups();if(!groups.length)return error('購物車是空的');const a=await SB.auth.getSession();session=a.data?.session||null;if(!session){$('loginState').textContent='尚未登入';return error('請先登入 BookWide 後再結帳。')}$('loginState').textContent=session.user.email||'已登入';try{paint(await api('/api/bw-cart-checkout-preview',{groups}))}catch(e){error('結帳預覽失敗：'+String(e.message||e))}}
$('pay').onclick=async()=>{if(!preview)return;const msg=`確認一次結帳全部商品？\n\n商品總額 ${fmt(preview.price)}\n推薦點折抵 ${Number(preview.points_used||0)} 點\n信用卡 ${fmt(preview.cash_amount)}`;if(!confirm(msg))return;$('pay').disabled=true;$('err').style.display='none';try{const o=await api('/api/bw-cart-checkout-create',{groups});if(Number(o.cash_amount||0)===0){$('ok').style.display='block';$('ok').textContent='整張購物車已完成兌換，建立為同一筆訂單。';localStorage.removeItem(CART_KEY);sessionStorage.removeItem('bw_gift_direct_group');$('pay').style.display='none';return}localStorage.setItem('bw_gift_pending_order',String(o.order_id||''));const resp=await fetch(SUPABASE_URL+'/functions/v1/create-line-gift-ecpay-order',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({order_id:o.order_id})}),text=await resp.text();if(!resp.ok)throw new Error('付款建立失敗：'+text);let j;try{j=JSON.parse(text)}catch(_){throw new Error('付款建立失敗：回傳格式錯誤')}if(j.html){document.open();document.write(j.html);document.close();return}throw new Error('付款建立失敗：缺少付款表單')}catch(e){error(String(e.message||e));$('pay').disabled=false}};
boot();
</script></body></html>
