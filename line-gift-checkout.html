<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BW 福利品結帳｜BookWide</title>
<script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
<style>body{margin:0;background:#f5f7fb;color:#0f172a;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:820px;margin:28px auto;padding:0 14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:22px;box-shadow:0 12px 34px rgba(15,23,42,.07)}h1{margin:0 0 8px;font-size:28px}.muted{color:#64748b}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eef2f7}.row b{font-size:18px}.total{font-size:30px;font-weight:950;color:#0f766e}.pts{color:#b45309}.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:900;background:#06c755;color:#fff;cursor:pointer;margin-top:18px}.btn:disabled{opacity:.55}.back{color:#2563eb;text-decoration:none;font-weight:800}.notice{margin-top:14px;padding:12px;border-radius:14px;background:#f8fafc;color:#475569;line-height:1.6}.err{display:none;margin-top:14px;padding:12px;border-radius:12px;background:#fff1f2;color:#be123c;white-space:pre-wrap}.ok{display:none;margin-top:14px;padding:14px;border-radius:12px;background:#ecfdf5;color:#047857;font-weight:800}@media(max-width:600px){.wrap{margin:12px auto}.card{padding:16px}h1{font-size:23px}}</style></head><body><div class="wrap"><div class="top"><a class="back" href="/line-gifts.html?from=referral">← 返回福利品</a><span id="loginState" class="muted">檢查登入中…</span></div><div class="card"><h1>🎁 BookWide 福利品結帳 <small style="font-size:13px;color:#64748b">V48.1</small></h1><div class="muted" id="productName">讀取商品中…</div><div style="margin-top:16px">
<div class="row"><span>商品價格</span><b id="price">—</b></div><div class="row"><span>福利品規則</span><b id="rule">—</b></div><div class="row"><span>庫存</span><b id="stock">—</b></div>
<div class="row"><span>可用推薦點（0 點也可購買）</span><b class="pts" id="available">—</b></div>
<div class="row"><span>本次推薦點折抵</span><b class="pts" id="points">—</b></div>
<div class="row"><span>折抵後金額</span><b id="net">—</b></div>
<div class="row"><span>5%</span><b id="fee">—</b></div>
<div class="row"><span>PAYUNi 實際收款</span><b class="total" id="cash">—</b></div>
</div><div class="notice">固定規則：<b>1 推薦點 = NT$1</b>。<b>NT$200 以下福利品只接受推薦點全額兌換，不進 PAYUNi。</b><b>0 點也可以購買</b>；有點數就先自動折抵，沒有點數就直接以商品價格計算，剩餘金額再加 5%。若推薦點足以全額折抵，PAYUNi 收款為 NT$0。PAYUNi 付款未完成時，點數只保留 30 分鐘，不會永久扣除。</div><button id="pay" class="btn" disabled>確認購買</button><div id="err" class="err"></div><div id="ok" class="ok"></div></div></div>
<script>
const SUPABASE_URL='https://jeajrwpmrgczimmrflxo.supabase.co';const PAYUNI_CHECKOUT_FUNCTION_URL=SUPABASE_URL+'/functions/v1/payuni-checkout';const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplYWpyd3BtcmdjemltbXJmbHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3MTg5MzksImV4cCI6MjA3NjI5NDkzOX0.3iFXdHH0JEuk177_R4TGFJmOxYK9V8XctON6rDe7-Do';const SB=supabase.createClient(SUPABASE_URL,KEY);const $=id=>document.getElementById(id);const fmt=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW');const pid=Number(new URL(location.href).searchParams.get('product')||0);let preview=null;function error(m){$('err').style.display='block';$('err').textContent=m;$('pay').disabled=false}
async function boot(){
  $('pay').disabled=true;
  $('productName').textContent='讀取商品中…';
  $('loginState').textContent='檢查登入中…';
  const {data:{session},error:sessionError}=await SB.auth.getSession();
  if(sessionError){$('loginState').textContent='登入檢查失敗';error('登入檢查失敗：'+sessionError.message);return}
  if(!session){$('loginState').textContent='尚未登入';error('請先登入 BookWide 後再購買 福利品。推薦點不是購買資格，0 點也可購買。');return}
  $('loginState').textContent=session.user.email||'已登入';
  if(!pid){error('缺少商品 ID');return}
  const {data,error:e}=await SB.rpc('preview_line_gift_purchase',{p_product_id:pid});
  if(e){error('商品結帳預覽失敗：'+e.message);return}
  preview=Array.isArray(data)?data[0]:data;
  if(!preview){error('找不到商品，或商品目前無法結帳。');return}
  const {data:product,error:productError}=await SB.from('line_gift_products').select('id,price,sale_mode,fulfillment_type,stock_qty,stock_tracking_enabled,is_active').eq('id',pid).maybeSingle();
  if(productError||!product||product.is_active===false){error('商品目前無法兌換／購買。');return}
  const redeemOnly=Number(product.price||0)<200||product.sale_mode==='redeem_only';
  const stockQty=Number(product.stock_qty||0);
  preview={...preview,redeem_only:redeemOnly,stock_qty:stockQty,stock_tracking_enabled:product.stock_tracking_enabled===true,fulfillment_type:product.fulfillment_type||'voucher'};
  const price=Number(preview.price||0);
  const available=Math.max(0,Number(preview.available_points||0));
  const pointsUsed=Math.max(0,Number(preview.points_used||0));
  const net=Math.max(0,Number(preview.net_after_points ?? (price-pointsUsed)));
  const fee=Math.max(0,Number(preview.fee_5 ?? Math.round(net*0.05)));
  const cash=Math.max(0,Number(preview.cash_amount ?? (net+fee)));
  preview={...preview,price,available_points:available,points_used:pointsUsed,net_after_points:net,fee_5:fee,cash_amount:cash};
  $('productName').textContent=preview.product_name||'福利品';
  $('rule').textContent=preview.redeem_only?'只接受推薦點兌換':'推薦點折抵／PAYUNi 付款';
  $('stock').textContent=preview.stock_tracking_enabled?(preview.stock_qty>0?String(preview.stock_qty):'缺貨'):'未啟用庫存限制';
  if(preview.stock_tracking_enabled&&preview.stock_qty<=0){error('此福利品目前缺貨。');$('pay').disabled=true;return}
  if(preview.redeem_only&&available<price){
    $('pay').textContent=`需要 ${price.toLocaleString('zh-TW')} 點才能兌換`;
    $('pay').disabled=true;
  }
  $('price').textContent=fmt(price);
  $('available').textContent=available.toLocaleString('zh-TW')+' 點';
  $('points').textContent='- '+pointsUsed.toLocaleString('zh-TW')+' 點';
  $('net').textContent=fmt(net);
  $('fee').textContent=fmt(fee);
  $('cash').textContent=fmt(cash);
  $('pay').textContent=cash>0
    ? (pointsUsed>0?`使用 ${pointsUsed} 點＋刷卡 ${fmt(cash)}`:`0 點折抵＋刷卡 ${fmt(cash)}`)
    : `使用 ${pointsUsed} 點全額兌換`;
  if(!(preview.redeem_only&&available<price))$('pay').disabled=false;
}
$('pay').onclick=async()=>{
  if(!preview)return;
  $('pay').disabled=true;
  $('err').style.display='none';
  try{
    const {data,error:e}=await SB.rpc('create_line_gift_order',{p_product_id:pid});
    if(e)throw new Error('建立 福利品訂單失敗：'+e.message);
    const o=Array.isArray(data)?data[0]:data;
    if(!o)throw new Error('建立 福利品訂單失敗');
    if(preview.redeem_only&&Number(o.cash_amount)>0)throw new Error('此福利品只接受推薦點全額兌換，不能建立現金付款。');

    if(Number(o.cash_amount)===0){
      $('ok').style.display='block';
      $('ok').textContent=`兌換成功：已使用 ${o.points_used} 點，訂單已進入待送禮。`;
      $('pay').style.display='none';
      return;
    }

    const {data:{session},error:sessionErr}=await SB.auth.getSession();
    if(sessionErr)throw new Error('登入狀態讀取失敗：'+sessionErr.message);
    if(!session?.access_token)throw new Error('登入已失效，請重新登入');

    const cashAmount=Math.max(0,Number(o.cash_amount||preview.cash_amount||0));
    if(!cashAmount)throw new Error('PAYUNi 收款金額異常');

    const slipNo='LG-'+String(o.order_id||Date.now()).replace(/[^A-Za-z0-9]/g,'').slice(0,22).toUpperCase();

    const resp=await fetch(PAYUNI_CHECKOUT_FUNCTION_URL,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey':KEY,
        'Authorization':'Bearer '+session.access_token
      },
      body:JSON.stringify({
        purchaseType:'line_gift',
        lineGiftOrderId:o.order_id,
        orderId:o.order_id,
        plan:'line_gift',
        planLabel:'福利品｜'+(preview.product_name||'商品'),
        amount:cashAmount,
        days:0,
        coins:0,
        referralCode:'',
        slipNo,
        productId:pid,
        productName:preview.product_name||'福利品',
        pointsUsed:Number(o.points_used||0),
        returnUrl:location.origin+'/line-gifts.html?from=payuni'
      })
    });

    const contentType=resp.headers.get('content-type')||'';
    const text=await resp.text();

    if(!resp.ok){
      let msg=text;
      try{
        const j=JSON.parse(text);
        msg=j.message||j.detail||j.error||text;
      }catch(_){}
      throw new Error('PAYUNi 建單失敗：'+(msg||('HTTP '+resp.status)));
    }

    if(!contentType.includes('text/html')){
      throw new Error('PAYUNi 回傳格式不是 HTML：'+text.slice(0,300));
    }

    document.open();
    document.write(text);
    document.close();
  }catch(e){
    error(String(e?.message||e));
  }
};
boot();
</script></body></html>
