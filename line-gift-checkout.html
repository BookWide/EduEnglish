<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINE 禮物結帳｜BookWide</title>
<script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
<style>body{margin:0;background:#f5f7fb;color:#0f172a;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:820px;margin:28px auto;padding:0 14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:22px;box-shadow:0 12px 34px rgba(15,23,42,.07)}h1{margin:0 0 8px;font-size:28px}.muted{color:#64748b}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eef2f7}.row b{font-size:18px}.total{font-size:30px;font-weight:950;color:#0f766e}.pts{color:#b45309}.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:900;background:#06c755;color:#fff;cursor:pointer;margin-top:18px}.btn:disabled{opacity:.55}.back{color:#2563eb;text-decoration:none;font-weight:800}.notice{margin-top:14px;padding:12px;border-radius:14px;background:#f8fafc;color:#475569;line-height:1.6}.err{display:none;margin-top:14px;padding:12px;border-radius:12px;background:#fff1f2;color:#be123c;white-space:pre-wrap}.ok{display:none;margin-top:14px;padding:14px;border-radius:12px;background:#ecfdf5;color:#047857;font-weight:800}@media(max-width:600px){.wrap{margin:12px auto}.card{padding:16px}h1{font-size:23px}}</style></head><body><div class="wrap"><div class="top"><a class="back" href="/line-gifts.html?from=referral">← 返回商品庫</a><span id="loginState" class="muted">檢查登入中…</span></div><div class="card"><h1>🎁 BookWide LINE 禮物結帳</h1><div class="muted" id="productName">讀取商品中…</div><div style="margin-top:16px">
<div class="row"><span>商品價格</span><b id="price">—</b></div>
<div class="row"><span>可用推薦點</span><b class="pts" id="available">—</b></div>
<div class="row"><span>本次推薦點折抵</span><b class="pts" id="points">—</b></div>
<div class="row"><span>折抵後金額</span><b id="net">—</b></div>
<div class="row"><span>5%</span><b id="fee">—</b></div>
<div class="row"><span>信用卡實際收款</span><b class="total" id="cash">—</b></div>
</div><div class="notice">固定規則：<b>1 推薦點 = NT$1</b>。系統會自動使用可用推薦點，剩餘金額再加 5%。若推薦點足以全額折抵，信用卡收款為 NT$0。刷卡未完成時，點數只保留 30 分鐘，不會永久扣除。</div><button id="pay" class="btn" disabled>確認購買</button><div id="err" class="err"></div><div id="ok" class="ok"></div></div></div>
<script>
const URL='https://jeajrwpmrgczimmrflxo.supabase.co';const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplYWpyd3BtcmdjemltbXJmbHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3MTg5MzksImV4cCI6MjA3NjI5NDkzOX0.3iFXdHH0JEuk177_R4TGFJmOxYK9V8XctON6rDe7-Do';const SB=supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);const fmt=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW');const pid=Number(new URL(location.href).searchParams.get('product')||0);let preview=null;function error(m){$('err').style.display='block';$('err').textContent=m;$('pay').disabled=false}
async function boot(){const {data:{session}}=await SB.auth.getSession();if(!session){$('loginState').textContent='尚未登入';error('請先登入 BookWide 後再使用推薦點購買。');return}$('loginState').textContent=session.user.email||'已登入';if(!pid){error('缺少商品 ID');return}const {data,error:e}=await SB.rpc('preview_line_gift_purchase',{p_product_id:pid});if(e){error(e.message);return}preview=Array.isArray(data)?data[0]:data;if(!preview){error('找不到商品');return}$('productName').textContent=preview.product_name;$('price').textContent=fmt(preview.price);$('available').textContent=Number(preview.available_points).toLocaleString('zh-TW')+' 點';$('points').textContent='- '+Number(preview.points_used).toLocaleString('zh-TW')+' 點';$('net').textContent=fmt(preview.net_after_points);$('fee').textContent=fmt(preview.fee_5);$('cash').textContent=fmt(preview.cash_amount);$('pay').textContent=preview.cash_amount>0?`使用 ${preview.points_used} 點＋刷卡 ${fmt(preview.cash_amount)}`:`使用 ${preview.points_used} 點全額兌換`;$('pay').disabled=false}
$('pay').onclick=async()=>{if(!preview)return;$('pay').disabled=true;$('err').style.display='none';const {data,error:e}=await SB.rpc('create_line_gift_order',{p_product_id:pid});if(e)return error(e.message);const o=Array.isArray(data)?data[0]:data;if(!o)return error('建立訂單失敗');if(Number(o.cash_amount)===0){$('ok').style.display='block';$('ok').textContent=`兌換成功：已使用 ${o.points_used} 點，訂單已進入待送禮。`;$('pay').style.display='none';return}const {data:{session}}=await SB.auth.getSession();const resp=await fetch(URL+'/functions/v1/create-line-gift-ecpay-order',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({order_id:o.order_id})});const text=await resp.text();if(!resp.ok)return error('付款建立失敗：'+text);let j;try{j=JSON.parse(text)}catch(_){return error('付款建立失敗：回傳格式錯誤')}if(j.html){document.open();document.write(j.html);document.close();return}error('付款建立失敗：缺少 ECPay 表單')};boot();
</script></body></html>
